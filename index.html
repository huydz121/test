<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Academy - Luyện thi Giữa kỳ</title>
    <meta name="description" content="Hệ thống ôn tập trắc nghiệm AWS Academy Module 2-13 với 240 câu hỏi">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3347;
            --primary:#ff9900;--primary-glow:rgba(255,153,0,.15);
            --text:#e4e4e7;--text-dim:#9ca3af;
            --success:#22c55e;--success-bg:rgba(34,197,94,.12);
            --error:#ef4444;--error-bg:rgba(239,68,68,.12);
            --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
            --selected:#a855f7;--selected-bg:rgba(168,85,247,.15);
            --radius:12px
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

        /* HEADER */
        .header{background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);border-bottom:1px solid var(--border);padding:1.5rem 0;text-align:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
        .header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ff9900,#ffb84d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
        .header p{color:var(--text-dim);font-size:.9rem}
        .container{max-width:900px;margin:0 auto;padding:2rem 1rem}

        /* DASHBOARD */
        .section-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
        .section-title::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px;display:inline-block}
        .source-tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:var(--surface);padding:.4rem;border-radius:var(--radius);border:1px solid var(--border)}
        .source-tab{flex:1;padding:.8rem 1rem;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s;background:transparent;color:var(--text-dim);font-family:inherit}
        .source-tab.active{background:var(--primary);color:#000;box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .source-tab:hover:not(.active){color:var(--text);background:var(--surface2)}

        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin-bottom:1.5rem}
        .module-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.75rem;user-select:none}
        .module-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
        .module-card.selected{border-color:var(--primary);background:var(--primary-glow)}
        .module-card input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
        .module-card label{cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.3}
        .module-card .q-count{font-size:.75rem;color:var(--text-dim);margin-top:.2rem}

        .controls{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .btn{padding:.7rem 1.2rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:.4rem}
        .btn-primary{background:var(--primary);color:#000}
        .btn-primary:hover{background:#ffb84d;transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .btn-submit{background:var(--selected);color:#fff;font-size:1rem;padding:.85rem 2rem}
        .btn-submit:hover:not(:disabled){background:#9333ea;transform:translateY(-1px);box-shadow:0 4px 15px rgba(168,85,247,.4)}
        .btn-submit:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
        .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
        .btn-lg{padding:1rem 2.5rem;font-size:1.1rem;border-radius:var(--radius)}

        .start-area{text-align:center;margin-top:2rem;padding:2rem;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
        .start-area .count{font-size:2.5rem;font-weight:800;color:var(--primary);margin:.5rem 0}

        /* QUIZ */
        #quiz-interface{display:none}
        .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .progress-wrap{flex:1;min-width:200px}
        .progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:.4rem}
        .progress-fill{height:100%;background:linear-gradient(90deg,#ff9900,#ffb84d);width:0;transition:width .4s ease}
        .progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-dim);font-weight:600}
        .stats{display:flex;gap:1rem;font-weight:700;font-size:.95rem}
        .s-ok{color:var(--success)}.s-no{color:var(--error)}

        .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem;animation:fadeUp .4s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .q-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--primary);padding:.3rem .8rem;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:1.2rem}
        .q-text{font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.7}
        .q-note{font-size:.85rem;color:var(--selected);margin-bottom:1.2rem;font-style:italic;padding:.6rem 1rem;background:var(--selected-bg);border-radius:8px;border-left:3px solid var(--selected)}

        /* OPTIONS */
        .opts{display:flex;flex-direction:column;gap:.6rem}
        .opt{text-align:left;padding:1rem 1.2rem;border:2px solid var(--border);border-radius:8px;background:var(--surface2);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.8rem;font-family:inherit;color:var(--text);line-height:1.5;width:100%}
        .opt:hover:not(:disabled):not(.correct):not(.wrong):not(.selected-opt){border-color:var(--primary);background:var(--primary-glow)}
        .opt .letter{font-weight:700;color:var(--text-dim);min-width:22px;flex-shrink:0;transition:color .2s}
        /* Selected (before submit) */
        .opt.selected-opt{border-color:var(--selected);background:var(--selected-bg)}
        .opt.selected-opt .letter{color:var(--selected)}
        /* After submit */
        .opt.correct{border-color:var(--success);background:var(--success-bg)}
        .opt.correct .letter{color:var(--success)}
        .opt.wrong{border-color:var(--error);background:var(--error-bg)}
        .opt.wrong .letter{color:var(--error)}
        .opt:disabled{cursor:default}
        .opt.dimmed{opacity:.45}

        /* SUBMIT & NEXT */
        #submit-area{margin-top:1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
        #submit-area .hint{font-size:.82rem;color:var(--text-dim);font-style:italic}
        .explain{display:none;margin-top:1.5rem;padding:1.4rem;border-radius:10px;background:var(--info-bg);border-left:4px solid var(--info);animation:fadeUp .4s ease}
        .explain h4{color:var(--info);margin-bottom:.6rem;font-size:.95rem;display:flex;align-items:center;gap:.4rem}
        .explain p{color:var(--text-dim);font-size:.92rem;line-height:1.8}
        .correct-label{background:var(--success-bg);border:1px solid var(--success);color:var(--success);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}
        .wrong-label{background:var(--error-bg);border:1px solid var(--error);color:var(--error);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}

        .next-area{display:none;text-align:right;margin-top:1.2rem;animation:fadeUp .3s ease}

        /* RESULTS */
        #results{display:none}
        .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:3rem 2rem;text-align:center}
        .result-circle{width:150px;height:150px;border-radius:50%;border:6px solid var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2.5rem;font-weight:800;color:var(--primary);box-shadow:0 0 40px rgba(255,153,0,.2)}
        .result-card h2{color:var(--text);margin-bottom:1rem;font-size:1.4rem}
        .result-card .detail{color:var(--text-dim);font-size:1.1rem;margin-bottom:2rem}
        .result-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

        @media(max-width:600px){
            .container{padding:1rem .75rem}
            .module-grid{grid-template-columns:1fr}
            .q-card{padding:1.5rem}
            .quiz-top{flex-direction:column;align-items:stretch}
        }
    </style>
</head>
<body>
<div class="header">
    <h1>☁️ AWS Academy Quiz</h1>
    <p>Hệ thống ôn tập Giữa kỳ — Module 2 đến 13</p>
</div>
<div class="container">

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h3 class="section-title">Nguồn Câu Hỏi</h3>
        <div class="source-tabs">
            <button class="source-tab active" onclick="setSource('original')">📚 120 Câu Gốc (Knowledge Check)</button>
            <button class="source-tab" onclick="setSource('extra')">🧠 120 Câu Mở Rộng (AI Tạo)</button>
        </div>
        <h3 class="section-title">Chọn Module</h3>
        <div class="controls">
            <button class="btn btn-outline" onclick="toggleAll(true)">✅ Chọn tất cả</button>
            <button class="btn btn-outline" onclick="toggleAll(false)">❌ Bỏ chọn</button>
        </div>
        <div class="module-grid" id="module-grid"></div>
        <div class="start-area">
            <p style="color:var(--text-dim)">Số câu hỏi đã chọn</p>
            <div class="count" id="sel-count">0</div>
            <button class="btn btn-primary btn-lg" id="start-btn" onclick="startQuiz()" disabled>🚀 BẮT ĐẦU LÀM BÀI</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-interface">
        <div class="quiz-top">
            <button class="btn btn-outline" onclick="exitQuiz()">← Thoát</button>
            <div class="progress-wrap">
                <div class="progress-label"><span>Tiến độ</span><span id="prog-txt">1/10</span></div>
                <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
            </div>
            <div class="stats">
                <span class="s-ok">✓ <span id="c-ok">0</span></span>
                <span class="s-no">✗ <span id="c-no">0</span></span>
            </div>
        </div>

        <div class="q-card">
            <div class="q-tag" id="q-tag">Module X</div>
            <div class="q-text" id="q-text"></div>
            <div class="q-note" id="q-note"></div>
            <div class="opts" id="q-opts"></div>

            <div id="submit-area">
                <button class="btn btn-submit" id="submit-btn" onclick="submitAnswer()" disabled>
                    ✅ Nộp bài
                </button>
                <span class="hint" id="submit-hint"></span>
            </div>

            <div class="explain" id="q-exp">
                <div id="q-result-label"></div>
                <h4>💡 Giải thích chi tiết:</h4>
                <p id="q-exp-txt"></p>
            </div>

            <div class="next-area" id="next-area">
                <button class="btn btn-primary" onclick="nextQ()">Câu tiếp theo →</button>
            </div>
        </div>
    </div>

    <!-- RESULTS -->
    <div id="results">
        <div class="result-card">
            <h2>🎉 Hoàn thành bài kiểm tra!</h2>
            <div class="result-circle"><span id="r-pct">0%</span></div>
            <p class="detail">Bạn trả lời đúng <span id="r-ok" class="s-ok">0</span> / <span id="r-total">0</span> câu hỏi.</p>
            <div class="result-btns">
                <button class="btn btn-outline" onclick="exitQuiz()">🏠 Về trang chủ</button>
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại bộ đề này</button>
            </div>
        </div>
    </div>

</div>

ập lịch)","B. Predictive (Dự đoán)","C. Manual (Thủ công)","D. Dynamic (Động)"],a:"A",e:"Khi đã biết chắc chắn quy luật tải tăng vào các \"ngày cuối tuần\" (thời gian cố định), việc sử dụng Scheduled Scaling (Lập lịch) là cách hiệu quả nhất để hệ thống chủ động thêm máy chủ đúng lúc."},{t:"A devops engineer launches a fleet of Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The EC2 instances must maintain 50 percent average CPU utilization. Which type of scaling is appropriate to use based on CPU utilization usage? (Một kỹ sư devops khởi chạy một nhóm các máy chủ Amazon EC2 trong một Auto Scaling group phía sau một Application Load Balancer. Các máy chủ EC2 phải duy trì mức sử dụng CPU trung bình ở mức 50%. Loại mở rộng (scaling) nào là phù hợp để sử dụng dựa trên mức sử dụng CPU?)",o:["A. Step scaling","B. Manual scaling","C. Target tracking scaling (Mở rộng theo mục tiêu)","D. Simple scaling"],a:"C",e:"Target tracking scaling cho phép bạn đặt một con số mục tiêu (ví dụ 50% CPU), và AWS sẽ tự động điều chỉnh số lượng máy chủ để giữ cho mức CPU thực tế luôn ổn định quanh con số đó."},{t:"How can a user vertically scale an Amazon RDS database? (Làm thế nào để một người dùng có thể mở rộng theo chiều dọc (vertically scale) một cơ sở dữ liệu Amazon RDS?)",o:["A. By changing the instance class or size (Bằng cách thay đổi loại (instance class) hoặc kích thước máy chủ)","B. By creating dedicated read and write nodes","C. By sharding the database","D. By adding read replicas"],a:"A",e:"Mở rộng theo chiều dọc (Vertical Scaling) nghĩa là nâng cấp cấu hình của máy chủ đó mạnh lên (tăng CPU, RAM). Với RDS, bạn thực hiện bằng cách thay đổi DB Instance Class."},{t:"How can an AWS customer horizontally scale an Amazon Aurora database? (Làm thế nào để một khách hàng AWS có thể mở rộng theo chiều ngang (horizontally scale) một cơ sở dữ liệu Amazon Aurora?)",o:["A. By adding Aurora Replica instances by using Aurora Auto Scaling (Bằng cách thêm các máy chủ Aurora Replica thông qua việc sử dụng Aurora Auto Scaling)","B. By changing the instance type","C. By creating Amazon CloudWatch alarms","D. By creating a scaling policy"],a:"A",e:"Mở rộng theo chiều ngang (Horizontal Scaling) là thêm nhiều máy chạy song song. Với Amazon Aurora, bạn có thể tự động thêm các Aurora Replicas để gánh tải cho hệ thống."},{t:"How does Amazon DynamoDB perform automatic scaling? (Amazon DynamoDB thực hiện mở rộng quy mô tự động (automatic scaling) như thế nào?)",o:["A. It adds read replicas in response to increased read demand.","B. It adjusts the provisioned throughput capacity in response to traffic patterns. (Nó điều chỉnh công suất thông lượng được phân bổ (provisioned throughput capacity) để phản ứng với các kiểu lưu lượng truy cập.)","C. It adds and removes database instances in response to changes in traffic.","D. It changes the instance type in response to changes in processing load."],a:"B",e:"DynamoDB là dịch vụ serverless, nó không thêm máy ảo mà nó tự động điều chỉnh Provisioned throughput capacity (khả năng đọc/ghi dữ liệu trên giây) để khớp với lưu lượng truy cập."},{t:"A fleet of Amazon EC2 instances is launched in an Amazon EC2 Auto Scaling group. The instances run an application that uses a custom protocol on TCP port 42000. Connections from client systems on the internet must balance across the instances. Which load balancing solution is the best solution? (Một nhóm các máy chủ Amazon EC2 được khởi chạy trong một Auto Scaling group. Các máy chủ chạy một ứng dụng sử dụng giao thức tùy chỉnh trên cổng TCP 42000. Các kết nối từ hệ thống máy khách trên internet phải được cân bằng tải giữa các máy chủ. Giải pháp cân bằng tải nào là tốt nhất?)",o:["A. Classic Load Balancer","B. Application Load Balancer","C. Network Load Balancer (Cân bằng tải mạng)","D. Gateway Load Balancer"],a:"C",e:"Với các giao thức không phải HTTP/HTTPS và sử dụng các cổng (port) tùy chỉnh, Network Load Balancer (NLB) là lựa chọn tốt nhất nhờ hiệu suất cực cao và độ trễ cực thấp."},{t:"A company must build a highly available website that uses server-side scripts to serve dynamic HTML. Which solution provides the HIGHEST availability for the LEAST cost and complexity? (Một công ty phải xây dựng một trang web có tính sẵn sàng cao sử dụng các tập lệnh phía máy chủ (server-side scripts) để phục vụ HTML động. Giải pháp nào cung cấp tính sẵn sàng CAO NHẤT với chi phí và độ phức tạp THẤP NHẤT?)",o:["A. The customer deploys a second web server in another Region. Amazon Route 53 uses failover routing for disaster recovery (DR).","B. An Auto Scaling group launches Amazon EC2 instances, which are served by a Network Load Balancer. Amazon Route 53 uses latency-based routing.","C. Amazon S3 hosts the website. DNS name resolution points to the S3 bucket.","D. An Auto Scaling group launches Amazon EC2 instances, which are served by an Application Load Balancer. (Một Auto Scaling group khởi chạy các máy chủ Amazon EC2, được phục vụ bởi một Application Load Balancer. Phân giải tên miền DNS trỏ đến load balancer.)"],a:"D",e:"Mô hình kết hợp Auto Scaling + Application Load Balancer là mô hình chuẩn nhất để đảm bảo tính sẵn sàng cao cho website động với chi phí và quản trị tối ưu nhất."},{t:"Users in location A connect to an application in Region A. Users in location B connect to the same application in Region B. If the application in Region A becomes unhealthy, traffic for location A must be redirected to the application in Region B. Which solution meets this requirement? (Người dùng ở vị trí A kết nối với một ứng dụng ở Region A. Người dùng ở vị trí B kết nối với cùng một ứng dụng ở Region B. Nếu ứng dụng ở Region A trở nên không lành mạnh (unhealthy), lưu lượng truy cập cho vị trí A phải được chuyển hướng đến ứng dụng ở Region B. Giải pháp nào đáp ứng yêu cầu này?)",o:["A. Use latency-based routing in Amazon Route 53 with Amazon CloudWatch alarms.","B. Use geoproximity routing and a Network Load Balancer that is attached to b {t:"AWS Config cung cấp chức năng gì?",o:["A. Triển khai code","B. Theo dõi và ghi lại lịch sử thay đổi cấu hình tài nguyên","C. Cân bằng tải","D. Lưu mật khẩu"],a:"B",e:"AWS Config liên tục theo dõi mọi thay đổi cấu hình tài nguyên để đảm bảo tính tuân thủ."},
{t:"Chính sách nào được gắn trực tiếp lên tài nguyên như S3 bucket?",o:["A. Identity-based policy","B. Resource-based policy","C. SCP","D. Session policy"],a:"B",e:"Resource-based policy (như S3 Bucket Policy) được gắn trực tiếp lên tài nguyên để kiểm soát quyền truy cập."},
{t:"Dịch vụ nào cung cấp tường lửa ứng dụng web?",o:["A. GuardDuty","B. Shield","C. AWS WAF","D. Inspector"],a:"C",e:"AWS WAF bảo vệ ứng dụng web khỏi SQL injection, XSS..."},
{t:"AWS Shield bảo vệ chống lại tấn công nào?",o:["A. SQL injection","B. Tấn công DDoS","C. Phishing","D. Brute-force"],a:"B",e:"AWS Shield chuyên bảo vệ chống lại các cuộc tấn công Từ chối dịch vụ phân tán (DDoS)."},
{t:"Khi nào nên sử dụng IAM Role thay vì IAM User cho EC2?",o:["A. Cần mật khẩu tĩnh","B. Cần thông tin xác thực tạm thời tự động xoay vòng","C. Khi chỉ có 1 user","D. Không cần quyền"],a:"B",e:"IAM Role cung cấp thông tin xác thực tạm thời an toàn hơn là dùng Access Key tĩnh của User."}
]},
{id:4,title:"Lưu trữ (Mở rộng)",questions:[
{t:"Amazon S3 đảm bảo độ bền dữ liệu (durability) ở mức nào?",o:["A. 99.9%","B. 99.99%","C. 11 số 9 (99.999999999%)","D. 100%"],a:"C",e:"S3 được thiết kế với độ bền 11 số 9, rất khó mất dữ liệu."},
{t:"S3 Versioning giúp bảo vệ dữ liệu như thế nào?",o:["A. Mã hóa mọi file","B. Lưu giữ mọi phiên bản của đối tượng kể cả khi bị ghi đè","C. Sao chép qua Region khác","D. Nén dữ liệu"],a:"B",e:"Versioning lưu lại các phiên bản cũ để khôi phục khi bị xóa hoặc sửa nhầm."},
{t:"Dịch vụ nào phù hợp làm ổ đĩa hệ điều hành cho EC2?",o:["A. S3","B. Amazon EBS","C. EFS","D. Glacier"],a:"B",e:"EBS cung cấp ổ đĩa khối (block storage) hiệu suất cao để gắn làm ổ hệ điều hành."},
{t:"Sự khác biệt chính giữa EBS và EFS là gì?",o:["A. EBS chỉ cho Linux, EFS cho Windows","B. EBS gắn vào 1 EC2, EFS có thể chia sẻ giữa nhiều EC2","C. EBS miễn phí","D. Không khác biệt"],a:"B",e:"EBS gắn độc quyền 1 EC2. EFS là hệ thống file chia sẻ (NFS) cho hàng nghìn EC2 dùng chung."},
{t:"S3 Lifecycle Policy dùng làm gì?",o:["A. Mã hóa dữ liệu","B. Tự động chuyển dữ liệu giữa các lớp lưu trữ hoặc xóa sau một thời gian","C. Giới hạn quyền","D. Tăng tốc tải lên"],a:"B",e:"Lifecycle Policy tự động hóa việc chuyển dữ liệu sang lớp rẻ hơn hoặc xóa để tiết kiệm chi phí."},
{t:"S3 Intelligent-Tiering hoạt động ra sao?",o:["A. Luôn dùng lớp rẻ nhất","B. Tự động di chuyển dữ liệu giữa các lớp dựa trên tần suất truy cập thực tế","C. Chọn thủ công mỗi tháng","D. Chỉ lưu file nhỏ"],a:"B",e:"Intelligent-Tiering tự động tối ưu chi phí bằng cách theo dõi mẫu truy cập của dữ liệu."},
{t:"AWS Storage Gateway dùng khi nào?",o:["A. Lưu trên cloud hoàn toàn","B. Kết nối hạ tầng lưu trữ on-premises với đám mây AWS","C. Chạy web tĩnh","D. Chạy database"],a:"B",e:"Storage Gateway là giải pháp lai (hybrid) kết nối lưu trữ tại văn phòng với lưu trữ đám mây."},
{t:"S3 Object Lock cung cấp tính năng gì?",o:["A. Khóa bucket hoàn toàn","B. Ngăn chặn việc xóa/sửa đối tượng trong một khoảng thời gian xác định","C. Mã hóa bằng khóa riêng","D. Giới hạn dung lượng"],a:"B",e:"Object Lock áp dụng mô hình WORM (viết 1 lần, đọc nhiều lần) để tuân thủ pháp luật."},
{t:"Kích thước tối đa của 1 file trên S3 là bao nhiêu?",o:["A. 5 GB","B. 5 TB","C. 50 TB","D. Không giới hạn"],a:"B",e:"Kích thước tối đa của 1 đối tượng trên S3 là 5 Terabytes."},
{t:"Glacier Instant Retrieval khác gì Flexible Retrieval?",o:["A. Truy xuất dữ liệu ngay lập tức trong mili giây","B. Rẻ hơn","C. Chậm hơn","D. Giống nhau"],a:"A",e:"Instant Retrieval cho phép lấy lại dữ liệu tức thì (mili giây), còn Flexible mất từ phút đến giờ."}
]}
]);

// Module 5-8
EXTRA_DATA.push(...[
{id:5,title:"Điện toán (Mở rộng)",questions:[
{t:"AWS Lambda hoạt động theo mô hình nào?",o:["A. EC2 chạy 24/7","B. Phi máy chủ (Serverless) - chạy khi có trigger","C. Máy chủ vật lý","D. Container liên tục"],a:"B",e:"Lambda là Serverless, bạn chỉ trả tiền cho phần nghìn giây code được chạy."},
{t:"Auto Scaling Group cung cấp lợi ích gì?",o:["A. Mã hóa tự động","B. Tự động tăng/giảm số lượng EC2 instance theo tải","C. Cập nhật hệ điều hành","D. Tạo database"],a:"B",e:"ASG điều chỉnh số lượng server tự động theo lưu lượng hiện tại."},
{t:"Chức năng chính của Elastic Load Balancer (ELB)?",o:["A. Lưu dữ liệu","B. Phân phối lưu lượng mạng đến nhiều máy chủ","C. Dịch tên miền","D. Mã hóa kết nối"],a:"B",e:"ELB chia tải đều cho nhiều máy chủ để tránh quá tải 1 máy duy nhất."},
{t:"Instance Store khác gì EBS?",o:["A. Bền hơn EBS","B. Mất dữ liệu khi instance stop/terminate","C. Giống y hệt","D. Không thể lưu trữ"],a:"B",e:"Instance Store là ổ đĩa tạm vật lý, sẽ mất trắng dữ liệu khi máy ảo bị tắt (stop)."},
{t:"Spot Instance phù hợp công việc nào?",o:["A. Database quan trọng","B. Web server chính","C. Xử lý hàng loạt có khả năng chịu gián đoạn","D. Thanh toán"],a:"C",e:"Spot rất rẻ nhưng bị AWS thu hồi bất kỳ lúc nào, phù hợp cho việc chịu được ngắt quãng."},
{t:"Dedicated Host là gì?",o:["A. Máy chủ vật lý riêng biệt cho phép kiểm soát cấp độ phần cứng (socket/core)","B. Máy ảo giá rẻ","C. Container","D. Database dùng chung"],a:"A",e:"Dùng Dedicated Host khi bạn có license phần mềm on-premises cần đối chiếu số CPU vật lý."},
{t:"Security Group mặc định của VPC làm gì?",o:["A. Mở mọi port","B. Chặn tất cả luồng vào, cho phép tất cả luồng ra","C. Chặn tất cả luồng ra và vào","D. Chặn port 80"],a:"B",e:"SG mặc định an toàn: Inbound bị chặn hết, Outbound được cho phép hết."},
{t:"Application Load Balancer (ALB) hỗ trợ định tuyến ở tầng mấy?",o:["A. Tầng 4 (Network)","B. Tầng 7 (Application - HTTP/HTTPS)","C. Tầng 3","D. Tầng 2"],a:"B",e:"ALB chuyên xử lý HTTP/HTTPS và định tuyến theo đường dẫn (Path) ở Layer 7."},
{t:"Truy cập metadata của EC2 bằng IP nào?",o:["A. 192.168.1.1","B. 169.254.169.254","C. 10.0.0.1","D. localhost"],a:"B",e:"IP đặc biệt 169.254.169.254 dùng để gọi API lấy metadata ngay trong lòng máy EC2."},
{t:"Spread Placement Group là gì?",o:["A. Đặt chung 1 rack","B. Phân tán các EC2 lên các phần cứng vật lý khác nhau","C. Đặt trên 1 host","D. Tự động xóa máy"],a:"B",e:"Giúp hạn chế rủi ro hỏng hóc phần cứng đồng loạt."}
]},
{id:6,title:"Cơ sở dữ liệu (Mở rộng)",questions:[
{t:"Lợi thế của Amazon Aurora?",o:["A. Miễn phí","B. Nhanh gấp 5 lần MySQL, 3 lần PostgreSQL","C. Không cần internet","D. Chỉ lưu ảnh"],a:"B",e:"Aurora là DB độc quyền AWS được tối ưu riêng cho cloud."},
{t:"DynamoDB hỗ trợ mô hình nào?",o:["A. Quan hệ SQL","B. Key-Value và Document (NoSQL)","C. Graph","D. Time-series"],a:"B",e:"DynamoDB là NoSQL Serverless cực mạnh của AWS."},
{t:"Read Replica trên RDS dùng làm gì?",o:["A. Backup","B. Gánh tải đọc (Read) để giảm tải cho DB chính","C. Nén data","D. Phân tích AI"],a:"B",e:"Tăng tốc ứng dụng bằng cách đẩy các query SELECT sang các bản sao Read Replica."},
{t:"Amazon Redshift dùng làm gì?",o:["A. Web hosting","B. Data Warehouse (Kho dữ liệu khổng lồ để phân tích)","C. Gửi email","D. Làm cache"],a:"B",e:"Redshift xử lý dữ liệu lớn cỡ Petabyte cho Business Intelligence (BI)."},
{t:"Tính năng Multi-AZ của RDS dùng để?",o:["A. Tăng tốc đọc","B. Dự phòng sự cố (Failover) tự động","C. Tăng dung lượng đĩa","D. Cân bằng tải"],a:"B",e:"Khi DB chính sập, RDS tự động bật DB dự phòng (Standby) ở AZ khác để thay thế ngay lập tức."},
{t:"ElastiCache hỗ trợ 2 engine nào?",o:["A. Redis và Memcached","B. MySQL và Oracle","C. SQL Server và PostgreSQL","D. MongoDB và Cassandra"],a:"A",e:"Redis và Memcached là 2 công cụ lưu trữ in-memory mã nguồn mở phổ biến nhất."},
{t:"AWS DMS (Database Migration Service) làm gì?",o:["A. Chuyển tiền","B. Di chuyển dữ liệu database một cách liên tục và đồng nhất/không đồng nhất","C. Chuyển tên miền","D. Mã hóa DB"],a:"B",e:"DMS di chuyển database từ On-premise lên AWS mà ứng dụng vẫn hoạt động không gián đoạn."},
{t:"DocumentDB tương thích với DB nào?",o:["A. MySQL","B. MongoDB","C. Oracle","D. DynamoDB"],a:"B",e:"DocumentDB là dịch vụ tương thích API với MongoDB do AWS quản lý."},
{t:"Khi nào dùng DynamoDB thay vì RDS?",o:["A. Cần JOIN nhiều bảng","B. Cần độ trễ dưới 10ms, mở rộng không giới hạn và schema linh hoạt","C. Cần Store procedure","D. Cần ACID chặt chẽ"],a:"B",e:"DynamoDB vượt trội về tốc độ tải siêu cao và không yêu cầu schema cố định."},
{t:"Amazon QLDB đặc biệt ở điểm nào?",o:["A. Dùng AI","B. Cung cấp sổ cái (ledger) bất biến, không thể sửa đổi hoặc xóa","C. Miễn phí","D. Chạy offline"],a:"B",e:"QLDB giống như blockchain nội bộ, lưu giữ mọi thay đổi dữ liệu minh bạch và bất biến."}
]},
{id:7,title:"Mạng cơ bản (Mở rộng)",questions:[
{t:"Thành phần nào cho public subnet ra internet?",o:["A. NAT Gateway","B. Internet Gateway (IGW)","C. Virtual Private Gateway","D. Customer Gateway"],a:"B",e:"IGW là cánh cổng kết nối trực tiếp VPC với Internet công cộng."},
{t:"Private subnet ra internet tải update bằng cách nào an toàn?",o:["A. IGW","B. Elastic IP","C. NAT Gateway","D. Direct Connect"],a:"C",e:"NAT Gateway nằm ở Public Subnet sẽ đứng ra tải dữ liệu thay cho Private Subnet."},
{t:"Route Table là gì?",o:["A. Chặn IP","B. Bảng định tuyến quyết định đường đi của dữ liệu mạng","C. Load balancer","D. Cáp quang"],a:"B",e:"Route table chứa các luật (route) chỉ đường cho traffic đi ra IGW, NAT hay Peering."},
{t:"Chính sách Weighted routing của Route 53 làm gì?",o:["A. Load balance theo khu vực","B. Phân chia tỷ lệ % traffic đến các server","C. Kiểm tra sức khỏe","D. Định tuyến tự động"],a:"B",e:"Ví dụ gửi 80% truy cập vào server A, 20% vào server B."},
{t:"VPC Peering có đặc điểm gì?",o:["A. Kết nối qua mạng internet","B. Là kết nối mạng riêng (không qua internet) giữa 2 VPC","C. Hỗ trợ định tuyến bắc cầu (A->B, B->C suy ra A->C)","D. Chỉ dùng được trong 1 Region"],a:"B",e:"VPC Peering rất an toàn vì dùng hạ tầng cáp quang riêng của AWS. (Nó KHÔNG hỗ trợ bắc cầu)."},
{t:"Elastic IP là gì?",o:["A. IP đổi liên tục","B. IP tĩnh (Static) Public cấp cho tài khoản AWS của bạn","C. IP private","D. IPv6"],a:"B",e:"Là một IP cố định, bạn có thể gán nó từ EC2 này sang EC2 khác."},
{t:"NACL (Network ACL) đánh giá luật theo thứ tự nào?",o:["A. Ngẫu nhiên","B. Số thứ tự từ thấp đến cao","C. Số cao đến thấp","D. Đánh giá tất cả"],a:"B",e:"Luật số 100 sẽ được đánh giá trước luật số 200. Nếu khớp, nó bỏ qua các luật bên dưới."},
{t:"Một VPC có tối đa bao nhiêu IGW?",o:["A. 1","B. 2","C. 5","D. Không giới hạn"],a:"A",e:"Một VPC chỉ gắn được duy nhất 1 Internet Gateway."},
{t:"Amazon Route 53 là dịch vụ gì?",o:["A. Tạo server","B. Hệ thống phân giải tên miền (DNS)","C. Tính toán","D. Lưu trữ"],a:"B",e:"Route 53 giúp map tên miền thân thiện (google.com) với địa chỉ IP."},
{t:"Khi tạo VPC mới, cái gì KHÔNG được tạo sẵn?",o:["A. Route Table mặc định","B. Security Group mặc định","C. NACL mặc định","D. Subnets"],a:"D",e:"Bạn phải tự tay tạo các Subnets sau khi tạo VPC."}
]},
{id:8,title:"Mạng nâng cao (Mở rộng)",questions:[
{t:"Transit Gateway giải quyết vấn đề gì?",o:["A. Backup data","B. Thay thế VPC Peering chằng chịt bằng cấu trúc Hub trung tâm mạng lưới","C. Giảm giá EC2","D. Tăng tốc web"],a:"B",e:"Transit Gateway là tổng đài trung tâm, các VPC chỉ cần nối 1 dây vào Hub này là có thể kết nối với nhau."},
{t:"Direct Connect ưu việt hơn VPN ở điểm nào?",o:["A. Rẻ hơn","B. Nhanh tạo xong","C. Băng thông cực lớn, ổn định, không đi qua internet","D. Kết nối không dây"],a:"C",e:"Cáp quang Direct Connect đâm thẳng vào Data Center của bạn, tránh hoàn toàn internet công cộng."},
{t:"Gateway VPC Endpoint dùng cho dịch vụ nào?",o:["A. Tất cả","B. Chỉ S3 và DynamoDB","C. EC2 và RDS","D. SQS và SNS"],a:"B",e:"Khái niệm Gateway Endpoint ra đời rất sớm và chỉ phục vụ duy nhất 2 hệ thống là S3 và DynamoDB."},
{t:"Global Accelerator dùng để làm gì?",o:["A. Nén file zip","B. Tăng tốc độ truy cập ứng dụng toàn cầu bằng mạng cáp quang nội bộ AWS","C. Tính toán toán học","D. Backup DB"],a:"B",e:"Giúp người dùng ở VN kết nối đến máy chủ Mỹ với tốc độ siêu nhanh thông qua Edge Location."},
{t:"Site-to-Site VPN dùng giao thức gì để mã hóa đường hầm?",o:["A. HTTP","B. IPsec","C. SSH","D. FTP"],a:"B",e:"IPsec là tiêu chuẩn vàng để mã hóa mạng VPN doanh nghiệp."},
{t:"Phía AWS trong kết nối VPN gọi là gì?",o:["A. Customer Gateway","B. Virtual Private Gateway (VGW) hoặc Transit Gateway","C. IGW","D. NAT"],a:"B",e:"VGW là cánh cửa tiếp nhận kết nối VPN từ Customer Gateway của doanh nghiệp."},
{t:"VPN CloudHub dùng làm gì?",o:["A. Kết nối 1 VPC - 1 Data Center","B. Kết nối nhiều VPC với nhau","C. Kết nối nhiều chi nhánh văn phòng (Hub and Spoke) qua VPN AWS","D. Chia sẻ file"],a:"C",e:"Biến AWS thành Hub trung tâm để chi nhánh Hà Nội có thể kết nối với chi nhánh HCM thông qua mạng AWS."},
{t:"Interface VPC Endpoint dùng công nghệ gì?",o:["A. Direct Connect","B. AWS PrivateLink","C. Transit Gateway","D. IGW"],a:"B",e:"PrivateLink tạo ra 1 card mạng (ENI) có IP private ngay trong subnet của bạn để kết nối với AWS service."},
{t:"Backup cho Direct Connect tiết kiệm chi phí nhất?",o:["A. 2 đường Direct Connect","B. Site-to-Site VPN qua Internet","C. Peering","D. Gắn USB"],a:"B",e:"Dùng cáp quang Direct Connect làm kết nối chính, và VPN (rẻ, qua mạng internet) làm kết nối dự phòng failover."},
{t:"VPC Flow Logs KHÔNG lưu thông tin gì?",o:["A. IP nguồn/đích","B. Nội dung bên trong gói tin (Packet Payload)","C. Port","D. Giao thức"],a:"B",e:"Nó chỉ log metadata mạng (ai gọi cho ai), không lưu nội dung bạn chat gì hay gửi file gì."}
]}
]);

EXTRA_DATA.push(...[
{id:9,title:"IAM (Mở rộng)",questions:[
{t:"Mô hình Trách nhiệm Chung quy định khách hàng bảo mật gì?",o:["A. Data center vật lý","B. Bảo mật 'TRONG' đám mây (Dữ liệu, Ứng dụng, HĐH)","C. Toàn bộ hạ tầng mạng","D. Phần cứng EC2"],a:"B",e:"Khách hàng tự bảo vệ dữ liệu, code và cấu hình của mình."},
{t:"Principal trong IAM là gì?",o:["A. Một người hoặc ứng dụng tạo yêu cầu gọi API","B. Là ổ cứng","C. Là Database","D. Là Policy"],a:"A",e:"Bất kỳ thực thể nào (User, Role, Service) đưa ra yêu cầu đều gọi là Principal."},

<script>// Quiz App Logic - v2 (submit button + multi-select fix)
let currentSource = 'original';
let selectedModules = new Set();
let quizQuestions = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let selectedAnswers = new Set(); // track selected options

function getData() {
    return currentSource === 'original' ? ORIGINAL_DATA : EXTRA_DATA;
}

function setSource(src) {
    currentSource = src;
    document.querySelectorAll('.source-tab').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && src === 'original') || (i === 1 && src === 'extra'));
    });
    selectedModules.clear();
    renderModules();
    updateCount();
}

function renderModules() {
    const grid = document.getElementById('module-grid');
    const data = getData();
    grid.innerHTML = '';
    data.forEach(m => {
        const checked = selectedModules.has(m.id) ? 'checked' : '';
        const sel = selectedModules.has(m.id) ? ' selected' : '';
        grid.innerHTML += `<div class="module-card${sel}" onclick="toggleModule(${m.id}, this)">
            <input type="checkbox" id="m${m.id}" ${checked} onclick="event.stopPropagation()">
            <div><label for="m${m.id}">Module ${m.id}</label><div class="q-count">${m.title} (${m.questions.length} câu)</div></div>
        </div>`;
    });
}

function toggleModule(id, el) {
    if (selectedModules.has(id)) { selectedModules.delete(id); } else { selectedModules.add(id); }
    if (el) { el.classList.toggle('selected'); el.querySelector('input').checked = selectedModules.has(id); }
    updateCount();
}

function toggleAll(select) {
    const data = getData();
    selectedModules.clear();
    if (select) data.forEach(m => selectedModules.add(m.id));
    renderModules();
    updateCount();
}

function updateCount() {
    const data = getData();
    let count = 0;
    data.forEach(m => { if (selectedModules.has(m.id)) count += m.questions.length; });
    document.getElementById('sel-count').textContent = count;
    document.getElementById('start-btn').disabled = count === 0;
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    const data = getData();
    quizQuestions = [];
    data.forEach(m => {
        if (selectedModules.has(m.id)) {
            m.questions.forEach(q => quizQuestions.push({ ...q, moduleId: m.id, moduleTitle: m.title }));
        }
    });
    shuffle(quizQuestions);
    currentIdx = 0; correctCount = 0; wrongCount = 0;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('quiz-interface').style.display = 'block';
    document.getElementById('results').style.display = 'none';
    showQuestion();
}

function getCorrectLetters(q) {
    // First check if question text has "(Chọn X)" pattern to know how many answers expected
    const answerText = q.a || '';
    const letters = [];
    
    // Match answer letters: look for standalone A-F followed by . or word boundary
    // Handle formats: "B", "A và C", "B. Full text...", "C. text và D. text"
    const matches = answerText.match(/(?:^|[\s,])([A-F])(?:\.|\b)/g);
    if (matches) {
        matches.forEach(m => {
            const letter = m.match(/[A-F]/)[0];
            if (!letters.includes(letter)) letters.push(letter);
        });
    }
    
    // Fallback: if no matches found, try simpler approach
    if (letters.length === 0) {
        const simple = answerText.match(/[A-F]/g);
        if (simple) simple.forEach(l => { if (!letters.includes(l)) letters.push(l); });
    }
    
    return letters;
}

function getExpectedCount(q) {
    // Check question text for "(Chọn X)" pattern
    const m = q.t.match(/\(Ch[oọ]n\s*(\d+)\)/i);
    if (m) return parseInt(m[1]);
    return null;
}

function isMultiAnswer(q) {
    const fromText = getExpectedCount(q);
    if (fromText && fromText > 1) return true;
    const correctLetters = getCorrectLetters(q);
    return correctLetters.length > 1;
}

function showQuestion() {
    const q = quizQuestions[currentIdx];
    const total = quizQuestions.length;
    selectedAnswers = new Set();

    const multi = isMultiAnswer(q);
    const correctLetters = getCorrectLetters(q);
    const expectedCount = getExpectedCount(q) || correctLetters.length;

    document.getElementById('q-tag').textContent = `Module ${q.moduleId}`;
    document.getElementById('q-text').textContent = q.t;

    const note = document.getElementById('q-note');
    if (multi) {
        note.textContent = `⚠️ Câu này có ${expectedCount} đáp án đúng — hãy chọn đủ ${expectedCount} đáp án rồi nhấn "Nộp bài"`;
        note.style.display = 'block';
    } else {
        note.textContent = `📌 Câu này có 1 đáp án đúng — chọn 1 đáp án rồi nhấn "Nộp bài"`;
        note.style.display = 'block';
    }

    const optsDiv = document.getElementById('q-opts');
    optsDiv.innerHTML = '';
    q.o.forEach((opt, i) => {
        const letter = opt.charAt(0);
        const text = opt.substring(2).trim();
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.id = `opt-${i}`;
        btn.innerHTML = `<span class="letter">${letter}.</span><span>${text}</span>`;
        btn.onclick = () => toggleOption(btn, letter, q);
        optsDiv.appendChild(btn);
    });

    document.getElementById('q-exp').style.display = 'none';
    document.getElementById('q-result-label').innerHTML = '';
    document.getElementById('next-area').style.display = 'none';
    document.getElementById('submit-area').style.display = 'block';
    document.getElementById('submit-btn').disabled = true;

    document.getElementById('prog-txt').textContent = `${currentIdx + 1} / ${total}`;
    document.getElementById('prog-fill').style.width = ((currentIdx + 1) / total * 100) + '%';
    document.getElementById('c-ok').textContent = correctCount;
    document.getElementById('c-no').textContent = wrongCount;
}

function toggleOption(btn, letter, q) {
    const multi = isMultiAnswer(q);

    if (multi) {
        // Multi: toggle selection
        if (selectedAnswers.has(letter)) {
            selectedAnswers.delete(letter);
            btn.classList.remove('selected-opt');
        } else {
            selectedAnswers.add(letter);
            btn.classList.add('selected-opt');
        }
    } else {
        // Single: deselect all others, select this one
        document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected-opt'));
        selectedAnswers.clear();
        selectedAnswers.add(letter);
        btn.classList.add('selected-opt');
    }

    // Enable submit if at least 1 selected
    document.getElementById('submit-btn').disabled = selectedAnswers.size === 0;
}

function submitAnswer() {
    const q = quizQuestions[currentIdx];
    const correctLetters = getCorrectLetters(q);

    // Disable all options
    document.querySelectorAll('.opt').forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('selected-opt');
        const letter = btn.querySelector('.letter').textContent.replace('.', '').trim();
        const isCorrect = correctLetters.includes(letter);
        const wasSelected = selectedAnswers.has(letter);

        if (isCorrect) {
            btn.classList.add('correct');
        } else if (wasSelected && !isCorrect) {
            btn.classList.add('wrong');
        } else {
            btn.classList.add('dimmed');
        }
    });

    // Determine if fully correct
    let fullyCorrect = true;
    if (selectedAnswers.size !== correctLetters.length) {
        fullyCorrect = false;
    } else {
        for (const l of correctLetters) {
            if (!selectedAnswers.has(l)) { fullyCorrect = false; break; }
        }
    }

    if (fullyCorrect) { correctCount++; }
    else { wrongCount++; }

    document.getElementById('c-ok').textContent = correctCount;
    document.getElementById('c-no').textContent = wrongCount;

    // Show result label + explanation
    const label = document.getElementById('q-result-label');
    if (fullyCorrect) {
        label.innerHTML = '<span class="correct-label">✅ Đúng rồi!</span>';
    } else {
        label.innerHTML = `<span class="wrong-label">❌ Chưa đúng — Đáp án: ${correctLetters.join(', ')}</span>`;
    }

    // Build explanation text
    let expText = q.e || '';
    // Also show answer text if it contains useful info
    if (q.a && q.a.length > 5) {
        expText = q.a + '<br><br>' + expText;
    }
    document.getElementById('q-exp-txt').innerHTML = expText;
    document.getElementById('q-exp').style.display = 'block';

    // Hide submit, show next
    document.getElementById('submit-area').style.display = 'none';
    const nextArea = document.getElementById('next-area');
    nextArea.style.display = 'block';
    if (currentIdx >= quizQuestions.length - 1) {
        nextArea.querySelector('button').textContent = '🏆 Xem kết quả';
    } else {
        nextArea.querySelector('button').textContent = 'Câu tiếp theo →';
    }
}

function nextQ() {
    currentIdx++;
    if (currentIdx >= quizQuestions.length) { showResults(); return; }
    showQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResults() {
    document.getElementById('quiz-interface').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    const total = quizQuestions.length;
    const pct = Math.round(correctCount / total * 100);
    document.getElementById('r-pct').textContent = pct + '%';
    document.getElementById('r-ok').textContent = correctCount;
    document.getElementById('r-total').textContent = total;
}

function exitQuiz() {
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('quiz-interface').style.display = 'none';
    document.getElementById('results').style.display = 'none';
    window.scrollTo({ top: 0 });
}

function restartQuiz() {
    shuffle(quizQuestions);
    currentIdx = 0; correctCount = 0; wrongCount = 0;
    document.getElementById('results').style.display = 'none';
    document.getElementById('quiz-interface').style.display = 'block';
    showQuestion();
    window.scrollTo({ top: 0 });
}

// Init
document.addEventListener('DOMContentLoaded', () => { renderModules(); updateCount(); });
</script>
</body>
