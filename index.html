<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Academy - Luyện thi Giữa kỳ</title>
    <meta name="description" content="Hệ thống ôn tập trắc nghiệm AWS Academy Module 2-13 với 240 câu hỏi">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3347;
            --primary:#ff9900;--primary-glow:rgba(255,153,0,.15);
            --text:#e4e4e7;--text-dim:#9ca3af;
            --success:#22c55e;--success-bg:rgba(34,197,94,.12);
            --error:#ef4444;--error-bg:rgba(239,68,68,.12);
            --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
            --selected:#a855f7;--selected-bg:rgba(168,85,247,.15);
            --radius:12px
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

        /* HEADER */
        .header{background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);border-bottom:1px solid var(--border);padding:1.5rem 0;text-align:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
        .header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ff9900,#ffb84d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
        .header p{color:var(--text-dim);font-size:.9rem}
        .container{max-width:900px;margin:0 auto;padding:2rem 1rem}

        /* DASHBOARD */
        .section-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
        .section-title::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px;display:inline-block}
        .source-tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:var(--surface);padding:.4rem;border-radius:var(--radius);border:1px solid var(--border)}
        .source-tab{flex:1;padding:.8rem 1rem;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s;background:transparent;color:var(--text-dim);font-family:inherit}
        .source-tab.active{background:var(--primary);color:#000;box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .source-tab:hover:not(.active){color:var(--text);background:var(--surface2)}

        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin-bottom:1.5rem}
        .module-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.75rem;user-select:none}
        .module-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
        .module-card.selected{border-color:var(--primary);background:var(--primary-glow)}
        .module-card input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
        .module-card label{cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.3}
        .module-card .q-count{font-size:.75rem;color:var(--text-dim);margin-top:.2rem}

        .controls{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .btn{padding:.7rem 1.2rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:.4rem}
        .btn-primary{background:var(--primary);color:#000}
        .btn-primary:hover{background:#ffb84d;transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .btn-submit{background:var(--selected);color:#fff;font-size:1rem;padding:.85rem 2rem}
        .btn-submit:hover:not(:disabled){background:#9333ea;transform:translateY(-1px);box-shadow:0 4px 15px rgba(168,85,247,.4)}
        .btn-submit:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
        .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
        .btn-lg{padding:1rem 2.5rem;font-size:1.1rem;border-radius:var(--radius)}

        .start-area{text-align:center;margin-top:2rem;padding:2rem;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
        .start-area .count{font-size:2.5rem;font-weight:800;color:var(--primary);margin:.5rem 0}

        /* QUIZ */
        #quiz-interface{display:none}
        .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .progress-wrap{flex:1;min-width:200px}
        .progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:.4rem}
        .progress-fill{height:100%;background:linear-gradient(90deg,#ff9900,#ffb84d);width:0;transition:width .4s ease}
        .progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-dim);font-weight:600}
        .stats{display:flex;gap:1rem;font-weight:700;font-size:.95rem}
        .s-ok{color:var(--success)}.s-no{color:var(--error)}

        .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem;animation:fadeUp .4s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .q-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--primary);padding:.3rem .8rem;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:1.2rem}
        .q-text{font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.7}
        .q-note{font-size:.85rem;color:var(--selected);margin-bottom:1.2rem;font-style:italic;padding:.6rem 1rem;background:var(--selected-bg);border-radius:8px;border-left:3px solid var(--selected)}

        /* OPTIONS */
        .opts{display:flex;flex-direction:column;gap:.6rem}
        .opt{text-align:left;padding:1rem 1.2rem;border:2px solid var(--border);border-radius:8px;background:var(--surface2);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.8rem;font-family:inherit;color:var(--text);line-height:1.5;width:100%}
        .opt:hover:not(:disabled):not(.correct):not(.wrong):not(.selected-opt){border-color:var(--primary);background:var(--primary-glow)}
        .opt .letter{font-weight:700;color:var(--text-dim);min-width:22px;flex-shrink:0;transition:color .2s}
        /* Selected (before submit) */
        .opt.selected-opt{border-color:var(--selected);background:var(--selected-bg)}
        .opt.selected-opt .letter{color:var(--selected)}
        /* After submit */
        .opt.correct{border-color:var(--success);background:var(--success-bg)}
        .opt.correct .letter{color:var(--success)}
        .opt.wrong{border-color:var(--error);background:var(--error-bg)}
        .opt.wrong .letter{color:var(--error)}
        .opt:disabled{cursor:default}
        .opt.dimmed{opacity:.45}

        /* SUBMIT & NEXT */
        #submit-area{margin-top:1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
        #submit-area .hint{font-size:.82rem;color:var(--text-dim);font-style:italic}
        .explain{display:none;margin-top:1.5rem;padding:1.4rem;border-radius:10px;background:var(--info-bg);border-left:4px solid var(--info);animation:fadeUp .4s ease}
        .explain h4{color:var(--info);margin-bottom:.6rem;font-size:.95rem;display:flex;align-items:center;gap:.4rem}
        .explain p{color:var(--text-dim);font-size:.92rem;line-height:1.8}
        .correct-label{background:var(--success-bg);border:1px solid var(--success);color:var(--success);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}
        .wrong-label{background:var(--error-bg);border:1px solid var(--error);color:var(--error);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}

        .next-area{display:none;text-align:right;margin-top:1.2rem;animation:fadeUp .3s ease}

        /* RESULTS */
        #results{display:none}
        .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:3rem 2rem;text-align:center}
        .result-circle{width:150px;height:150px;border-radius:50%;border:6px solid var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2.5rem;font-weight:800;color:var(--primary);box-shadow:0 0 40px rgba(255,153,0,.2)}
        .result-card h2{color:var(--text);margin-bottom:1rem;font-size:1.4rem}
        .result-card .detail{color:var(--text-dim);font-size:1.1rem;margin-bottom:2rem}
        .result-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

        @media(max-width:600px){
            .container{padding:1rem .75rem}
            .module-grid{grid-template-columns:1fr}
            .q-card{padding:1.5rem}
            .quiz-top{flex-direction:column;align-items:stretch}
        }
    </style>
</head>
<body>
<div class="header">
    <h1>☁️ AWS Academy Quiz</h1>
    <p>Hệ thống ôn tập Giữa kỳ — Module 2 đến 13</p>
</div>
<div class="container">

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h3 class="section-title">Nguồn Câu Hỏi</h3>
        <div class="source-tabs">
            <button class="source-tab active" onclick="setSource('original')">📚 120 Câu Gốc (Knowledge Check)</button>
            <button class="source-tab" onclick="setSource('extra')">🧠 120 Câu Mở Rộng (AI Tạo)</button>
        </div>
        <h3 class="section-title">Chọn Module</h3>
        <div class="controls">
            <button class="btn btn-outline" onclick="toggleAll(true)">✅ Chọn tất cả</button>
            <button class="btn btn-outline" onclick="toggleAll(false)">❌ Bỏ chọn</button>
        </div>
        <div class="module-grid" id="module-grid"></div>
        <div class="start-area">
            <p style="color:var(--text-dim)">Số câu hỏi đã chọn</p>
            <div class="count" id="sel-count">0</div>
            <button class="btn btn-primary btn-lg" id="start-btn" onclick="startQuiz()" disabled>🚀 BẮT ĐẦU LÀM BÀI</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-interface">
        <div class="quiz-top">
            <button class="btn btn-outline" onclick="exitQuiz()">← Thoát</button>
            <div class="progress-wrap">
                <div class="progress-label"><span>Tiến độ</span><span id="prog-txt">1/10</span></div>
                <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
            </div>
            <div class="stats">
                <span class="s-ok">✓ <span id="c-ok">0</span></span>
                <span class="s-no">✗ <span id="c-no">0</span></span>
            </div>
        </div>

        <div class="q-card">
            <div class="q-tag" id="q-tag">Module X</div>
            <div class="q-text" id="q-text"></div>
            <div class="q-note" id="q-note"></div>
            <div class="opts" id="q-opts"></div>

            <div id="submit-area">
                <button class="btn btn-submit" id="submit-btn" onclick="submitAnswer()" disabled>
                    ✅ Nộp bài
                </button>
                <span class="hint" id="submit-hint"></span>
            </div>

            <div class="explain" id="q-exp">
                <div id="q-result-label"></div>
                <h4>💡 Giải thích chi tiết:</h4>
                <p id="q-exp-txt"></p>
            </div>

            <div class="next-area" id="next-area">
                <button class="btn btn-primary" onclick="nextQ()">Câu tiếp theo →</button>
            </div>
        </div>
    </div>

    <!-- RESULTS -->
    <div id="results">
        <div class="result-card">
            <h2>🎉 Hoàn thành bài kiểm tra!</h2>
            <div class="result-circle"><span id="r-pct">0%</span></div>
            <p class="detail">Bạn trả lời đúng <span id="r-ok" class="s-ok">0</span> / <span id="r-total">0</span> câu hỏi.</p>
            <div class="result-btns">
                <button class="btn btn-outline" onclick="exitQuiz()">🏠 Về trang chủ</button>
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại bộ đề này</button>
            </div>
        </div>
    </div>

</div>
<script>const ORIGINAL_DATA=[{id:2,title:"Kiến trúc đám mây (Cloud Architecture)",questions:[{t:"Định nghĩa nào sau đây mô tả đúng nhất về kiến trúc đám mây?",o:["A. Kết hợp phần mềm và thành phần frontend/backend để tạo dịch vụ web có tính sẵn sàng cao và khả năng mở rộng đáp ứng nhu cầu tổ chức.","B. Di chuyển trung tâm dữ liệu tại chỗ sang trung tâm dữ liệu có thể truy cập qua internet do nhà cung cấp quản lý.","C. Áp dụng các đặc điểm của đám mây vào giải pháp sử dụng dịch vụ và tính năng đám mây để đáp ứng yêu cầu kỹ thuật và kinh doanh.","D. Thiết kế ứng dụng trên hạ tầng CNTT dùng chung dựa trên đám mây bằng máy ảo và kho dữ liệu chịu lỗi."],a:"C",e:"Kiến trúc đám mây là việc thiết kế các giải pháp tận dụng tối đa các đặc tính ưu việt của Cloud (như tính đàn hồi, tự động hóa) để giải quyết các vấn đề kinh doanh."},{t:"AWS Well-Architected Framework có sáu trụ cột. Ba trụ cột là bảo mật, xuất sắc vận hành và tính bền vững. Hai trụ cột nào còn lại? (Chọn 2)",o:["A. Quyền riêng tư (Privacy)","B. Quản trị (Governance)","C. Quản lý rủi ro (Risk management)","D. Độ tin cậy (Reliability)","E. Tối ưu chi phí (Cost optimization)"],a:"D, E",e:"6 trụ cột gồm: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, và Sustainability."},{t:"Những hành động nào phù hợp với trụ cột xuất sắc vận hành (Operational Excellence) của AWS Well-Architected Framework? (Chọn 2)",o:["A. Lập kế hoạch và quản lý toàn bộ vòng đời tài sản phần cứng.","B. Xem xét và cải tiến quy trình, thủ tục liên tục.","C. Đánh giá cơ cấu tổ chức và vai trò để xác định khoảng cách kỹ năng.","D. Đảm bảo nhân viên vận hành ghi lại các thay đổi đối với hạ tầng.","E. Áp dụng nguyên tắc kỹ thuật phần mềm và phương pháp luận vào hạ tầng dưới dạng mã (infrastructure as code)."],a:"B, E",e:"Cốt lõi của Operational Excellence là cải tiến liên tục và tự động hóa hạ tầng bằng mã (IaC)."},{t:"Một ứng dụng cần tầng web frontend gồm nhiều máy chủ giao tiếp với tầng ứng dụng backend gồm nhiều máy chủ. Thiết kế nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Gán một máy chủ ứng dụng riêng và kết nối riêng cho từng máy chủ web.","B. Thiết kế tầng web giao tiếp với tầng ứng dụng thông qua dịch vụ Elastic Load Balancing (ELB).","C. Tạo nhiều instance kết hợp cả frontend web và backend ứng dụng trong cùng một instance.","D. Tạo mạng lưới đầy đủ giữa tầng web và tầng ứng dụng để mỗi máy chủ web có thể giao tiếp trực tiếp với mọi máy chủ ứng dụng."],a:"B",e:"Sử dụng Load Balancer giúp tách biệt các tầng (decoupling), tăng tính sẵn sàng và khả năng chịu lỗi."},{t:"Một kiến trúc sư giải pháp đang xây dựng quy trình xử lý sự cố máy chủ. Quy trình nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Amazon CloudWatch phát hiện sự cố hệ thống, thông báo cho quản trị viên, người đó cấp phép máy chủ mới qua AWS Management Console.","B. Nhân viên vận hành phát hiện sự cố, thông báo cho quản trị viên, người đó cấp phép máy chủ mới qua AWS Management Console.","C. Nhân viên vận hành phát hiện sự cố, khởi động tự động hóa để cấp phép máy chủ mới.","D. Amazon CloudWatch phát hiện sự cố hệ thống, tự động khởi động quy trình cấp phép máy chủ mới."],a:"D",e:"Tự động hóa việc phát hiện và phục hồi (Self-healing) là tiêu chuẩn cao nhất trong kiến trúc AWS."},{t:"Một công ty đang cân nhắc chuyển trung tâm dữ liệu tại chỗ lên đám mây với mục tiêu chính là tăng hiệu quả chi phí. Phương án nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Cấp phép các máy chủ khi cần và dừng dịch vụ khi không sử dụng.","B. Cấp phép một số máy chủ trên đám mây và đảm bảo các máy chủ chạy 24/7.","C. Sao chép lại trung tâm dữ liệu tại chỗ trên đám mây.","D. Duy trì trung tâm dữ liệu tại chỗ càng lâu càng tốt."],a:"A",e:"Mô hình Pay-as-you-go (dùng bao nhiêu trả bấy nhiêu) giúp tối ưu hóa chi phí cực tốt trên đám mây."},{t:"Một công ty lưu trữ dữ liệu chỉ đọc trên Amazon S3. Phần lớn người dùng ở cùng quốc gia với trụ sở công ty, một số người dùng ở khắp nơi trên thế giới. Quyết định thiết kế nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Sử dụng một bucket ở AWS Region gần nhất với trụ sở công ty. Tất cả người dùng truy cập dữ liệu qua Amazon CloudFront.","B. Sử dụng một bucket ở Region gần nhất với trụ sở công ty.","C. Sử dụng một bucket ở Region có độ trễ trung bình thấp nhất cho tất cả người dùng.","D. Sao chép các object sang bucket ở nhiều AWS Region trên thế giới, người dùng truy cập bucket gần họ nhất."],a:"A",e:"Amazon CloudFront là dịch vụ CDN giúp tăng tốc phân phối nội dung toàn cầu với chi phí thấp hơn so với việc sao chép dữ liệu ra nhiều Region."},{t:"Một tư vấn viên cần truy cập một object lớn trong S3 bucket trong một ngày. Phương pháp cấp quyền truy cập nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Tạo một presigned URL trỏ đến object với thời hạn 24 giờ và cung cấp cho tư vấn viên.","B. Sao chép object sang bucket S3 mới, bật quyền truy cập công khai, lấy URL và cung cấp cho tư vấn viên.","C. Tạo tài khoản người dùng cho tư vấn viên, cấp quyền truy cập S3 bucket qua AWS Management Console.","D. Bật quyền truy cập công khai trên S3 bucket và cung cấp URL object cho tư vấn viên."],a:"A",e:"Presigned URL cho phép cấp quyền truy cập tạm thời một cách an toàn nhất."},{t:"Những yếu tố nào là cân nhắc chính ảnh hưởng đến việc chọn AWS Region? (Chọn 2)",o:["A. Bảo vệ khỏi thiên tai cục bộ.","B. Tuân thủ luật pháp và quy định.","C. Kiểm soát bảo mật và truy cập.","D. Giảm độ trễ cho người dùng cuối.","E. Khả năng phục hồi ứng dụng khi hệ thống gặp sự cố."],a:"B, D",e:"Tuân thủ pháp luật (Data Residency) và giảm độ trễ (Latency) là hai lý do hàng đầu khi chọn Region."},{t:"Những yếu tố nào là cân nhắc chính ảnh hưởng đến việc chọn Availability Zone? (Chọn 2)",o:["A. Giảm độ trễ cho người dùng cuối.","B. Tuân thủ luật pháp và quy định.","C. Khả năng phục hồi ứng dụng khi hệ thống gặp sự cố.","D. Kiểm soát bảo mật và truy cập.","E. Bảo vệ khỏi thiên tai cục bộ."],a:"C, E",e:"Availability Zones được thiết kế để cách ly lỗi và bảo vệ hệ thống khỏi các thiên tai cục bộ, tăng tính sẵn sàng."}]},{id:3,title:"Bảo mật (Security)",questions:[{t:"Phát biểu nào phản ánh nguyên tắc thiết kế của trụ cột bảo mật trong Well-Architected Framework?",o:["A. Không triển khai giải pháp lên môi trường production cho đến khi chắc chắn không còn rủi ro bảo mật nào.","B. Phân quyền quản lý đặc quyền.","C. Đảm bảo nhân viên chủ động theo dõi các rủi ro tiềm ẩn theo cách thủ công.","D. Áp dụng bảo mật ở tất cả các tầng của kiến trúc."],a:"D",e:"Defense in depth (Bảo mật đa lớp) là nguyên tắc cốt lõi của AWS."},{t:"Những phát biểu nào về trách nhiệm là chính xác dựa trên mô hình trách nhiệm chung của AWS? (Chọn 2)",o:["A. AWS chịu trách nhiệm về cấu hình tường lửa dựa trên máy chủ (host-based firewall).","B. Khách hàng chịu trách nhiệm quản lý dữ liệu người dùng của họ.","C. Khách hàng chịu trách nhiệm cài đặt, bảo trì và ngừng sử dụng phần cứng tại trung tâm dữ liệu AWS.","D. AWS chịu trách nhiệm về cấu hình security group.","E. AWS chịu trách nhiệm về bảo mật vật lý của các trung tâm dữ liệu."],a:"B, E",e:"AWS bảo mật \"của\" đám mây (phần cứng, hạ tầng), khách hàng bảo mật \"trong\" đám mây (dữ liệu, cấu hình)."},{t:"Những đặc điểm nào thuộc về nguyên tắc đặc quyền tối thiểu (least privilege)? (Chọn 2)",o:["A. Sử dụng mã hóa.","B. Chỉ cấp quyền truy cập khi cần thiết.","C. Giám sát các hành động và thay đổi.","D. Xây dựng chính sách bảo mật giới hạn quyền truy cập cho các tác vụ cụ thể.","E. Luôn sử dụng nhóm (groups)."],a:"B, D",e:"Least privilege nghĩa là chỉ cấp đúng và đủ quyền cần thiết để thực hiện công việc."},{t:"Phát biểu nào về AWS Identity and Access Management (IAM) là đúng?",o:["A. IAM cung cấp nhật ký kiểm tra về ai đã thực hiện hành động, hành động nào và thời điểm thực hiện.","B. IAM cung cấp lớp bảo mật bổ sung bằng cách phát hiện bất thường trên tài nguyên.","C. Với IAM, bạn có thể quản lý mã hóa cho các mục yêu cầu mã hóa khi lưu trữ.","D. Với IAM, bạn có thể cấp quyền truy cập chi tiết vào tài nguyên cho các principal."],a:"D",e:"IAM dùng để quản lý quyền truy cập chi tiết (fine-grained access control)."},{t:"Những phát biểu nào mô tả đúng về IAM roles? (Chọn 2)",o:["A. Chúng được gắn riêng cho một cá nhân cụ thể.","B. Chúng cung cấp thông tin xác thực bảo mật vĩnh viễn.","C. Cá nhân, ứng dụng và dịch vụ đều có thể đảm nhận (assume) các role.","D. Chúng chỉ có thể được sử dụng bởi tài khoản của người tạo ra role đó.","E. Chúng cung cấp thông tin xác thực bảo mật tạm thời."],a:"C, E",e:"IAM Role không có thông tin xác thực tĩnh, nó cung cấp quyền tạm thời cho các thực thể đảm nhận nó."},{t:"Phát biểu nào phản ánh thực tiễn tốt nhất cho root user trên tài khoản AWS?",o:["A. Để tránh bị khóa tài khoản, không bật xác thực đa yếu tố (MFA) cho root account.","B. Tạo một admin user và thực hiện hầu hết các tác vụ quản trị bằng user đó thay vì root user.","C. Tạo hai root user với thông tin xác thực riêng biệt và phân phối cho hai cá nhân khác nhau.","D. Xóa các quyền không cần thiết khỏi tài khoản root user."],a:"B",e:"Chỉ sử dụng root account cho các tác vụ cực kỳ đặc biệt, còn lại dùng IAM Admin user."},{t:"AWS Identity and Access Management (IAM) đánh giá một policy như thế nào?",o:["A. Một câu lệnh deny tường minh không ghi đè câu lệnh allow tường minh.","B. Nó kiểm tra các câu lệnh allow tường minh trước khi kiểm tra các câu lệnh deny tường minh.","C. Nó kiểm tra các câu lệnh deny tường minh trước khi kiểm tra các câu lệnh allow tường minh.","D. Nếu policy không có câu lệnh deny hay allow tường minh nào, người dùng mặc định có quyền truy cập."],a:"C",e:"Explicit Deny luôn có ưu tiên cao nhất trong đánh giá policy của AWS."},{t:"Phát biểu nào về các IAM policy là chính xác?",o:["A. Resource-based policy cho phép truy cập theo mặc định.","B. Identity-based policy được gắn vào user, group hoặc role.","C. Identity-based policy chỉ có thể được gắn vào một thực thể duy nhất.","D. Resource-based policy được gắn vào user, group hoặc role."],a:"B",e:"Identity-based policies gắn vào các đối tượng định danh để quy định quyền của họ."},{t:"Phần tử nào trong IAM policy chứa thông tin về việc cho phép hay từ chối một yêu cầu?",o:["A. Condition","B. Principal","C. Effect","D. Action"],a:"C",e:"Effect có hai giá trị là \"Allow\" hoặc \"Deny\"."},{t:"Tùy chọn nào mô tả chính xác phần tử statement trong IAM policy?",o:["A. Phần tử statement là phần tùy chọn trong IAM policy.","B. Một policy chỉ có thể có một phần tử statement.","C. Phần tử statement không áp dụng cho identity-based policy.","D. Phần tử statement chứa các phần tử khác cùng nhau xác định những gì được phép hoặc bị từ chối."],a:"D",e:"Statement là khối xây dựng cơ bản của một policy, chứa Action, Effect, Resource..."}]},{id:4,title:"Lưu trữ (Storage)",questions:[{t:"Một công ty muốn lưu trữ dữ liệu theo mô hình WORM (write once, read many). Tính năng nào của Amazon S3 đáp ứng yêu cầu này?",o:["A. S3 Versioning","B. S3 Object Lock","C. S3 Replication","D. S3 Lifecycle policies"],a:"B",e:"S3 Object Lock giúp ngăn chặn việc xóa hoặc ghi đè đối tượng trong một khoảng thời gian cố định."},{t:"Bạn cần lưu trữ dữ liệu có thể truy cập đồng thời bởi hàng trăm máy chủ EC2 thông qua giao thức NFS. Dịch vụ nào là phù hợp nhất?",o:["A. Amazon EBS","B. Amazon S3","C. Amazon EFS","D. Amazon Instance Store"],a:"C",e:"EFS là hệ thống tệp chia sẻ cho phép hàng nghìn instance kết nối cùng lúc qua NFS."},{t:"Dịch vụ lưu trữ nào cung cấp độ trễ thấp nhất cho các ứng dụng chạy trên EC2 nhưng dữ liệu sẽ bị mất khi instance bị stop hoặc terminate?",o:["A. Amazon EBS","B. Amazon EFS","C. Amazon S3","D. Amazon Instance Store"],a:"D",e:"Instance Store gắn trực tiếp vào phần cứng máy chủ vật lý nên tốc độ cực nhanh nhưng dữ liệu là tạm thời (ephemeral)."},{t:"Amazon S3 Glacier Flexible Retrieval phù hợp nhất cho loại dữ liệu nào?",o:["A. Dữ liệu cần truy cập thường xuyên.","B. Dữ liệu sao lưu lưu trữ lâu dài, hiếm khi truy cập và có thể đợi vài giờ để lấy lại.","C. Dữ liệu làm ổ đĩa hệ điều hành.","D. Dữ liệu web tĩnh."],a:"B",e:"Glacier là lớp lưu trữ lưu trữ (archive) với chi phí cực thấp nhưng thời gian truy xuất lâu."},{t:"Để tự động chuyển dữ liệu từ S3 Standard sang S3 Glacier sau 90 ngày để tiết kiệm chi phí, bạn nên sử dụng tính năng nào?",o:["A. S3 Versioning","B. S3 Replication","C. S3 Lifecycle Policies","D. S3 Intelligent-Tiering"],a:"C",e:"Lifecycle Policies cho phép định nghĩa các quy tắc để tự động di chuyển hoặc xóa đối tượng."},{t:"Sự khác biệt chính giữa Amazon EBS và Amazon S3 là gì?",o:["A. EBS là lưu trữ đối tượng (Object), S3 là lưu trữ khối (Block).","B. EBS là lưu trữ khối (Block), S3 là lưu trữ đối tượng (Object).","C. S3 chỉ dùng cho máy ảo Windows.","D. EBS không thể sao lưu."],a:"B",e:"EBS cung cấp các ổ đĩa khối gắn vào EC2, S3 lưu trữ các tệp tin dưới dạng đối tượng qua internet."},{t:"Lớp lưu trữ S3 nào tự động tối ưu hóa chi phí khi mẫu truy cập của dữ liệu thay đổi?",o:["A. S3 Standard","B. S3 Standard-IA","C. S3 One Zone-IA","D. S3 Intelligent-Tiering"],a:"D",e:"Intelligent-Tiering tự động di chuyển dữ liệu giữa các lớp truy cập thường xuyên và không thường xuyên dựa trên hành vi truy cập."},{t:"Một công ty cần một hệ thống tệp có thể gắn vào các instance Windows thông qua giao thức SMB. Dịch vụ nào phù hợp?",o:["A. Amazon EFS","B. Amazon FSx for Windows File Server","C. Amazon S3","D. Amazon Instance Store"],a:"B",e:"FSx for Windows cung cấp hệ thống tệp native Windows hỗ trợ đầy đủ giao thức SMB."},{t:"Khả năng của Amazon S3 để giữ lại các phiên bản cũ của một đối tượng khi nó bị ghi đè hoặc xóa gọi là gì?",o:["A. S3 Replication","B. S3 Versioning","C. S3 Object Lock","D. S3 Logging"],a:"B",e:"Versioning giúp khôi phục lại dữ liệu nếu lỡ tay xóa hoặc sửa nhầm."},{t:"Bạn muốn tạo một bản sao dự phòng của EBS volume ở một Availability Zone khác. Cách nhanh nhất là gì?",o:["A. Sao chép toàn bộ dữ liệu qua mạng.","B. Tạo một EBS Snapshot và khôi phục nó thành volume mới ở AZ đích.","C. Dùng S3 Replication.","D. Không thể làm được."],a:"B",e:"Snapshots là cách tiêu chuẩn để sao lưu và di chuyển EBS volumes."}]},{id:5,title:"Điện toán (Compute)",questions:[{t:"Loại hình thanh toán EC2 nào giúp giảm chi phí nhiều nhất (lên tới 90%) cho các công việc có thể bị gián đoạn?",o:["A. On-Demand Instances","B. Reserved Instances","C. Spot Instances","D. Dedicated Hosts"],a:"C",e:"Spot Instances tận dụng dung lượng dư thừa của AWS với giá cực rẻ nhưng có thể bị AWS thu hồi bất cứ lúc nào."},{t:"Dịch vụ nào cho phép bạn chạy các container mà không cần quản lý máy chủ EC2 ẩn bên dưới?",o:["A. Amazon ECS với EC2 launch type.","B. Amazon EKS với EC2 nodes.","C. AWS Fargate.","D. Amazon Lightsail."],a:"C",e:"Fargate là công cụ serverless cho container, giúp bạn chỉ cần quan tâm đến ứng dụng của mình."},{t:"Để đảm bảo một ứng dụng web luôn có đủ số lượng máy chủ để đáp ứng lưu lượng truy cập thay đổi, bạn nên sử dụng dịch vụ nào?",o:["A. Elastic Load Balancing","B. Amazon EC2 Auto Scaling","C. AWS Lambda","D. Amazon Route 53"],a:"B",e:"Auto Scaling tự động thêm hoặc bớt máy chủ dựa trên nhu cầu thực tế."},{t:"Một công ty có một khối lượng công việc chạy liên tục 24/7 và dự kiến sẽ kéo dài trong ít nhất 1 năm. Lựa chọn mua EC2 nào là tối ưu nhất?",o:["A. On-Demand Instances","B. Reserved Instances (hoặc Savings Plans)","C. Spot Instances","D. Dedicated Instances"],a:"B",e:"Cam kết sử dụng trong 1 hoặc 3 năm giúp giảm giá đáng kể so với On-Demand."},{t:"AWS Lambda là một dịch vụ thuộc loại nào?",o:["A. Infrastructure as a Service (IaaS)","B. Platform as a Service (PaaS)","C. Serverless Function as a Service (FaaS)","D. Software as a Service (SaaS)"],a:"C",e:"Lambda chạy code khi có sự kiện (trigger) mà không cần quan tâm đến máy chủ."},{t:"Trong Amazon ECS, tệp tin cấu hình định nghĩa container image, CPU, RAM và các tham số khác gọi là gì?",o:["A. Cluster definition","B. Task definition","C. Service definition","D. Container definition"],a:"B",e:"Task definition giống như một bản thiết kế cho ứng dụng container của bạn."},{t:"Lợi ích của việc sử dụng Amazon Lightsail là gì?",o:["A. Quản lý các cụm Kubernetes phức tạp.","B. Cung cấp môi trường phát triển web đơn giản, trọn gói với giá cố định hàng tháng.","C. Chạy các siêu máy tính.","D. Quản lý kho lưu trữ S3."],a:"B",e:"Lightsail dành cho người mới bắt đầu hoặc các dự án nhỏ cần sự đơn giản."},{t:"Một \"Dedicated Host\" khác với \"Dedicated Instance\" ở điểm nào?",o:["A. Dedicated Host rẻ hơn.","B. Dedicated Host cho phép bạn kiểm soát vị trí vật lý của máy chủ và hỗ trợ các giấy phép phần mềm (BYOL) dựa trên socket/core.","C. Dedicated Instance là máy chủ vật lý riêng.","D. Không có sự khác biệt."],a:"B",e:"Dedicated Host cung cấp quyền kiểm soát phần cứng vật lý sâu hơn để đáp ứng các yêu cầu tuân thủ hoặc bản quyền phần mềm."},{t:"Dịch vụ nào phù hợp nhất để chạy một đoạn code xử lý ảnh ngay khi ảnh được tải lên S3?",o:["A. Amazon EC2","B. AWS Lambda","C. Amazon ECS","D. AWS Batch"],a:"B",e:"Lambda cực kỳ mạnh mẽ trong các kiến trúc hướng sự kiện (event-driven)."},{t:"Khi cấu hình Auto Scaling, \"Desired Capacity\" có ý nghĩa gì?",o:["A. Số lượng máy chủ tối đa có thể chạy.","B. Số lượng máy chủ tối thiểu phải chạy.","C. Số lượng máy chủ mà Auto Scaling sẽ cố gắng duy trì hoạt động tại mọi thời điểm.","D. Tổng dung lượng ổ cứng."],a:"C",e:"ASG sẽ tự động khởi chạy hoặc tắt bớt máy chủ để khớp với con số Desired Capacity này."}]},{id:6,title:"Cơ sở dữ liệu (Database)",questions:[{t:"Bạn cần một cơ sở dữ liệu quan hệ (SQL) có khả năng tự động sao lưu, vá lỗi phần mềm và hỗ trợ Multi-AZ để dự phòng. Dịch vụ nào là lựa chọn tốt nhất?",o:["A. Amazon RDS","B. Amazon DynamoDB","C. Amazon Redshift","D. Amazon ElastiCache"],a:"A",e:"RDS quản lý các DB engine phổ biến như MySQL, PostgreSQL, SQL Server..."},{t:"Cơ sở dữ liệu NoSQL nào của AWS cung cấp hiệu suất mili giây ở quy mô bất kỳ và hoàn toàn serverless?",o:["A. Amazon Aurora","B. Amazon RDS","C. Amazon DynamoDB","D. Amazon DocumentDB"],a:"C",e:"DynamoDB là lựa chọn hàng đầu cho các ứng dụng cần tốc độ cực nhanh và khả năng mở rộng lớn."},{t:"Amazon Aurora là một phần của dịch vụ nào?",o:["A. Amazon DynamoDB","B. Amazon RDS","C. Amazon Redshift","D. Amazon Neptune"],a:"B",e:"Aurora là DB quan hệ tương thích MySQL/PostgreSQL được AWS tối ưu riêng cho đám mây."},{t:"Dịch vụ nào là một kho dữ liệu (Data Warehouse) chuyên dùng cho việc phân tích dữ liệu khổng lồ (Big Data)?",o:["A. Amazon RDS","B. Amazon DynamoDB","C. Amazon Redshift","D. Amazon ElastiCache"],a:"C",e:"Redshift sử dụng kiến trúc lưu trữ cột để tối ưu hóa cho các truy vấn phân tích phức tạp."},{t:"Để tăng tốc độ phản hồi của ứng dụng bằng cách lưu kết quả truy vấn cơ sở dữ liệu lên RAM, bạn nên dùng dịch vụ nào?",o:["A. Amazon ElastiCache","B. Amazon RDS Read Replicas","C. Amazon S3","D. Amazon CloudFront"],a:"A",e:"ElastiCache hỗ trợ Redis và Memcached để giảm độ trễ truy cập dữ liệu."},{t:"Amazon Neptune là loại cơ sở dữ liệu nào?",o:["A. Quan hệ (Relational)","B. Khóa - giá trị (Key-value)","C. Đồ thị (Graph)","D. Chuỗi thời gian (Time-series)"],a:"C",e:"Neptune dùng để lưu trữ các mối quan hệ phức tạp giữa các tập dữ liệu (như mạng xã hội)."},{t:"Tính năng nào của Amazon RDS giúp tăng hiệu suất cho các ứng dụng có lượng đọc dữ liệu (Read) rất lớn?",o:["A. Multi-AZ Deployment","B. Read Replicas","C. Snapshots","D. Provisioned IOPS"],a:"B",e:"Read Replicas tạo ra các bản sao chỉ đọc để chia tải cho database chính."},{t:"Dịch vụ nào giúp bạn di chuyển cơ sở dữ liệu từ hạ tầng tại chỗ lên AWS một cách dễ dàng và giảm thiểu thời gian ngừng hoạt động?",o:["A. AWS Snowball","B. AWS Database Migration Service (DMS)","C. AWS DataSync","D. Amazon S3 Transfer Acceleration"],a:"B",e:"DMS hỗ trợ di chuyển dữ liệu liên tục giữa các DB cùng loại hoặc khác loại."},{t:"Khi sử dụng DynamoDB, bạn không cần phải quản lý máy chủ hay cài đặt phần mềm. Điều này có nghĩa là DynamoDB là:",o:["A. Một máy ảo EC2.","B. Một dịch vụ Managed Service và Serverless.","C. Một ổ đĩa EBS.","D. Một dịch vụ mã nguồn mở."],a:"B",e:"AWS lo toàn bộ hạ tầng, bạn chỉ cần tạo bảng và dùng dữ liệu."},{t:"Amazon DocumentDB tương thích với công cụ cơ sở dữ liệu nào?",o:["A. MySQL","B. PostgreSQL","C. MongoDB","D. Cassandra"],a:"C",e:"DocumentDB là dịch vụ cơ sở dữ liệu tài liệu được quản lý hoàn toàn tương thích với MongoDB."}]},{id:7,title:"Mạng (Networking)",questions:[{t:"Một mạng ảo riêng biệt mà bạn định nghĩa trong tài khoản AWS của mình gọi là gì?",o:["A. Subnet","B. VPC (Virtual Private Cloud)","C. Internet Gateway","D. VPN"],a:"B",e:"VPC là nền tảng mạng cho hầu hết các tài nguyên AWS của bạn."},{t:"Để cho phép các tài nguyên trong VPC (như EC2) có thể truy cập được internet, bạn cần gắn thành phần nào vào VPC?",o:["A. NAT Gateway","B. Internet Gateway (IGW)","C. Virtual Private Gateway","D. Customer Gateway"],a:"B",e:"IGW là cửa ngõ hai chiều giữa VPC và internet."},{t:"Dịch vụ nào cung cấp kết nối mạng chuyên dụng, riêng tư giữa trung tâm dữ liệu tại chỗ và AWS, không đi qua internet công cộng?",o:["A. AWS Site-to-Site VPN","B. AWS Direct Connect","C. AWS Transit Gateway","D. VPC Peering"],a:"B",e:"Direct Connect cung cấp băng thông ổn định và độ trễ thấp cho các kết nối doanh nghiệp."},{t:"Để kết nối hai VPC với nhau để chúng có thể trao đổi dữ liệu bằng địa chỉ IP nội bộ, bạn sử dụng tính năng nào?",o:["A. VPC Endpoints","B. NAT Gateway","C. VPC Peering","D. Route 53"],a:"C",e:"Peering tạo ra kết nối trực tiếp giữa hai VPC như thể chúng nằm trong cùng một mạng."},{t:"Dịch vụ DNS (Domain Name System) của AWS là gì?",o:["A. Amazon Route 53","B. Amazon CloudFront","C. AWS Direct Connect","D. Amazon VPC"],a:"A",e:"Route 53 giúp quản lý tên miền và định tuyến người dùng đến ứng dụng."},{t:"Bạn muốn phân phối nội dung web (hình ảnh, video) đến người dùng trên toàn cầu với độ trễ thấp nhất. Bạn nên dùng dịch vụ nào?",o:["A. Amazon S3","B. Amazon CloudFront","C. Amazon Route 53","D. AWS Global Accelerator"],a:"B",e:"CloudFront là mạng phân phối nội dung (CDN) sử dụng các vá trí biên (Edge Locations)."},{t:"Sự khác biệt giữa Security Group và Network ACL (NACL) là gì?",o:["A. Security Group ở cấp Subnet, NACL ở cấp Instance.","B. Security Group ở cấp Instance (máy ảo), NACL ở cấp Subnet (mạng con).","C. Cả hai đều giống nhau.","D. NACL là stateful, Security Group là stateless."],a:"B",e:"Security Group là tường lửa cho từng EC2, NACL là lớp bảo mật cho cả Subnet."},{t:"Thành phần nào cho phép các instance trong Private Subnet có thể tải bản cập nhật từ internet nhưng ngăn chặn internet khởi tạo kết nối đến chúng?",o:["A. Internet Gateway","B. NAT Gateway","C. Virtual Private Gateway","D. Transit Gateway"],a:"B",e:"NAT Gateway cho phép traffic đi ra nhưng chặn traffic lạ đi vào."},{t:"AWS Global Accelerator giúp cải thiện hiệu suất ứng dụng bằng cách nào?",o:["A. Nén dữ liệu.","B. Sử dụng mạng cáp quang nội bộ của AWS để định tuyến traffic qua các điểm truy cập gần người dùng nhất.","C. Tăng tốc độ CPU.","D. Lưu cache dữ liệu."],a:"B",e:"Nó cung cấp các IP tĩnh làm lối vào mạng AWS toàn cầu cho ứng dụng của bạn."},{t:"Để tập trung quản lý kết nối giữa hàng trăm VPC và mạng tại chỗ (on-premises), dịch vụ nào là tối ưu nhất?",o:["A. VPC Peering","B. AWS Site-to-Site VPN","C. AWS Transit Gateway","D. AWS Direct Connect"],a:"C",e:"Transit Gateway hoạt động như một cái Hub trung tâm cho mọi kết nối mạng."}]},{id:8,title:"Kiến trúc và Định giá (Architecture & Pricing)",questions:[{t:"Công cụ nào cung cấp các khuyến nghị tự động để giúp bạn tối ưu hóa chi phí, tăng hiệu suất và cải thiện bảo mật cho tài khoản AWS?",o:["A. AWS Config","B. AWS Trusted Advisor","C. Amazon Inspector","D. AWS Artifact"],a:"B",e:"Trusted Advisor kiểm tra tài khoản của bạn dựa trên các best practices của AWS."},{t:"Bạn muốn xem báo cáo chi tiết về chi phí AWS theo từng dịch vụ, theo ngày hoặc tháng và dự báo chi phí trong tương lai. Bạn nên dùng:",o:["A. AWS Budgets","B. AWS Cost Explorer","C. AWS Pricing Calculator","D. AWS Marketplace"],a:"B",e:"Cost Explorer là công cụ trực quan hóa chi phí mạnh mẽ của AWS."},{t:"Công cụ nào cho phép bạn đặt các ngưỡng chi phí và gửi cảnh báo khi chi phí thực tế hoặc dự báo vượt quá ngưỡng đó?",o:["A. AWS Cost Explorer","B. AWS Budgets","C. AWS Trusted Advisor","D. Amazon CloudWatch"],a:"B",e:"AWS Budgets giúp bạn kiểm soát ngân sách một cách chủ động."},{t:"Bạn cần ước tính chi phí cho một kiến trúc giải pháp mới trên AWS trước khi bắt đầu triển khai. Bạn nên dùng:",o:["A. AWS Pricing Calculator","B. AWS Cost Explorer","C. AWS Marketplace","D. AWS Budgets"],a:"A",e:"Pricing Calculator giúp bạn mô phỏng các cấu hình dịch vụ và biết trước số tiền phải trả."},{t:"\"Càng dùng càng rẻ\" (Tiered Pricing) thường được áp dụng cho loại dịch vụ nào?",o:["A. EC2 Instance","B. S3 Storage và Data Transfer out","C. IAM Users","D. VPC"],a:"B",e:"Với S3, khi bạn lưu trữ dung lượng càng lớn (theo các mốc TB), đơn giá trên mỗi GB sẽ càng giảm."},{t:"AWS Marketplace là gì?",o:["A. Một cửa hàng phần cứng.","B. Một cửa hàng trực tuyến giúp tìm kiếm, mua và triển khai các phần mềm chạy trên AWS từ các nhà cung cấp bên thứ ba.","C. Một diễn đàn thảo luận.","D. Một dịch vụ lưu trữ mã nguồn."],a:"B",e:"Bạn có thể tìm thấy các image OS, bảo mật, mạng đã được cấu hình sẵn tại đây."},{t:"Đặc điểm nào của AWS giúp giảm chi phí bằng cách gộp hóa đơn của nhiều tài khoản con vào một tài khoản chính?",o:["A. AWS Organizations - Consolidated Billing","B. AWS Control Tower","C. AWS Resource Groups","D. AWS Cost Categories"],a:"A",e:"Consolidated Billing giúp bạn dễ dàng quản lý chi phí và tận dụng các mức giảm giá theo số lượng."},{t:"Loại chi phí nào sau đây là MIỄN PHÍ trong AWS (trong hầu hết các trường hợp)?",o:["A. Dữ liệu truyền ra internet (Data Transfer Out).","B. Dữ liệu truyền vào AWS (Data Transfer In).","C. Lưu trữ EBS.","D. Chạy máy chủ EC2."],a:"B",e:"AWS không tính phí khi bạn tải dữ liệu từ ngoài vào hệ thống của họ."},{t:"AWS Trusted Advisor cung cấp kiểm tra ở các lĩnh vực nào? (Chọn 2)",o:["A. Tối ưu chi phí (Cost Optimization).","B. Quản lý nhân sự.","C. Bảo mật (Security).","D. Thiết kế logo.","E. Tốc độ gõ phím."],a:"A, C",e:"5 lĩnh vực gồm: Cost Optimization, Performance, Security, Fault Tolerance, và Service Limits."},{t:"Một công ty muốn có một kênh hỗ trợ kỹ thuật 24/7 qua điện thoại và chat, cùng với thời gian phản hồi dưới 1 giờ cho các sự cố nghiêm trọng. Họ cần gói AWS Support nào tối thiểu?",o:["A. Basic","B. Developer","C. Business","D. Enterprise"],a:"C",e:"Gói Business là gói thấp nhất hỗ trợ kỹ thuật 24/7 cho các vấn đề về môi trường production."}]},{id:9,title:"Hệ thống và Quản lý (System & Management)",questions:[{t:"Dịch vụ nào cung cấp các số liệu (metrics) về hiệu năng của các tài nguyên AWS (như CPU utilization của EC2)?",o:["A. AWS CloudTrail","B. Amazon CloudWatch","C. AWS Config","D. Amazon Inspector"],a:"B",e:"CloudWatch là tai mắt của bạn để theo dõi sức khỏe của hệ thống."},{t:"Dịch vụ nào ghi lại nhật ký (logs) về mọi hành động gọi API trong tài khoản AWS của bạn (ai đã làm gì, lúc nào)?",o:["A. Amazon CloudWatch","B. AWS CloudTrail","C. AWS Trusted Advisor","D. AWS Shield"],a:"B",e:"CloudTrail cực kỳ quan trọng cho việc quản trị, tuân thủ và kiểm toán bảo mật."},{t:"Bạn muốn theo dõi lịch sử cấu hình của các tài nguyên AWS và kiểm tra xem chúng có tuân thủ các quy tắc bảo mật của công ty hay không. Bạn nên dùng:",o:["A. AWS CloudTrail","B. Amazon CloudWatch","C. AWS Config","D. Amazon GuardDuty"],a:"C",e:"AWS Config giúp bạn biết \"cấu hình tài nguyên của tôi trông như thế nào ở thời điểm X\"."},{t:"Để thực hiện các hành động tự động khi một số liệu CloudWatch vượt quá ngưỡng cho phép (ví dụ: gửi email khi CPU > 80%), bạn sử dụng tính năng nào?",o:["A. CloudWatch Logs","B. CloudWatch Alarms","C. CloudWatch Dashboard","D. CloudWatch Events"],a:"B",e:"Alarms kích hoạt các thông báo (SNS) hoặc các hành động tự động (Auto Scaling)."},{t:"AWS Trusted Advisor khác với AWS Config ở điểm nào?",o:["A. Không khác nhau.","B. Trusted Advisor đưa ra lời khuyên tối ưu, còn AWS Config ghi lại lịch sử cấu hình và kiểm tra tính tuân thủ.","C. Config rẻ hơn.","D. Trusted Advisor chỉ dùng cho bảo mật."],a:"B",e:"Trusted Advisor mang tính chất \"tư vấn\", còn Config mang tính chất \"quản lý trạng thái và tuân thủ\"."},{t:"Dịch vụ nào cung cấp một bảng điều khiển tập trung để quản lý và vận hành các tài nguyên AWS theo nhóm?",o:["A. AWS Systems Manager","B. AWS Management Console","C. AWS Organizations","D. AWS Resource Groups"],a:"A",e:"Systems Manager giúp bạn thực hiện các tác vụ như chạy lệnh trên hàng loạt server, quản lý bản vá lỗi..."},{t:"CloudWatch Logs dùng để làm gì?",o:["A. Lưu trữ video.","B. Thu thập, lưu trữ và phân tích các tệp nhật ký từ các ứng dụng và dịch vụ AWS.","C. Ghi lại các lệnh gọi API.","D. Theo dõi chi phí."],a:"B",e:"Bạn có thể đẩy các file log của web server (như Apache/Nginx) lên đây để quản lý tập trung."},{t:"Bạn muốn tự động hóa việc vá lỗi (patching) cho hàng trăm máy chủ EC2 một cách định kỳ. Công cụ nào trong Systems Manager hỗ trợ việc này?",o:["A. Run Command","B. Patch Manager","C. State Manager","D. Parameter Store"],a:"B",e:"Patch Manager giúp đơn giản hóa quy trình cập nhật phần mềm bảo mật cho máy chủ."},{t:"AWS Personal Health Dashboard cung cấp thông tin gì?",o:["A. Sức khỏe của nhân viên công ty.","B. Trạng thái hoạt động của các dịch vụ AWS cụ thể mà tài khoản của bạn đang sử dụng.","C. Trạng thái chung của toàn bộ dịch vụ AWS trên thế giới.","D. Danh sách các lỗi code."],a:"B",e:"Nó cảnh báo bạn nếu có sự cố hạ tầng ảnh hưởng trực tiếp đến các tài nguyên bạn đang chạy."},{t:"Để quản lý các tham số cấu hình (như mật khẩu DB, API keys) một cách an toàn và tập trung, bạn nên dùng thành phần nào của Systems Manager?",o:["A. Inventory","B. Parameter Store","C. Session Manager","D. Maintenance Windows"],a:"B",e:"Parameter Store cho phép lưu trữ dữ liệu dưới dạng văn bản thuần hoặc mã hóa (SecureString)."}]},{id:10,title:"Giám sát và Tính đàn hồi (Monitoring & Elasticity)",questions:[{t:"Phóng to (Vertical Scaling) một máy chủ EC2 có nghĩa là gì?",o:["A. Thêm nhiều máy chủ mới vào hệ thống.","B. Thay đổi Instance Type để máy chủ có nhiều CPU và RAM hơn.","C. Tăng tốc độ internet.","D. Thêm nhiều ổ cứng."],a:"B",e:"Vertical scaling là làm cho một máy chủ mạnh lên."},{t:"Mở rộng theo chiều ngang (Horizontal Scaling) có lợi ích gì so với Vertical Scaling?",o:["A. Dễ thực hiện hơn.","B. Rẻ hơn.","C. Tăng tính sẵn sàng (High Availability) vì lỗi của một máy không làm sập toàn bộ hệ thống.","D. Không cần Load Balancer."],a:"C",e:"Khi có nhiều máy, nếu 1 máy hỏng, các máy còn lại vẫn phục vụ khách hàng được."},{t:"Amazon EC2 Auto Scaling thực hiện hành động gì khi lưu lượng truy cập giảm xuống?",o:["A. Tắt bớt các máy chủ không cần thiết (Scaling in) để tiết kiệm chi phí.","B. Tăng cấu hình CPU của máy chủ.","C. Xóa toàn bộ dữ liệu.","D. Gửi email thông báo cho sếp."],a:"A",e:"Đây là tính năng giúp tối ưu hóa chi phí tự động."},{t:"Làm thế nào để Auto Scaling biết được một máy chủ EC2 không còn hoạt động tốt để thay thế nó?",o:["A. Dựa vào báo cáo của người dùng.","B. Thông qua các đợt kiểm tra sức khỏe (Health Checks).","C. Dựa vào ngày hết hạn.","D. Do quản trị viên tắt thủ công."],a:"B",e:"ASG liên tục kiểm tra tình trạng của instance, nếu thấy lỗi nó sẽ tự động thay thế."},{t:"Loại hình Scaling nào dựa trên các dự đoán về lưu lượng truy cập trong quá khứ để chuẩn bị sẵn máy chủ?",o:["A. Dynamic Scaling","B. Scheduled Scaling","C. Predictive Scaling","D. Manual Scaling"],a:"C",e:"AWS sử dụng Machine Learning để phân tích dữ liệu cũ và đưa ra dự báo."},{t:"Khi cấu hình Auto Scaling, bạn cần tạo một bản thiết kế bao gồm AMI ID, Instance Type, Key Pair... Bản thiết kế này gọi là gì?",o:["A. Launch Configuration (hoặc Launch Template)","B. Scaling Policy","C. Auto Scaling Group","D. Load Balancer Template"],a:"A",e:"Đây là thông tin cần thiết để ASG biết cách tạo ra một máy chủ mới."},{t:"Thành phần nào của Elastic Load Balancing hoạt động ở tầng 7 (Application Layer) và có thể định tuyến dựa trên đường dẫn URL?",o:["A. Network Load Balancer","B. Application Load Balancer (ALB)","C. Classic Load Balancer","D. Gateway Load Balancer"],a:"B",e:"ALB cực kỳ linh hoạt cho các ứng dụng web hiện đại (Microservices)."},{t:"Target Tracking Scaling Policy hoạt động như thế nào?",o:["A. Thêm 1 máy chủ mỗi giờ.","B. Giữ cho một số liệu cụ thể (ví dụ CPU trung bình) luôn ở mức mục tiêu mà bạn đặt ra.","C. Chờ lệnh từ quản trị viên.","D. Chỉ chạy vào ban đêm."],a:"B",e:"Ví dụ: \"Luôn giữ CPU trung bình ở mức 50%\"."},{t:"Lợi ích của việc kết hợp ALB và Auto Scaling là gì?",o:["A. Chỉ để cho đẹp.","B. Giúp ứng dụng có khả năng chịu lỗi và tự động mở rộng linh hoạt.","C. Giảm băng thông mạng.","D. Không cần dùng VPC."],a:"B",e:"ALB chia tải, ASG đảm bảo số lượng máy chủ phù hợp."},{t:"Bạn muốn đảm bảo ứng dụng luôn có ít nhất 2 máy chủ chạy ở 2 Availability Zones khác nhau để dự phòng sự cố. Bạn cần cấu hình tham số nào trong ASG?",o:["A. Maximum Capacity = 2","B. Minimum Capacity = 2","C. Desired Capacity = 1","D. Health Check Grace Period"],a:"B",e:"Minimum Capacity đảm bảo hệ thống không bao giờ tụt xuống dưới số lượng này."}]},{id:11,title:"Tự động hóa và IaC (Automation & IaC)",questions:[{t:"Dịch vụ nào của AWS cho phép bạn định nghĩa hạ tầng bằng mã (Infrastructure as Code) thông qua các tệp mẫu (templates)?",o:["A. AWS Elastic Beanstalk","B. AWS CloudFormation","C. AWS OpsWorks","D. AWS Systems Manager"],a:"B",e:"CloudFormation giúp bạn khởi tạo toàn bộ hệ thống (VPC, EC2, DB...) một cách tự động và nhất quán."},{t:"Trong CloudFormation, tập hợp các tài nguyên AWS được tạo ra từ một template gọi là gì?",o:["A. Bundle","B. Stack","C. Group","D. Collection"],a:"B",e:"Bạn quản lý vòng đời của tài nguyên (tạo, sửa, xóa) thông qua việc quản lý Stack."},{t:"Lợi ích chính của Infrastructure as Code (IaC) là gì?",o:["A. Có thể tái sử dụng, dễ dàng kiểm soát phiên bản và triển khai nhanh chóng các môi trường giống hệt nhau.","B. Làm cho hệ thống chạy nhanh hơn.","C. Không cần kết nối internet.","D. Chỉ dùng được cho S3."],a:"A",e:"IaC loại bỏ các sai sót khi thao tác thủ công và giúp quản lý hạ tầng như quản lý code ứng dụng."},{t:"Dịch vụ nào là lựa chọn nhanh nhất để triển khai một ứng dụng web (Java, .NET, PHP, Node.js...) mà bạn chỉ cần upload code và AWS tự động lo liệu hạ tầng bên dưới?",o:["A. AWS CloudFormation","B. AWS Elastic Beanstalk","C. Amazon EC2","D. AWS Lambda"],a:"B",e:"Elastic Beanstalk là dịch vụ PaaS giúp đơn giản hóa việc triển khai ứng dụng."},{t:"CloudFormation hỗ trợ các định dạng tệp tin nào cho template?",o:["A. TXT và PDF","B. JSON và YAML","C. HTML và CSS","D. XML và CSV"],a:"B",e:"JSON và YAML là hai định dạng chuẩn để mô tả dữ liệu có cấu trúc."},{t:"Tính năng \"Drift Detection\" trong CloudFormation dùng để làm gì?",o:["A. Phát hiện virus.","B. Phát hiện sự sai lệch giữa cấu hình thực tế của tài nguyên và cấu hình được định nghĩa trong template.","C. Tăng tốc độ deploy.","D. Tự động sửa lỗi code."],a:"B",e:"Nó giúp bạn biết nếu có ai đó đã tự ý thay đổi hạ tầng bằng tay ngoài tầm kiểm soát của CloudFormation."},{t:"AWS OpsWorks sử dụng các công cụ quản lý cấu hình nào của bên thứ ba?",o:["A. Jenkins và Docker.","B. Chef và Puppet.","C. Ansible và Terraform.","D. GitHub và Bitbucket."],a:"B",e:"OpsWorks cung cấp các dịch vụ được quản lý cho Chef và Puppet."},{t:"Khi một Stack của CloudFormation gặp lỗi trong quá trình khởi tạo, hành động mặc định của nó là gì?",o:["A. Tiếp tục tạo các tài nguyên khác.","B. Dừng lại và giữ nguyên hiện trạng.","C. Tự động xóa các tài nguyên đã tạo thành công để đưa hệ thống về trạng thái sạch (Rollback).","D. Gửi yêu cầu hỗ trợ cho AWS."],a:"C",e:"Tính năng Rollback giúp đảm bảo bạn không bị mất tiền cho các tài nguyên tạo dở dang hoặc bị lỗi."},{t:"Dịch vụ nào cung cấp các kiến trúc mẫu đã được kiểm chứng (Quick Starts) để giúp bạn triển khai các giải pháp phổ biến chỉ bằng vài cú click?",o:["A. CloudFormation","B. Marketplace","C. AWS Solutions Library (hoặc CloudFormation Quick Starts)","D. AWS Artifact"],a:"C, A",e:"Quick Starts sử dụng CloudFormation templates để triển khai các kiến trúc phức tạp một cách nhanh chóng."},{t:"Sự khác biệt chính giữa Elastic Beanstalk và CloudFormation là gì?",o:["A. Beanstalk tập trung vào ứng dụng, CloudFormation tập trung vào toàn bộ hạ tầng.","B. CloudFormation dễ dùng hơn.","C. Beanstalk đắt hơn.","D. Không có sự khác biệt."],a:"A",e:"Beanstalk dành cho developer muốn deploy app nhanh, CloudFormation dành cho sysadmin/DevOps muốn quản lý hạ tầng chi tiết."}]},{id:12,title:"Caching & Content Delivery",questions:[{t:"Amazon CloudFront sử dụng các vá trí nào để lưu trữ nội dung gần với người dùng nhất?",o:["A. AWS Regions","B. Availability Zones","C. Edge Locations","D. Local Zones"],a:"C",e:"Có hàng trăm Edge Locations trên thế giới để giảm độ trễ cho người dùng."},{t:"\"TTL\" (Time To Live) trong cấu hình cache có ý nghĩa gì?",o:["A. Thời gian để một máy chủ khởi động.","B. Khoảng thời gian một đối tượng được lưu trong bộ nhớ đệm trước khi nó hết hạn và cần được làm mới từ máy chủ gốc.","C. Tốc độ truyền tải dữ liệu.","D. Tuổi thọ của ổ cứng."],a:"B",e:"TTL giúp cân bằng giữa tính cập nhật của dữ liệu và hiệu quả giảm tải cho máy chủ gốc."},{t:"Trong CloudFront, máy chủ chứa nội dung gốc (như S3 bucket hoặc web server) gọi là gì?",o:["A. Source","B. Origin","C. Root","D. Base"],a:"B",e:"CloudFront sẽ lấy dữ liệu từ Origin để phân phối đến các Edge Locations."},{t:"ElastiCache hỗ trợ hai công cụ (engines) nào?",o:["A. MySQL và PostgreSQL.","B. Redis và Memcached.","C. MongoDB và Cassandra.","D. Oracle và SQL Server."],a:"B",e:"Redis hỗ trợ các cấu trúc dữ liệu phức tạp, Memcached đơn giản và hiệu quả cao."},{t:"Để bảo vệ website khỏi các cuộc tấn công DDoS phổ biến ở tầng mạng, CloudFront được tích hợp sẵn với dịch vụ nào?",o:["A. AWS WAF","B. AWS Shield","C. Amazon Inspector","D. AWS Artifact"],a:"B",e:"AWS Shield Standard được bật mặc định cho CloudFront để chống DDoS."},{t:"Lợi ích của việc sử dụng Amazon CloudFront cho các tệp tin tĩnh là gì?",o:["A. Tăng tốc độ tải trang và giảm tải cho máy chủ gốc.","B. Làm cho ảnh đẹp hơn.","C. Tự động dịch văn bản.","D. Thay thế cơ sở dữ liệu."],a:"A",e:"Dữ liệu được lấy từ điểm gần nhất với người dùng nên tốc độ cực nhanh."},{t:"CloudFront có thể phân phối các loại nội dung nào?",o:["A. Chỉ tệp tin tĩnh (hình ảnh, CSS).","B. Chỉ video.","C. Cả nội dung tĩnh và nội dung động (như API, trang web cá nhân hóa).","D. Chỉ tệp tin nén."],a:"C",e:"CloudFront cũng tối ưu hóa các kết nối cho nội dung động để tăng hiệu suất."},{t:"Một công ty muốn ngăn chặn người dùng ở một số quốc gia cụ thể truy cập vào nội dung của họ trên CloudFront. Họ nên dùng tính năng nào?",o:["A. Geoproximity routing","B. Geographic Restriction (Geo Blocking)","C. AWS WAF","D. IAM Policies"],a:"B",e:"Tính năng này cho phép bạn tạo \"whitelist\" hoặc \"blacklist\" theo quốc gia."},{t:"Bạn muốn cache kết quả của các lệnh gọi API để giảm chi phí và độ trễ. Dịch vụ nào hỗ trợ việc này?",o:["A. Amazon S3","B. Amazon API Gateway (có tính năng caching)","C. AWS Lambda","D. Amazon Route 53"],a:"B",e:"API Gateway có bộ nhớ đệm riêng để tránh việc phải chạy Lambda liên tục cho cùng một yêu cầu."},{t:"Amazon CloudFront hỗ trợ giao thức bảo mật nào để mã hóa dữ liệu giữa người dùng và Edge Location?",o:["A. FTP","B. HTTPS (SSL/TLS)","C. SSH","D. RDP"],a:"B",e:"HTTPS đảm bảo dữ liệu không bị nghe lén trên đường truyền."}]},{id:13,title:"Microservices & Serverless",questions:[{t:"Đặc điểm chính của kiến trúc Microservices là gì?",o:["A. Một ứng dụng lớn duy nhất chứa tất cả các chức năng.","B. Ứng dụng được chia thành các dịch vụ nhỏ, độc lập, giao tiếp với nhau qua API và có thể triển khai riêng lẻ.","C. Chỉ chạy trên một máy chủ duy nhất.","D. Không sử dụng cơ sở dữ liệu."],a:"B",e:"Microservices giúp tăng tính linh hoạt và khả năng mở rộng của hệ thống."},{t:"Dịch vụ nào của AWS đóng vai trò là \"hàng đợi tin nhắn\" giúp các dịch vụ Microservices giao tiếp với nhau một cách bất đồng bộ?",o:["A. Amazon SNS","B. Amazon SQS (Simple Queue Service)","C. Amazon SES","D. AWS Lambda"],a:"B",e:"SQS giúp tách biệt các thành phần (decoupling), đảm bảo tin nhắn không bị mất nếu một dịch vụ gặp sự cố."},{t:"Amazon SNS (Simple Notification Service) hoạt động theo mô hình nào?",o:["A. Client-Server","B. Pub/Sub (Publisher/Subscriber)","C. Peer-to-Peer","D. Monolithic"],a:"B",e:"Một tin nhắn gửi đến Topic có thể được đẩy đồng thời đến nhiều người nhận (Email, SMS, Lambda, SQS...)."},{t:"Dịch vụ nào giúp bạn điều phối nhiều dịch vụ AWS (như Lambda) thành một quy trình nghiệp vụ phức tạp với các bước rẽ nhánh và vòng lặp?",o:["A. AWS Step Functions","B. Amazon SQS","C. Amazon SNS","D. AWS Batch"],a:"A",e:"Step Functions là công cụ quản lý máy trạng thái (state machine) cho các ứng dụng serverless."},{t:"Định nghĩa \"Serverless\" trên AWS có nghĩa là gì?",o:["A. Không có máy chủ vật lý nào được sử dụng.","B. Khách hàng không cần phải quan tâm đến việc quản lý, vá lỗi hay mở rộng máy chủ; AWS lo toàn bộ hạ tầng.","C. Ứng dụng chạy miễn phí.","D. Chỉ dùng cho ứng dụng web."],a:"B",e:"Serverless giúp tập trung hoàn toàn vào logic ứng dụng và tối ưu hóa chi phí (chỉ trả tiền khi code chạy)."},{t:"Dịch vụ nào cung cấp cổng vào (Gateway) bảo mật để quản lý, giám sát và bảo vệ các RESTful API ở quy mô lớn?",o:["A. AWS AppSync","B. Amazon API Gateway","C. Amazon Route 53","D. Elastic Load Balancing"],a:"B",e:"API Gateway là \"mặt tiền\" cho các ứng dụng serverless backend."},{t:"Sự khác biệt chính giữa SQS và SNS là gì?",o:["A. SNS lưu trữ tin nhắn lâu hơn.","B. SQS là mô hình \"Pull\" (worker lấy tin), SNS là mô hình \"Push\" (đẩy tin đi ngay lập tức).","C. SQS chỉ dùng để gửi email.","D. Không có sự khác biệt."],a:"B",e:"SQS dùng để đệm tin nhắn (buffering), SNS dùng để thông báo tức thời."},{t:"Dịch vụ nào cho phép bạn gửi email marketing hoặc email giao dịch hàng loạt từ ứng dụng của mình?",o:["A. Amazon SNS","B. Amazon SQS","C. Amazon SES (Simple Email Service)","D. AWS Lambda"],a:"C",e:"SES là giải pháp gửi email chuyên nghiệp và tiết kiệm chi phí."},{t:"Khi sử dụng SQS, khái niệm \"Visibility Timeout\" có ý nghĩa gì?",o:["A. Thời gian tin nhắn tồn tại trong hàng đợi trước khi bị xóa.","B. Khoảng thời gian mà một tin nhắn sau khi được một worker lấy đi sẽ bị ẩn đối với các worker khác để tránh xử lý trùng lặp.","C. Tốc độ gửi tin nhắn.","D. Kích thước tối đa của tin nhắn."],a:"B",e:"Nếu worker xử lý thành công, nó sẽ xóa tin nhắn. Nếu worker bị lỗi, sau khi hết timeout, tin nhắn sẽ hiện lại để worker khác xử lý."},{t:"AWS X-Ray dùng để làm gì trong kiến trúc Microservices?",o:["A. Mã hóa dữ liệu.","B. Phân tích và gỡ lỗi (trace) các yêu cầu khi chúng đi qua các dịch vụ khác nhau để tìm ra điểm nghẽn hoặc lỗi.","C. Tăng tốc độ CPU.","D. Quản lý user."],a:"B",e:"X-Ray cung cấp bản đồ dịch vụ (Service Map) để bạn có cái nhìn tổng quan về luồng dữ liệu của ứng dụng."}]}];</script>
<script>const EXTRA_DATA = [];

// Module 2-4
EXTRA_DATA.push(...[
{id:2,title:"Kiến trúc đám mây (Mở rộng)",questions:[
{t:"Trụ cột nào của AWS Well-Architected Framework tập trung vào khả năng phục hồi sau sự cố?",o:["A. Bảo mật (Security)","B. Độ tin cậy (Reliability)","C. Hiệu suất (Performance Efficiency)","D. Tính bền vững (Sustainability)"],a:"B",e:"Trụ cột Reliability tập trung vào khả năng hệ thống phục hồi sau sự cố."},
{t:"Khái niệm 'Elasticity' trong điện toán đám mây có nghĩa là gì?",o:["A. Khả năng mã hóa tự động","B. Khả năng tự động co giãn tài nguyên theo nhu cầu","C. Khả năng sao lưu dữ liệu","D. Chạy nhiều hệ điều hành"],a:"B",e:"Elasticity là khả năng hệ thống tự động co giãn tài nguyên (thêm/bớt) theo lưu lượng thực tế."},

{t:"AWS Trusted Advisor cung cấp khuyến nghị về lĩnh vực nào? (Chọn 2)",o:["A. Tối ưu chi phí","B. Giao diện UI","C. Hiệu suất hệ thống","D. Quản lý nhân sự"],a:"A và C",e:"Trusted Advisor tự động kiểm tra tài khoản và khuyến nghị về Tối ưu chi phí, Hiệu suất, Bảo mật."},
{t:"Mô hình 'Pay-as-you-go' của AWS là gì?",o:["A. Trả trước 1 năm","B. Chỉ thanh toán cho tài nguyên thực tế đã sử dụng","C. Thanh toán cố định hàng tháng","D. Miễn phí năm đầu"],a:"B",e:"Pay-as-you-go nghĩa là chỉ trả tiền cho lượng tài nguyên thực tế đã tiêu thụ."},
{t:"Công cụ nào giúp ước tính chi phí trước khi triển khai?",o:["A. Billing Dashboard","B. Pricing Calculator","C. Cost Explorer","D. AWS Budgets"],a:"B",e:"AWS Pricing Calculator cho phép mô phỏng cấu hình và ước tính chi phí trước khi tạo tài nguyên."},
{t:"Lợi ích của việc dùng nhiều Availability Zones là gì?",o:["A. Giảm chi phí","B. Tăng tốc độ CPU","C. Tăng tính sẵn sàng và khả năng chịu lỗi","D. Đơn giản hóa quản trị"],a:"C",e:"Triển khai trên nhiều AZ giúp hệ thống sống sót ngay cả khi một Data Center gặp sự cố."},
{t:"AWS Free Tier cung cấp những loại ưu đãi nào? (Chọn 2)",o:["A. Dùng thử miễn phí 12 tháng","B. Giảm giá 50%","C. Miễn phí vĩnh viễn ở mức sử dụng thấp","D. Hoàn tiền 100%"],a:"A và C",e:"AWS Free Tier có: Dùng thử miễn phí, Miễn phí 12 tháng và Miễn phí vĩnh viễn (ở mức thấp)."},
{t:"'High Availability' trong AWS là gì?",o:["A. Hệ thống có tốc độ cực nhanh","B. Hệ thống luôn sẵn sàng hoạt động với thời gian ngừng tối thiểu","C. Chi phí cực thấp","D. Chỉ admin mới được truy cập"],a:"B",e:"High Availability nghĩa là hệ thống được thiết kế để hoạt động liên tục với downtime cực thấp."},
{t:"Nguyên tắc 'Design for Failure' khuyến nghị điều gì?",o:["A. Không cần sao lưu","B. Luôn giả định mọi thành phần đều có thể hỏng và thiết kế dự phòng","C. Chỉ dùng 1 máy chủ","D. Tắt hệ thống khi có lỗi"],a:"B",e:"Cần giả định mọi thứ đều có thể hỏng để thiết kế dự phòng, tự động phục hồi."}
]},
{id:3,title:"Bảo mật (Mở rộng)",questions:[
{t:"AWS CloudTrail cung cấp chức năng chính nào?",o:["A. Vá lỗi OS","B. Ghi nhật ký mọi lệnh gọi API trên tài khoản","C. Mã hóa S3","D. Quản lý khóa"],a:"B",e:"CloudTrail ghi lại chi tiết mọi hành động API trên tài khoản AWS."},
{t:"Xác thực đa yếu tố (MFA) cung cấp lớp bảo mật bằng cách nào?",o:["A. Mã hóa dữ liệu","B. Yêu cầu thêm mã xác thực ngoài mật khẩu","C. Khóa tài khoản sau 3 lần sai","D. Giới hạn IP"],a:"B",e:"MFA yêu cầu thêm mã OTP từ điện thoại ngoài mật khẩu để bảo vệ tài khoản tốt hơn."},
{t:"Dịch vụ nào phát hiện mối đe dọa bằng cách phân tích nhật ký?",o:["A. IAM","B. Amazon GuardDuty","C. KMS","D. Amazon S3"],a:"B",e:"GuardDuty dùng Machine Learning phân tích VPC Flow Logs, CloudTrail, DNS để tìm nguy hiểm."},
{t:"Security Group hoạt động ở cấp độ nào?",o:["A. Subnet","B. Máy chủ ảo (Instance)","C. VPC","D. Region"],a:"B",e:"Security Group hoạt động như tường lửa ảo ở cấp độ từng EC2 instance."},
{t:"Sự khác biệt chính giữa Security Group và Network ACL là gì?",o:["A. SG là stateless, NACL là stateful","B. SG ở cấp instance, NACL ở cấp subnet","C. SG kiểm soát lưu lượng vào, NACL kiểm soát vào và ra","D. Không khác biệt"],a:"B",e:"SG ở cấp instance và stateful. NACL ở cấp subnet và stateless."},
{t:"AWS Config cung cấp chức năng gì?",o:["A. Triển khai code","B. Theo dõi và ghi lại lịch sử thay đổi cấu hình tài nguyên","C. Cân bằng tải","D. Lưu mật khẩu"],a:"B",e:"AWS Config liên tục theo dõi mọi thay đổi cấu hình tài nguyên để đảm bảo tính tuân thủ."},
{t:"Chính sách nào được gắn trực tiếp lên tài nguyên như S3 bucket?",o:["A. Identity-based policy","B. Resource-based policy","C. SCP","D. Session policy"],a:"B",e:"Resource-based policy (như S3 Bucket Policy) được gắn trực tiếp lên tài nguyên để kiểm soát quyền truy cập."},
{t:"Dịch vụ nào cung cấp tường lửa ứng dụng web?",o:["A. GuardDuty","B. Shield","C. AWS WAF","D. Inspector"],a:"C",e:"AWS WAF bảo vệ ứng dụng web khỏi SQL injection, XSS..."},
{t:"AWS Shield bảo vệ chống lại tấn công nào?",o:["A. SQL injection","B. Tấn công DDoS","C. Phishing","D. Brute-force"],a:"B",e:"AWS Shield chuyên bảo vệ chống lại các cuộc tấn công Từ chối dịch vụ phân tán (DDoS)."},
{t:"Khi nào nên sử dụng IAM Role thay vì IAM User cho EC2?",o:["A. Cần mật khẩu tĩnh","B. Cần thông tin xác thực tạm thời tự động xoay vòng","C. Khi chỉ có 1 user","D. Không cần quyền"],a:"B",e:"IAM Role cung cấp thông tin xác thực tạm thời an toàn hơn là dùng Access Key tĩnh của User."}
]},
{id:4,title:"Lưu trữ (Mở rộng)",questions:[
{t:"Amazon S3 đảm bảo độ bền dữ liệu (durability) ở mức nào?",o:["A. 99.9%","B. 99.99%","C. 11 số 9 (99.999999999%)","D. 100%"],a:"C",e:"S3 được thiết kế với độ bền 11 số 9, rất khó mất dữ liệu."},
{t:"S3 Versioning giúp bảo vệ dữ liệu như thế nào?",o:["A. Mã hóa mọi file","B. Lưu giữ mọi phiên bản của đối tượng kể cả khi bị ghi đè","C. Sao chép qua Region khác","D. Nén dữ liệu"],a:"B",e:"Versioning lưu lại các phiên bản cũ để khôi phục khi bị xóa hoặc sửa nhầm."},
{t:"Dịch vụ nào phù hợp làm ổ đĩa hệ điều hành cho EC2?",o:["A. S3","B. Amazon EBS","C. EFS","D. Glacier"],a:"B",e:"EBS cung cấp ổ đĩa khối (block storage) hiệu suất cao để gắn làm ổ hệ điều hành."},
{t:"Sự khác biệt chính giữa EBS và EFS là gì?",o:["A. EBS chỉ cho Linux, EFS cho Windows","B. EBS gắn vào 1 EC2, EFS có thể chia sẻ giữa nhiều EC2","C. EBS miễn phí","D. Không khác biệt"],a:"B",e:"EBS gắn độc quyền 1 EC2. EFS là hệ thống file chia sẻ (NFS) cho hàng nghìn EC2 dùng chung."},
{t:"S3 Lifecycle Policy dùng làm gì?",o:["A. Mã hóa dữ liệu","B. Tự động chuyển dữ liệu giữa các lớp lưu trữ hoặc xóa sau một thời gian","C. Giới hạn quyền","D. Tăng tốc tải lên"],a:"B",e:"Lifecycle Policy tự động hóa việc chuyển dữ liệu sang lớp rẻ hơn hoặc xóa để tiết kiệm chi phí."},
{t:"S3 Intelligent-Tiering hoạt động ra sao?",o:["A. Luôn dùng lớp rẻ nhất","B. Tự động di chuyển dữ liệu giữa các lớp dựa trên tần suất truy cập thực tế","C. Chọn thủ công mỗi tháng","D. Chỉ lưu file nhỏ"],a:"B",e:"Intelligent-Tiering tự động tối ưu chi phí bằng cách theo dõi mẫu truy cập của dữ liệu."},
{t:"AWS Storage Gateway dùng khi nào?",o:["A. Lưu trên cloud hoàn toàn","B. Kết nối hạ tầng lưu trữ on-premises với đám mây AWS","C. Chạy web tĩnh","D. Chạy database"],a:"B",e:"Storage Gateway là giải pháp lai (hybrid) kết nối lưu trữ tại văn phòng với lưu trữ đám mây."},
{t:"S3 Object Lock cung cấp tính năng gì?",o:["A. Khóa bucket hoàn toàn","B. Ngăn chặn việc xóa/sửa đối tượng trong một khoảng thời gian xác định","C. Mã hóa bằng khóa riêng","D. Giới hạn dung lượng"],a:"B",e:"Object Lock áp dụng mô hình WORM (viết 1 lần, đọc nhiều lần) để tuân thủ pháp luật."},
{t:"Kích thước tối đa của 1 file trên S3 là bao nhiêu?",o:["A. 5 GB","B. 5 TB","C. 50 TB","D. Không giới hạn"],a:"B",e:"Kích thước tối đa của 1 đối tượng trên S3 là 5 Terabytes."},
{t:"Glacier Instant Retrieval khác gì Flexible Retrieval?",o:["A. Truy xuất dữ liệu ngay lập tức trong mili giây","B. Rẻ hơn","C. Chậm hơn","D. Giống nhau"],a:"A",e:"Instant Retrieval cho phép lấy lại dữ liệu tức thì (mili giây), còn Flexible mất từ phút đến giờ."}
]}
]);

// Module 5-8
EXTRA_DATA.push(...[
{id:5,title:"Điện toán (Mở rộng)",questions:[
{t:"AWS Lambda hoạt động theo mô hình nào?",o:["A. EC2 chạy 24/7","B. Phi máy chủ (Serverless) - chạy khi có trigger","C. Máy chủ vật lý","D. Container liên tục"],a:"B",e:"Lambda là Serverless, bạn chỉ trả tiền cho phần nghìn giây code được chạy."},
{t:"Auto Scaling Group cung cấp lợi ích gì?",o:["A. Mã hóa tự động","B. Tự động tăng/giảm số lượng EC2 instance theo tải","C. Cập nhật hệ điều hành","D. Tạo database"],a:"B",e:"ASG điều chỉnh số lượng server tự động theo lưu lượng hiện tại."},
{t:"Chức năng chính của Elastic Load Balancer (ELB)?",o:["A. Lưu dữ liệu","B. Phân phối lưu lượng mạng đến nhiều máy chủ","C. Dịch tên miền","D. Mã hóa kết nối"],a:"B",e:"ELB chia tải đều cho nhiều máy chủ để tránh quá tải 1 máy duy nhất."},
{t:"Instance Store khác gì EBS?",o:["A. Bền hơn EBS","B. Mất dữ liệu khi instance stop/terminate","C. Giống y hệt","D. Không thể lưu trữ"],a:"B",e:"Instance Store là ổ đĩa tạm vật lý, sẽ mất trắng dữ liệu khi máy ảo bị tắt (stop)."},
{t:"Spot Instance phù hợp công việc nào?",o:["A. Database quan trọng","B. Web server chính","C. Xử lý hàng loạt có khả năng chịu gián đoạn","D. Thanh toán"],a:"C",e:"Spot rất rẻ nhưng bị AWS thu hồi bất kỳ lúc nào, phù hợp cho việc chịu được ngắt quãng."},
{t:"Dedicated Host là gì?",o:["A. Máy chủ vật lý riêng biệt cho phép kiểm soát cấp độ phần cứng (socket/core)","B. Máy ảo giá rẻ","C. Container","D. Database dùng chung"],a:"A",e:"Dùng Dedicated Host khi bạn có license phần mềm on-premises cần đối chiếu số CPU vật lý."},
{t:"Security Group mặc định của VPC làm gì?",o:["A. Mở mọi port","B. Chặn tất cả luồng vào, cho phép tất cả luồng ra","C. Chặn tất cả luồng ra và vào","D. Chặn port 80"],a:"B",e:"SG mặc định an toàn: Inbound bị chặn hết, Outbound được cho phép hết."},
{t:"Application Load Balancer (ALB) hỗ trợ định tuyến ở tầng mấy?",o:["A. Tầng 4 (Network)","B. Tầng 7 (Application - HTTP/HTTPS)","C. Tầng 3","D. Tầng 2"],a:"B",e:"ALB chuyên xử lý HTTP/HTTPS và định tuyến theo đường dẫn (Path) ở Layer 7."},
{t:"Truy cập metadata của EC2 bằng IP nào?",o:["A. 192.168.1.1","B. 169.254.169.254","C. 10.0.0.1","D. localhost"],a:"B",e:"IP đặc biệt 169.254.169.254 dùng để gọi API lấy metadata ngay trong lòng máy EC2."},
{t:"Spread Placement Group là gì?",o:["A. Đặt chung 1 rack","B. Phân tán các EC2 lên các phần cứng vật lý khác nhau","C. Đặt trên 1 host","D. Tự động xóa máy"],a:"B",e:"Giúp hạn chế rủi ro hỏng hóc phần cứng đồng loạt."}
]},
{id:6,title:"Cơ sở dữ liệu (Mở rộng)",questions:[
{t:"Lợi thế của Amazon Aurora?",o:["A. Miễn phí","B. Nhanh gấp 5 lần MySQL, 3 lần PostgreSQL","C. Không cần internet","D. Chỉ lưu ảnh"],a:"B",e:"Aurora là DB độc quyền AWS được tối ưu riêng cho cloud."},
{t:"DynamoDB hỗ trợ mô hình nào?",o:["A. Quan hệ SQL","B. Key-Value và Document (NoSQL)","C. Graph","D. Time-series"],a:"B",e:"DynamoDB là NoSQL Serverless cực mạnh của AWS."},
{t:"Read Replica trên RDS dùng làm gì?",o:["A. Backup","B. Gánh tải đọc (Read) để giảm tải cho DB chính","C. Nén data","D. Phân tích AI"],a:"B",e:"Tăng tốc ứng dụng bằng cách đẩy các query SELECT sang các bản sao Read Replica."},
{t:"Amazon Redshift dùng làm gì?",o:["A. Web hosting","B. Data Warehouse (Kho dữ liệu khổng lồ để phân tích)","C. Gửi email","D. Làm cache"],a:"B",e:"Redshift xử lý dữ liệu lớn cỡ Petabyte cho Business Intelligence (BI)."},
{t:"Tính năng Multi-AZ của RDS dùng để?",o:["A. Tăng tốc đọc","B. Dự phòng sự cố (Failover) tự động","C. Tăng dung lượng đĩa","D. Cân bằng tải"],a:"B",e:"Khi DB chính sập, RDS tự động bật DB dự phòng (Standby) ở AZ khác để thay thế ngay lập tức."},
{t:"ElastiCache hỗ trợ 2 engine nào?",o:["A. Redis và Memcached","B. MySQL và Oracle","C. SQL Server và PostgreSQL","D. MongoDB và Cassandra"],a:"A",e:"Redis và Memcached là 2 công cụ lưu trữ in-memory mã nguồn mở phổ biến nhất."},
{t:"AWS DMS (Database Migration Service) làm gì?",o:["A. Chuyển tiền","B. Di chuyển dữ liệu database một cách liên tục và đồng nhất/không đồng nhất","C. Chuyển tên miền","D. Mã hóa DB"],a:"B",e:"DMS di chuyển database từ On-premise lên AWS mà ứng dụng vẫn hoạt động không gián đoạn."},
{t:"DocumentDB tương thích với DB nào?",o:["A. MySQL","B. MongoDB","C. Oracle","D. DynamoDB"],a:"B",e:"DocumentDB là dịch vụ tương thích API với MongoDB do AWS quản lý."},
{t:"Khi nào dùng DynamoDB thay vì RDS?",o:["A. Cần JOIN nhiều bảng","B. Cần độ trễ dưới 10ms, mở rộng không giới hạn và schema linh hoạt","C. Cần Store procedure","D. Cần ACID chặt chẽ"],a:"B",e:"DynamoDB vượt trội về tốc độ tải siêu cao và không yêu cầu schema cố định."},
{t:"Amazon QLDB đặc biệt ở điểm nào?",o:["A. Dùng AI","B. Cung cấp sổ cái (ledger) bất biến, không thể sửa đổi hoặc xóa","C. Miễn phí","D. Chạy offline"],a:"B",e:"QLDB giống như blockchain nội bộ, lưu giữ mọi thay đổi dữ liệu minh bạch và bất biến."}
]},
{id:7,title:"Mạng cơ bản (Mở rộng)",questions:[
{t:"Thành phần nào cho public subnet ra internet?",o:["A. NAT Gateway","B. Internet Gateway (IGW)","C. Virtual Private Gateway","D. Customer Gateway"],a:"B",e:"IGW là cánh cổng kết nối trực tiếp VPC với Internet công cộng."},
{t:"Private subnet ra internet tải update bằng cách nào an toàn?",o:["A. IGW","B. Elastic IP","C. NAT Gateway","D. Direct Connect"],a:"C",e:"NAT Gateway nằm ở Public Subnet sẽ đứng ra tải dữ liệu thay cho Private Subnet."},
{t:"Route Table là gì?",o:["A. Chặn IP","B. Bảng định tuyến quyết định đường đi của dữ liệu mạng","C. Load balancer","D. Cáp quang"],a:"B",e:"Route table chứa các luật (route) chỉ đường cho traffic đi ra IGW, NAT hay Peering."},
{t:"Chính sách Weighted routing của Route 53 làm gì?",o:["A. Load balance theo khu vực","B. Phân chia tỷ lệ % traffic đến các server","C. Kiểm tra sức khỏe","D. Định tuyến tự động"],a:"B",e:"Ví dụ gửi 80% truy cập vào server A, 20% vào server B."},
{t:"VPC Peering có đặc điểm gì?",o:["A. Kết nối qua mạng internet","B. Là kết nối mạng riêng (không qua internet) giữa 2 VPC","C. Hỗ trợ định tuyến bắc cầu (A->B, B->C suy ra A->C)","D. Chỉ dùng được trong 1 Region"],a:"B",e:"VPC Peering rất an toàn vì dùng hạ tầng cáp quang riêng của AWS. (Nó KHÔNG hỗ trợ bắc cầu)."},
{t:"Elastic IP là gì?",o:["A. IP đổi liên tục","B. IP tĩnh (Static) Public cấp cho tài khoản AWS của bạn","C. IP private","D. IPv6"],a:"B",e:"Là một IP cố định, bạn có thể gán nó từ EC2 này sang EC2 khác."},
{t:"NACL (Network ACL) đánh giá luật theo thứ tự nào?",o:["A. Ngẫu nhiên","B. Số thứ tự từ thấp đến cao","C. Số cao đến thấp","D. Đánh giá tất cả"],a:"B",e:"Luật số 100 sẽ được đánh giá trước luật số 200. Nếu khớp, nó bỏ qua các luật bên dưới."},
{t:"Một VPC có tối đa bao nhiêu IGW?",o:["A. 1","B. 2","C. 5","D. Không giới hạn"],a:"A",e:"Một VPC chỉ gắn được duy nhất 1 Internet Gateway."},
{t:"Amazon Route 53 là dịch vụ gì?",o:["A. Tạo server","B. Hệ thống phân giải tên miền (DNS)","C. Tính toán","D. Lưu trữ"],a:"B",e:"Route 53 giúp map tên miền thân thiện (google.com) với địa chỉ IP."},
{t:"Khi tạo VPC mới, cái gì KHÔNG được tạo sẵn?",o:["A. Route Table mặc định","B. Security Group mặc định","C. NACL mặc định","D. Subnets"],a:"D",e:"Bạn phải tự tay tạo các Subnets sau khi tạo VPC."}
]},
{id:8,title:"Mạng nâng cao (Mở rộng)",questions:[
{t:"Transit Gateway giải quyết vấn đề gì?",o:["A. Backup data","B. Thay thế VPC Peering chằng chịt bằng cấu trúc Hub trung tâm mạng lưới","C. Giảm giá EC2","D. Tăng tốc web"],a:"B",e:"Transit Gateway là tổng đài trung tâm, các VPC chỉ cần nối 1 dây vào Hub này là có thể kết nối với nhau."},
