<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Academy - Luyện thi Giữa kỳ</title>
    <meta name="description" content="Hệ thống ôn tập trắc nghiệm AWS Academy Module 2-13 với 240 câu hỏi">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3347;
            --primary:#ff9900;--primary-glow:rgba(255,153,0,.15);
            --text:#e4e4e7;--text-dim:#9ca3af;
            --success:#22c55e;--success-bg:rgba(34,197,94,.12);
            --error:#ef4444;--error-bg:rgba(239,68,68,.12);
            --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
            --selected:#a855f7;--selected-bg:rgba(168,85,247,.15);
            --radius:12px
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

        /* HEADER */
        .header{background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);border-bottom:1px solid var(--border);padding:1.5rem 0;text-align:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
        .header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ff9900,#ffb84d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
        .header p{color:var(--text-dim);font-size:.9rem}
        .container{max-width:900px;margin:0 auto;padding:2rem 1rem}

        /* DASHBOARD */
        .section-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
        .section-title::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px;display:inline-block}
        .source-tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:var(--surface);padding:.4rem;border-radius:var(--radius);border:1px solid var(--border)}
        .source-tab{flex:1;padding:.8rem 1rem;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s;background:transparent;color:var(--text-dim);font-family:inherit}
        .source-tab.active{background:var(--primary);color:#000;box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .source-tab:hover:not(.active){color:var(--text);background:var(--surface2)}

        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin-bottom:1.5rem}
        .module-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.75rem;user-select:none}
        .module-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
        .module-card.selected{border-color:var(--primary);background:var(--primary-glow)}
        .module-card input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
        .module-card label{cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.3}
        .module-card .q-count{font-size:.75rem;color:var(--text-dim);margin-top:.2rem}

        .controls{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .btn{padding:.7rem 1.2rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:.4rem}
        .btn-primary{background:var(--primary);color:#000}
        .btn-primary:hover{background:#ffb84d;transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .btn-submit{background:var(--selected);color:#fff;font-size:1rem;padding:.85rem 2rem}
        .btn-submit:hover:not(:disabled){background:#9333ea;transform:translateY(-1px);box-shadow:0 4px 15px rgba(168,85,247,.4)}
        .btn-submit:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
        .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
        .btn-lg{padding:1rem 2.5rem;font-size:1.1rem;border-radius:var(--radius)}

        .start-area{text-align:center;margin-top:2rem;padding:2rem;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
        .start-area .count{font-size:2.5rem;font-weight:800;color:var(--primary);margin:.5rem 0}

        /* QUIZ */
        #quiz-interface{display:none}
        .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .progress-wrap{flex:1;min-width:200px}
        .progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:.4rem}
        .progress-fill{height:100%;background:linear-gradient(90deg,#ff9900,#ffb84d);width:0;transition:width .4s ease}
        .progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-dim);font-weight:600}
        .stats{display:flex;gap:1rem;font-weight:700;font-size:.95rem}
        .s-ok{color:var(--success)}.s-no{color:var(--error)}

        .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem;animation:fadeUp .4s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .q-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--primary);padding:.3rem .8rem;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:1.2rem}
        .q-text{font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.7}
        .q-note{font-size:.85rem;color:var(--selected);margin-bottom:1.2rem;font-style:italic;padding:.6rem 1rem;background:var(--selected-bg);border-radius:8px;border-left:3px solid var(--selected)}

        /* OPTIONS */
        .opts{display:flex;flex-direction:column;gap:.6rem}
        .opt{text-align:left;padding:1rem 1.2rem;border:2px solid var(--border);border-radius:8px;background:var(--surface2);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.8rem;font-family:inherit;color:var(--text);line-height:1.5;width:100%}
        .opt:hover:not(:disabled):not(.correct):not(.wrong):not(.selected-opt){border-color:var(--primary);background:var(--primary-glow)}
        .opt .letter{font-weight:700;color:var(--text-dim);min-width:22px;flex-shrink:0;transition:color .2s}
        /* Selected (before submit) */
        .opt.selected-opt{border-color:var(--selected);background:var(--selected-bg)}
        .opt.selected-opt .letter{color:var(--selected)}
        /* After submit */
        .opt.correct{border-color:var(--success);background:var(--success-bg)}
        .opt.correct .letter{color:var(--success)}
        .opt.wrong{border-color:var(--error);background:var(--error-bg)}
        .opt.wrong .letter{color:var(--error)}
        .opt:disabled{cursor:default}
        .opt.dimmed{opacity:.45}

        /* SUBMIT & NEXT */
        #submit-area{margin-top:1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
        #submit-area .hint{font-size:.82rem;color:var(--text-dim);font-style:italic}
        .explain{display:none;margin-top:1.5rem;padding:1.4rem;border-radius:10px;background:var(--info-bg);border-left:4px solid var(--info);animation:fadeUp .4s ease}
        .explain h4{color:var(--info);margin-bottom:.6rem;font-size:.95rem;display:flex;align-items:center;gap:.4rem}
        .explain p{color:var(--text-dim);font-size:.92rem;line-height:1.8}
        .correct-label{background:var(--success-bg);border:1px solid var(--success);color:var(--success);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}
        .wrong-label{background:var(--error-bg);border:1px solid var(--error);color:var(--error);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}

        .next-area{display:none;text-align:right;margin-top:1.2rem;animation:fadeUp .3s ease}

        /* RESULTS */
        #results{display:none}
        .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:3rem 2rem;text-align:center}
        .result-circle{width:150px;height:150px;border-radius:50%;border:6px solid var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2.5rem;font-weight:800;color:var(--primary);box-shadow:0 0 40px rgba(255,153,0,.2)}
        .result-card h2{color:var(--text);margin-bottom:1rem;font-size:1.4rem}
        .result-card .detail{color:var(--text-dim);font-size:1.1rem;margin-bottom:2rem}
        .result-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

        @media(max-width:600px){
            .container{padding:1rem .75rem}
            .module-grid{grid-template-columns:1fr}
            .q-card{padding:1.5rem}
            .quiz-top{flex-direction:column;align-items:stretch}
        }
    </style>
</head>
<body>
<div class="header">
    <h1>☁️ AWS Academy Quiz</h1>
    <p>Hệ thống ôn tập Giữa kỳ — Module 2 đến 13</p>
</div>
<div class="container">

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h3 class="section-title">Nguồn Câu Hỏi</h3>
        <div class="source-tabs">
            <button class="source-tab active" onclick="setSource('original')">📚 120 Câu Gốc (Knowledge Check)</button>
            <button class="source-tab" onclick="setSource('extra')">🧠 120 Câu Mở Rộng (AI Tạo)</button>
        </div>
        <h3 class="section-title">Chọn Module</h3>
        <div class="controls">
            <button class="btn btn-outline" onclick="toggleAll(true)">✅ Chọn tất cả</button>
            <button class="btn btn-outline" onclick="toggleAll(false)">❌ Bỏ chọn</button>
        </div>
        <div class="module-grid" id="module-grid"></div>
        <div class="start-area">
            <p style="color:var(--text-dim)">Số câu hỏi đã chọn</p>
            <div class="count" id="sel-count">0</div>
            <button class="btn btn-primary btn-lg" id="start-btn" onclick="startQuiz()" disabled>🚀 BẮT ĐẦU LÀM BÀI</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-interface">
        <div class="quiz-top">
            <button class="btn btn-outline" onclick="exitQuiz()">← Thoát</button>
            <div class="progress-wrap">
                <div class="progress-label"><span>Tiến độ</span><span id="prog-txt">1/10</span></div>
                <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
            </div>
            <div class="stats">
                <span class="s-ok">✓ <span id="c-ok">0</span></span>
                <span class="s-no">✗ <span id="c-no">0</span></span>
            </div>
        </div>

        <div class="q-card">
            <div class="q-tag" id="q-tag">Module X</div>
            <div class="q-text" id="q-text"></div>
            <div class="q-note" id="q-note"></div>
            <div class="opts" id="q-opts"></div>

            <div id="submit-area">
                <button class="btn btn-submit" id="submit-btn" onclick="submitAnswer()" disabled>
                    ✅ Nộp bài
                </button>
                <span class="hint" id="submit-hint"></span>
            </div>

            <div class="explain" id="q-exp">
                <div id="q-result-label"></div>
                <h4>💡 Giải thích chi tiết:</h4>
                <p id="q-exp-txt"></p>
            </div>

            <div class="next-area" id="next-area">
                <button class="btn btn-primary" onclick="nextQ()">Câu tiếp theo →</button>
            </div>
        </div>
    </div>

    <!-- RESULTS -->
    <div id="results">
        <div class="result-card">
            <h2>🎉 Hoàn thành bài kiểm tra!</h2>
            <div class="result-circle"><span id="r-pct">0%</span></div>
            <p class="detail">Bạn trả lời đúng <span id="r-ok" class="s-ok">0</span> / <span id="r-total">0</span> câu hỏi.</p>
            <div class="result-btns">
                <button class="btn btn-outline" onclick="exitQuiz()">🏠 Về trang chủ</button>
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại bộ đề này</button>
            </div>
        </div>
    </div>

</div>
<script>const ORIGINAL_DATA=[{id:2,title:"Kiến trúc đám mây và Định giá (Cloud Economics and Billing)",questions:[{t:"Đâu là định nghĩa đúng nhất về kiến trúc đám mây?",o:["A. Kết hợp các phần mềm và thành phần giao diện người dùng (frontend) và máy chủ (backend) để tạo ra các dịch vụ web có tính sẵn sàng cao và khả năng mở rộng nhằm đáp ứng nhu cầu của tổ chức.","B. Di dời các trung tâm dữ liệu tại chỗ (on-premises) truyền thống sang các trung tâm dữ liệu có thể truy cập qua internet do một nhà cung cấp quản lý.","C. Áp dụng các đặc điểm của đám mây vào một giải pháp sử dụng các dịch vụ và tính năng của đám mây để đáp ứng các yêu cầu về kỹ thuật và kinh doanh.","D. Thiết kế các ứng dụng trong cơ sở hạ tầng công nghệ thông tin chia sẻ, dựa trên đám mây bằng cách sử dụng các máy ảo và kho dữ liệu chịu lỗi trên đám mây."],a:"C",e:"Kiến trúc đám mây không chỉ đơn giản là di dời nguyên trạng máy chủ vật lý lên môi trường mạng (như câu B) hay chỉ sử dụng hệ thống máy ảo (như câu D). Đáp án C là đầy đủ nhất vì nó bao hàm việc áp dụng các \"đặc tính của đám mây\" (như tự động mở rộng, trả tiền theo mức độ sử dụng) vào các dịch vụ của AWS để giải quyết chính xác các bài toán về kỹ thuật và kinh doanh của doanh nghiệp."},{t:"AWS Well-Architected Framework có 6 trụ cột. Ba trong số đó là Bảo mật (Security), Vận hành xuất sắc (Operational excellence) và Tính bền vững (Sustainability). Hai trụ cột khác của Well-Architected Framework là gì? (Chọn 2)",o:["A. Quyền riêng tư (Privacy)","B. Quản trị (Governance)","C. Quản lý rủi ro (Risk management)","D. Độ tin cậy (Reliability)","E. Tối ưu hóa chi phí (Cost optimization)"],a:"D. Độ tin cậy (Reliability) và E. Tối ưu hóa chi phí (Cost optimization)",e:"6 trụ cột (pillars) chính thức của thiết kế AWS Well-Architected Framework bao gồm: 1. Operational Excellence (Vận hành xuất sắc) 2. Security (Bảo mật) 3. Reliability (Độ tin cậy) 4. Performance Efficiency (Hiệu suất hoạt động) 5. Cost Optimization (Tối ưu hóa chi phí) 6. Sustainability (Tính bền vững). Các đáp án A, B, C tuy quan trọng nhưng không nằm trong danh sách 6 trụ cột cốt lõi này."},{t:"Những hành động nào phù hợp với trụ cột \"Vận hành xuất sắc\" (Operational excellence) của AWS Well-Architected Framework? (Chọn 2)",o:["A. Lên kế hoạch và quản lý toàn bộ vòng đời của tài sản phần cứng.","B. Đánh giá và cải tiến các quy trình và thủ tục theo một chu kỳ liên tục.","C. Đánh giá cấu trúc tổ chức và vai trò để xác định các lỗ hổng kỹ năng.","D. Đảm bảo nhân sự vận hành ghi chép lại các thay đổi đối với cơ sở hạ tầng bằng tài liệu.","E. Áp dụng các nguyên tắc và phương pháp kỹ thuật phần mềm vào cơ sở hạ tầng dưới dạng mã (Infrastructure as code)."],a:"B và E",e:"- Chọn B: Vì cốt lõi của việc vận hành xuất sắc là liên tục đánh giá và cải tiến các quy trình để hệ thống ngày càng tốt hơn. - Chọn E: Quản lý cơ sở hạ tầng bằng mã (Infrastructure as Code) là nguyên tắc thiết kế quan trọng nhất của trụ cột này, giúp giảm thiểu lỗi từ con người. - Câu A sai vì trên AWS, bạn không cần quản lý phần cứng vật lý. Câu D sai vì việc ghi chép tài liệu thủ công rất dễ xảy ra sai sót; AWS khuyến khích sử dụng mã lập trình để tự động hóa mọi thay đổi."},{t:"Một ứng dụng yêu cầu một tầng web frontend gồm nhiều máy chủ giao tiếp với một tầng ứng dụng backend cũng gồm nhiều máy chủ. Thiết kế nào tuân thủ chặt chẽ nhất các phương pháp thực hành tốt nhất (best practices) của AWS?",o:["A. Chỉ định một máy chủ ứng dụng chuyên dụng và một kết nối chuyên dụng cho mỗi máy chủ web.","B. Thiết kế tầng web để giao tiếp với tầng ứng dụng thông qua dịch vụ Cân bằng tải đàn hồi (Elastic Load Balancing - ELB).","C. Tạo nhiều máy chủ (instances), trong đó mỗi máy chủ kết hợp cả frontend web và backend ứng dụng trên cùng một máy.","D. Tạo một mạng lưới kết nối toàn bộ (full mesh) giữa tầng web và tầng ứng dụng, để mỗi máy chủ web có thể giao tiếp trực tiếp với mọi máy chủ ứng dụng."],a:"B",e:"Nguyên tắc thiết kế quan trọng của AWS là \"Kết nối lỏng lẻo\" (Loose Coupling). Việc đặt một bộ Cân bằng tải (ELB) ở giữa tầng Frontend và Backend sẽ giúp hai tầng này không bị phụ thuộc trực tiếp vào nhau. Nếu một máy chủ Backend gặp sự cố, ELB sẽ tự động điều hướng lưu lượng truy cập sang máy chủ khác, đảm bảo hệ thống duy trì tính khả dụng."},{t:"Một kiến trúc sư giải pháp đang xây dựng quy trình xử lý lỗi máy chủ. Quy trình nào tuân thủ chặt chẽ nhất các phương pháp thực hành tốt nhất của AWS?",o:["A. Amazon CloudWatch phát hiện lỗi hệ thống. Nó thông báo cho quản trị viên hệ thống để họ cung cấp một máy chủ mới bằng AWS Management Console.","B. Nhân viên vận hành phát hiện lỗi hệ thống. Họ thông báo cho quản trị viên hệ thống để cung cấp một máy chủ mới bằng AWS Management Console.","C. Nhân viên vận hành phát hiện lỗi hệ thống. Họ khởi hoạt tự động hóa để cung cấp một máy chủ mới.","D. Amazon CloudWatch phát hiện lỗi hệ thống. Nó tự động kích hoạt tiến trình cung cấp một máy chủ mới."],a:"D",e:"Nguyên tắc thiết kế trên nền tảng đám mây là \"Tự động hóa mọi thứ\" (Automate everything). Việc xử lý lỗi thủ công có sự can thiệp của con người (như các câu A, B, C) vừa mất thời gian vừa dễ xảy ra sai sót. Phương pháp tối ưu nhất là để hệ thống giám sát (như Amazon CloudWatch) tự động phát hiện lỗi và tự động kích hoạt quy trình khởi tạo máy chủ thay thế (ví dụ thông qua Auto Scaling)."},{t:"Một công ty đang xem xét di dời trung tâm dữ liệu tại chỗ (on-premises) của họ lên đám mây. Động lực chính của họ là tăng hiệu quả về chi phí. Cách tiếp cận nào tuân thủ chặt chẽ nhất các phương pháp thực hành tốt nhất của AWS?",o:["A. Khởi tạo các máy chủ khi cần thiết và dừng các dịch vụ khi chúng không được sử dụng.","B. Khởi tạo một số máy chủ trên đám mây và đảm bảo các máy chủ này chạy liên tục 24/7.","C. Sao chép toàn bộ trung tâm dữ liệu tại chỗ của họ lên đám mây theo cấu trúc tương tự.","D. Duy trì trung tâm dữ liệu tại chỗ càng lâu càng tốt."],a:"A",e:"Lợi thế lớn nhất của điện toán đám mây là mô hình chi trả theo mức độ sử dụng (Pay-as-you-go). Do đó, phương pháp tối ưu chi phí tốt nhất là chỉ khởi động máy chủ khi có nhu cầu xử lý và tắt chúng đi khi không sử dụng, thay vì để hệ thống chạy liên tục 24/7 gây lãng phí tài nguyên như các máy chủ vật lý truyền thống."},{t:"Một công ty lưu trữ dữ liệu chỉ đọc (read-only) trên Amazon S3. Hầu hết người dùng ở cùng quốc gia với trụ sở công ty. Một số người dùng nằm rải rác trên toàn thế giới. Quyết định thiết kế nào tuân thủ chặt chẽ nhất các phương pháp thực hành tốt nhất của AWS?",o:["A. Sử dụng một bucket trong AWS Region (Khu vực) gần với trụ sở công ty nhất. Tất cả người dùng truy cập dữ liệu thông qua Amazon CloudFront.","B. Sử dụng một bucket trong Region gần với trụ sở công ty nhất.","C. Sử dụng một bucket trong Region có độ trễ trung bình thấp nhất cho tất cả người dùng.","D. Sao chép (Replicate) các đối tượng qua các bucket ở nhiều AWS Region trên thế giới. Người dùng truy cập vào bucket ở Region gần họ nhất."],a:"A",e:"Vì phần lớn người dùng ở gần trụ sở, việc đặt bucket S3 tại Region gần đó là quyết định đúng đắn. Để phục vụ số lượng nhỏ khách hàng quốc tế, việc sao chép toàn bộ dữ liệu ra khắp thế giới (câu D) sẽ tốn rất nhiều chi phí. Cách tối ưu nhất là sử dụng mạng phân phối nội dung Amazon CloudFront để lưu vào bộ nhớ đệm (cache) dữ liệu tại các vị trí biên (Edge Locations) trên toàn cầu, giúp khách hàng quốc tế truy cập với độ trễ thấp."},{t:"Một chuyên gia tư vấn (consultant) cần truy cập vào một tệp dữ liệu lớn trong bucket S3. Họ cần một ngày để hoàn thành việc truy cập tệp. Phương pháp cấp quyền truy cập nào tuân thủ chặt chẽ nhất các phương pháp thực hành tốt nhất của AWS?",o:["A. Tạo một Đường dẫn có chữ ký trước (Presigned URL) cho đối tượng, tự động hết hạn sau 24 giờ, và cung cấp đường dẫn đó cho chuyên gia tư vấn.","B. Sao chép đối tượng vào một bucket S3 mới. Bật quyền truy cập công khai trên bucket mới này. Lấy URL của đối tượng từ bucket mới và cung cấp cho chuyên gia tư vấn.","C. Tạo một tài khoản người dùng (user account) cho chuyên gia tư vấn. Cấp quyền cho tài khoản này truy cập bucket S3 thông qua AWS Management Console.","D. Bật quyền truy cập công khai trên bucket S3 hiện tại. Cung cấp URL đối tượng cho chuyên gia tư vấn."],a:"A",e:"Việc mở quyền truy cập công khai (câu B, D) sẽ tạo ra rủi ro bảo mật vô cùng nghiêm trọng đối với hệ thống. Việc tạo một tài khoản IAM mới (câu C) chỉ để tải một tệp tin là không cần thiết và phức tạp. Đường dẫn có chữ ký trước (Presigned URL) được thiết kế chuyên biệt để cấp quyền truy cập tạm thời vào tài nguyên bảo mật, và nó sẽ tự động vô hiệu hóa sau thời gian được cài đặt (24 giờ)."},{t:"Những yếu tố chính nào ảnh hưởng đến việc quyết định sử dụng Khu vực AWS (AWS Regions) nào? (Chọn 2)",o:["A. Khả năng bảo vệ khỏi các thảm họa thiên nhiên cục bộ.","B. Tuân thủ các luật lệ và quy định của địa phương.","C. Bảo mật và kiểm soát truy cập.","D. Giảm độ trễ cho người dùng cuối.","E. Khả năng phục hồi của ứng dụng trong quá trình hệ thống gặp sự cố."],a:"B và D",e:"Việc chọn Khu vực (Region) thường phụ thuộc vào 4 yếu tố chính: Tuân thủ pháp luật (ví dụ: yêu cầu dữ liệu người dùng của một quốc gia phải được lưu trữ nội địa), Giảm độ trễ (đặt máy chủ gần người dùng để tải trang nhanh hơn), Tính khả dụng của dịch vụ, và Giá cả. (Lưu ý: Khả năng chống thảm họa thiên nhiên và lỗi hệ thống cục bộ là vai trò của các Vùng sẵn sàng - Availability Zones chứ không phải của Region)."},{t:"Những yếu tố chính nào ảnh hưởng đến việc quyết định sử dụng Vùng sẵn sàng (Availability Zones - AZ) nào? (Chọn 2)",o:["A. Giảm độ trễ cho người dùng cuối.","B. Tuân thủ các luật lệ và quy định.","C. Khả năng phục hồi của ứng dụng trong quá trình hệ thống gặp sự cố.","D. Bảo mật và kiểm soát truy cập.","E. Khả năng bảo vệ khỏi các thảm họa thiên nhiên cục bộ."],a:"C và E",e:"Availability Zones (AZ) là các cụm trung tâm dữ liệu vật lý được đặt cách xa nhau trong cùng một Region. Việc phân bổ ứng dụng trên nhiều AZ nhằm mục đích: Bảo vệ hệ thống khỏi các thảm họa thiên nhiên mang tính cục bộ (như lũ lụt, hỏa hoạn ở một AZ) và đảm bảo tính phục hồi, giúp hệ thống tiếp tục hoạt động (Resiliency) trong trường hợp một AZ gặp sự cố gián đoạn dịch vụ."}]},{id:3,title:"Bảo mật và Mô hình trách nhiệm chung (Security)",questions:[{t:"Phát biểu nào phản ánh nguyên tắc thiết kế của trụ cột bảo mật trong Well-Architected Framework?",o:["A. Không triển khai giải pháp vào môi trường sản xuất (production) cho đến khi bạn chắc chắn rằng không có bất kỳ rủi ro bảo mật nào tồn tại.","B. Phi tập trung hóa việc quản lý đặc quyền.","C. Đảm bảo nhân sự tích cực giám sát các rủi ro tiềm ẩn bằng phương pháp thủ công.","D. Áp dụng bảo mật ở mọi tầng (layer) của kiến trúc."],a:"D",e:"Bảo mật trên đám mây đòi hỏi phải áp dụng chiến lược \"Phòng thủ theo chiều sâu\" (Apply security at all layers). Điều này có nghĩa là bạn phải cấu hình bảo mật ở tầng mạng (VPC), tầng máy chủ (EC2), tầng dữ liệu (S3), chứ không chỉ xây dựng lớp bảo vệ vòng ngoài. Câu A không thực tế vì không thể đảm bảo rủi ro bằng 0. Câu C sai vì AWS khuyến khích sử dụng các công cụ tự động để giám sát bảo mật thay vì dựa vào sức người."},{t:"Những phát biểu nào về trách nhiệm là chính xác dựa trên Mô hình trách nhiệm chung của AWS (Shared Responsibility Model)? (Chọn 2)",o:["A. AWS chịu trách nhiệm cấu hình tường lửa dựa trên máy chủ (host-based firewall).","B. Khách hàng chịu trách nhiệm quản lý dữ liệu người dùng của họ.","C. Khách hàng chịu trách nhiệm cài đặt, bảo trì và ngừng hoạt động phần cứng mà họ sử dụng trong trung tâm dữ liệu AWS.","D. AWS chịu trách nhiệm cấu hình các Nhóm bảo mật (Security groups).","E. AWS chịu trách nhiệm về an ninh vật lý của các trung tâm dữ liệu."],a:"B và E",e:"Mô hình trách nhiệm chung được phân chia như sau: - **Trách nhiệm CỦA đám mây (Security OF the cloud):** AWS quản lý phần cứng, hạ tầng mạng, nguồn điện và bảo mật vật lý cho các trung tâm dữ liệu (Chọn E). - **Trách nhiệm TRONG đám mây (Security IN the cloud):** Khách hàng chịu trách nhiệm bảo vệ dữ liệu người dùng (Chọn B), cài đặt tường lửa của hệ điều hành, cấu hình Security Group (A và D sai). Khách hàng không có quyền truy cập vật lý hay quản lý phần cứng (C sai)."},{t:"Các lựa chọn nào là đặc điểm của \"Nguyên tắc đặc quyền tối thiểu\" (Principle of least privilege)? (Chọn 2)",o:["A. Sử dụng mã hóa.","B. Chỉ cấp quyền truy cập khi thực sự cần thiết.","C. Theo dõi các hành động và thay đổi.","D. Xây dựng các chính sách bảo mật giới hạn quyền truy cập vào các tác vụ cụ thể.","E. Luôn sử dụng nhóm (groups)."],a:"B và D",e:"\"Nguyên tắc đặc quyền tối thiểu\" có nghĩa là chỉ cấp cho người dùng những quyền hạn tối thiểu vừa đủ để họ thực hiện một công việc cụ thể (limit access to specific tasks), và không cấp thêm bất kỳ quyền hạn dư thừa nào khác, nhằm hạn chế rủi ro lạm dụng hoặc lộ lọt dữ liệu."},{t:"Phát biểu nào về Dịch vụ quản lý định danh và truy cập AWS (AWS IAM) là đúng?",o:["A. IAM cung cấp lịch sử kiểm toán về ai đã thực hiện hành động, thực hiện hành động gì và vào thời điểm nào.","B. IAM cung cấp thêm một lớp bảo mật bằng cách phát hiện các hành vi bất thường trên tài nguyên.","C. Với IAM, bạn có thể quản lý mã hóa cho các dữ liệu yêu cầu mã hóa ở trạng thái nghỉ (encryption at rest).","D. Với IAM, bạn có thể cấp cho các thực thể (principals) quyền truy cập cực kỳ chi tiết vào các tài nguyên."],a:"D",e:"Chức năng chính của IAM là quản lý việc \"Ai (Principals) được phép thực hiện hành động gì trên Tài nguyên nào (Resources)\" với mức độ phân quyền rất chi tiết. Câu A mô tả chức năng của AWS CloudTrail. Câu B mô tả tính năng của Amazon GuardDuty. Câu C là chức năng của AWS KMS."},{t:"Những phát biểu nào mô tả chính xác về Vai trò IAM (IAM Roles)? (Chọn 2)",o:["A. Chúng được liên kết duy nhất với một cá nhân cụ thể.","B. Chúng cung cấp thông tin xác thực bảo mật vĩnh viễn.","C. Cá nhân, ứng dụng và các dịch vụ có thể đảm nhận (assume) các vai trò này.","D. Chúng chỉ có thể được sử dụng bởi các tài khoản liên kết với người đã tạo ra vai trò đó.","E. Chúng cung cấp thông tin xác thực bảo mật tạm thời."],a:"C và E",e:"Đặc điểm khác biệt lớn nhất của IAM Role (Vai trò) so với IAM User (Người dùng) là Role cung cấp chứng chỉ bảo mật tạm thời (temporary credentials). Bất kỳ đối tượng nào được ủy quyền, bao gồm cá nhân con người, ứng dụng, hoặc dịch vụ của AWS (như máy chủ EC2) đều có thể \"đảm nhận\" (assume) vai trò này để thực thi công việc trong một khoảng thời gian giới hạn."},{t:"Phát biểu nào phản ánh phương pháp thực hành tốt nhất (best practice) đối với tài khoản quản trị tối cao (root user) trên tài khoản AWS?",o:["A. Để tránh bị khóa khỏi tài khoản, không nên bật xác thực đa yếu tố (MFA) trên tài khoản root.","B. Tạo một người dùng quản trị (admin user) và thực hiện hầu hết các tác vụ quản trị bằng người dùng này thay vì tài khoản root.","C. Tạo hai tài khoản root với thông tin xác thực riêng biệt và giao cho hai cá nhân khác nhau.","D. Xóa các quyền không cần thiết khỏi tài khoản root."],a:"B",e:"Tài khoản Root là tài khoản có quyền lực tối cao nhất trên toàn bộ hệ thống. AWS khuyến cáo người dùng phải bật xác thực đa yếu tố (MFA) cho tài khoản Root, lưu trữ thông tin đăng nhập ở nơi cực kỳ an toàn và không dùng tài khoản này cho các tác vụ hằng ngày. Thay vào đó, bạn nên tạo một người dùng IAM, cấp quyền Quản trị viên (Admin) cho người dùng đó và sử dụng nó để thực hiện công việc (Chọn B). Việc giới hạn hay xóa quyền của tài khoản Root là không thể thực hiện được (Câu D sai)."},{t:"AWS IAM đánh giá một chính sách (policy) theo quy trình như thế nào?",o:["A. Một lệnh từ chối rõ ràng (explicit deny) không ghi đè một lệnh cho phép rõ ràng (explicit allow).","B. Nó kiểm tra các lệnh cho phép rõ ràng trước khi kiểm tra các lệnh từ chối rõ ràng.","C. Nó kiểm tra các lệnh từ chối rõ ràng trước khi kiểm tra các lệnh cho phép rõ ràng.","D. Nếu chính sách không có lệnh từ chối rõ ràng hoặc lệnh cho phép rõ ràng nào, người dùng sẽ có quyền truy cập theo mặc định."],a:"C",e:"Logic đánh giá quyền truy cập của AWS cực kỳ chặt chẽ: Hệ thống luôn bắt đầu bằng mặc định là \"Từ chối\" (Default Deny). Sau đó, nó quét toàn bộ chính sách xem có dòng \"Từ chối rõ ràng\" (Explicit Deny) nào hay không (Chọn C); nếu có, yêu cầu lập tức bị từ chối mà không cần xét tiếp. Cuối cùng, nó mới tìm các lệnh \"Cho phép rõ ràng\" (Explicit Allow). Nói tóm lại, lệnh Từ chối (Explicit Deny) luôn luôn được ưu tiên cao nhất."},{t:"Phát biểu nào về các chính sách (policies) của AWS IAM là chính xác?",o:["A. Các chính sách dựa trên tài nguyên (Resource-based policies) cho phép truy cập theo mặc định.","B. Các chính sách dựa trên danh tính (Identity-based policies) được gắn vào một người dùng (user), nhóm (group) hoặc vai trò (role).","C. Các chính sách dựa trên danh tính chỉ có thể được gắn vào một thực thể duy nhất.","D. Các chính sách dựa trên tài nguyên được gắn vào một người dùng, nhóm hoặc vai trò."],a:"B",e:"Trong IAM có 2 loại chính sách cơ bản: 1. Chính sách dựa trên danh tính (Identity-based policies): Được gán trực tiếp cho đối tượng thực thi như User, Group, hoặc Role (chọn B đúng). 2. Chính sách dựa trên tài nguyên (Resource-based policies): Được gắn trực tiếp lên các tài nguyên mà người dùng truy cập, chẳng hạn như S3 bucket hay SQS queue (Câu D sai)."},{t:"Thành phần (element) nào trong chính sách AWS IAM chứa thông tin về việc quyết định cho phép (allow) hay từ chối (deny) một yêu cầu?",o:["A. Điều kiện (Condition)","B. Thực thể (Principal)","C. Hiệu ứng (Effect)","D. Hành động (Action)"],a:"C",e:"Trong cấu trúc JSON của một chính sách IAM, phần tử \"Effect\" xác định kết quả của chính sách, và nó chỉ nhận một trong hai giá trị là: \"Allow\" (Cho phép) hoặc \"Deny\" (Từ chối). (Action là thao tác được phép làm, Principal là đối tượng bị áp dụng chính sách, Condition là các điều kiện ràng buộc đi kèm)."},{t:"Tùy chọn nào mô tả chính xác thành phần \"statement\" trong một chính sách AWS IAM?",o:["A. Thành phần statement là một phần tùy chọn (không bắt buộc) của chính sách IAM.","B. Một chính sách chỉ có thể chứa duy nhất một thành phần statement.","C. Thành phần statement không áp dụng cho các chính sách dựa trên danh tính.","D. Thành phần statement chứa các thành phần con khác, kết hợp lại với nhau để định nghĩa những gì được cho phép hoặc bị từ chối."],a:"D",e:"\"Statement\" là khối cốt lõi và bắt buộc phải có trong mọi chính sách IAM (Câu A sai). Một chính sách có thể bao gồm nhiều khối Statement (Câu B sai). Bên trong mỗi Statement sẽ chứa các thành phần nhỏ hơn (như Effect, Action, Resource, Condition) nhằm định nghĩa một cách chi tiết quyền hạn cụ thể (Câu D đúng)."}]},{id:4,title:"Lưu trữ (Storage)",questions:[{t:"Do công ty tiến hành sáp nhập, một kỹ sư dữ liệu cần gia tăng dung lượng lưu trữ đối tượng (object storage). Họ không dự đoán được chính xác dung lượng cần thiết. Họ mong muốn một dịch vụ có khả năng mở rộng quy mô linh hoạt để lưu trữ dữ liệu phi cấu trúc, bán cấu trúc và có cấu trúc. Dịch vụ nào sẽ tối ưu chi phí nhất để thực hiện nhiệm vụ này?",o:["A. Amazon S3","B. Amazon Elastic Block Store (Amazon EBS)","C. AWS Storage Gateway","D. Amazon RDS"],a:"A. Amazon S3",e:"Từ khóa \"lưu trữ đối tượng\" (object storage) cùng với khả năng lưu trữ mọi định dạng dữ liệu (unstructured, semistructured, structured) với khả năng mở rộng vô hạn chính là các đặc tính cốt lõi của Amazon S3. (EBS là lưu trữ dạng khối dùng cho máy chủ ảo, RDS là cơ sở dữ liệu quan hệ, Storage Gateway dùng để kết nối hạ tầng tại chỗ với đám mây)."},{t:"Amazon S3 cung cấp giải pháp tối ưu cho trường hợp sử dụng (use case) nào dưới đây?",o:["A. Một không gian lưu trữ có thể truy cập qua internet dành cho các tệp video để một trang web bên ngoài có thể truy cập.","B. Một kho dữ liệu (data warehouse) dành cho hệ thống phân tích kinh doanh (business intelligence).","C. Hệ thống lưu trữ tính phí theo giờ cho các tệp tạm thời được truy cập thường xuyên.","D. Dữ liệu sổ cái (ledger data) được cập nhật và truy xuất liên tục."],a:"A",e:"Amazon S3 là giải pháp hoàn hảo để lưu trữ các tệp tĩnh (hình ảnh, video, tài liệu) và cho phép người dùng hoặc ứng dụng truy cập trực tiếp từ internet thông qua URL tĩnh. (Câu B là mục đích sử dụng của Amazon Redshift, câu C dành cho Amazon ElastiCache hoặc EBS, câu D dùng cho Amazon QLDB)."},{t:"Một công ty muốn sử dụng bucket Amazon S3 để lưu trữ trang web của họ thay vì dùng máy chủ web truyền thống. Những loại nội dung nào được Amazon S3 hỗ trợ cho tính năng lưu trữ trang web tĩnh (static web hosting)? (Chọn 3)",o:["A. Các tệp HTML động (Dynamic HTML files)","B. Các tập lệnh chạy phía máy khách (Client-side scripts)","C. Các tập lệnh chạy phía máy chủ (Server-side scripts)","D. Hệ quản trị cơ sở dữ liệu (Database engine)","E. Tệp âm thanh và video","F. Các tệp HTML tĩnh và tệp hình ảnh"],a:"B, E, và F",e:"Amazon S3 chỉ cung cấp tính năng lưu trữ Trang web tĩnh (Static Website). Nghĩa là nó chỉ lưu và phân phối các tệp tin trực tiếp xuống trình duyệt của người dùng như: HTML, CSS, Hình ảnh (F), Video/Âm thanh (E) và các đoạn mã xử lý ở phía trình duyệt như JavaScript (B). S3 không có môi trường tính toán để xử lý các mã lệnh phía máy chủ (như PHP, Python) hay cơ sở dữ liệu."},{t:"Một công ty dự định sử dụng bucket S3 để lưu trữ dữ liệu nhạy cảm. Những biện pháp nào họ có thể thực hiện để bảo vệ dữ liệu của mình? (Chọn 2)",o:["A. Bật mã hóa phía máy chủ (server-side encryption) trên bucket S3 sau khi đã tải lên dữ liệu nhạy cảm.","B. Bật mã hóa phía máy chủ trên bucket S3 trước khi tải lên dữ liệu nhạy cảm.","C. Sử dụng Giao thức truyền tệp an toàn (SFTP) để kết nối trực tiếp đến Amazon S3.","D. Sử dụng mã hóa phía máy khách (client-side encryption) để bảo vệ dữ liệu trong quá trình truyền tải trước khi gửi lên Amazon S3.","E. Tải lên các tệp không được mã hóa vì Amazon S3 sẽ tự động mã hóa tệp theo mặc định."],a:"B và D",e:"Để đảm bảo tính bảo mật tuyệt đối cho dữ liệu nhạy cảm, bạn phải thực hiện mã hóa. Có hai phương pháp chính: 1. Yêu cầu S3 tự động mã hóa dữ liệu ngay khi nó được nhận vào hệ thống (Mã hóa phía máy chủ - Server-side encryption). Cấu hình này phải được thiết lập trước khi tải dữ liệu lên (Chọn B). 2. Tự mã hóa tệp tin bằng hệ thống của khách hàng trước, sau đó tải bản đã mã hóa lên S3 (Mã hóa phía máy khách - Client-side encryption - Chọn D)."},{t:"Một công ty cần tạo một kho lưu trữ chung để chia sẻ tệp tin. Amazon S3 hỗ trợ đáp ứng những yêu cầu nào trong các yêu cầu sau? (Chọn 2)",o:["A. Đính kèm bình luận (comments) vào tệp tin.","B. Khóa một tệp tin sao cho tại một thời điểm chỉ có một người có thể chỉnh sửa nó.","C. So sánh nội dung chi tiết giữa các tệp tin khác nhau.","D. Khôi phục các tệp tin đã bị xóa.","E. Duy trì các phiên bản khác nhau của tệp tin."],a:"D. Khôi phục các tệp tin đã bị xóa và E. Duy trì các phiên bản khác nhau của tệp tin.",e:"Amazon S3 sở hữu tính năng vô cùng hữu ích gọi là Quản lý phiên bản (Versioning). Khi tính năng này được kích hoạt, hệ thống sẽ lưu lại bản sao của tệp mỗi khi có thao tác ghi đè (Duy trì các phiên bản - E). Nhờ đó, nếu một tệp tin vô tình bị xóa đi, quản trị viên có khả năng khôi phục lại trạng thái trước đó một cách dễ dàng (Khôi phục tệp bị xóa - D). S3 là dịch vụ lưu trữ đối tượng đơn thuần, không phải ứng dụng văn phòng, nên nó không có tính năng bình luận, khóa tệp (file locking) hay so sánh văn bản."},{t:"Đội ngũ chăm sóc khách hàng truy cập dữ liệu hồ sơ hàng ngày trong khoảng thời gian tối đa 30 ngày. Các hồ sơ này có thể được mở lại giải quyết và yêu cầu phải truy xuất được ngay lập tức trong vòng 1 năm kể từ khi đóng lại. Giải pháp lưu trữ nào vừa đáp ứng yêu cầu vừa mang lại hiệu quả kinh tế cao nhất?",o:["A. Lưu dữ liệu tại S3 Standard. Sử dụng chính sách vòng đời để chuyển dữ liệu sang S3 Glacier Flexible Retrieval sau 30 ngày.","B. Lưu toàn bộ dữ liệu tại S3 Standard để luôn sẵn sàng truy cập mọi lúc.","C. Lưu dữ liệu tại S3 Standard. Sử dụng chính sách vòng đời để chuyển dữ liệu sang lớp S3 Standard-Infrequent Access (S3 Standard-IA) sau 30 ngày.","D. Lưu dữ liệu tại S3 Intelligent-Tiering để hệ thống tự động luân chuyển giữa các lớp tùy theo tần suất truy cập."],a:"C",e:"- Trong 30 ngày đầu, dữ liệu được truy cập thường xuyên nên phải lưu ở lớp S3 Standard. - Sau 30 ngày, tần suất truy cập giảm hẳn, nhưng nếu hồ sơ được mở lại thì cần lấy dữ liệu ngay lập tức (immediate access). Việc đẩy xuống lớp lưu trữ S3 Standard-IA sẽ giảm chi phí lưu trữ mà vẫn giữ nguyên tốc độ truy xuất tức thì. (Câu A sai vì lớp Glacier đòi hỏi thời gian phục hồi từ vài phút đến vài giờ, không đáp ứng tiêu chí tức thì. Câu B không tối ưu chi phí)."},{t:"Tùy chọn nào sử dụng mạng lưới các vị trí biên (edge locations) trong Amazon CloudFront để truyền tải các tệp tin với khoảng cách xa đến một bucket S3 một cách nhanh chóng?",o:["A. AWS SDKs","B. AWS Transfer Family","C. Amazon S3 Transfer Acceleration","D. Amazon S3 REST API"],a:"C. Amazon S3 Transfer Acceleration",e:"Dựa vào từ khóa \"edge locations\" kết hợp với \"transfer files\", đây là tính năng S3 Transfer Acceleration. Tính năng này tăng tốc quá trình tải lên từ một nơi ở xa (ví dụ tải lên S3 Mỹ từ Việt Nam) bằng cách định tuyến gói tin qua vị trí biên CloudFront gần nhất và truyền đi qua mạng lưới cáp quang xương sống tốc độ cao của AWS."},{t:"Một nhà sản xuất video phải thường xuyên tải nhiều tệp video lên Amazon S3. Các tệp này có dung lượng dao động từ 100–700 MB. Kết nối internet thiếu ổn định, khiến một số quá trình tải lên bị lỗi giữa chừng. Giải pháp nào cung cấp cách truyền tải nhanh nhất, đáng tin cậy nhất và hiệu quả về chi phí để đẩy tệp lên Amazon S3?",o:["A. Amazon S3 Transfer Acceleration","B. Bảng điều khiển AWS Management Console","C. Tính năng tải lên đa phần (multipart uploads) của Amazon S3","D. AWS Transfer Family"],a:"C. Tính năng tải lên đa phần (multipart uploads) của Amazon S3",e:"Khi đường truyền mạng bị chập chờn, việc tải lên nguyên khối một tệp 700MB sẽ rất rủi ro vì lỗi mạng sẽ khiến thao tác phải thực hiện lại từ đầu. Tính năng tải lên đa phần (multipart upload) sẽ chia nhỏ tệp 700MB thành hàng trăm phần nhỏ. Nếu kết nối bị ngắt, hệ thống chỉ cần gửi lại chính xác phần bị lỗi thay vì toàn bộ tệp. AWS khuyến nghị sử dụng tính năng này cho các tệp có kích thước lớn hơn 100MB."},{t:"Lớp lưu trữ nào của Amazon S3 được thiết kế đặc biệt cho mục đích lưu trữ các bản sao lưu từ dữ liệu tại chỗ (on-premises) hoặc các dữ liệu có thể dễ dàng tái tạo lại được?",o:["A. S3 One Zone-Infrequent Access (S3 One Zone-IA)","B. S3 Intelligent-Tiering","C. S3 Glacier Instant Retrieval","D. S3 Standard-Infrequent Access (S3 Standard-IA)"],a:"A. S3 One Zone-Infrequent Access (S3 One Zone-IA)",e:"Điểm mấu chốt là \"dữ liệu dễ dàng tái tạo lại được\" (easily re-creatable data). Lớp lưu trữ S3 One Zone-IA có đặc tính là chỉ lưu trữ dữ liệu tại một Vùng sẵn sàng (AZ) duy nhất, thay vì được nhân bản ra tối thiểu 3 vùng như các lớp S3 khác. Điều này giúp giảm 20% chi phí, tuy nhiên nếu AZ đó gặp thảm họa, dữ liệu có thể bị mất. Vì vậy, nó chỉ phù hợp với dữ liệu không quá quan trọng hoặc đã có bản gốc lưu ở nơi khác."},{t:"Một công ty cần lưu giữ các hồ sơ để phục vụ kiểm tra pháp lý trong thời hạn 7 năm. Các hồ sơ này cực kỳ hiếm khi được truy xuất (chỉ 1 hoặc 2 lần mỗi năm). Lớp lưu trữ nào của Amazon S3 mang lại mức chi phí thấp nhất cho nhu cầu này?",o:["A. S3 Glacier Deep Archive","B. S3 One Zone-Infrequent Access (S3 One Zone-IA)","C. S3 Intelligent-Tiering","D. S3 Standard-Infrequent Access (S3 Standard-IA)"],a:"A. S3 Glacier Deep Archive",e:"S3 Glacier Deep Archive là lớp lưu trữ có chi phí rẻ nhất trong toàn bộ dịch vụ của AWS. Nó được thiết kế chuyên biệt để đóng băng và lưu trữ dài hạn (lên tới nhiều năm) đối với các dữ liệu chỉ nhằm mục đích tuân thủ pháp luật, bởi quá trình phục hồi dữ liệu từ lớp này có thể mất từ 12 đến 48 giờ."}]},{id:5,title:"Điện toán (Compute)",questions:[{t:"Những đặc tính nào là lý do để doanh nghiệp quyết định lựa chọn Amazon EC2? (Chọn 2)",o:["A. Kiểm soát hoàn toàn các tài nguyên điện toán.","B. Khả năng chạy bất kỳ loại khối lượng công việc (workload) nào.","C. AWS tự động quản lý các bản vá hệ điều hành (OS patches).","D. AWS đảm nhận quản lý bảo mật cho hệ điều hành.","E. Khả năng chạy các ứng dụng phi máy chủ (serverless)."],a:"A. Kiểm soát hoàn toàn các tài nguyên điện toán và B. Khả năng chạy bất kỳ loại khối lượng công việc nào.",e:"Amazon EC2 cung cấp dịch vụ máy chủ ảo dưới dạng Hạ tầng như một Dịch vụ (IaaS). Lợi ích lớn nhất của IaaS là người dùng có quyền kiểm soát toàn diện (root/admin access) vào máy chủ ảo để cài đặt và chạy bất kỳ phần mềm hay hệ thống nào họ muốn. Câu C và D sai vì trong dịch vụ EC2, trách nhiệm bảo mật và vá lỗi hệ điều hành hoàn toàn thuộc về khách hàng. Câu E sai vì EC2 là máy chủ có quản lý truyền thống, không phải kiến trúc serverless như AWS Lambda."},{t:"Lợi ích của việc sử dụng Amazon Machine Image (AMI) là gì? (Chọn 3)",o:["A. Cập nhật hệ thống bằng cách tự động vá lỗi trên AMI của chúng.","B. Khởi chạy hàng loạt máy chủ mới với cấu hình giống hệt nhau.","C. Bán hoặc chia sẻ các giải pháp phần mềm được đóng gói dưới dạng AMI.","D. Tự động hóa cài đặt nhóm bảo mật (security group) cho các máy chủ.","E. Sử dụng AMI đóng vai trò như một bản sao lưu (backup) máy chủ cho các phiên bản Amazon EC2.","F. Di chuyển trực tiếp dữ liệu từ mạng tại chỗ (on-premises) sang các máy chủ Amazon EC2."],a:"B, C, và E",e:"AMI hoạt động tương tự như một \"bản sao lưu nguyên trạng hệ thống đĩa\" của máy chủ. Nó mang lại những lợi ích: 1. Bạn có thể sử dụng nó làm mẫu để khởi tạo nhanh chóng hàng loạt máy chủ có chung cấu hình (B). 2. Bạn có thể cài đặt sẵn phần mềm, đóng gói thành AMI để kinh doanh trên AWS Marketplace (C). 3. Nó là phương pháp tuyệt vời để sao lưu toàn bộ trạng thái cấu hình của hệ thống máy chủ (E). (Lưu ý: AMI không có chức năng tự động vá lỗi hệ thống và không lưu trữ cấu hình mạng lưới bảo mật như Security Group)."},{t:"Một quản trị viên hệ thống phải tiến hành thay đổi loại máy (instance types) của nhiều máy chủ Amazon EC2 đang trong trạng thái hoạt động. Các máy chủ này được khởi chạy bằng cả AMI sử dụng bộ lưu trữ Elastic Block Store (EBS) và AMI sử dụng bộ lưu trữ Instance Store. Phương pháp nào là cách hợp lệ để thực hiện thay đổi cấu hình máy?",o:["A. Dừng (Stop) một máy chủ sử dụng Instance Store, thay đổi cấu hình, và khởi động lại.","B. Dừng (Stop) một máy chủ sử dụng EBS, thay đổi cấu hình, và khởi động lại.","C. Thay đổi cấu hình của máy chủ sử dụng Instance Store mà không cần phải tắt máy.","D. Thay đổi cấu hình của máy chủ sử dụng EBS mà không cần phải tắt máy."],a:"B. Dừng (Stop) một máy chủ sử dụng EBS, thay đổi cấu hình, và khởi động lại.",e:"Có hai quy tắc quan trọng trong quản trị EC2: 1. Việc thay đổi phần cứng máy ảo (RAM, CPU) bắt buộc phải thực hiện sau khi máy chủ đã chuyển sang trạng thái dừng (Stop). 2. Trạng thái dừng (Stop) CHỈ được hỗ trợ trên các máy chủ có ổ đĩa hệ điều hành sử dụng công nghệ EBS. Đối với máy chủ sử dụng ổ đĩa cục bộ tạm thời (Instance Store), chức năng Stop không được hỗ trợ (nó chỉ có thể restart hoặc terminate). Vì vậy, chỉ có đáp án B là khả thi."},{t:"Một khối lượng công việc đòi hỏi tần suất truy xuất đọc/ghi cực kỳ cao đối với các tập dữ liệu lưu trữ trực tiếp trên máy chủ. Nhóm loại máy chủ (instance types) nào sẽ hoạt động TỐT NHẤT cho khối lượng công việc này? (Chọn 2)",o:["A. Nhóm tính toán tăng tốc (Accelerated computing)","B. Nhóm mục đích chung (General purpose)","C. Nhóm tối ưu hóa bộ nhớ (Memory optimized)","D. Nhóm tối ưu hóa lưu trữ (Storage optimized)","E. Nhóm tối ưu hóa điện toán (Compute optimized)"],a:"C. Nhóm tối ưu hóa bộ nhớ (Memory optimized) và D. Nhóm tối ưu hóa lưu trữ (Storage optimized)",e:"- Nhóm tối ưu hóa lưu trữ (Storage optimized): Được thiết kế tối ưu với ổ cứng tốc độ siêu cao, phù hợp để đọc và ghi hàng vạn lệnh I/O mỗi giây từ đĩa vật lý. - Nhóm tối ưu hóa bộ nhớ RAM (Memory optimized): Được sử dụng để tải các tập dữ liệu khổng lồ trực tiếp lên bộ nhớ RAM nhằm xử lý với độ trễ gần như bằng không (rất quan trọng cho các cơ sở dữ liệu xử lý tức thời quy mô lớn)."},{t:"Một ứng dụng nội bộ cần thu thập địa chỉ kiểm soát truy cập môi trường (MAC address) của máy chủ Amazon EC2 mà nó đang được lưu trữ. Hệ thống kiến trúc sử dụng nhóm AWS Auto Scaling để tự động thêm bớt máy chủ liên tục. Đâu là cách TỐT NHẤT để phần mềm ứng dụng tự động nhận biết địa chỉ MAC?",o:["A. Sử dụng chức năng user data của từng máy chủ để truy vấn địa chỉ MAC thông qua siêu dữ liệu máy chủ (instance metadata).","B. Lưu cứng địa chỉ MAC vào tệp cấu hình ứng dụng (config file) của từng máy chủ.","C. Đính kèm địa chỉ MAC vào bản mẫu Amazon Machine Image (AMI) dùng để khởi tạo tất cả máy chủ trong Auto Scaling.","D. Biên dịch một bản AMI riêng biệt chứa địa chỉ MAC cho từng máy chủ mới sinh ra."],a:"A. Sử dụng chức năng user data của từng máy chủ để truy vấn địa chỉ MAC thông qua siêu dữ liệu máy chủ (instance metadata).",e:"Vì Auto Scaling tạo mới máy chủ một cách ngẫu nhiên và tự động, mỗi máy ảo sẽ sở hữu một địa chỉ MAC duy nhất. Do đó, việc lưu cứng thông số này vào cấu hình phần mềm hoặc bản AMI mẫu là điều không thể (loại trừ B, C, D). Cách tối ưu là phần mềm sẽ gửi một yêu cầu truy vấn nội bộ vào đường dẫn \"instance metadata\" ngay khi khởi động để hệ thống EC2 tự động trả về thông tin địa chỉ MAC của chính nó."},{t:"Các phát biểu nào sau đây mô tả chính xác về tính năng Dữ liệu người dùng (User data)? (Chọn 2)",o:["A. Theo mặc định, tập lệnh user data chỉ thực thi duy nhất một lần vào lúc máy chủ được khởi chạy.","B. Theo mặc định, tập lệnh user data sẽ thực thi lại sau mỗi lần khởi động lại máy chủ (restart).","C. Tập lệnh user data không thể được thực thi khi máy chủ đang ở trạng thái dừng (stopped).","D. Kiến trúc sư đám mây phải tự chạy lệnh /var/lib/cloud/instance/scripts/part-001 để tập lệnh được thực thi lần nữa.","E. Kiến trúc sư đám mây phải xóa bỏ tệp tin đánh dấu \"config_user_scripts\" để hệ thống tiến hành chạy lại tập lệnh user data."],a:"A và E",e:"User data là một công cụ truyền tham số hoặc mã lệnh tự động cài đặt hệ thống ở bước khởi động máy (bootstrap). - Đặc điểm của nó là chỉ được hệ thống kích hoạt chạy đúng một lần duy nhất vào lúc máy chủ EC2 vừa được sinh ra (A). - Nếu quản trị viên muốn kịch bản mã lệnh này chạy lại trong lần khởi động tiếp theo, họ phải đi vào hệ thống và xóa tệp tin có tên \"config_user_scripts\" (E) nhằm xóa lịch sử hoạt động, khiến hệ thống tin rằng tập lệnh này chưa từng được chạy."},{t:"Một hệ thống chuyên xử lý giao dịch thương mại trên Amazon EC2 thực hiện khối lượng cực lớn các thao tác đọc và ghi liên tục với tần suất cao. Loại ổ đĩa Amazon Elastic Block Store (Amazon EBS) nào là TỐT NHẤT cho ứng dụng này?",o:["A. Ổ đĩa thể rắn mục đích chung - General Purpose solid state drive (SSD)","B. Ổ đĩa cứng cơ học tối ưu hóa băng thông - Throughput Optimized hard disk drive (HDD)","C. Ổ đĩa cứng cơ học lưu trữ lạnh - Cold hard disk drive (HDD)","D. Ổ đĩa thể rắn phân bổ trước mức IOPS - Provisioned IOPS solid state drive (SSD)"],a:"D. Provisioned IOPS solid state drive (SSD)",e:"Đối với hệ thống giao dịch dữ liệu, từ khóa quan trọng là \"khối lượng cực lớn\" và \"thao tác liên tục\". - Các tùy chọn ổ đĩa HDD (B, C) không đáp ứng được tần suất truy xuất ngẫu nhiên nhanh chóng. - Ổ đĩa SSD mục đích chung (A) hoạt động ổn định nhưng có giới hạn thông lượng. - Ổ đĩa SSD phân bổ trước mức IOPS (D) là phân khúc ổ cứng cao cấp nhất, cung cấp hiệu năng cực lớn, độ trễ không đáng kể và cam kết duy trì tốc độ đọc/ghi không sụt giảm, đặc biệt phù hợp cho các cơ sở dữ liệu tải nặng."},{t:"Mặc dù bạn hoàn toàn có thể tự triển khai hệ thống chia sẻ tệp NFS bằng cách cài đặt máy chủ trên nền tảng Amazon EC2 (dùng ổ EBS), nhưng việc sử dụng dịch vụ lưu trữ chuyên nghiệp Amazon Elastic File System (Amazon EFS) mang lại những lợi thế kỹ thuật vượt trội nào? (Chọn 2)",o:["A. Khả năng sẵn sàng cao (High availability)","B. Tính nhất quán dữ liệu mạnh mẽ (Strong consistency)","C. Không cần phải thực hiện quá trình sao lưu","D. Chức năng khóa tệp tin chuyên sâu (File locking)","E. Tự động mở rộng quy mô lưu trữ (Automatic scaling)"],a:"A. Khả năng sẵn sàng cao (High availability) và E. Tự động mở rộng quy mô lưu trữ (Automatic scaling)",e:"Việc tự thiết lập máy chủ chia sẻ tệp chứa nhiều nhược điểm lớn như: máy chủ gặp sự cố khiến dịch vụ ngưng hoạt động, hoặc ổ cứng đầy phải tự tiến hành mua thêm dung lượng vật lý. Dịch vụ lưu trữ Amazon EFS giải quyết hoàn toàn hai khuyết điểm này: 1. Tính sẵn sàng cao (A): Dữ liệu được hệ thống tự động phân tán ở nhiều Vùng sẵn sàng, đảm bảo dữ liệu luôn có thể truy cập ngay cả khi một trung tâm dữ liệu gặp sự cố. 2. Mở rộng tự động (E): Dung lượng bộ nhớ của EFS có khả năng co giãn hoàn toàn tự động dựa trên số lượng tệp được lưu trữ, xóa bỏ giới hạn về mặt vật lý."},{t:"Dịch vụ Amazon FSx for Windows File Server cung cấp giải pháp đặc thù gì cho hệ thống mạng?",o:["A. Một giải pháp chuyên dụng để sao lưu dữ liệu cho các máy chủ Windows đặt tại hạ tầng doanh nghiệp (on-premises).","B. Công cụ của Amazon dùng để giám sát và quản lý các máy chủ tệp tin nền tảng Windows.","C. Dịch vụ cung cấp máy chủ định danh Microsoft Active Directory cho các máy chủ chia sẻ tệp.","D. Máy chủ lưu trữ và chia sẻ tệp nền tảng Windows được AWS quản lý toàn diện."],a:"D. Máy chủ lưu trữ và chia sẻ tệp nền tảng Windows được AWS quản lý toàn diện.",e:"Nếu như hệ điều hành Linux tương thích tốt nhất với hệ thống tệp Amazon EFS, thì các ứng dụng dành cho môi trường doanh nghiệp Windows yêu cầu định dạng tệp SMB và NTFS, tương thích trực tiếp với Active Directory. Amazon FSx for Windows File Server chính là một máy chủ chia sẻ tệp tin gốc của Windows, được AWS vận hành và bảo trì hoàn toàn, giúp khách hàng sử dụng dễ dàng như đang dùng hạ tầng nội bộ nhưng có khả năng thay đổi quy mô tự động."},{t:"Những mô tả nào về các mô hình định giá sử dụng máy chủ Amazon EC2 là chính xác? (Chọn 2)",o:["A. Với Máy chủ chạy theo yêu cầu (On-Demand Instances), khách hàng thanh toán chi phí điện toán tính theo thời gian sử dụng thực tế mà không cần bất kỳ ràng buộc hợp đồng dài hạn nào.","B. Với Máy chủ linh hoạt giá rẻ (Spot Instances), hệ thống cung cấp năng lực điện toán dư thừa với giá được chiết khấu rất sâu, tuy nhiên chúng có thể bị hệ thống tự động gián đoạn và thu hồi.","C. Với Máy chủ thuê riêng (Dedicated Hosts), đây là những máy chủ ảo được thiết kế chuyên biệt để hoạt động độc quyền như một bức tường lửa.","D. Với Máy chủ dự phòng hợp đồng (Reserved Instances), AWS sẽ bàn giao các máy chủ vật lý chuyên dụng cho khách hàng độc quyền sử dụng trong thời hạn hợp đồng.","E. Kế hoạch tiết kiệm (Savings Plans) là công cụ lập kế hoạch ngân sách giúp khách hàng quản lý và cảnh báo chi phí tiêu thụ trên EC2."],a:"A và B",e:"AWS triển khai cấu trúc tính phí EC2 rõ ràng như sau: - Tùy chọn Theo yêu cầu (A): Là mô hình trả tiền theo thời gian thực (tính bằng giây), không đòi hỏi hợp đồng cam kết. Mô hình này linh hoạt nhất nhưng mức giá không được chiết khấu. - Tùy chọn Máy chủ Spot (B): Đây là công suất thừa của AWS được đem bán lại với mức giảm giá có thể lên tới 90%. Tuy nhiên, đổi lại, AWS có toàn quyền yêu cầu lấy lại máy chủ đó bất kỳ lúc nào với cảnh báo trước 2 phút. (Các lựa chọn sai: Dedicated Hosts là thuê phần cứng vật lý dùng chung không giới hạn tính năng; Reserved Instances chỉ là cam kết chiết khấu chứ không phải là sở hữu phần cứng; Savings Plans là hợp đồng cam kết sử dụng linh hoạt thay thế Reserved Instances, chứ không phải công cụ lập ngân sách.)"}]},{id:6,title:"Cơ sở dữ liệu (Database)",questions:[{t:"Phát biểu nào so sánh tính năng giữa một dịch vụ cơ sở dữ liệu được AWS quản lý toàn diện với một cơ sở dữ liệu tự triển khai trên máy chủ ảo Amazon EC2 là đúng?",o:["A. AWS tự động đảm nhận việc nâng cấp các bản vá lỗi cơ sở dữ liệu đối với dịch vụ cơ sở dữ liệu được quản lý.","B. Khách hàng không cần phải thiết lập cấu hình sao lưu cho dịch vụ cơ sở dữ liệu được AWS quản lý.","C. AWS tự động quản lý và áp dụng bản vá hệ điều hành (OS) đối với cơ sở dữ liệu do khách hàng tự cài đặt trên máy chủ EC2.","D. Khách hàng không cần thiết lập cấu hình sao lưu nếu cơ sở dữ liệu được lưu trữ trên máy chủ EC2."],a:"A. AWS tự động đảm nhận việc nâng cấp các bản vá lỗi cơ sở dữ liệu đối với dịch vụ cơ sở dữ liệu được quản lý.",e:"Đặc điểm nổi bật của dịch vụ được quản lý toàn diện (như Amazon RDS) là việc AWS sẽ tự động hóa các tác vụ quản trị bảo trì tốn thời gian, bao gồm nâng cấp hệ điều hành và cập nhật các bản vá lỗi bảo mật (database patches). Ngược lại, nếu người dùng tự triển khai cơ sở dữ liệu trên máy ảo EC2, họ phải tự mình thực hiện mọi thao tác quản trị máy chủ (loại trừ C). Ở cả hai phương án, thao tác thiết lập quy trình sao lưu theo nhu cầu riêng luôn luôn cần thiết (loại trừ B và D)."},{t:"Một doanh nghiệp khởi nghiệp quy mô nhỏ đang cân nhắc sử dụng dịch vụ cơ sở dữ liệu nào cho hệ thống đăng ký học viên trên nền tảng trực tuyến. Các đặc tả yêu cầu nào sẽ định hướng họ lựa chọn Amazon RDS thay vì Amazon DynamoDB? (Chọn 2)",o:["A. Cấu trúc dữ liệu có tính hệ thống cao và mối quan hệ chặt chẽ.","B. Các dữ liệu liên quan đến học viên, thông tin khóa học và thông tin ghi danh được phân mảnh trong nhiều bảng (tables) khác nhau.","C. Yêu cầu mọi dữ liệu và quá trình giao dịch phải được mã hóa nhằm bảo vệ tính riêng tư.","D. Hệ thống đăng ký ghi danh đòi hỏi tính sẵn sàng cao xuyên suốt để tránh mất khách hàng.","E. Dữ liệu cần thiết phải có quy trình sao lưu định kỳ để đối phó sự cố thảm họa."],a:"A và B",e:"Amazon RDS là dịch vụ cơ sở dữ liệu quan hệ (SQL) được tối ưu hóa cho mô hình dữ liệu có cấu trúc ổn định (A) và sở hữu khả năng xử lý truy vấn kết hợp (JOIN) hiệu quả khối lượng thông tin phân mảnh trên nhiều bảng dữ liệu (B). Trong khi đó, Amazon DynamoDB là cơ sở dữ liệu phi quan hệ (NoSQL), không có khả năng kết nối phức tạp giữa các bảng một cách tối ưu. Cả hai nền tảng đều hỗ trợ sẵn các chức năng nâng cao như mã hóa bảo mật, tính khả dụng cao và tự động sao lưu, do đó các lựa chọn C, D, E không phải là tiêu chí quyết định."},{t:"Một dự án mới đang được lên kế hoạch xây dựng để quản lý kho hàng hóa thông qua giao diện web. Đội ngũ kỹ sư mong muốn sử dụng một hệ thống cơ sở dữ liệu xử lý giao dịch với khả năng phản hồi theo thời gian thực (real-time). Dịch vụ nào là giải pháp thiết kế hoàn hảo nhất?",o:["A. Amazon DynamoDB","B. Amazon Redshift","C. Amazon Neptune","D. Amazon DocumentDB"],a:"A. Amazon DynamoDB",e:"Yêu cầu trọng tâm của dự án là khả năng xử lý \"giao dịch thời gian thực\" phục vụ cho các \"ứng dụng web\" hiện đại. Amazon DynamoDB là một dịch vụ cơ sở dữ liệu phi quan hệ (NoSQL) phân tán, cung cấp độ trễ phản hồi được tính bằng một chữ số mili giây ở quy mô toàn cầu, hoàn toàn lý tưởng cho mô hình này. (Trong khi đó, Amazon Redshift là kho phân tích dữ liệu lớn chuyên biệt, Amazon Neptune giải quyết bài toán đồ thị mạng lưới)."},{t:"Một công ty giải trí trò chơi trực tuyến đang phát triển nền tảng trò chơi, ở đó hàng ngàn người chơi có thể tự do tạo ra các đồ vật trong trò chơi theo ý muốn. Mô hình cơ sở dữ liệu cũ đang sử dụng MySQL trên nền Amazon RDS. Những đặc điểm thiết kế đồ vật trò chơi nào sẽ chứng minh rằng chuyển sang Amazon DynamoDB là một nước đi ưu việt hơn? (Chọn 2)",o:["A. Tất cả đồ vật do người chơi tạo ra chia sẻ chung một tập hợp các thuộc tính cố định.","B. Người chơi có quyền sáng tạo ra các thuộc tính đồ vật không thể dự đoán trước.","C. Trò chơi ghi nhận lượng truy cập yêu cầu đọc thông tin đồ vật vô cùng lớn nhưng lượng thao tác ghi thông tin thì khá thấp.","D. Dữ liệu trò chơi cần lưu trữ tệp tin kỹ thuật số nhị phân có dung lượng có thể lên đến 700 MB.","E. Nội dung của một đồ vật trong trò chơi có thể thay đổi bằng cách tính toán từ số liệu ở những bảng dữ liệu khác."],a:"B và C",e:"1. Khả năng lưu trữ không cần lược đồ (Unpredictable attributes - B): Điểm mạnh của DynamoDB là cho phép từng hàng dữ liệu có những cột thuộc tính hoàn toàn khác nhau mà không cần cấu trúc định nghĩa từ trước, khác biệt hoàn toàn với RDS yêu cầu lược đồ cột chặt chẽ. 2. Xử lý tải đọc khổng lồ (High read activity - C): Khả năng mở rộng ngang vô hạn của DynamoDB cung cấp sức mạnh vượt trội giúp xử lý trơn tru hàng triệu yêu cầu truy xuất đọc toàn cầu mà không gây nghẽn cổ chai. (Câu D sai vì một mục dữ liệu của DynamoDB bị giới hạn ở 400KB, câu E là lợi thế vượt trội của SQL/RDS)."},{t:"Một tổ chức phi chính phủ đang đối mặt với tỷ lệ lừa đảo tài chính ngày càng tăng. Dịch vụ cơ sở dữ liệu nào cung cấp sức mạnh truy vấn thời gian thực để phân tích bản đồ cấu trúc liên kết nhằm theo dấu vết các mô hình gian lận lừa đảo?",o:["A. Amazon RDS","B. Amazon DynamoDB","C. Amazon Redshift","D. Amazon Neptune"],a:"D. Amazon Neptune",e:"Khi gặp từ khóa truy vấn phân tích bản đồ hoặc mạng lưới (graph database), giải pháp duy nhất và chính xác nhất trên hệ sinh thái AWS là Amazon Neptune. Đây là một cơ sở dữ liệu đồ thị, được thiết kế đặc biệt để tối ưu hóa việc phân tích những nút thắt liên kết phức tạp giữa các chủ thể (giúp tìm ra các mạng lưới rửa tiền hoặc hệ thống gợi ý bạn bè trên nền tảng xã hội)."},{t:"Một chuyên viên hạ tầng cần di chuyển và vận hành hệ thống Microsoft SQL Server phục vụ cho một dự án mới trên đám mây AWS. Họ có thể cân nhắc triển khai dịch vụ quản lý nào để đáp ứng nhanh chóng yêu cầu này?",o:["A. Amazon RDS","B. Amazon DynamoDB","C. Amazon Aurora","D. Amazon Neptune"],a:"A. Amazon RDS",e:"Microsoft SQL Server thuộc nhóm các Hệ quản trị cơ sở dữ liệu quan hệ (RDBMS) truyền thống. Do đó, AWS cung cấp môi trường lý tưởng để chạy SQL Server thông qua nền tảng quản lý Amazon RDS. (Cần đặc biệt lưu ý: Dịch vụ cơ sở dữ liệu tối cao của AWS là Amazon Aurora hiện tại CHỈ phát hành dưới hai phiên bản nhân tương thích là MySQL và PostgreSQL, hoàn toàn KHÔNG hỗ trợ kiến trúc SQL Server)."},{t:"Để đảm bảo tính toàn vẹn và độ an toàn cho một máy chủ cơ sở dữ liệu Amazon RDS, kiến trúc sư hệ thống cần áp dụng đồng thời các phương pháp kỹ thuật nào sau đây? (Chọn 3)",o:["A. Xây dựng chính sách AWS IAM chuyên sâu nhằm kiểm soát đặc quyền quản trị trực tiếp đến tận từng cấp độ bảng (table), hàng (row) và cột (column).","B. Cấu hình VGW (virtual private gateway) để sàng lọc truy cập từ các mạng nội bộ.","C. Kết nối một VPC gateway endpoint nhằm hạn chế luồng dữ liệu bị rò rỉ ra ngoài môi trường internet công cộng.","D. Triển khai máy chủ vào mạng lưới cách ly ảo (Virtual Private Cloud - VPC) để bảo vệ vật lý và hệ thống.","E. Thiết lập mạng lưới quy tắc Nhóm bảo mật (Security groups) kiểm soát kết nối ở cấp độ cổng mạng đối với các máy chủ RDS riêng lẻ.","F. Tiến hành quy trình mã hóa dữ liệu ở cả hai trạng thái lưu trữ tĩnh và đang truyền tải để bảo vệ luồng thông tin tối mật."],a:"D, E, và F",e:"Máy chủ Amazon RDS về bản chất là một phiên bản máy chủ ảo thực thi chức năng xử lý dữ liệu. Để bảo vệ nó, AWS đưa ra tiêu chuẩn bảo mật ba lớp: 1. Đặt máy chủ vào môi trường mạng kín (VPC - D). 2. Xây dựng bộ quy tắc tường lửa (Security groups - E) nhằm chặn các kết nối và cổng mạng không mong muốn. 3. Mã hóa cấp độ cao (Encryption - F) để bảo vệ an toàn nội dung. (Câu A hoàn toàn sai vì IAM của AWS không thể can thiệp sâu vào phân quyền dữ liệu cấu trúc bảng/cột; việc này phải do quản trị viên cơ sở dữ liệu cấu hình trong phần mềm SQL. Câu C sai vì Endpoint dạng Gateway chỉ hỗ trợ S3 và DynamoDB)."},{t:"Đối với dịch vụ Amazon DynamoDB, kỹ sư cần triển khai các phương pháp kỹ thuật bảo mật nào nhằm tối đa hóa an toàn dữ liệu? (Chọn 3)",o:["A. Xây dựng chính sách AWS IAM chuyên sâu nhằm kiểm soát đặc quyền truy cập ở cấp độ bảng (table), mục dữ liệu (item) hoặc thuộc tính cụ thể (attribute).","B. Triển khai vào mạng lưới cách ly ảo (VPC) để cô lập máy chủ và thiết lập tường lửa.","C. Tiến hành quy trình mã hóa dữ liệu nhằm bảo mật thông tin nội dung quan trọng.","D. Cấu hình VGW (virtual private gateway) để sàng lọc dữ liệu.","E. Thiết lập mạng lưới quy tắc Nhóm bảo mật (Security groups) kiểm soát giao tiếp mạng của máy chủ ảo.","F. Kết nối thông qua một điểm cuối mạng lưới VPC (VPC gateway endpoint) nhằm tránh luồng dữ liệu truyền tải phải chuyển hướng qua internet."],a:"A, C, và F",e:"Do DynamoDB là một dịch vụ phi máy chủ (Serverless), khách hàng không được cấp và không có quyền truy cập vào một hạ tầng máy chủ ảo cụ thể. Điều này khiến cho việc sử dụng tính năng cô lập mạng lưới VPC (B) hoặc cấu hình Nhóm bảo mật (E) là điều bất khả thi. Thay vào đó, quy trình bảo mật chuẩn mực bao gồm: 1. Sử dụng tính năng phân quyền chi tiết cực kỳ mạnh mẽ của IAM (A) để hạn chế thao tác trực tiếp tới cấp độ một hàng dữ liệu cụ thể. 2. Mã hóa tài nguyên hệ thống (C). 3. Thiết lập kết nối VPC Gateway Endpoint (F) để các máy chủ nằm trong mạng VPC nội bộ có thể gửi yêu cầu thẳng tới DynamoDB thông qua đường trục nội bộ mà không cần phải vòng ra Internet rủi ro."},{t:"Một công ty mong muốn di chuyển hoàn toàn cấu trúc cơ sở dữ liệu Oracle truyền thống hiện tại ở trung tâm dữ liệu nội bộ sang hệ thống Amazon Aurora MySQL. Đâu là quy trình mô tả các giai đoạn triển khai cấp cao nhất xác thực nhất?",o:["A. Chạy AWS Schema Conversion Tool (AWS SCT) để chuyển đổi lược đồ đồng thời di chuyển dữ liệu vào máy chủ mới.","B. Triển khai AWS Database Migration Service (AWS DMS) để sao chép dữ liệu, sau đó sử dụng AWS SCT nhằm tinh chỉnh lại cấu trúc bảng.","C. Vận hành AWS Schema Conversion Tool (AWS SCT) để chuyển đổi lược đồ hệ thống, sau đó thực thi AWS Database Migration Service (AWS DMS) nhằm kết nối và tải lượng lớn dữ liệu sang nền tảng mới.","D. Thiết lập kết nối AWS Database Migration Service (AWS DMS) từ máy chủ gốc chuyển luồng thẳng đến Amazon Aurora MySQL để tiết kiệm thời gian."],a:"C",e:"Việc di chuyển giữa hai ngôn ngữ cơ sở dữ liệu hoàn toàn khác biệt (Oracle và MySQL) được gọi là quá trình di chuyển không đồng nhất (Heterogeneous migration). Theo phương pháp thực hành, chuyên viên bắt buộc phải sử dụng công cụ SCT để dịch và tương thích hóa toàn bộ bộ khung định nghĩa dữ liệu (Schema) sang ngôn ngữ đích. Chỉ sau khi cấu trúc mới đã được xây dựng chuẩn xác tại đích đến, công cụ phân phối luồng tải dữ liệu (AWS DMS) mới được cấp phép thực hiện nhiệm vụ bơm dữ liệu vào hệ thống một cách trơn tru."},{t:"Một kiến trúc sư giải pháp đám mây đang tiến hành xây dựng nền tảng sử dụng một máy chủ Amazon RDS MySQL. Yêu cầu cấu trúc cơ sở dữ liệu phải được thiết kế để đảm bảo năng lực tính sẵn sàng cao xuyên suốt các Vùng sẵn sàng (Availability Zones) cũng như chống chịu rủi ro ở cấp độ Khu vực AWS (AWS Regions) với thời gian ngừng hoạt động tối thiểu nhất. Đâu là phương án giải quyết tối ưu?",o:["A. Khởi tạo một phiên bản máy chủ Single-AZ. Thiết lập một bản sao lưu phục vụ đọc (read replica) lưu tại một Region địa lý khác.","B. Triển khai một cấu hình đa vùng Multi-AZ. Thiết lập mở rộng một bản sao lưu phục vụ đọc (read replica) nằm tại một Region địa lý khác.","C. Triển khai một cấu hình đa vùng Multi-AZ. Điều chỉnh thiết lập thời gian khung sao lưu tự động phù hợp.","D. Khởi tạo phiên bản Single-AZ. Cấu hình tự động gửi tệp tin sao lưu (snapshots) định kỳ qua một Region dự phòng khác."],a:"B",e:"Đề bài đặt ra hai yêu cầu thiết lập mức độ khả dụng độc lập: 1. Chống chịu sự cố ngắt kết nối tại cấp độ một trung tâm dữ liệu cục bộ (Availability Zones): Giải pháp duy nhất là bật thiết lập phân tán tài nguyên tại Nhiều Vùng sẵn sàng (Multi-AZ). 2. Chống chịu sự cố ở cấp độ thảm họa địa lý diện rộng (Khu vực - Regions): Để hệ thống có thể chuyển hướng hoạt động (failover) tức thời khi một Region ngừng cung cấp dịch vụ, thiết lập một máy chủ bản sao đọc phụ (Read replica) hoạt động liên tục ở vùng khác là bắt buộc. Đáp án B kết hợp hoàn hảo để thỏa mãn cả hai thách thức này."}]},{id:7,title:"Mạng lưới (Networking)",questions:[{t:"Đám mây riêng ảo (Virtual Private Cloud - VPC) trên AWS được định nghĩa chuẩn xác như thế nào?",o:["A. Một mạng lưới ảo được phân tách và cô lập về mặt logic do khách hàng thiết lập trong đám mây AWS.","B. Một dịch vụ nền tảng tích hợp toàn diện nhằm mở rộng biên giới đám mây AWS xuống trực tiếp hạ tầng cục bộ của khách hàng.","C. Một hệ thống mạng kết nối riêng tư (VPN) dành riêng cho đám mây AWS.","D. Một đường liên kết trực tiếp mở rộng hạ tầng cục bộ vào sâu trong môi trường AWS."],a:"A. Một mạng lưới ảo được phân tách và cô lập về mặt logic do khách hàng thiết lập trong đám mây AWS.",e:"Amazon VPC đóng vai trò như một môi trường mạng nội bộ chuyên biệt, nơi hệ thống kiến trúc mạng được tách biệt hoàn toàn về mặt logic (logically isolated) dành riêng cho tài khoản khách hàng vận hành trên AWS. Người dùng nắm toàn quyền phân bổ các không gian địa chỉ, mạng con (subnets), cùng hệ thống đường dẫn giao thông. Các đáp án B và D mô tả cho chức năng của nhóm dịch vụ kết nối lai (hybrid) như AWS Outposts hoặc mạng trực tiếp Direct Connect, còn câu C mô tả giao thức VPN."},{t:"Trong thiết kế kiến trúc mạng tiêu chuẩn trên AWS, thành phần tài nguyên nào KHÔNG được phép thiết lập luồng kết nối trực tiếp đến môi trường internet bên ngoài?",o:["A. Dịch vụ cổng dịch địa chỉ mạng (NAT gateway) nằm trong vùng mạng con công khai (public subnet).","B. Máy chủ EC2 khởi tạo trong không gian mạng con công khai.","C. Giao diện mạng được gán địa chỉ IP tĩnh (Elastic IP).","D. Máy chủ EC2 thiết lập trong vùng mạng con riêng tư (private subnet)."],a:"D. Máy chủ EC2 thiết lập trong vùng mạng con riêng tư (private subnet).",e:"Theo lý thuyết quy hoạch kiến trúc mạng của AWS, mục đích của việc phân chia Mạng con riêng tư (Private Subnet) là để đóng gói các tài nguyên mang tính bảo mật nội bộ cao (như các hệ thống cơ sở dữ liệu hay máy chủ phân tích) không bị tiếp xúc trực tiếp trước các rủi ro từ Internet. Do đó, các máy chủ nằm tại vùng này sẽ không có IP định tuyến trực tiếp. Để tải dữ liệu cập nhật về máy, các máy chủ Private này bắt buộc phải điều hướng kết nối thông qua trạm trung chuyển một chiều là cổng NAT Gateway nằm ở Mạng con công khai."},{t:"Không gian mạng của một tổ chức đang cấu hình sử dụng khối định tuyến IP 172.16.0.0/21 (cung cấp 2048 địa chỉ). Tổ chức định hướng phân chia mạng thành hai khối mạng con (Subnet A và B). Yêu cầu kỹ thuật hiện tại cần tối thiểu 100 địa chỉ hoạt động khả dụng cho mỗi khối mạng, tuy nhiên dung lượng này được dự phóng sẽ đạt tối đa 254 địa chỉ khả dụng trong một tương lai rất gần. Đâu là lược đồ kiến trúc mạng tuân thủ chuẩn xác nhất tiêu chí bảo đảm và thực hành tốt nhất của AWS?",o:["A. Subnet A: 172.16.0.0/24 (256 addresses) và Subnet B: 172.16.1.0/24 (256 addresses)","B. Subnet A: 172.16.0.0/22 (1024 addresses) và Subnet B: 172.16.4.0/22 (1024 addresses)","C. Subnet A: 172.16.0.0/23 (512 addresses) và Subnet B: 172.16.2.0/23 (512 addresses)","D. Subnet A: 172.16.0.0/25 (128 addresses) và Subnet B: 172.16.0.128/25 (128 addresses)"],a:"C. Subnet A: 172.16.0.0/23 (512 addresses) và Subnet B: 172.16.2.0/23 (512 addresses)",e:"Mấu chốt kỹ thuật nằm ở yêu cầu cung cấp khả năng mở rộng lên \"TỐI ĐA 254 địa chỉ khả dụng (usable addresses)\". Khác với mạng truyền thống, giao thức của AWS luôn dự trữ 5 địa chỉ IP trong mỗi một phân lớp mạng con để sử dụng cho mục đích vận hành nội bộ (như máy chủ DNS và bộ định tuyến ảo). - Ở đáp án A (sử dụng tiền tố /24): Tổng dung lượng là 256 địa chỉ, nhưng khi trừ đi 5 địa chỉ bị khóa bởi hệ thống AWS thì chỉ còn 251 địa chỉ khả dụng, không thể đáp ứng được ngưỡng mục tiêu là 254. - Vì vậy, giải pháp tối ưu là lựa chọn tiền tố /23 ở câu C (tạo ra 512 địa chỉ, cung cấp 507 địa chỉ khả dụng), đảm bảo đáp ứng ngưỡng yêu cầu và cung cấp thêm không gian an toàn."},{t:"Một loạt các máy chủ xử lý dữ liệu đang vận hành trong một mạng VPC nội bộ. Nhằm đảm bảo an toàn, các nền tảng Internet công cộng bên ngoài hoàn toàn bị ngăn cấm truy cập vào các máy chủ này, nhưng ngược lại, máy chủ bắt buộc phải có khả năng khởi tạo kết nối tải xuống các bản vá cập nhật bảo mật từ Internet. Mô hình phân bổ mạng nào giúp giải quyết bài toán trên?",o:["A. Cấu hình gán địa chỉ IP tĩnh (Elastic IP), đặt trong mạng con liên kết bộ định tuyến thẳng tới một Internet Gateway.","B. Gỡ bỏ địa chỉ IP công khai, đặt trong mạng con liên kết bộ định tuyến thẳng tới một Internet Gateway.","C. Gỡ bỏ địa chỉ IP công khai, định cấu hình đặt máy chủ trong một mạng con với bộ định tuyến mặc định đẩy dữ liệu thông qua trạm trung chuyển mạng NAT Gateway.","D. Khởi tạo IP công khai (public IP addresses), định cấu hình liên kết mạng con định tuyến ra cổng Internet Gateway."],a:"C. Gỡ bỏ địa chỉ IP công khai, định cấu hình đặt máy chủ trong một mạng con với bộ định tuyến mặc định đẩy dữ liệu thông qua trạm trung chuyển mạng NAT Gateway.",e:"Để đáp ứng thiết kế \"ngăn chặn hoàn toàn luồng truy cập vào nhưng cấp phép cho luồng kết nối đi ra\", yêu cầu bắt buộc là: 1. Đặt máy chủ vào môi trường mạng riêng tư hoàn toàn không có IP công khai. 2. Xây dựng đường ống dẫn luồng kết nối (routing table) đẩy ra bên ngoài thông qua một NAT Gateway. Thiết bị NAT hoạt động theo nguyên tắc một chiều, thiết lập liên kết tải gói tin cập nhật nhưng lập tức chặn toàn bộ mọi thao tác gọi ngược (ping/request) từ thế giới bên ngoài vào."},{t:"Một đội ngũ chuyên viên bảo trì (consultant) cần đặc quyền truy cập bảo mật qua nền tảng internet vào một cụm máy chủ EC2 trung tâm trong 3 ngày làm việc liên tiếp. Máy chủ sẽ được lệnh tắt hoạt động (shut down) vào các ngày còn lại để tối ưu nguồn chi phí. Hệ thống mạng VPC hiện tại đã được cấu trúc có cổng mạng Internet. Vậy phương pháp cấp phát thiết lập mạng IPv4 cho cụm máy chủ là gì nhằm đảm bảo kết nối ổn định cho các chuyên viên?",o:["A. Kích hoạt thuộc tính tự động phân bổ địa chỉ kết nối cho toàn bộ không gian mạng con (subnet).","B. Kích hoạt tính năng phân bổ liên tục tự động trên cấu hình mạng của riêng máy chủ EC2.","C. Lập trình gán cố định kết nối trong kịch bản khởi động (boot configuration) của hệ điều hành trên máy ảo.","D. Cấp phát và đính kèm vĩnh viễn một địa chỉ IP Đàn hồi (Elastic IP) cho máy chủ EC2."],a:"D. Cấp phát và đính kèm vĩnh viễn một địa chỉ IP Đàn hồi (Elastic IP) cho máy chủ EC2.",e:"Đối với đặc thù IP công khai tự động trên AWS (A, B), bất cứ khi nào một máy chủ EC2 tiến hành chuyển đổi trạng thái (như tắt máy để tiết kiệm - shut down), hạ tầng AWS sẽ thu hồi lại địa chỉ IP đó và cung cấp một địa chỉ hoàn toàn ngẫu nhiên khi hệ thống khởi động lại. Việc này khiến cho đội ngũ chuyên viên bảo trì liên tục mất kết nối và không xác định được đích đến. Do đó, kỹ thuật viên phải mua và gán một địa chỉ \"Elastic IP\", đây là một dải IP tính phí được AWS cam kết tĩnh vĩnh viễn không thay đổi bất kể trạng thái của máy chủ là gì."},{t:"Trong một kiến trúc bảo mật phân lớp, ứng dụng sử dụng một máy chủ nhúng \"Bastion Host\" nhằm thiết lập cầu nối cho các phiên truy cập vào máy chủ EC2 đặt tại khu vực mạng con tư nhân riêng biệt (private subnet). Để cho phép giao thức quản trị từ xa (SSH) truyền tải từ địa chỉ IP nguồn đi qua hệ thống này, các cấu hình quy tắc Nhóm bảo mật (Security groups) nào là bắt buộc? (Chọn 2)",o:["A. Bổ sung một quy tắc trên Nhóm bảo mật của máy EC2 tư nhân cấp phép phản hồi lưu lượng ngược trở lại máy Bastion host.","B. Bổ sung một quy tắc trên Nhóm bảo mật của máy Bastion host thiết lập tường lửa ngăn chặn (deny) mọi nguồn cấp internet khác.","C. Bổ sung một quy tắc trên Nhóm bảo mật của máy Bastion host cấp phép luồng phản hồi trở về địa chỉ IP gốc.","D. Bổ sung một quy tắc cấp phép lưu lượng kết nối truy cập đầu vào qua cổng Port 22 trên Nhóm bảo mật của máy chủ EC2 nhận nguồn dữ liệu từ Nhóm bảo mật Bastion host.","E. Bổ sung một quy tắc cấp phép kết nối thông qua cổng Port 22 từ luồng IP gốc của quản trị viên trên thiết lập Nhóm bảo mật của máy Bastion host."],a:"D và E",e:"Phiên làm việc truy cập từ xa (SSH - hoạt động trên Port 22) sẽ là một quy trình hai trạm trung chuyển: Từ thiết bị cá nhân -> Trạm kiểm soát Bastion Host -> Máy chủ hệ thống nội bộ tư nhân. - Giai đoạn 1 (E): Trạm kiểm soát Bastion host đóng vai trò là tiền đồn, bắt buộc phải mở một cổng Port 22 duy nhất để đón nhận đúng địa chỉ IP gốc (source IP address) từ thiết bị cá nhân của bạn tiến vào hệ thống. - Giai đoạn 2 (D): Ở lớp sâu hơn, máy chủ hệ thống bên trong không gian mạng tư nhân cũng phải cấu trúc Nhóm bảo mật mở cửa thông qua cổng Port 22 để tiếp nhận đường truyền nội bộ được cấp phép từ ông trạm kiểm soát Bastion Host đi vào. (Lưu ý: Không bao giờ chọn A và C vì hệ thống Nhóm bảo mật của AWS tuân theo cơ chế tường lửa lưu trạng thái (Stateful); một khi hệ thống đã đồng ý yêu cầu đi vào, nó sẽ tự động đồng bộ hóa tạo ra đường truyền cho dòng phản hồi (return traffic) để thoát ra ngoài mà không cần bạn phải thiết lập thủ công)."},{t:"Kiến trúc dự án yêu cầu xây dựng một hệ thống mạng lưới bảo mật, ở đó một phân vùng mạng con (subnet) sẽ bị kiểm soát cực kỳ nghiêm ngặt và chỉ thiết lập kết nối đến một số địa chỉ mạng Internet được kiểm duyệt. Vậy một kiến trúc sư cần phải thiết lập và vận hành các quy tắc Danh sách kiểm soát truy cập mạng (Network ACL - NACL) theo nguyên lý như thế nào để siết chặt luồng giao thông cả ra lẫn vào (traffic from and to)?",o:["A. Bổ sung danh sách các quy tắc (rules) vào thành phần NACL mặc định (default network ACL) nhằm cấp phép đường truyền từ các địa chỉ chuẩn.","B. Xây dựng bổ sung hệ thống quy tắc vào danh sách NACL chuyên biệt tùy chỉnh (custom network ACL). Định nghĩa cho phép đường truyền từ các địa chỉ chuẩn và cấu hình bổ sung tính năng từ chối tường minh (Deny all) toàn bộ các kết nối phát sinh khác.","C. Bổ sung hệ thống quy tắc trên danh sách NACL tùy chỉnh của cấu trúc mạng con nhằm cấp quyền truy cập từ các địa chỉ Internet chuẩn đã được phê duyệt.","D. Xây dựng bổ sung trên danh sách NACL mặc định nhằm cấp phép đường truyền từ các địa chỉ chuẩn, sau đó cấu hình bổ sung tính năng từ chối tường minh (Deny all) cho toàn bộ các kết nối còn lại."],a:"C. Bổ sung hệ thống quy tắc trên danh sách NACL tùy chỉnh của cấu trúc mạng con nhằm cấp quyền truy cập từ các địa chỉ Internet chuẩn đã được phê duyệt.",e:"Trong kiến trúc mạng phân lớp AWS, một danh sách điều khiển kiểm soát mạng con tùy chỉnh (Custom Network ACL) được vận hành dựa trên triết lý bảo mật bằng không. Hệ thống được lập trình chứa một cơ chế cốt lõi tàng hình luôn luôn mang giá trị \"Từ chối mọi thứ\" (Ngầm định Deny All ở độ ưu tiên thấp nhất). Vì vậy, đội ngũ kiến trúc sư hoàn toàn không phải tốn sức lực cấu hình việc ngăn chặn (Câu B và D chứa thao tác thừa). Việc duy nhất cần thực thi là cấu hình những luật \"Cho phép\" (Allow) các địa chỉ tin cậy. Những gói tin ngoại lai nào không thể vượt qua danh sách các luật Cho phép sẽ tự động gặp phải bộ quy tắc ngầm định dưới cùng và bị tiêu hủy."},{t:"Nguyên tắc vàng nào thể hiện các phương pháp thực hành tối ưu hóa nhất (best practices) về khả năng thiết kế bền vững cho đám mây riêng ảo (VPC)? (Chọn 3)",o:["A. Phân tách và tạo ra một định tuyến mạng con (subnet) riêng biệt cho mỗi Vùng sẵn sàng (Availability Zone) tương ứng với từng phân nhóm dịch vụ máy chủ có chiến lược định tuyến khác nhau.","B. Lên kế hoạch dự trữ sẵn một lượng lớn không gian cấp phát địa chỉ chưa định tuyến để phục vụ cho sự mở rộng vô định trong tương lai.","C. Lập trình tính toán phân chia khối địa chỉ mạng (CIDR block) của mạng VPC hoàn toàn khít với số lượng máy chủ thiết bị hiện tại mà không chừa dư.","D. Khởi tạo một thông số mạng địa chỉ CIDR tương tự và trùng lặp hoàn toàn với kiến trúc mạng công ty tại chỗ (on-premises network).","E. Thiết kế phân vùng dải địa chỉ mạng CIDR giống hệt nhau đối với các mạng con nằm trong các AZ khác nhau.","F. Xây dựng quy hoạch mạng lưới hạ tầng VPC với tiêu chí phân chia dải địa chỉ đều đặn bao phủ rải rác toàn bộ các phân khu Vùng sẵn sàng (Availability Zones)."],a:"A, B, và F",e:"Kiến trúc mạng VPC bền bỉ trên AWS cần áp dụng 3 quy chuẩn: 1. Mỗi Vùng sẵn sàng (AZ) cần sở hữu một mạng con riêng biệt (A): Thiết kế này ngăn chặn việc cấu trúc mạng bị phụ thuộc, nhằm đảm bảo khi một trung tâm dữ liệu cục bộ gặp sự cố thì các trung tâm khác hoàn toàn không bị ảnh hưởng định tuyến. 2. Thiết lập quy hoạch dự phòng (B): Luôn cung cấp dư dả các phân mảnh IP (khác với câu C) nhằm đáp ứng nhu cầu gia tăng công suất hệ thống mà không vấp phải giới hạn mạng và phải đập bỏ xây lại từ đầu. 3. Cân bằng tải phân vùng (F): Thiết kế dàn đều toàn bộ cấu trúc mạng lưới (Subnets) ra khắp tất cả các AZ khả dụng trong một Khu vực, giúp tránh tắc nghẽn thông lượng mạng tại một điểm yết hầu. (Đặc biệt lưu ý câu D vi phạm thiết kế nghiêm trọng, vì việc sử dụng một dải IP trùng lặp với không gian mạng công ty vật lý sẽ sinh ra lỗi xung đột định tuyến (overlap) khiến việc kết nối lai hai môi trường là bất khả thi)."},{t:"Các điểm đến của nhật ký luồng lưu lượng (VPC Flow Logs) theo dõi toàn bộ đường đi mạng IP trong hệ thống có thể được định tuyến vận chuyển tới kho lưu trữ trung tâm nào? (Chọn 3)",o:["A. Bộ lưu trữ đối tượng Amazon S3 bucket","B. Nền tảng giám sát hệ thống Amazon CloudWatch","C. Bảng điều khiển quản trị trung tâm AWS Management Console","D. Công cụ phân luồng dữ liệu liên tục Amazon Kinesis Data Firehose","E. Công cụ truy vấn máy học Amazon Athena","F. Cơ sở dữ liệu tìm kiếm phân tích Amazon OpenSearch Service"],a:"A, B, và D",e:"Tính năng VPC Flow Logs là thiết bị ghi dấu nhật ký (log) cho mọi kết nối giao thức mạng đã xâm nhập hoặc cố gắng xâm nhập vào kiến trúc hệ thống của bạn. Khi kích hoạt chức năng theo dõi này, AWS cấp quyền cho phép bạn vận chuyển nguồn cung cấp log khổng lồ này về một trong ba trung tâm xử lý dữ liệu lõi: 1. Nền tảng Amazon S3: Mục đích thiết lập kho lưu trữ lâu dài với chi phí giám sát bằng không. 2. Dịch vụ Amazon CloudWatch: Dành cho mục đích hiển thị trực tiếp dữ liệu theo thời gian thực và thiết lập hệ thống cảnh báo cảnh sát (Alarms). 3. Hệ thống luồng Kinesis Data Firehose: Sử dụng như một đường ống dữ liệu tức thời nhằm cung cấp cho các ứng dụng đối tác thứ ba đánh giá rủi ro hệ thống mạng."},{t:"Một quy trình tự động hóa thuộc máy chủ cấu hình EC2 yêu cầu thiết lập cầu nối chuyển luồng mạng trực tiếp đến một dịch vụ S3 bucket. Đâu là thành phần thiết bị liên kết tối ưu nhất để thực hiện khả năng này mà
