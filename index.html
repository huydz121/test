<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Academy - Luyện thi Giữa kỳ</title>
    <meta name="description" content="Hệ thống ôn tập trắc nghiệm AWS Academy Module 2-13 với 240 câu hỏi">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0f1117;--surface:#1a1d27;--surface2:#242836;--border:#2e3347;
            --primary:#ff9900;--primary-glow:rgba(255,153,0,.15);
            --text:#e4e4e7;--text-dim:#9ca3af;
            --success:#22c55e;--success-bg:rgba(34,197,94,.12);
            --error:#ef4444;--error-bg:rgba(239,68,68,.12);
            --info:#3b82f6;--info-bg:rgba(59,130,246,.1);
            --selected:#a855f7;--selected-bg:rgba(168,85,247,.15);
            --radius:12px
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

        /* HEADER */
        .header{background:linear-gradient(135deg,#1a1d27 0%,#242836 100%);border-bottom:1px solid var(--border);padding:1.5rem 0;text-align:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
        .header h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ff9900,#ffb84d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
        .header p{color:var(--text-dim);font-size:.9rem}
        .container{max-width:900px;margin:0 auto;padding:2rem 1rem}

        /* DASHBOARD */
        .section-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
        .section-title::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px;display:inline-block}
        .source-tabs{display:flex;gap:.5rem;margin-bottom:2rem;background:var(--surface);padding:.4rem;border-radius:var(--radius);border:1px solid var(--border)}
        .source-tab{flex:1;padding:.8rem 1rem;border:none;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s;background:transparent;color:var(--text-dim);font-family:inherit}
        .source-tab.active{background:var(--primary);color:#000;box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .source-tab:hover:not(.active){color:var(--text);background:var(--surface2)}

        .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem;margin-bottom:1.5rem}
        .module-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.75rem;user-select:none}
        .module-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
        .module-card.selected{border-color:var(--primary);background:var(--primary-glow)}
        .module-card input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
        .module-card label{cursor:pointer;font-weight:500;font-size:.9rem;line-height:1.3}
        .module-card .q-count{font-size:.75rem;color:var(--text-dim);margin-top:.2rem}

        .controls{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .btn{padding:.7rem 1.2rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:.4rem}
        .btn-primary{background:var(--primary);color:#000}
        .btn-primary:hover{background:#ffb84d;transform:translateY(-1px);box-shadow:0 4px 15px rgba(255,153,0,.3)}
        .btn-submit{background:var(--selected);color:#fff;font-size:1rem;padding:.85rem 2rem}
        .btn-submit:hover:not(:disabled){background:#9333ea;transform:translateY(-1px);box-shadow:0 4px 15px rgba(168,85,247,.4)}
        .btn-submit:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{border-color:var(--primary);color:var(--primary)}
        .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
        .btn-lg{padding:1rem 2.5rem;font-size:1.1rem;border-radius:var(--radius)}

        .start-area{text-align:center;margin-top:2rem;padding:2rem;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
        .start-area .count{font-size:2.5rem;font-weight:800;color:var(--primary);margin:.5rem 0}

        /* QUIZ */
        #quiz-interface{display:none}
        .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
        .progress-wrap{flex:1;min-width:200px}
        .progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:.4rem}
        .progress-fill{height:100%;background:linear-gradient(90deg,#ff9900,#ffb84d);width:0;transition:width .4s ease}
        .progress-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-dim);font-weight:600}
        .stats{display:flex;gap:1rem;font-weight:700;font-size:.95rem}
        .s-ok{color:var(--success)}.s-no{color:var(--error)}

        .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:1.5rem;animation:fadeUp .4s ease}
        @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        .q-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--primary);padding:.3rem .8rem;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:1.2rem}
        .q-text{font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.7}
        .q-note{font-size:.85rem;color:var(--selected);margin-bottom:1.2rem;font-style:italic;padding:.6rem 1rem;background:var(--selected-bg);border-radius:8px;border-left:3px solid var(--selected)}

        /* OPTIONS */
        .opts{display:flex;flex-direction:column;gap:.6rem}
        .opt{text-align:left;padding:1rem 1.2rem;border:2px solid var(--border);border-radius:8px;background:var(--surface2);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:.8rem;font-family:inherit;color:var(--text);line-height:1.5;width:100%}
        .opt:hover:not(:disabled):not(.correct):not(.wrong):not(.selected-opt){border-color:var(--primary);background:var(--primary-glow)}
        .opt .letter{font-weight:700;color:var(--text-dim);min-width:22px;flex-shrink:0;transition:color .2s}
        /* Selected (before submit) */
        .opt.selected-opt{border-color:var(--selected);background:var(--selected-bg)}
        .opt.selected-opt .letter{color:var(--selected)}
        /* After submit */
        .opt.correct{border-color:var(--success);background:var(--success-bg)}
        .opt.correct .letter{color:var(--success)}
        .opt.wrong{border-color:var(--error);background:var(--error-bg)}
        .opt.wrong .letter{color:var(--error)}
        .opt:disabled{cursor:default}
        .opt.dimmed{opacity:.45}

        /* SUBMIT & NEXT */
        #submit-area{margin-top:1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
        #submit-area .hint{font-size:.82rem;color:var(--text-dim);font-style:italic}
        .explain{display:none;margin-top:1.5rem;padding:1.4rem;border-radius:10px;background:var(--info-bg);border-left:4px solid var(--info);animation:fadeUp .4s ease}
        .explain h4{color:var(--info);margin-bottom:.6rem;font-size:.95rem;display:flex;align-items:center;gap:.4rem}
        .explain p{color:var(--text-dim);font-size:.92rem;line-height:1.8}
        .correct-label{background:var(--success-bg);border:1px solid var(--success);color:var(--success);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}
        .wrong-label{background:var(--error-bg);border:1px solid var(--error);color:var(--error);padding:.4rem .9rem;border-radius:6px;font-size:.82rem;font-weight:700;display:inline-block;margin-bottom:.7rem}

        .next-area{display:none;text-align:right;margin-top:1.2rem;animation:fadeUp .3s ease}

        /* RESULTS */
        #results{display:none}
        .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:3rem 2rem;text-align:center}
        .result-circle{width:150px;height:150px;border-radius:50%;border:6px solid var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2.5rem;font-weight:800;color:var(--primary);box-shadow:0 0 40px rgba(255,153,0,.2)}
        .result-card h2{color:var(--text);margin-bottom:1rem;font-size:1.4rem}
        .result-card .detail{color:var(--text-dim);font-size:1.1rem;margin-bottom:2rem}
        .result-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}

        @media(max-width:600px){
            .container{padding:1rem .75rem}
            .module-grid{grid-template-columns:1fr}
            .q-card{padding:1.5rem}
            .quiz-top{flex-direction:column;align-items:stretch}
        }
    </style>
</head>
<body>
<div class="header">
    <h1>☁️ AWS Academy Quiz</h1>
    <p>Hệ thống ôn tập Giữa kỳ — Module 2 đến 13</p>
</div>
<div class="container">

    <!-- DASHBOARD -->
    <div id="dashboard">
        <h3 class="section-title">Nguồn Câu Hỏi</h3>
        <div class="source-tabs">
            <button class="source-tab active" onclick="setSource('original')">📚 120 Câu Gốc (Knowledge Check)</button>
            <button class="source-tab" onclick="setSource('extra')">🧠 120 Câu Mở Rộng (AI Tạo)</button>
        </div>
        <h3 class="section-title">Chọn Module</h3>
        <div class="controls">
            <button class="btn btn-outline" onclick="toggleAll(true)">✅ Chọn tất cả</button>
            <button class="btn btn-outline" onclick="toggleAll(false)">❌ Bỏ chọn</button>
        </div>
        <div class="module-grid" id="module-grid"></div>
        <div class="start-area">
            <p style="color:var(--text-dim)">Số câu hỏi đã chọn</p>
            <div class="count" id="sel-count">0</div>
            <button class="btn btn-primary btn-lg" id="start-btn" onclick="startQuiz()" disabled>🚀 BẮT ĐẦU LÀM BÀI</button>
        </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-interface">
        <div class="quiz-top">
            <button class="btn btn-outline" onclick="exitQuiz()">← Thoát</button>
            <div class="progress-wrap">
                <div class="progress-label"><span>Tiến độ</span><span id="prog-txt">1/10</span></div>
                <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
            </div>
            <div class="stats">
                <span class="s-ok">✓ <span id="c-ok">0</span></span>
                <span class="s-no">✗ <span id="c-no">0</span></span>
            </div>
        </div>

        <div class="q-card">
            <div class="q-tag" id="q-tag">Module X</div>
            <div class="q-text" id="q-text"></div>
            <div class="q-note" id="q-note"></div>
            <div class="opts" id="q-opts"></div>

            <div id="submit-area">
                <button class="btn btn-submit" id="submit-btn" onclick="submitAnswer()" disabled>
                    ✅ Nộp bài
                </button>
                <span class="hint" id="submit-hint"></span>
            </div>

            <div class="explain" id="q-exp">
                <div id="q-result-label"></div>
                <h4>💡 Giải thích chi tiết:</h4>
                <p id="q-exp-txt"></p>
            </div>

            <div class="next-area" id="next-area">
                <button class="btn btn-primary" onclick="nextQ()">Câu tiếp theo →</button>
            </div>
        </div>
    </div>

    <!-- RESULTS -->
    <div id="results">
        <div class="result-card">
            <h2>🎉 Hoàn thành bài kiểm tra!</h2>
            <div class="result-circle"><span id="r-pct">0%</span></div>
            <p class="detail">Bạn trả lời đúng <span id="r-ok" class="s-ok">0</span> / <span id="r-total">0</span> câu hỏi.</p>
            <div class="result-btns">
                <button class="btn btn-outline" onclick="exitQuiz()">🏠 Về trang chủ</button>
                <button class="btn btn-primary" onclick="restartQuiz()">🔄 Làm lại bộ đề này</button>
            </div>
        </div>
    </div>

</div>
<script>const ORIGINAL_DATA=[{id:2,title:"Cloud Architecture",questions:[{t:"Câu 1. Định nghĩa nào sau đây mô tả đúng nhất về kiến trúc đám mây?",o:["A. Kết hợp phần mềm và thành phần frontend/backend để tạo dịch vụ web có tính sẵn sàng cao và khả năng mở rộng đáp ứng nhu cầu tổ chức","B. Di chuyển trung tâm dữ liệu tại chỗ sang trung tâm dữ liệu có thể truy cập qua internet do nhà cung cấp quản lý","C. Áp dụng các đặc điểm của đám mây vào giải pháp sử dụng dịch vụ và tính năng đám mây để đáp ứng yêu cầu kỹ thuật và kinh doanh","D. Thiết kế ứng dụng trên hạ tầng CNTT dùng chung dựa trên đám mây bằng máy ảo và kho dữ liệu chịu lỗi"],a:"C",e:""},{t:"Câu 2. AWS Well-Architected Framework có sáu trụ cột. Ba trụ cột là bảo mật, xuất sắc vận hành và tính bền vững. Hai trụ cột nào còn lại? (Chọn HAI.)",o:["A. Quyền riêng tư","B. Quản trị","C. Quản lý rủi ro","D. Độ tin cậy (Reliability)","E. Tối ưu chi phí (Cost optimization)"],a:"D, E",e:""},{t:"Câu 3. Những hành động nào phù hợp với trụ cột xuất sắc vận hành của AWS Well-Architected Framework? (Chọn HAI.)",o:["A. Lập kế hoạch và quản lý toàn bộ vòng đời tài sản phần cứng","B. Xem xét và cải tiến quy trình, thủ tục liên tục","C. Đánh giá cơ cấu tổ chức và vai trò để xác định khoảng cách kỹ năng","D. Đảm bảo nhân viên vận hành ghi lại các thay đổi đối với hạ tầng","E. Áp dụng nguyên tắc kỹ thuật phần mềm và phương pháp luận vào hạ tầng dưới dạng mã (infrastructure as code)"],a:"B, E",e:""},{t:"Câu 4. Một ứng dụng cần tầng web frontend gồm nhiều máy chủ giao tiếp với tầng ứng dụng backend gồm nhiều máy chủ. Thiết kế nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Gán một máy chủ ứng dụng riêng và kết nối riêng cho từng máy chủ web","B. Thiết kế tầng web giao tiếp với tầng ứng dụng thông qua dịch vụ Elastic Load Balancing (ELB)","C. Tạo nhiều instance kết hợp cả frontend web và backend ứng dụng trong cùng một instance","D. Tạo mạng lưới đầy đủ giữa tầng web và tầng ứng dụng để mỗi máy chủ web có thể giao tiếp trực tiếp với mọi máy chủ ứng dụng"],a:"B",e:""},{t:"Câu 5. Một kiến trúc sư giải pháp đang xây dựng quy trình xử sự cố máy chủ. Quy trình nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Amazon CloudWatch phát hiện sự cố hệ thống, thông báo cho quản trị viên, người đó cấp phép máy chủ mới qua AWS Management Console","B. Nhân viên vận hành phát hiện sự cố, thông báo cho quản trị viên, người đó cấp phép máy chủ mới qua AWS Management Console","C. Nhân viên vận hành phát hiện sự cố, khởi động tự động hóa để cấp phép máy chủ mới","D. Amazon CloudWatch phát hiện sự cố hệ thống, tự động khởi động quy trình cấp phép máy chủ mới"],a:"D",e:""},{t:"Câu 6. Một công ty đang cân nhắc chuyển trung tâm dữ liệu tại chỗ lên đám mây với mục tiêu chính là tăng hiệu quả chi phí. Phương án nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Cấp phép các máy chủ khi cần và dừng dịch vụ khi không sử dụng","B. Cấp phép một số máy chủ trên đám mây và đảm bảo các máy chủ chạy 24/7","C. Sao chép lại trung tâm dữ liệu tại chỗ trên đám mây","D. Duy trì trung tâm dữ liệu tại chỗ càng lâu càng tốt"],a:"A",e:""},{t:"Câu 7. Một công ty lưu trữ dữ liệu chỉ đọc trên Amazon S3. Phần lớn người dùng ở cùng quốc gia với trụ sở công ty, một số người dùng ở khắp nơi trên thế giới. Quyết định thiết kế nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Sử dụng một bucket ở AWS Region gần nhất với trụ sở công ty. Tất cả người dùng truy cập dữ liệu qua Amazon CloudFront","B. Sử dụng một bucket ở Region gần nhất với trụ sở công ty","C. Sử dụng một bucket ở Region có độ trễ trung bình thấp nhất cho tất cả người dùng","D. Sao chép các object sang bucket ở nhiều AWS Region trên thế giới, người dùng truy cập bucket gần họ nhất"],a:"A",e:""},{t:"Câu 8. Một tư vấn viên cần truy cập một object lớn trong S3 bucket trong một ngày. Phương pháp cấp quyền truy cập nào phù hợp nhất với thực tiễn tốt nhất của AWS?",o:["A. Tạo một presigned URL trỏ đến object với thời hạn 24 giờ và cung cấp cho tư vấn viên","B. Sao chép object sang bucket S3 mới, bật quyền truy cập công khai, lấy URL và cung cấp cho tư vấn viên","C. Tạo tài khoản người dùng cho tư vấn viên, cấp quyền truy cập S3 bucket qua AWS Management Console","D. Bật quyền truy cập công khai trên S3 bucket và cung cấp URL object cho tư vấn viên"],a:"A",e:""},{t:"Câu 9. Những yếu tố nào là cân nhắc chính ảnh hưởng đến việc chọn AWS Region? (Chọn HAI.)",o:["A. Bảo vệ khỏi thiên tai cục bộ","B. Tuân thủ luật pháp và quy định","C. Kiểm soát bảo mật và truy cập","D. Giảm độ trễ cho người dùng cuối","E. Khả năng phục hồi ứng dụng khi hệ thống gặp sự cố"],a:"B, D",e:""},{t:"Câu 10. Những yếu tố nào là cân nhắc chính ảnh hưởng đến việc chọn Availability Zone? (Chọn HAI.)",o:["A. Giảm độ trễ cho người dùng cuối","B. Tuân thủ luật pháp và quy định","C. Khả năng phục hồi ứng dụng khi hệ thống gặp sự cố","D. Kiểm soát bảo mật và truy cập","E. Bảo vệ khỏi thiên tai cục bộ"],a:"C, E",e:""}]},{id:3,title:"Security",questions:[{t:"Câu 1. Phát biểu nào phản ánh nguyên tắc thiết kế của trụ cột bảo mật trong Well-Architected Framework?",o:["A. Không triển khai giải pháp lên môi trường production cho đến khi chắc chắn không còn rủi ro bảo mật nào","B. Phân quyền quản lý đặc quyền","C. Đảm bảo nhân viên chủ động theo dõi các rủi ro tiềm ẩn theo cách thủ công","D. Áp dụng bảo mật ở tất cả các tầng của kiến trúc"],a:"D",e:""},{t:"Câu 2. Những phát biểu nào về trách nhiệm là chính xác dựa trên mô hình trách nhiệm chung của AWS? (Chọn HAI.)",o:["A. AWS chịu trách nhiệm về cấu hình tường lửa dựa trên máy chủ (host-based firewall)","B. Khách hàng chịu trách nhiệm quản lý dữ liệu người dùng của họ","C. Khách hàng chịu trách nhiệm cài đặt, bảo trì và ngừng sử dụng phần cứng tại trung tâm dữ liệu AWS","D. AWS chịu trách nhiệm về cấu hình security group","E. AWS chịu trách nhiệm về bảo mật vật lý của các trung tâm dữ liệu"],a:"B, E",e:""},{t:"Câu 3. Những đặc điểm nào thuộc về nguyên tắc đặc quyền tối thiểu (least privilege)? (Chọn HAI.)",o:["A. Sử dụng mã hóa","B. Chỉ cấp quyền truy cập khi cần thiết","C. Giám sát các hành động và thay đổi","D. Xây dựng chính sách bảo mật giới hạn quyền truy cập cho các tác vụ cụ thể","E. Luôn sử dụng nhóm (groups)"],a:"B, D",e:""},{t:"Câu 4. Phát biểu nào về AWS Identity and Access Management (IAM) là đúng?",o:["A. IAM cung cấp nhật ký kiểm tra về ai đã thực hiện hành động, hành động nào và thời điểm thực hiện","B. IAM cung cấp lớp bảo mật bổ sung bằng cách phát hiện bất thường trên tài nguyên","C. Với IAM, bạn có thể quản lý mã hóa cho các mục yêu cầu mã hóa khi lưu trữ","D. Với IAM, bạn có thể cấp quyền truy cập chi tiết vào tài nguyên cho các principal"],a:"D",e:""},{t:"Câu 5. Những phát biểu nào mô tả đúng về IAM roles? (Chọn HAI.)",o:["A. Chúng được gắn riêng cho một cá nhân cụ thể","B. Chúng cung cấp thông tin xác thực bảo mật vĩnh viễn","C. Cá nhân, ứng dụng và dịch vụ đều có thể đảm nhận (assume) các role","D. Chúng chỉ có thể được sử dụng bởi tài khoản của người tạo ra role đó","E. Chúng cung cấp thông tin xác thực bảo mật tạm thời"],a:"C, E",e:""},{t:"Câu 6. Phát biểu nào phản ánh thực tiễn tốt nhất cho root user trên tài khoản AWS?",o:["A. Để tránh bị khóa tài khoản, không bật xác thực đa yếu tố (MFA) cho root account","B. Tạo một admin user và thực hiện hầu hết các tác vụ quản trị bằng user đó thay vì root user","C. Tạo hai root user với thông tin xác thực riêng biệt và phân phối cho hai cá nhân khác nhau","D. Xóa các quyền không cần thiết khỏi tài khoản root user"],a:"B",e:""},{t:"Câu 7. AWS Identity and Access Management (IAM) đánh giá một policy như thế nào?",o:["A. Một câu lệnh deny tường minh không ghi đè câu lệnh allow tường minh","B. Nó kiểm tra các câu lệnh allow tường minh trước khi kiểm tra các câu lệnh deny tường minh","C. Nó kiểm tra các câu lệnh deny tường minh trước khi kiểm tra các câu lệnh allow tường minh","D. Nếu policy không có câu lệnh deny hay allow tường minh nào, người dùng mặc định có quyền truy cập"],a:"C",e:""},{t:"Câu 8. Phát biểu nào về các IAM policy là chính xác?",o:["A. Resource-based policy cho phép truy cập theo mặc định","B. Identity-based policy được gắn vào user, group hoặc role","C. Identity-based policy chỉ có thể được gắn vào một thực thể duy nhất","D. Resource-based policy được gắn vào user, group hoặc role"],a:"B",e:""},{t:"Câu 9. Phần tử nào trong IAM policy chứa thông tin về việc cho phép hay từ chối một yêu cầu?",o:["A. Condition","B. Principal","C. Effect","D. Action"],a:"C",e:""},{t:"Câu 10. Tùy chọn nào mô tả chính xác phần tử statement trong IAM policy?",o:["A. Phần tử statement là phần tùy chọn trong IAM policy","B. Một policy chỉ có thể có một phần tử statement","C. Phần tử statement không áp dụng cho identity-based policy","D. Phần tử statement chứa các phần tử khác cùng nhau xác định những gì được phép hoặc bị từ chối"],a:"D",e:""}]},{id:4,title:"Storage",questions:[{t:"Câu 1. Do sáp nhập công ty, một kỹ sư dữ liệu cần tăng dung lượng lưu trữ object. Họ chưa biết cần bao nhiêu dung lượng và muốn một dịch vụ có khả năng mở rộng cao, lưu trữ được dữ liệu phi cấu trúc, bán cấu trúc và có cấu trúc. Dịch vụ nào tiết kiệm chi phí nhất?",o:["A. Amazon S3","B. Amazon Elastic Block Store (Amazon EBS)","C. AWS Storage Gateway","D. Amazon RDS"],a:"A",e:""},{t:"Câu 2. Amazon S3 phù hợp với trường hợp sử dụng nào?",o:["A. Vị trí lưu trữ có thể truy cập qua internet cho các tệp video mà website bên ngoài có thể truy cập","B. Kho dữ liệu cho business intelligence","C. Lưu trữ theo giờ cho các tệp tạm thời được truy cập thường xuyên","D. Dữ liệu sổ cái được cập nhật và truy cập thường xuyên"],a:"A",e:""},{t:"Câu 3. Một công ty muốn dùng Amazon S3 để host website thay vì web server truyền thống. Amazon S3 hỗ trợ những loại nội dung nào cho static web hosting? (Chọn BA.)",o:["A. Dynamic HTML files","B. Client-side scripts","C. Server-side scripts","D. Database engine","E. Video and sound files","F. HTML files and image files"],a:"B, E, F",e:""},{t:"Câu 4. Một công ty muốn dùng S3 bucket để lưu trữ dữ liệu nhạy cảm. Những hành động nào có thể thực hiện để bảo vệ dữ liệu? (Chọn HAI.)",o:["A. Bật mã hóa phía máy chủ trên S3 bucket sau khi tải dữ liệu nhạy cảm lên","B. Bật mã hóa phía máy chủ trên S3 bucket trước khi tải dữ liệu nhạy cảm lên","C. Sử dụng SFTP để kết nối trực tiếp với Amazon S3","D. Sử dụng mã hóa phía máy khách để bảo vệ dữ liệu trong quá trình truyền trước khi gửi lên Amazon S3","E. Tải tệp không mã hóa lên Amazon S3 vì Amazon S3 tự động mã hóa tệp theo mặc định"],a:"B, D",e:""},{t:"Câu 5. Một công ty cần tạo nơi lưu trữ chung cho các tệp dùng chung. Amazon S3 hỗ trợ những yêu cầu nào? (Chọn HAI.)",o:["A. Đính kèm bình luận vào tệp","B. Khóa tệp để chỉ một người có thể chỉnh sửa tại một thời điểm","C. So sánh nội dung giữa các tệp","D. Khôi phục các tệp đã xóa","E. Duy trì các phiên bản khác nhau của tệp"],a:"D, E",e:""},{t:"Câu 6. Nhóm dịch vụ khách hàng truy cập dữ liệu hồ sơ hàng ngày trong tối đa 30 ngày. Hồ sơ có thể được mở lại và cần truy cập ngay trong vòng 1 năm sau khi đóng. Hồ sơ mở lại cần 2 ngày để xử lý. Giải pháp nào đáp ứng yêu cầu và tiết kiệm chi phí nhất?",o:["A. Lưu dữ liệu trong S3 Standard, dùng lifecycle policy chuyển sang S3 Glacier Flexible Retrieval sau 30 ngày","B. Lưu toàn bộ dữ liệu trong S3 Standard để luôn sẵn sàng truy cập","C. Lưu dữ liệu trong S3 Standard, dùng lifecycle policy chuyển sang S3 Standard-Infrequent Access (S3 Standard-IA) sau 30 ngày","D. Lưu dữ liệu trong S3 Intelligent-Tiering để tự động chuyển dữ liệu giữa các tầng dựa trên tần suất truy cập"],a:"C",e:""},{t:"Câu 7. Tùy chọn nào tận dụng các edge location của Amazon CloudFront để truyền tệp qua khoảng cách xa đến S3 bucket?",o:["A. AWS SDKs","B. AWS Transfer Family","C. Amazon S3 Transfer Acceleration","D. Amazon S3 REST API"],a:"C",e:""},{t:"Câu 8. Một nhà sản xuất video thường xuyên phải truyền nhiều tệp video lên Amazon S3, dung lượng từ 100–700 MB. Kết nối internet không ổn định khiến một số lần tải lên bị thất bại. Giải pháp nào nhanh nhất, đáng tin cậy nhất và tiết kiệm chi phí nhất?",o:["A. Amazon S3 Transfer Acceleration","B. AWS Management Console","C. Amazon S3 multipart uploads","D. AWS Transfer Family"],a:"C",e:""},{t:"Câu 9. Storage class nào của Amazon S3 được thiết kế cho bản sao lưu dữ liệu tại chỗ (on-premises) hoặc dữ liệu có thể dễ dàng tạo lại?",o:["A. S3 One Zone-Infrequent Access (S3 One Zone-IA)","B. S3 Intelligent-Tiering","C. S3 Glacier Instant Retrieval","D. S3 Standard-Infrequent Access (S3 Standard-IA)"],a:"A",e:""},{t:"Câu 10. Một công ty cần lưu trữ hồ sơ cho mục đích quy định trong 7 năm. Các hồ sơ này hiếm khi được truy cập (một hoặc hai lần mỗi năm). Storage class nào của Amazon S3 có chi phí thấp nhất?",o:["A. S3 Glacier Deep Archive","B. S3 One Zone-Infrequent Access (S3 One Zone-IA)","C. S3 Intelligent-Tiering","D. S3 Standard-Infrequent Access (S3 Standard-IA)"],a:"A",e:""}]},{id:5,title:"Compute",questions:[{t:"Câu 1. Những thuộc tính nào là lý do để chọn Amazon EC2? (Chọn HAI.)",o:["A. Toàn quyền kiểm soát tài nguyên điện toán","B. Khả năng chạy bất kỳ loại workload nào","C. AWS quản lý các bản vá hệ điều hành (OS)","D. AWS quản lý bảo mật hệ điều hành (OS)","E. Khả năng chạy ứng dụng serverless"],a:"A, B",e:""},{t:"Câu 2. Những lợi ích nào của việc sử dụng Amazon Machine Image (AMI)? (Chọn BA.)",o:["A. Cập nhật hệ thống bằng cách vá AMI","B. Khởi chạy các instance với cùng cấu hình","C. Bán hoặc chia sẻ các giải pháp phần mềm được đóng gói dưới dạng AMI","D. Tự động hóa cài đặt security group cho các instance","E. Sử dụng AMI làm bản sao lưu máy chủ cho các Amazon EC2 instance","F. Di chuyển dữ liệu từ on-premises sang Amazon EC2 instance"],a:"B, C, E",e:""},{t:"Câu 3. Một quản trị viên hệ thống cần thay đổi loại instance của nhiều Amazon EC2 instance đang chạy. Các instance được khởi chạy bằng cả AMI được hỗ trợ bởi Amazon EBS và AMI được hỗ trợ bởi instance store. Phương pháp nào hợp lệ để thay đổi loại instance?",o:["A. Dừng instance-store-backed instance, thay đổi loại instance và khởi động lại","B. Dừng Amazon EBS-backed instance, thay đổi loại instance và khởi động lại","C. Thay đổi loại instance của instance-store-backed instance mà không cần dừng","D. Thay đổi loại instance của Amazon EBS-backed instance mà không cần dừng"],a:"B",e:""},{t:"Câu 4. Một workload yêu cầu quyền truy cập đọc/ghi cao vào các tập dữ liệu cục bộ lớn. Loại instance nào hoạt động TỐT NHẤT cho workload này? (Chọn HAI.)",o:["A. Accelerated computing","B. General purpose","C. Memory optimized","D. Storage optimized","E. Compute optimized"],a:"D, E",e:""},{t:"Câu 5. Một ứng dụng cần địa chỉ MAC của EC2 instance host. Kiến trúc sử dụng AWS Auto Scaling group để tự động khởi chạy và chấm dứt instance. Cách nào TỐT NHẤT để ứng dụng lấy địa chỉ MAC?",o:["A. Sử dụng user data của mỗi instance để truy cập địa chỉ MAC thông qua instance metadata","B. Ghi địa chỉ MAC vào file cấu hình ứng dụng của mỗi instance","C. Đưa địa chỉ MAC vào AMI dùng để khởi chạy tất cả instance trong Auto Scaling group","D. Đưa địa chỉ MAC vào AMI tùy chỉnh cho từng instance trong Auto Scaling group"],a:"A",e:""},{t:"Câu 6. Những phát biểu nào về user data là đúng? (Chọn HAI.)",o:["A. Theo mặc định, user data chỉ chạy một lần khi instance được khởi chạy lần đầu","B. Theo mặc định, user data chạy sau mỗi lần khởi động lại instance","C. User data không thể chạy khi instance đang dừng","D. Cloud architect phải chạy lệnh /var/lib/cloud/instance/scripts/part-001 để user data script chạy lại","E. Cloud architect phải xóa file config_user_scripts để chạy lại user data script"],a:"A, C",e:""},{t:"Câu 7. Một workload giao dịch trên Amazon EC2 instance thực hiện số lượng lớn các thao tác đọc/ghi thường xuyên. Loại Amazon EBS volume nào PHÙ HỢP NHẤT?",o:["A. General Purpose SSD","B. Throughput Optimized HDD","C. Cold HDD","D. Provisioned IOPS SSD"],a:"D",e:""},{t:"Câu 8. Có thể tạo NFS share trên Linux instance được hỗ trợ bởi Amazon EBS bằng cách cài đặt và cấu hình NFS server. Những ưu điểm nào Amazon EFS cung cấp so với giải pháp này? (Chọn HAI.)",o:["A. Tính sẵn sàng cao (High availability)","B. Tính nhất quán mạnh (Strong consistency)","C. Không cần sao lưu","D. Khóa file (File locking)","E. Tự động mở rộng (Automatic scaling)"],a:"A, E",e:""},{t:"Câu 9. Amazon FSx for Windows File Server cung cấp tính năng gì?",o:["A. Giải pháp sao lưu cho Windows file server tại chỗ","B. Amazon management agent cho Windows file server","C. Microsoft Active Directory server cho Windows file server","D. Windows file server được quản lý hoàn toàn (Fully managed)"],a:"D",e:""},{t:"Câu 10. Những mô tả nào về các tùy chọn định giá Amazon EC2 là đúng? (Chọn HAI.)",o:["A. Với On-Demand Instances, khách hàng trả tiền theo thời gian sử dụng năng lực tính toán mà không có cam kết dài hạn","B. Spot Instances cung cấp năng lực tính toán dư thừa với giá chiết khấu và có thể bị gián đoạn","C. Dedicated Hosts là các máy chủ được dành riêng cho một mục đích, chẳng hạn như tường lửa","D. Reserved Instances là các máy chủ vật lý được dành riêng cho khách hàng sử dụng","E. Savings Plans là công cụ lập ngân sách giúp khách hàng quản lý chi phí Amazon EC2"],a:"A, B",e:""}]},{id:6,title:"Database",questions:[{t:"Câu 1. Phát biểu nào so sánh dịch vụ cơ sở dữ liệu do AWS quản lý với cơ sở dữ liệu trên Amazon EC2 instance là đúng?",o:["A. AWS quản lý các bản vá cơ sở dữ liệu cho database trên dịch vụ cơ sở dữ liệu được quản lý","B. Không cần cấu hình sao lưu cho database trên dịch vụ cơ sở dữ liệu được quản lý","C. AWS quản lý các bản vá hệ điều hành cho database trên EC2 instance","D. Không cần cấu hình sao lưu cho database trên EC2 instance"],a:"A",e:""},{t:"Câu 2. Một công ty khởi nghiệp nhỏ đang chọn dịch vụ cơ sở dữ liệu cho hệ thống đăng ký của website đào tạo trực tuyến. Những yêu cầu nào có thể khiến họ chọn Amazon RDS thay vì Amazon DynamoDB? (Chọn HAI.)",o:["A. Dữ liệu có cấu trúc cao","B. Dữ liệu học viên, khóa học và đăng ký được lưu trong nhiều bảng khác nhau","C. Dữ liệu và giao dịch phải được mã hóa để bảo vệ thông tin cá nhân","D. Hệ thống đăng ký phải có tính sẵn sàng cao","E. Dữ liệu phải được sao lưu trong trường hợp xảy ra thảm họa"],a:"A, B",e:""},{t:"Câu 3. Một công ty khởi nghiệp đang xây dựng hệ thống quản lý đơn hàng với giao diện web và cần cơ sở dữ liệu giao dịch theo thời gian thực. Dịch vụ nào phù hợp nhất?",o:["A. Amazon DynamoDB","B. Amazon Redshift","C. Amazon Neptune","D. Amazon DocumentDB (with MongoDB compatibility)"],a:"A",e:""},{t:"Câu 4. Một công ty game nhỏ đang thiết kế game trực tuyến cho phép hàng nghìn người chơi tạo vật phẩm trong game. Thiết kế hiện tại dùng MySQL trên Amazon RDS. Những tính năng nào của vật phẩm trong game có thể khiến Amazon DynamoDB trở thành giải pháp tốt hơn? (Chọn HAI.)",o:["A. Một tập hợp các thuộc tính vật phẩm chung cho tất cả vật phẩm","B. Các thuộc tính vật phẩm không thể đoán trước cho vật phẩm do người chơi tạo","C. Lượng đọc vật phẩm cao và lượng ghi thấp","D. Các vật phẩm trong game chứa dữ liệu nhị phân và có thể vượt quá 700 MB","E. Các vật phẩm trong game có thể được chỉnh sửa bằng dữ liệu từ các bảng khác"],a:"B, C",e:""},{t:"Câu 5. Một tổ chức lo ngại về sự gia tăng gian lận. Dịch vụ nào có thể giúp xây dựng truy vấn cơ sở dữ liệu đồ thị theo thời gian thực để phát hiện gian lận?",o:["A. Amazon RDS","B. Amazon DynamoDB","C. Amazon Redshift","D. Amazon Neptune"],a:"D",e:""},{t:"Câu 6. Một kỹ sư dữ liệu cần host cơ sở dữ liệu Microsoft SQL Server mới trên AWS cho một dự án. Dịch vụ nào có thể dùng để thực hiện điều này?",o:["A. Amazon DynamoDB","B. Amazon Neptune","C. Amazon Aurora","D. Amazon DocumentDB (with MongoDB compatibility)"],a:"C",e:""},{t:"Câu 7. Những kỹ thuật nào nên được sử dụng để bảo mật Amazon RDS? (Chọn BA.)",o:["A. Chính sách IAM để xác định quyền truy cập ở cấp bảng, hàng và cột","B. Virtual private gateway (VGW) để lọc lưu lượng từ các mạng bị hạn chế","C. Amazon VPC gateway endpoint để ngăn lưu lượng đi qua internet","D. Virtual Private Cloud (VPC) để cô lập instance","E. Security group để kiểm soát quyền truy cập mạng vào từng RDS instance","F. Mã hóa khi lưu trữ và khi truyền để bảo vệ dữ liệu nhạy cảm"],a:"D, E, F",e:""},{t:"Câu 8. Những kỹ thuật nào nên được sử dụng để bảo mật Amazon DynamoDB? (Chọn BA.)",o:["A. Chính sách IAM để xác định quyền truy cập ở cấp bảng, mục hoặc thuộc tính","B. VPC để cô lập instance và bảo vệ tường lửa","C. Mã hóa để bảo vệ dữ liệu nhạy cảm","D. Virtual private gateway (VGW) để lọc lưu lượng từ các mạng bị hạn chế","E. Security group để kiểm soát quyền truy cập mạng vào từng instance","F. Amazon VPC gateway endpoint để ngăn lưu lượng đi qua internet"],a:"A, C, F",e:""},{t:"Câu 9. Một công ty muốn di chuyển cơ sở dữ liệu Oracle tại chỗ sang Amazon Aurora MySQL. Quy trình nào mô tả chính xác nhất các bước cấp cao?",o:["A. Dùng AWS SCT để đồng thời chuyển đổi schema và di chuyển dữ liệu","B. Dùng AWS DMS để di chuyển dữ liệu, sau đó dùng AWS SCT để chuyển đổi schema","C. Dùng AWS Schema Conversion Tool (AWS SCT) để chuyển đổi schema, sau đó dùng AWS Database Migration Service (AWS DMS) để di chuyển dữ liệu","D. Dùng AWS DMS để di chuyển trực tiếp từ Oracle sang Amazon Aurora MySQL"],a:"C",e:""},{t:"Câu 10. Một cloud architect đang thiết lập ứng dụng dùng Amazon RDS MySQL. Cơ sở dữ liệu phải có tính sẵn sàng cao trên nhiều Availability Zone và AWS Region với thời gian ngừng hoạt động tối thiểu. Họ nên thực hiện như thế nào?",o:["A. Thiết lập RDS MySQL Single-AZ DB instance, cấu hình read replica ở Region khác","B. Thiết lập RDS MySQL Multi-AZ DB instance, cấu hình read replica ở Region khác","C. Thiết lập RDS MySQL Multi-AZ DB instance, cấu hình backup window phù hợp","D. Thiết lập RDS MySQL Single-AZ DB instance, sao chép automated snapshot sang ít nhất một Region khác"],a:"B",e:""}]},{id:7,title:"Networking",questions:[{t:"Câu 1. Định nghĩa nào mô tả đúng virtual private cloud (VPC)?",o:["A. Một mạng ảo được cô lập về mặt logic mà bạn định nghĩa trong AWS Cloud","B. Một dịch vụ được quản lý hoàn toàn giúp mở rộng AWS Cloud đến cơ sở của khách hàng","C. Một mạng riêng ảo (VPN) trong AWS Cloud","D. Một phần mở rộng của mạng on-premises vào AWS"],a:"A",e:""},{t:"Câu 2. Thành phần nào không có quyền truy cập trực tiếp vào internet?",o:["A. NAT gateway bên trong public subnet","B. EC2 instance bên trong public subnet","C. Elastic IP address interface","D. EC2 instance bên trong private subnet"],a:"D",e:""},{t:"Câu 3. VPC của một công ty có khối CIDR 172.16.0.0/21 (2048 địa chỉ). Nó có hai subnet (A và B). Mỗi subnet phải hỗ trợ 100 địa chỉ khả dụng hiện tại, nhưng dự kiến tăng lên tối đa 254 địa chỉ. Sơ đồ địa chỉ subnet nào đáp ứng yêu cầu và tuân theo thực tiễn tốt nhất của AWS?",o:["A. Subnet A: 172.16.0.0/24 (256 địa chỉ) — Subnet B: 172.16.1.0/24 (256 địa chỉ)","B. Subnet A: 172.16.0.0/22 (1024 địa chỉ) — Subnet B: 172.16.4.0/22 (1024 địa chỉ)","C. Subnet A: 172.16.0.0/23 (512 địa chỉ) — Subnet B: 172.16.2.0/23 (512 địa chỉ)","D. Subnet A: 172.16.0.0/25 (128 địa chỉ) — Subnet B: 172.16.0.128/25 (128 địa chỉ)"],a:"C",e:""},{t:"Câu 4. Một một EC2 instance khởi chạy trong VPC có kết nối internet. Các instance này không được truy cập từ internet nhưng phải có khả năng tải xuống bản cập nhật từ internet. Các instance nên được khởi chạy như thế nào?",o:["A. Với Elastic IP address, trong subnet có default route đến internet gateway","B. Không có public IP address, trong subnet có default route đến internet gateway","C. Không có public IP address, trong subnet có default route đến NAT gateway","D. Với public IP address, trong subnet có default route đến internet gateway"],a:"C",e:""},{t:"Câu 5. Một nhóm tư vấn viên cần truy cập vào EC2 instance từ internet trong 3 ngày liên tiếp mỗi tuần. Instance tắt vào những ngày còn lại. Cách nào tốt nhất để gán một địa chỉ IPv4 cố định cho instance?",o:["A. Bật tự động gán địa chỉ cho subnet","B. Bật tự động gán địa chỉ cho EC2 instance","C. Gán địa chỉ IP trong cấu hình khởi động hệ điều hành (OS)","D. Liên kết một Elastic IP address với EC2 instance"],a:"D",e:""},{t:"Câu 6. Một ứng dụng sử dụng bastion host để cho phép truy cập vào các EC2 instance trong private subnet. Những cấu hình security group nào cho phép truy cập SSH từ source IP đến EC2 instance? (Chọn HAI.)",o:["A. Thêm rule vào security group của EC2 instance trong private subnet để cho phép return traffic đến bastion host security group","B. Thêm rule vào bastion host security group để từ chối toàn bộ traffic từ internet","C. Thêm rule vào bastion host security group để cho phép return traffic đến source IP của bạn","D. Thêm rule vào security group của EC2 instance để cho phép traffic từ bastion host security group trên cổng 22","E. Thêm rule vào bastion host security group để cho phép traffic trên cổng 22 từ source IP của bạn"],a:"D, E",e:""},{t:"Câu 7. Một giải pháp trong VPC cần một subnet với quyền truy cập hạn chế đến các địa chỉ internet cụ thể. Kiến trúc sư có thể cấu hình network ACL như thế nào để giới hạn traffic đến và từ EC2 instance trong subnet?",o:["A. Thêm rule vào default network ACL để cho phép traffic từ và đến các địa chỉ internet được phép","B. Thêm rule vào subnet custom network ACL để cho phép traffic từ và đến các địa chỉ internet được phép, từ chối tất cả traffic còn lại","C. Thêm rule vào subnet custom network ACL để cho phép traffic từ và đến các địa chỉ internet được phép","D. Thêm rule vào default network ACL để cho phép traffic từ và đến các địa chỉ internet được phép, từ chối tất cả traffic còn lại"],a:"B",e:""},{t:"Câu 8. Những hành động nào là thực tiễn tốt nhất khi thiết kế VPC? (Chọn BA.)",o:["A. Tạo một subnet cho mỗi Availability Zone cho từng nhóm host có yêu cầu định tuyến riêng biệt","B. Dự trữ một phần không gian địa chỉ cho việc sử dụng trong tương lai","C. Khớp kích thước khối CIDR của VPC với số lượng host cần thiết cho workload","D. Sử dụng cùng khối CIDR với mạng on-premises","E. Sử dụng cùng khối CIDR cho các subnet ở các AZ khác nhau trong cùng Auto Scaling group","F. Chia đều dải địa chỉ mạng VPC trên tất cả các Availability Zone hiện có"],a:"A, B, C",e:""},{t:"Câu 9. VPC flow logs có thể được gửi đến những nơi nào? (Chọn BA.)",o:["A. Amazon S3 bucket","B. Amazon CloudWatch","C. AWS Management Console","D. Amazon Kinesis Data Firehose","E. Amazon Athena","F. Amazon OpenSearch Service"],a:"A, B, D",e:""},{t:"Câu 10. Một EC2 instance cần kết nối đến Amazon S3 bucket. Thành phần nào cung cấp kết nối này mà không tốn thêm phí và không giới hạn thông lượng gói tin?",o:["A. Gateway VPC endpoint","B. Public region access point","C. Gateway Load Balancer endpoint","D. Interface VPC endpoint"],a:"A",e:""}]},{id:8,title:"Advanced Networking",questions:[{t:"Câu 1. Cách đơn giản nhất để kết nối 100 VPC lại với nhau là gì?",o:["A. Kết nối từng VPC với tất cả các VPC khác bằng VPC peering","B. Tạo mạng hub-and-spoke bằng AWS VPN CloudHub","C. Kết nối chuỗi các VPC lại với nhau bằng VPC peering","D. Kết nối các VPC với AWS Transit Gateway"],a:"D",e:""},{t:"Câu 2. Một công ty cần lưu lượng mạng lưu thông giữa một tài khoản AWS ở một Region sang tài khoản khác ở Region khác. Họ nên thiết lập gì giữa các transit gateway ở mỗi Region?",o:["A. AWS Direct Connect","B. Transit gateway peering attachment","C. AWS Site-to-Site VPN","D. AWS PrivateLink"],a:"B",e:""},{t:"Câu 3. Một công ty có hai VPC. VPC A có khối CIDR 10.1.0.0/16, VPC B có khối CIDR 10.2.0.0/16. Cả hai đều thuộc cùng tài khoản AWS. Cách đơn giản nhất để kết nối hai VPC để định tuyến toàn bộ traffic giữa chúng là gì?",o:["A. AWS Site-to-Site VPN","B. VPC peering","C. AWS Direct Connect","D. VPC endpoints"],a:"B",e:""},{t:"Câu 4. Các hệ thống trong subnet bảo mật của VPC cần truy cập một bucket trong Amazon S3. Những giải pháp nào ngăn traffic đi qua internet? (Chọn HAI.)",o:["A. Tạo VPC gateway endpoint cho Amazon S3","B. Sử dụng VPC interface endpoints","C. Sử dụng địa chỉ IP private của Amazon S3","D. Tạo kết nối VPC peering đến Amazon S3","E. Sử dụng địa chỉ IP private cho hệ thống"],a:"A, B",e:""},{t:"Câu 5. Một công ty có ba VPC (A, B, C) với các khối CIDR không trùng nhau. A và C đều có kết nối VPC peering riêng với B, nhưng A không thể giao tiếp với C. Cách đơn giản và tiết kiệm chi phí nhất để cho phép A và C giao tiếp đầy đủ với nhau là gì?",o:["A. Thêm route vào B để cho phép traffic giữa A và C đi qua B","B. Thêm kết nối peering giữa A và C, định tuyến traffic giữa A và C qua kết nối peering đó","C. Liên kết cả ba VPC qua một transit VPC và định tuyến toàn bộ traffic qua đó","D. Tạo VPC endpoint trong A và C cho các host riêng lẻ cần giao tiếp với nhau"],a:"B",e:""},{t:"Câu 6. Do thiên tai, một công ty đã di chuyển trung tâm dữ liệu phụ đến cơ sở tạm thời có kết nối internet. Họ cần kết nối bảo mật với VPC và phải hoạt động được sớm nhất có thể. Trung tâm dữ liệu sẽ di chuyển lại sau 2 tuần. Tùy chọn nào đáp ứng yêu cầu?",o:["A. AWS Site-to-Site VPN","B. AWS Direct Connect","C. VPC endpoints","D. VPC peering"],a:"A",e:""},{t:"Câu 7. Một công ty lo ngại về sự gián đoạn internet. Họ muốn định tuyến traffic hiệu quả từ mạng on-premises đến AWS edge location gần thiết bị customer gateway của họ nhất. Họ nên dùng gì?",o:["A. AWS Global Accelerator","B. AWS Direct Connect","C. AWS Transit Gateway","D. AWS VPN CloudHub"],a:"B",e:""},{t:"Câu 8. Một công ty đang triển khai hệ thống sao lưu các hệ thống on-premises lên AWS. Phương thức kết nối mạng nào cung cấp hiệu suất nhất quán nhất?",o:["A. VPC peering","B. AWS Direct Connect","C. AWS Site-to-Site VPN","D. VPC endpoints"],a:"B",e:""},{t:"Câu 9. Một công ty sử dụng một kết nối AWS Direct Connect duy nhất giữa mạng on-premises và VPC. Họ muốn đảm bảo tính sẵn sàng cao bằng cách thêm kết nối dự phòng. Phương thức nào tiết kiệm chi phí nhất?",o:["A. Thêm một kết nối Direct Connect khác qua một Direct Connect location khác","B. Kết nối AWS Client VPN theo yêu cầu qua internet","C. Thêm một kết nối Direct Connect khác qua cùng Direct Connect location","D. Kết nối AWS Site-to-Site VPN theo yêu cầu qua internet"],a:"D",e:""},{t:"Câu 10. Một công ty đang kết nối VPC với nhiều trung tâm dữ liệu on-premises bằng VPN. Triển khai nào đảm bảo khả năng phục hồi và yêu cầu băng thông ổn định?",o:["A. Triển khai Direct Connect làm kết nối chính và dùng VPN làm kết nối dự phòng từ mỗi trung tâm dữ liệu","B. Triển khai AWS Transit Gateway để kết nối với từng trung tâm dữ liệu on-premises","C. Sử dụng mô hình mesh nhiều-nhiều như Amazon VPC peering","D. Thiết lập nhiều phiên BGP cho từng VPC để tạo kết nối với nhiều VPC trên nhiều AWS Region"],a:"A",e:""}]},{id:9,title:"Identity & Access Management",questions:[{t:"Câu 1. Những đặc điểm nào của IAM group? (Chọn HAI.)",o:["A. Một group có thể thuộc về một group khác","B. Một user có thể thuộc về nhiều hơn một group","C. Một group có thể có security credentials","D. Người dùng mới được thêm vào group sẽ kế thừa các quyền của group đó","E. Quyền trong group policy luôn ghi đè quyền trong user policy"],a:"B, D",e:""},{t:"Câu 2. Ưu điểm của kiểm soát truy cập dựa trên thuộc tính (ABAC) so với kiểm soát truy cập dựa trên vai trò (RBAC) là gì?",o:["A. ABAC yêu cầu ít kiểm thử hơn RBAC","B. Quyền ABAC xác định rõ ràng các tài nguyên mà chúng bảo vệ","C. ABAC có khả năng yêu cầu ít policy hơn RBAC","D. Quyền ABAC bảo mật hơn quyền RBAC"],a:"C",e:""},{t:"Câu 3. Một developer là thành viên của IAM group có group policy cho phép truy cập Amazon S3 và Amazon EC2, đồng thời từ chối truy cập Amazon ECS. Developer cũng có user policy cho phép truy cập Amazon ECS và Amazon CloudFront. Quyền truy cập của user này là gì?",o:["A. Truy cập Amazon ECS và Amazon CloudFront, không có quyền truy cập Amazon S3 và Amazon EC2","B. Truy cập Amazon S3 và Amazon EC2, không có quyền truy cập Amazon ECS và Amazon CloudFront","C. Truy cập Amazon S3, Amazon EC2 và Amazon CloudFront, nhưng không có quyền truy cập Amazon ECS","D. Truy cập Amazon S3, Amazon EC2, Amazon ECS và Amazon CloudFront"],a:"C",e:""},{t:"Câu 4. Lợi ích của identity federation với AWS Cloud là gì?",o:["A. Loại bỏ nhu cầu định nghĩa quyền trong IAM để bảo mật quyền truy cập vào tài nguyên AWS","B. Tập trung lưu trữ và quản lý danh tính người dùng bên trong AWS Cloud","C. Gán role cho người dùng đã xác thực để kiểm soát quyền truy cập vào tài nguyên AWS","D. Cho phép sử dụng nhà cung cấp danh tính bên ngoài để xác thực người dùng và cấp quyền truy cập vào tài nguyên AWS"],a:"D",e:""},{t:"Câu 5. Dịch vụ nào cho phép identity federation để truy cập vào ứng dụng web chạy trên AWS Cloud?",o:["A. AWS CloudHSM","B. AWS WAF","C. Amazon Cognito","D. AWS Key Management Service (AWS KMS)"],a:"C",e:""},{t:"Câu 6. Dịch vụ nào giúp quản lý thanh toán tập trung, kiểm soát truy cập, tuân thủ, bảo mật và chia sẻ tài nguyên trên nhiều tài khoản AWS?",o:["A. AWS Systems Manager","B. AWS Organizations","C. AWS Identity and Access Management (IAM)","D. Amazon Cognito"],a:"B",e:""},{t:"Câu 7. Một công ty công nghệ có nhiều tài khoản production được nhóm vào một organizational unit (OU) trong AWS Organizations. Công ty muốn ngăn tất cả IAM user trong các tài khoản production xóa AWS CloudTrail logs. Quản trị viên hệ thống có thể thực thi hạn chế này như thế nào?",o:["A. Tạo IAM policy và gắn vào từng IAM user trong các tài khoản production","B. Tạo service control policy (SCP) và gắn vào production OU","C. Tạo tag policy và gắn vào các tài khoản production","D. Tạo Amazon S3 bucket policy và liên kết với tất cả bucket chứa AWS CloudTrail logs"],a:"B",e:""},{t:"Câu 8. Một developer đang viết ứng dụng client mã hóa dữ liệu nhạy cảm bằng data key trước khi gửi đến server. Client gửi data key cho server để server có thể giải mã. Developer lo ngại rằng nếu data key bị đánh cắp, tính bảo mật của dữ liệu sẽ bị xâm phạm. Loại mã hóa nào nên được sử dụng để bảo vệ hoàn toàn thông tin nhạy cảm?",o:["A. Mã hóa bất đối xứng (Asymmetric encryption)","B. Mã hóa đối xứng (Symmetric encryption)","C. Mã hóa phía máy chủ (Server-side encryption)","D. Mã hóa phong bì (Envelope encryption)"],a:"D",e:""},{t:"Câu 9. AWS Key Management Service (AWS KMS) cung cấp những chức năng nào? (Chọn HAI.)",o:["A. Xác thực người dùng bên ngoài","B. Tạo khóa đối xứng và bất đối xứng","C. Tạo IAM access keys","D. Lưu trữ dữ liệu đã mã hóa","E. Xoay vòng khóa (Rotate keys)"],a:"B, E",e:""},{t:"Câu 10. Dịch vụ AWS nào phát hiện và bảo vệ thông tin nhạy cảm được lưu trữ trên Amazon S3 trong tài khoản AWS?",o:["A. AWS Audit Manager","B. Amazon Macie","C. Amazon Detective","D. AWS Resource Access Manager (AWS RAM)"],a:"B",e:""}]},{id:10,title:"Monitoring & Elasticity",questions:[{t:"Câu 1. Phát biểu nào về Amazon EC2 Auto Scaling là chính xác?",o:["A. Nó có thể khởi chạy các EC2 instance mới dựa trên lịch trình","B. Nó có thể khởi chạy các EC2 instance trên nhiều Availability Zone","C. Nó yêu cầu khách hàng chỉ sử dụng Reserved Instances","D. Nó có thể khởi chạy EC2 instance, nhưng khách hàng phải tự chấm dứt instance khi không còn cần thiết"],a:"B",e:""},{t:"Câu 2. Một DevOps engineer phát hiện nhu cầu trên một nhóm EC2 instance trong Auto Scaling group tăng theo một lượng cố định vào các ngày cuối tuần. Loại scaling nào PHÙ HỢP NHẤT trong trường hợp này?",o:["A. Scheduled (Theo lịch trình)","B. Predictive (Dự đoán)","C. Manual (Thủ công)","D. Dynamic (Động)"],a:"A",e:""},{t:"Câu 3. Một DevOps engineer khởi chạy một nhóm EC2 instance trong Auto Scaling group đằng sau Application Load Balancer. Các EC2 instance phải duy trì mức sử dụng CPU trung bình 50%. Loại scaling nào phù hợp dựa trên mức sử dụng CPU?",o:["A. Step scaling","B. Manual scaling","C. Target tracking scaling","D. Simple scaling"],a:"C",e:""},{t:"Câu 4. Người dùng có thể mở rộng theo chiều dọc (vertically scale) cơ sở dữ liệu Amazon RDS bằng cách nào?",o:["A. Thay đổi loại hoặc kích thước instance","B. Tạo các node đọc và ghi riêng biệt","C. Sharding cơ sở dữ liệu","D. Thêm read replicas"],a:"A",e:""},{t:"Câu 5. Khách hàng AWS có thể mở rộng theo chiều ngang (horizontally scale) cơ sở dữ liệu Amazon Aurora bằng cách nào?",o:["A. Thêm Aurora Replica instance bằng cách sử dụng Aurora Auto Scaling","B. Thay đổi loại instance","C. Tạo Amazon CloudWatch alarms","D. Tạo scaling policy"],a:"A",e:""},{t:"Câu 6. Amazon DynamoDB thực hiện tự động scaling như thế nào?",o:["A. Nó thêm read replicas để đáp ứng nhu cầu đọc tăng cao","B. Nó điều chỉnh dung lượng throughput được cấp phát theo mẫu traffic","C. Nó thêm và xóa các database instance theo sự thay đổi của traffic","D. Nó thay đổi loại instance theo sự thay đổi tải xử lý"],a:"B",e:""},{t:"Câu 7. Một nhóm EC2 instance được khởi chạy trong Auto Scaling group chạy ứng dụng sử dụng giao thức tùy chỉnh trên cổng TCP 42000. Các kết nối từ client trên internet phải được cân bằng tải trên các instance. Giải pháp load balancing nào là tốt nhất?",o:["A. Classic Load Balancer","B. Application Load Balancer","C. Network Load Balancer","D. Gateway Load Balancer"],a:"C",e:""},{t:"Câu 8. Một công ty phải xây dựng website có tính sẵn sàng cao dùng server-side scripts để phục vụ dynamic HTML. Giải pháp nào cung cấp tính sẵn sàng CAO NHẤT với CHI PHÍ và độ phức tạp THẤP NHẤT?",o:["A. Khách hàng triển khai web server thứ hai ở Region khác, Amazon Route 53 dùng failover routing để khôi phục sau thảm họa","B. Auto Scaling group khởi chạy EC2 instance được phục vụ bởi Network Load Balancer, Route 53 dùng latency-based routing","C. Amazon S3 host website, DNS name resolution trỏ đến S3 bucket","D. Auto Scaling group khởi chạy EC2 instance được phục vụ bởi Application Load Balancer, DNS name resolution trỏ đến load balancer"],a:"D",e:""},{t:"Câu 9. Người dùng ở địa điểm A kết nối đến ứng dụng ở Region A. Người dùng ở địa điểm B kết nối đến cùng ứng dụng ở Region B. Nếu ứng dụng ở Region A gặp sự cố, traffic từ địa điểm A phải được chuyển hướng sang ứng dụng ở Region B. Giải pháp nào đáp ứng yêu cầu này?",o:["A. Dùng latency-based routing trong Amazon Route 53 với Amazon CloudWatch alarms","B. Dùng geoproximity routing và Network Load Balancer gắn với cả hai Region","C. Dùng Application Load Balancer với Amazon CloudWatch alarms","D. Dùng geolocation routing với failover records trong Amazon Route 53"],a:"D",e:""},{t:"Câu 10. Một software engineer đã tạo tài khoản AWS cho mục đích phát triển và kiểm thử cá nhân. Họ muốn tài khoản luôn nằm trong giới hạn AWS Free Tier và không phát sinh chi phí bất ngờ. Cách tiếp cận nào hiệu quả và đòi hỏi ÍT công sức NHẤT?",o:["A. Tạo service control policy (SCP) để hạn chế tất cả dịch vụ không có trong AWS Free Tier","B. Tạo Amazon CloudWatch alarm để gửi email khi billing của tài khoản vượt quá $0","C. Tạo Amazon CloudWatch metric để theo dõi billing tài khoản và giới hạn ở mức $0","D. Đăng nhập vào AWS Management Console mỗi tháng và kiểm tra billing dashboard"],a:"B",e:""}]},{id:11,title:"Automation & IaC",questions:[{t:"Câu 1. Những lý do nào để sử dụng tự động hóa để cấp phát tài nguyên? (Chọn HAI.)",o:["A. Thiếu kiểm soát phiên bản với các quy trình thủ công","B. Yêu cầu tự động hóa cho tính sẵn sàng cao","C. Chi phí cao hơn với các quy trình thủ công","D. Yêu cầu tự động hóa để tạo một số tài nguyên nhất định","E. Phù hợp với nguyên tắc thiết kế độ tin cậy"],a:"A, E",e:""},{t:"Câu 2. Những lợi ích nào của việc sử dụng Infrastructure as Code (IaC) so với quy trình thủ công? (Chọn HAI.)",o:["A. Truyền bá các cập nhật từ một môi trường sang tất cả các môi trường khác","B. Tự động hóa quét bảo mật toàn hệ thống","C. Bảo vệ môi trường khỏi bị xóa","D. Quản lý tất cả người dùng tài khoản","E. Triển khai các môi trường với cấu hình nhất quán"],a:"A, E",e:""},{t:"Câu 3. Một cloud architect muốn nhanh chóng thiết lập triển khai Amazon FSx for Windows File Server an toàn theo thực tiễn tốt nhất của AWS. Họ nên dùng giải pháp nào?",o:["A. AWS CloudFormation Designer","B. Template AWS CloudFormation tải xuống từ internet","C. Amazon Machine Image (AMI) trên AWS Marketplace","D. AWS Quick Start"],a:"D",e:""},{t:"Câu 4. Amazon CodeWhisperer là gì?",o:["A. Một môi trường phát triển tích hợp (IDE)","B. Một template để triển khai ứng dụng nhanh chóng","C. Một tập hợp các kiến trúc tham chiếu tự động","D. Một trợ lý lập trình được hỗ trợ bởi trí tuệ nhân tạo (AI)"],a:"D",e:""},{t:"Câu 5. Những lý do nào để sử dụng Amazon CodeWhisperer? (Chọn HAI.)",o:["A. Tăng tốc các tác vụ lập trình","B. Viết compliance tests","C. Nâng cao bảo mật ứng dụng","D. Chia sẻ mã nguồn mở","E. Tự động hóa cho tính sẵn sàng cao"],a:"A, C",e:""},{t:"Câu 6. AWS CloudFormation là gì?",o:["A. Một dịch vụ AWS mà bạn có thể sử dụng để tạo, mô hình hóa và quản lý tài nguyên AWS","B. Một template mô tả cơ sở hạ tầng của bạn","C. Mô tả về các thực tiễn tốt nhất để thiết kế triển khai AWS","D. Một gói chứa tất cả thông tin cần thiết để khởi chạy Amazon EC2 instance"],a:"A",e:""},{t:"Câu 7. AWS CloudFormation Designer là gì?",o:["A. Một tập hợp các template có thể tái sử dụng","B. Kho lưu trữ mã nguồn cho các template AWS CloudFormation","C. Giao diện thiết kế đồ họa để tạo các template AWS CloudFormation","D. Công cụ để tự động hóa việc triển khai"],a:"C",e:""},{t:"Câu 8. Tùy chọn nào có thể được sử dụng để xử lý các điểm khác biệt theo từng môi trường triển khai trong AWS CloudFormation template?",o:["A. Sử dụng conditions (điều kiện)","B. Sử dụng drift detection","C. Sử dụng change sets","D. Sử dụng AWS CloudFormation Designer"],a:"A",e:""},{t:"Câu 9. Tùy chọn nào là cách tốt để xem trước các thay đổi trước khi thực hiện chúng trong AWS CloudFormation?",o:["A. Kiểm tra template bằng mắt thường","B. Chạy Update Stack","C. Chạy Detect Drift","D. Tạo một change set"],a:"D",e:""},{t:"Câu 10. Tùy chọn nào là cách tốt để biết những tài nguyên nào trong môi trường ứng dụng đã bị chỉnh sửa thủ công nếu môi trường được tạo bằng AWS CloudFormation stack?",o:["A. Chạy so sánh trong AWS CloudFormation Designer trên stack","B. Chạy change set trên stack","C. Chạy drift detection trên stack","D. Chạy conditions trên stack"],a:"C",e:""}]},{id:12,title:"Caching",questions:[{t:"Câu 1: Caching là gì?",o:["A. Một mạng lưới toàn cầu để phân phối nội dung","B. Một cách để lưu trữ mật khẩu","C. Một cơ sở dữ liệu trong bộ nhớ","D. Một lớp lưu trữ dữ liệu tốc độ cao"],a:"D",e:""},{t:"Câu 2: Bạn nên cache loại dữ liệu nào?",o:["A. Dữ liệu có thể truy xuất nhanh bằng các truy vấn đơn giản","B. Dữ liệu chuyên biệt chỉ cần cho một nhóm người dùng nhỏ","C. Nội dung web được tạo động","D. Dữ liệu tĩnh được truy cập thường xuyên"],a:"D",e:""},{t:"Câu 3: Đâu là lợi ích của caching?",o:["A. Tăng độ tin cậy của ứng dụng","B. Giảm chi phí","C. Cân bằng tải cho ứng dụng","D. Giảm độ trễ phản hồi"],a:"D",e:""},{t:"Câu 4: Loại nội dung nào trên trang web có thể được cache bằng edge cache? (Chọn HAI.)",o:["A. Tệp video, chẳng hạn như video demo sản phẩm","B. Đối tượng web, chẳng hạn như các siêu liên kết","C. Dữ liệu do người dùng tạo, chẳng hạn như từ khóa tìm kiếm","D. Giỏ hàng chứa các mặt hàng của người dùng","E. Nội dung được tạo động, chẳng hạn như tên người dùng"],a:"A, B",e:""},{t:"Câu 5: Amazon CloudFront cho phép điều gì?",o:["A. Xử lý giao dịch với cơ sở dữ liệu trong bộ nhớ","B. Tự động tạo giá trị thời gian tồn tại (TTL)","C. Caching hai chiều giữa người dùng và máy chủ gốc","D. Caching nội dung đa tầng và theo khu vực"],a:"D",e:""},{t:"Câu 6: Amazon CloudFront sử dụng các edge location như thế nào?",o:["A. Nó cache toàn bộ nội dung từ nguồn gốc tại edge location và phân phối nội dung đến khách hàng qua edge location nhanh nhất.","B. Nó cache nội dung được truy cập thường xuyên tại các edge location. Nó phân phối nội dung đã cache đến khách hàng qua edge location có độ trễ thấp nhất đến khách hàng đó.","C. Nó cache nội dung cục bộ tại các edge location. Nó phân phối nội dung đã cache đến khách hàng qua edge location yêu cầu ít bước nhảy mạng nhất để đến được khách hàng đó.","D. Nó cache dữ liệu khu vực tại các Regional edge location và phân phối nội dung đến khách hàng qua Regional edge location của họ."],a:"B",e:""},{t:"Câu 7: Câu nào mô tả cách hiệu quả để phân phối nội dung video theo yêu cầu?",o:["A. Khởi chạy một Amazon EC2 instance để lưu trữ nội dung video của bạn. Sau đó dùng Amazon CloudFront để phân phối nội dung.","B. Dùng Amazon S3 để lưu trữ nội dung. Sau đó dùng Amazon CloudFront để phân phối nội dung.","C. Khởi chạy một Amazon EC2 instance để lưu trữ và phục vụ nội dung video của bạn.","D. Dùng Amazon S3 để lưu trữ và phục vụ trực tiếp nội dung."],a:"B",e:""},{t:"Câu 8: Amazon CloudFront đóng vai trò gì trong việc bảo vệ chống lại các cuộc tấn công từ chối dịch vụ phân tán (DDoS)?",o:["A. Thực hiện kiểm tra gói tin sâu để phát hiện tấn công","B. Định tuyến lưu lượng qua các edge location","C. Kiểm soát lưu lượng bằng địa chỉ IP nguồn của các yêu cầu","D. Hạn chế lưu lượng theo địa lý để giúp chặn các cuộc tấn công xuất phát từ các quốc gia cụ thể"],a:"B",e:""},{t:"Câu 9: Một ứng dụng có thể sử dụng Amazon ElastiCache để cải thiện hiệu suất đọc cơ sở dữ liệu như thế nào? (Chọn HAI.)",o:["A. Đọc dữ liệu từ cơ sở dữ liệu trước, và ghi dữ liệu được đọc thường xuyên nhất vào ElastiCache.","B. Chuyển hướng tất cả các yêu cầu đọc đến cơ sở dữ liệu, và cấu hình để đọc từ ElastiCache khi xảy ra cache miss.","C. Sao chép cơ sở dữ liệu trong ElastiCache, và chuyển hướng tất cả lượt đọc đến ElastiCache và tất cả lượt ghi đến cơ sở dữ liệu.","D. Ghi dữ liệu vào ElastiCache mỗi khi ứng dụng ghi vào cơ sở dữ liệu.","E. Đọc dữ liệu từ ElastiCache trước, và ghi vào ElastiCache khi xảy ra cache miss."],a:"D, E",e:""},{t:"Câu 10: Nên sử dụng chiến lược caching nào khi có dữ liệu phải được cập nhật theo thời gian thực?",o:["A. Lazy loading","B. Write-through","C. Time to live (TTL)","D. Cache-control headers"],a:"B",e:""}]},{id:13,title:"Microservices",questions:[{t:"Câu 1: Câu nào mô tả sự khác biệt giữa kiến trúc liên kết chặt và liên kết lỏng?",o:["A. Các thành phần trong kiến trúc liên kết chặt phụ thuộc cao vào nhau. Trong kiến trúc liên kết lỏng, các thành phần không phụ thuộc cao vào nhau.","B. Kiến trúc liên kết chặt có khả năng thất bại cao hơn kiến trúc liên kết lỏng.","C. Liên kết lỏng làm tăng độ phức tạp khi mở rộng. Liên kết chặt làm giảm nó.","D. Kiến trúc liên kết lỏng bắt buộc phải dùng managed services, còn kiến trúc liên kết chặt thì không."],a:"A",e:""},{t:"Câu 2: Câu nào mô tả Amazon Simple Queue Service (Amazon SQS)? (Chọn BA.)",o:["A. Lưu trữ và tùy chọn mã hóa các tin nhắn cho đến khi chúng được xử lý và xóa","B. Cho phép bạn tách rời và mở rộng các microservice, hệ thống phân tán và ứng dụng serverless","C. Hỗ trợ hàng đợi chuẩn và các topic","D. Yêu cầu consumer phải polling hàng đợi để lấy tin nhắn","E. Gửi thông báo đẩy đến consumer","F. Hỗ trợ gửi email và tin nhắn văn bản"],a:"A, B, D",e:""},{t:"Câu 3: Những câu nào đúng khi sử dụng hàng đợi chuẩn của Amazon SQS? (Chọn HAI.)",o:["A. Tin nhắn phải được xử lý theo thứ tự gửi.","B. Một tin nhắn có thể được gửi nhiều hơn một lần.","C. Tin nhắn có thể được gửi theo bất kỳ thứ tự nào.","D. Một tin nhắn chỉ được xử lý đúng một lần.","E. Tin nhắn có thể được gán độ ưu tiên."],a:"B, C",e:""},{t:"Câu 4: Một nhóm EC2 instance xử lý video do người dùng tải lên. Amazon SQS có thể thực hiện chức năng nào trong ứng dụng này?",o:["A. Ứng dụng đặt các job message vào hàng đợi SQS. Các EC2 instance có dung lượng xử lý sẵn sàng sẽ lấy job message tiếp theo từ hàng đợi.","B. Các EC2 instance đặt các tệp video đã chỉnh sửa vào hàng đợi SQS. Ứng dụng lấy video từ hàng đợi.","C. Hàng đợi SQS nhận tin nhắn từ ứng dụng và thông báo cho tất cả các EC2 instance rằng có video sẵn sàng.","D. Ứng dụng ghi các tệp video vào hàng đợi SQS. Các EC2 instance có dung lượng xử lý sẵn sàng sẽ lấy video tiếp theo từ hàng đợi."],a:"A",e:""},{t:"Câu 5: Amazon Simple Notification Service (Amazon SNS) là gì?",o:["A. Dịch vụ truyền thông marketing linh hoạt và có thể mở rộng, sử dụng email, SMS, push hoặc voice","B. Dịch vụ nhắn tin được quản lý hoàn toàn cho cả giao tiếp system-to-system và application-to-person (A2P), sử dụng mô hình publish/subscribe","C. Dịch vụ email tiết kiệm chi phí, linh hoạt và có thể mở rộng cho phép developer gửi email từ bất kỳ ứng dụng nào","D. Event bus serverless cho phép kết nối dễ dàng các ứng dụng bằng dữ liệu từ ứng dụng của bạn, ứng dụng SaaS và các dịch vụ AWS"],a:"B",e:""},{t:"Câu 6: Đâu là một số trường hợp sử dụng Amazon SNS? (Chọn BA.)",o:["A. Thông báo cho nhiều hệ thống rằng dữ liệu đầu vào của người dùng đã sẵn sàng để xử lý.","B. Gửi tin nhắn văn bản đến các nhà vận hành hệ thống khi phát hiện hoạt động bất thường.","C. Giữ dữ liệu đầu vào cho đến khi có thể xử lý theo thứ tự nhận được.","D. Gửi thông báo đẩy đến ứng dụng di động khi có bản cập nhật phần mềm mới.","E. Thu thập dữ liệu streaming từ nhiều hệ thống.","F. Kích hoạt một AWS Lambda function duy nhất khi một đối tượng được tạo trong Amazon S3 bucket."],a:"A, B, D",e:""},{t:"Câu 7: Đâu là một số tính năng của Amazon SNS? (Chọn HAI.)",o:["A. Thu hồi tin nhắn đã gửi","B. Gửi tin nhắn đến một URL","C. Gửi tin nhắn đến một hàng đợi Amazon SQS","D. Đảm bảo thứ tự tin nhắn nghiêm ngặt với các topic chuẩn.","E. Đảm bảo gửi tin nhắn ngay cả khi endpoint không thể truy cập"],a:"B, C",e:""},{t:"Câu 8: Hai AWS Lambda function khác nhau phải đồng thời xử lý các tệp PDF được tải lên Amazon S3. S3 event notification chỉ cho phép một hành động khi tệp PDF được tải lên. Giải pháp nào cung cấp cách ít phức tạp nhất để xử lý tin nhắn với cả hai Lambda function?",o:["A. Gửi S3 event đến Amazon MQ để phân phối cho cả hai Lambda function.","B. Tải lên hai bản sao của mỗi tệp PDF bằng cách sử dụng các object key prefix khác nhau.","C. Gửi S3 event đến hàng đợi Amazon SQS mà cả hai Lambda function đều polling.","D. Gửi S3 event đến một Amazon SNS topic mà cả hai Lambda function đều subscribe."],a:"D",e:""},{t:"Câu 9: Amazon MQ là gì?",o:["A. Dịch vụ giám sát ứng dụng","B. Dịch vụ di chuyển dữ liệu","C. Dịch vụ message broker","D. Dịch vụ identity broker"],a:"C",e:""},{t:"Câu 10: Đâu là trường hợp sử dụng phổ biến của Amazon MQ?",o:["A. Kết nối một VPC với mạng on-premises.","B. Tách rời các thành phần trong ứng dụng cloud-native mới.","C. Tận dụng ứng dụng on-premises hiện có sử dụng Apache ActiveMQ để giao tiếp giữa các microservice.","D. Tải lên một trang web tĩnh độc lập lên AWS."],a:"C",e:""}]}];</script>
<script>const EXTRA_DATA = [];

// Module 2-4
EXTRA_DATA.push(...[
{id:2,title:"Kiến trúc đám mây (Mở rộng)",questions:[
{t:"Trụ cột nào của AWS Well-Architected Framework tập trung vào khả năng phục hồi sau sự cố?",o:["A. Bảo mật (Security)","B. Độ tin cậy (Reliability)","C. Hiệu suất (Performance Efficiency)","D. Tính bền vững (Sustainability)"],a:"B",e:"Trụ cột Reliability tập trung vào khả năng hệ thống phục hồi sau sự cố."},
{t:"Khái niệm 'Elasticity' trong điện toán đám mây có nghĩa là gì?",o:["A. Khả năng mã hóa tự động","B. Khả năng tự động co giãn tài nguyên theo nhu cầu","C. Khả năng sao lưu dữ liệu","D. Chạy nhiều hệ điều hành"],a:"B",e:"Elasticity là khả năng hệ thống tự động co giãn tài nguyên (thêm/bớt) theo lưu lượng thực tế."},
{t:"Nguyên tắc thiết kế nào giúp giảm thiểu tác động khi một thành phần gặp sự cố?",o:["A. Thiết kế monolithic","B. Thiết kế kết nối chặt","C. Thiết kế kết nối lỏng (Loose coupling)","D. Thiết kế đơn điểm"],a:"C",e:"Loose coupling đảm bảo các thành phần hoạt động độc lập, không bị ảnh hưởng dây chuyền."},
{t:"AWS Trusted Advisor cung cấp khuyến nghị về lĩnh vực nào? (Chọn 2)",o:["A. Tối ưu chi phí","B. Giao diện UI","C. Hiệu suất hệ thống","D. Quản lý nhân sự"],a:"A và C",e:"Trusted Advisor tự động kiểm tra tài khoản và khuyến nghị về Tối ưu chi phí, Hiệu suất, Bảo mật."},
{t:"Mô hình 'Pay-as-you-go' của AWS là gì?",o:["A. Trả trước 1 năm","B. Chỉ thanh toán cho tài nguyên thực tế đã sử dụng","C. Thanh toán cố định hàng tháng","D. Miễn phí năm đầu"],a:"B",e:"Pay-as-you-go nghĩa là chỉ trả tiền cho lượng tài nguyên thực tế đã tiêu thụ."},
{t:"Công cụ nào giúp ước tính chi phí trước khi triển khai?",o:["A. Billing Dashboard","B. Pricing Calculator","C. Cost Explorer","D. AWS Budgets"],a:"B",e:"AWS Pricing Calculator cho phép mô phỏng cấu hình và ước tính chi phí trước khi tạo tài nguyên."},
{t:"Lợi ích của việc dùng nhiều Availability Zones là gì?",o:["A. Giảm chi phí","B. Tăng tốc độ CPU","C. Tăng tính sẵn sàng và khả năng chịu lỗi","D. Đơn giản hóa quản trị"],a:"C",e:"Triển khai trên nhiều AZ giúp hệ thống sống sót ngay cả khi một Data Center gặp sự cố."},
{t:"AWS Free Tier cung cấp những loại ưu đãi nào? (Chọn 2)",o:["A. Dùng thử miễn phí 12 tháng","B. Giảm giá 50%","C. Miễn phí vĩnh viễn ở mức sử dụng thấp","D. Hoàn tiền 100%"],a:"A và C",e:"AWS Free Tier có: Dùng thử miễn phí, Miễn phí 12 tháng và Miễn phí vĩnh viễn (ở mức thấp)."},
{t:"'High Availability' trong AWS là gì?",o:["A. Hệ thống có tốc độ cực nhanh","B. Hệ thống luôn sẵn sàng hoạt động với thời gian ngừng tối thiểu","C. Chi phí cực thấp","D. Chỉ admin mới được truy cập"],a:"B",e:"High Availability nghĩa là hệ thống được thiết kế để hoạt động liên tục với downtime cực thấp."},
{t:"Nguyên tắc 'Design for Failure' khuyến nghị điều gì?",o:["A. Không cần sao lưu","B. Luôn giả định mọi thành phần đều có thể hỏng và thiết kế dự phòng","C. Chỉ dùng 1 máy chủ","D. Tắt hệ thống khi có lỗi"],a:"B",e:"Cần giả định mọi thứ đều có thể hỏng để thiết kế dự phòng, tự động phục hồi."}
]},
{id:3,title:"Bảo mật (Mở rộng)",questions:[
{t:"AWS CloudTrail cung cấp chức năng chính nào?",o:["A. Vá lỗi OS","B. Ghi nhật ký mọi lệnh gọi API trên tài khoản","C. Mã hóa S3","D. Quản lý khóa"],a:"B",e:"CloudTrail ghi lại chi tiết mọi hành động API trên tài khoản AWS."},
{t:"Xác thực đa yếu tố (MFA) cung cấp lớp bảo mật bằng cách nào?",o:["A. Mã hóa dữ liệu","B. Yêu cầu thêm mã xác thực ngoài mật khẩu","C. Khóa tài khoản sau 3 lần sai","D. Giới hạn IP"],a:"B",e:"MFA yêu cầu thêm mã OTP từ điện thoại ngoài mật khẩu để bảo vệ tài khoản tốt hơn."},
{t:"Dịch vụ nào phát hiện mối đe dọa bằng cách phân tích nhật ký?",o:["A. IAM","B. Amazon GuardDuty","C. KMS","D. Amazon S3"],a:"B",e:"GuardDuty dùng Machine Learning phân tích VPC Flow Logs, CloudTrail, DNS để tìm nguy hiểm."},
{t:"Security Group hoạt động ở cấp độ nào?",o:["A. Subnet","B. Máy chủ ảo (Instance)","C. VPC","D. Region"],a:"B",e:"Security Group hoạt động như tường lửa ảo ở cấp độ từng EC2 instance."},
{t:"Sự khác biệt chính giữa Security Group và Network ACL là gì?",o:["A. SG là stateless, NACL là stateful","B. SG ở cấp instance, NACL ở cấp subnet","C. SG kiểm soát lưu lượng vào, NACL kiểm soát vào và ra","D. Không khác biệt"],a:"B",e:"SG ở cấp instance và stateful. NACL ở cấp subnet và stateless."},
{t:"AWS Config cung cấp chức năng gì?",o:["A. Triển khai code","B. Theo dõi và ghi lại lịch sử thay đổi cấu hình tài nguyên","C. Cân bằng tải","D. Lưu mật khẩu"],a:"B",e:"AWS Config liên tục theo dõi mọi thay đổi cấu hình tài nguyên để đảm bảo tính tuân thủ."},
{t:"Chính sách nào được gắn trực tiếp lên tài nguyên như S3 bucket?",o:["A. Identity-based policy","B. Resource-based policy","C. SCP","D. Session policy"],a:"B",e:"Resource-based policy (như S3 Bucket Policy) được gắn trực tiếp lên tài nguyên để kiểm soát quyền truy cập."},
{t:"Dịch vụ nào cung cấp tường lửa ứng dụng web?",o:["A. GuardDuty","B. Shield","C. AWS WAF","D. Inspector"],a:"C",e:"AWS WAF bảo vệ ứng dụng web khỏi SQL injection, XSS..."},
{t:"AWS Shield bảo vệ chống lại tấn công nào?",o:["A. SQL injection","B. Tấn công DDoS","C. Phishing","D. Brute-force"],a:"B",e:"AWS Shield chuyên bảo vệ chống lại các cuộc tấn công Từ chối dịch vụ phân tán (DDoS)."},
{t:"Khi nào nên sử dụng IAM Role thay vì IAM User cho EC2?",o:["A. Cần mật khẩu tĩnh","B. Cần thông tin xác thực tạm thời tự động xoay vòng","C. Khi chỉ có 1 user","D. Không cần quyền"],a:"B",e:"IAM Role cung cấp thông tin xác thực tạm thời an toàn hơn là dùng Access Key tĩnh của User."}
]},
{id:4,title:"Lưu trữ (Mở rộng)",questions:[
{t:"Amazon S3 đảm bảo độ bền dữ liệu (durability) ở mức nào?",o:["A. 99.9%","B. 99.99%","C. 11 số 9 (99.999999999%)","D. 100%"],a:"C",e:"S3 được thiết kế với độ bền 11 số 9, rất khó mất dữ liệu."},
{t:"S3 Versioning giúp bảo vệ dữ liệu như thế nào?",o:["A. Mã hóa mọi file","B. Lưu giữ mọi phiên bản của đối tượng kể cả khi bị ghi đè","C. Sao chép qua Region khác","D. Nén dữ liệu"],a:"B",e:"Versioning lưu lại các phiên bản cũ để khôi phục khi bị xóa hoặc sửa nhầm."},
{t:"Dịch vụ nào phù hợp làm ổ đĩa hệ điều hành cho EC2?",o:["A. S3","B. Amazon EBS","C. EFS","D. Glacier"],a:"B",e:"EBS cung cấp ổ đĩa khối (block storage) hiệu suất cao để gắn làm ổ hệ điều hành."},
{t:"Sự khác biệt chính giữa EBS và EFS là gì?",o:["A. EBS chỉ cho Linux, EFS cho Windows","B. EBS gắn vào 1 EC2, EFS có thể chia sẻ giữa nhiều EC2","C. EBS miễn phí","D. Không khác biệt"],a:"B",e:"EBS gắn độc quyền 1 EC2. EFS là hệ thống file chia sẻ (NFS) cho hàng nghìn EC2 dùng chung."},
{t:"S3 Lifecycle Policy dùng làm gì?",o:["A. Mã hóa dữ liệu","B. Tự động chuyển dữ liệu giữa các lớp lưu trữ hoặc xóa sau một thời gian","C. Giới hạn quyền","D. Tăng tốc tải lên"],a:"B",e:"Lifecycle Policy tự động hóa việc chuyển dữ liệu sang lớp rẻ hơn hoặc xóa để tiết kiệm chi phí."},
{t:"S3 Intelligent-Tiering hoạt động ra sao?",o:["A. Luôn dùng lớp rẻ nhất","B. Tự động di chuyển dữ liệu giữa các lớp dựa trên tần suất truy cập thực tế","C. Chọn thủ công mỗi tháng","D. Chỉ lưu file nhỏ"],a:"B",e:"Intelligent-Tiering tự động tối ưu chi phí bằng cách theo dõi mẫu truy cập của dữ liệu."},
{t:"AWS Storage Gateway dùng khi nào?",o:["A. Lưu trên cloud hoàn toàn","B. Kết nối hạ tầng lưu trữ on-premises với đám mây AWS","C. Chạy web tĩnh","D. Chạy database"],a:"B",e:"Storage Gateway là giải pháp lai (hybrid) kết nối lưu trữ tại văn phòng với lưu trữ đám mây."},
{t:"S3 Object Lock cung cấp tính năng gì?",o:["A. Khóa bucket hoàn toàn","B. Ngăn chặn việc xóa/sửa đối tượng trong một khoảng thời gian xác định","C. Mã hóa bằng khóa riêng","D. Giới hạn dung lượng"],a:"B",e:"Object Lock áp dụng mô hình WORM (viết 1 lần, đọc nhiều lần) để tuân thủ pháp luật."},
{t:"Kích thước tối đa của 1 file trên S3 là bao nhiêu?",o:["A. 5 GB","B. 5 TB","C. 50 TB","D. Không giới hạn"],a:"B",e:"Kích thước tối đa của 1 đối tượng trên S3 là 5 Terabytes."},
{t:"Glacier Instant Retrieval khác gì Flexible Retrieval?",o:["A. Truy xuất dữ liệu ngay lập tức trong mili giây","B. Rẻ hơn","C. Chậm hơn","D. Giống nhau"],a:"A",e:"Instant Retrieval cho phép lấy lại dữ liệu tức thì (mili giây), còn Flexible mất từ phút đến giờ."}
]}
]);

// Module 5-8
EXTRA_DATA.push(...[
{id:5,title:"Điện toán (Mở rộng)",questions:[
{t:"AWS Lambda hoạt động theo mô hình nào?",o:["A. EC2 chạy 24/7","B. Phi máy chủ (Serverless) - chạy khi có trigger","C. Máy chủ vật lý","D. Container liên tục"],a:"B",e:"Lambda là Serverless, bạn chỉ trả tiền cho phần nghìn giây code được chạy."},
{t:"Auto Scaling Group cung cấp lợi ích gì?",o:["A. Mã hóa tự động","B. Tự động tăng/giảm số lượng EC2 instance theo tải","C. Cập nhật hệ điều hành","D. Tạo database"],a:"B",e:"ASG điều chỉnh số lượng server tự động theo lưu lượng hiện tại."},
{t:"Chức năng chính của Elastic Load Balancer (ELB)?",o:["A. Lưu dữ liệu","B. Phân phối lưu lượng mạng đến nhiều máy chủ","C. Dịch tên miền","D. Mã hóa kết nối"],a:"B",e:"ELB chia tải đều cho nhiều máy chủ để tránh quá tải 1 máy duy nhất."},
{t:"Instance Store khác gì EBS?",o:["A. Bền hơn EBS","B. Mất dữ liệu khi instance stop/terminate","C. Giống y hệt","D. Không thể lưu trữ"],a:"B",e:"Instance Store là ổ đĩa tạm vật lý, sẽ mất trắng dữ liệu khi máy ảo bị tắt (stop)."},
{t:"Spot Instance phù hợp công việc nào?",o:["A. Database quan trọng","B. Web server chính","C. Xử lý hàng loạt có khả năng chịu gián đoạn","D. Thanh toán"],a:"C",e:"Spot rất rẻ nhưng bị AWS thu hồi bất kỳ lúc nào, phù hợp cho việc chịu được ngắt quãng."},
{t:"Dedicated Host là gì?",o:["A. Máy chủ vật lý riêng biệt cho phép kiểm soát cấp độ phần cứng (socket/core)","B. Máy ảo giá rẻ","C. Container","D. Database dùng chung"],a:"A",e:"Dùng Dedicated Host khi bạn có license phần mềm on-premises cần đối chiếu số CPU vật lý."},
{t:"Security Group mặc định của VPC làm gì?",o:["A. Mở mọi port","B. Chặn tất cả luồng vào, cho phép tất cả luồng ra","C. Chặn tất cả luồng ra và vào","D. Chặn port 80"],a:"B",e:"SG mặc định an toàn: Inbound bị chặn hết, Outbound được cho phép hết."},
{t:"Application Load Balancer (ALB) hỗ trợ định tuyến ở tầng mấy?",o:["A. Tầng 4 (Network)","B. Tầng 7 (Application - HTTP/HTTPS)","C. Tầng 3","D. Tầng 2"],a:"B",e:"ALB chuyên xử lý HTTP/HTTPS và định tuyến theo đường dẫn (Path) ở Layer 7."},
{t:"Truy cập metadata của EC2 bằng IP nào?",o:["A. 192.168.1.1","B. 169.254.169.254","C. 10.0.0.1","D. localhost"],a:"B",e:"IP đặc biệt 169.254.169.254 dùng để gọi API lấy metadata ngay trong lòng máy EC2."},
{t:"Spread Placement Group là gì?",o:["A. Đặt chung 1 rack","B. Phân tán các EC2 lên các phần cứng vật lý khác nhau","C. Đặt trên 1 host","D. Tự động xóa máy"],a:"B",e:"Giúp hạn chế rủi ro hỏng hóc phần cứng đồng loạt."}
]},
{id:6,title:"Cơ sở dữ liệu (Mở rộng)",questions:[
{t:"Lợi thế của Amazon Aurora?",o:["A. Miễn phí","B. Nhanh gấp 5 lần MySQL, 3 lần PostgreSQL","C. Không cần internet","D. Chỉ lưu ảnh"],a:"B",e:"Aurora là DB độc quyền AWS được tối ưu riêng cho cloud."},
{t:"DynamoDB hỗ trợ mô hình nào?",o:["A. Quan hệ SQL","B. Key-Value và Document (NoSQL)","C. Graph","D. Time-series"],a:"B",e:"DynamoDB là NoSQL Serverless cực mạnh của AWS."},
{t:"Read Replica trên RDS dùng làm gì?",o:["A. Backup","B. Gánh tải đọc (Read) để giảm tải cho DB chính","C. Nén data","D. Phân tích AI"],a:"B",e:"Tăng tốc ứng dụng bằng cách đẩy các query SELECT sang các bản sao Read Replica."},
{t:"Amazon Redshift dùng làm gì?",o:["A. Web hosting","B. Data Warehouse (Kho dữ liệu khổng lồ để phân tích)","C. Gửi email","D. Làm cache"],a:"B",e:"Redshift xử lý dữ liệu lớn cỡ Petabyte cho Business Intelligence (BI)."},
{t:"Tính năng Multi-AZ của RDS dùng để?",o:["A. Tăng tốc đọc","B. Dự phòng sự cố (Failover) tự động","C. Tăng dung lượng đĩa","D. Cân bằng tải"],a:"B",e:"Khi DB chính sập, RDS tự động bật DB dự phòng (Standby) ở AZ khác để thay thế ngay lập tức."},
{t:"ElastiCache hỗ trợ 2 engine nào?",o:["A. Redis và Memcached","B. MySQL và Oracle","C. SQL Server và PostgreSQL","D. MongoDB và Cassandra"],a:"A",e:"Redis và Memcached là 2 công cụ lưu trữ in-memory mã nguồn mở phổ biến nhất."},
{t:"AWS DMS (Database Migration Service) làm gì?",o:["A. Chuyển tiền","B. Di chuyển dữ liệu database một cách liên tục và đồng nhất/không đồng nhất","C. Chuyển tên miền","D. Mã hóa DB"],a:"B",e:"DMS di chuyển database từ On-premise lên AWS mà ứng dụng vẫn hoạt động không gián đoạn."},
{t:"DocumentDB tương thích với DB nào?",o:["A. MySQL","B. MongoDB","C. Oracle","D. DynamoDB"],a:"B",e:"DocumentDB là dịch vụ tương thích API với MongoDB do AWS quản lý."},
{t:"Khi nào dùng DynamoDB thay vì RDS?",o:["A. Cần JOIN nhiều bảng","B. Cần độ trễ dưới 10ms, mở rộng không giới hạn và schema linh hoạt","C. Cần Store procedure","D. Cần ACID chặt chẽ"],a:"B",e:"DynamoDB vượt trội về tốc độ tải siêu cao và không yêu cầu schema cố định."},
{t:"Amazon QLDB đặc biệt ở điểm nào?",o:["A. Dùng AI","B. Cung cấp sổ cái (ledger) bất biến, không thể sửa đổi hoặc xóa","C. Miễn phí","D. Chạy offline"],a:"B",e:"QLDB giống như blockchain nội bộ, lưu giữ mọi thay đổi dữ liệu minh bạch và bất biến."}
]},
{id:7,title:"Mạng cơ bản (Mở rộng)",questions:[
{t:"Thành phần nào cho public subnet ra internet?",o:["A. NAT Gateway","B. Internet Gateway (IGW)","C. Virtual Private Gateway","D. Customer Gateway"],a:"B",e:"IGW là cánh cổng kết nối trực tiếp VPC với Internet công cộng."},
{t:"Private subnet ra internet tải update bằng cách nào an toàn?",o:["A. IGW","B. Elastic IP","C. NAT Gateway","D. Direct Connect"],a:"C",e:"NAT Gateway nằm ở Public Subnet sẽ đứng ra tải dữ liệu thay cho Private Subnet."},
{t:"Route Table là gì?",o:["A. Chặn IP","B. Bảng định tuyến quyết định đường đi của dữ liệu mạng","C. Load balancer","D. Cáp quang"],a:"B",e:"Route table chứa các luật (route) chỉ đường cho traffic đi ra IGW, NAT hay Peering."},
{t:"Chính sách Weighted routing của Route 53 làm gì?",o:["A. Load balance theo khu vực","B. Phân chia tỷ lệ % traffic đến các server","C. Kiểm tra sức khỏe","D. Định tuyến tự động"],a:"B",e:"Ví dụ gửi 80% truy cập vào server A, 20% vào server B."},
{t:"VPC Peering có đặc điểm gì?",o:["A. Kết nối qua mạng internet","B. Là kết nối mạng riêng (không qua internet) giữa 2 VPC","C. Hỗ trợ định tuyến bắc cầu (A->B, B->C suy ra A->C)","D. Chỉ dùng được trong 1 Region"],a:"B",e:"VPC Peering rất an toàn vì dùng hạ tầng cáp quang riêng của AWS. (Nó KHÔNG hỗ trợ bắc cầu)."},
{t:"Elastic IP là gì?",o:["A. IP đổi liên tục","B. IP tĩnh (Static) Public cấp cho tài khoản AWS của bạn","C. IP private","D. IPv6"],a:"B",e:"Là một IP cố định, bạn có thể gán nó từ EC2 này sang EC2 khác."},
{t:"NACL (Network ACL) đánh giá luật theo thứ tự nào?",o:["A. Ngẫu nhiên","B. Số thứ tự từ thấp đến cao","C. Số cao đến thấp","D. Đánh giá tất cả"],a:"B",e:"Luật số 100 sẽ được đánh giá trước luật số 200. Nếu khớp, nó bỏ qua các luật bên dưới."},
{t:"Một VPC có tối đa bao nhiêu IGW?",o:["A. 1","B. 2","C. 5","D. Không giới hạn"],a:"A",e:"Một VPC chỉ gắn được duy nhất 1 Internet Gateway."},
{t:"Amazon Route 53 là dịch vụ gì?",o:["A. Tạo server","B. Hệ thống phân giải tên miền (DNS)","C. Tính toán","D. Lưu trữ"],a:"B",e:"Route 53 giúp map tên miền thân thiện (google.com) với địa chỉ IP."},
{t:"Khi tạo VPC mới, cái gì KHÔNG được tạo sẵn?",o:["A. Route Table mặc định","B. Security Group mặc định","C. NACL mặc định","D. Subnets"],a:"D",e:"Bạn phải tự tay tạo các Subnets sau khi tạo VPC."}
]},
{id:8,title:"Mạng nâng cao (Mở rộng)",questions:[
{t:"Transit Gateway giải quyết vấn đề gì?",o:["A. Backup data","B. Thay thế VPC Peering chằng chịt bằng cấu trúc Hub trung tâm mạng lưới","C. Giảm giá EC2","D. Tăng tốc web"],a:"B",e:"Transit Gateway là tổng đài trung tâm, các VPC chỉ cần nối 1 dây vào Hub này là có thể kết nối với nhau."},
{t:"Direct Connect ưu việt hơn VPN ở điểm nào?",o:["A. Rẻ hơn","B. Nhanh tạo xong","C. Băng thông cực lớn, ổn định, không đi qua internet","D. Kết nối không dây"],a:"C",e:"Cáp quang Direct Connect đâm thẳng vào Data Center của bạn, tránh hoàn toàn internet công cộng."},
{t:"Gateway VPC Endpoint dùng cho dịch vụ nào?",o:["A. Tất cả","B. Chỉ S3 và DynamoDB","C. EC2 và RDS","D. SQS và SNS"],a:"B",e:"Khái niệm Gateway Endpoint ra đời rất sớm và chỉ phục vụ duy nhất 2 hệ thống là S3 và DynamoDB."},
{t:"Global Accelerator dùng để làm gì?",o:["A. Nén file zip","B. Tăng tốc độ truy cập ứng dụng toàn cầu bằng mạng cáp quang nội bộ AWS","C. Tính toán toán học","D. Backup DB"],a:"B",e:"Giúp người dùng ở VN kết nối đến máy chủ Mỹ với tốc độ siêu nhanh thông qua Edge Location."},
{t:"Site-to-Site VPN dùng giao thức gì để mã hóa đường hầm?",o:["A. HTTP","B. IPsec","C. SSH","D. FTP"],a:"B",e:"IPsec là tiêu chuẩn vàng để mã hóa mạng VPN doanh nghiệp."},
{t:"Phía AWS trong kết nối VPN gọi là gì?",o:["A. Customer Gateway","B. Virtual Private Gateway (VGW) hoặc Transit Gateway","C. IGW","D. NAT"],a:"B",e:"VGW là cánh cửa tiếp nhận kết nối VPN từ Customer Gateway của doanh nghiệp."},
