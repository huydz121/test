 HOÀN TOÀN KHÔNG phát sinh thêm bất cứ khoản phí dịch vụ nào, cũng như KHÔNG áp đặt bất cứ rào cản băng thông thông lượng truyền tin nào?",o:["A. Nút mạng chuyển tiếp VPC (Gateway VPC endpoint)","B. Các điểm truy cập mạng công khai khu vực (Public region access point)","C. Trạm cân bằng tải mạng cuối (Gateway Load Balancer endpoint)","D. Điểm truy cập giao diện mạng riêng tư ảo (Interface VPC endpoint)"],a:"A. Nút mạng chuyển tiếp VPC (Gateway VPC endpoint)",e:"Để thiết lập liên kết từ cụm máy ảo EC2 trong hạ tầng nội bộ hướng ra các dịch vụ khác của AWS mà không cần vòng tránh thông qua rủi ro trên mạng lưới Internet, AWS triển khai khái niệm VPC Endpoint. - Nút mạng chuyển tiếp Gateway VPC (A): Đây là kiến trúc lâu đời đặc quyền được AWS xây dựng chỉ phục vụ kết nối cho đúng hai hệ thống khổng lồ là Amazon S3 và Amazon DynamoDB. Cấu trúc định tuyến này vĩnh viễn miễn phí và cung cấp thông lượng kết nối không giới hạn dung lượng. - Ngược lại, điểm kết nối giao diện Interface VPC (D) dù có chức năng tương tự, song được vận hành trên hạ tầng AWS PrivateLink, do đó sẽ áp dụng phí khởi tạo dựa trên giờ và áp đặt chi phí trên mỗi đơn vị Gigabyte xử lý dữ liệu mạng (vi phạm điều kiện bài toán)."}]},{id:8,title:"Kết nối mạng mở rộng (Advanced Networking)",questions:[{t:"Giải pháp kiến trúc mạng nào cung cấp cách tiếp cận tinh giản và có khả năng quản lý tối ưu nhất để kết nối đồng bộ một mạng lưới khổng lồ gồm 100 Đám mây riêng ảo (VPCs) lại với nhau?",o:["A. Thiết lập mạng lưới chằng chịt kết nối mỗi VPC với 99 mạng VPC còn lại thông qua giải pháp ngang hàng (VPC peering).","B. Xây dựng một mạng lưới vệ tinh mô hình trung tâm (hub-and-spoke) sử dụng cổng trung tâm AWS VPN CloudHub.","C. Xâu chuỗi tất cả các VPC thành vòng tròn tuần tự bằng phương thức VPC peering.","D. Định tuyến liên kết toàn bộ 100 VPC quy tụ chung vào Trạm trung chuyển AWS Transit Gateway."],a:"D. Định tuyến liên kết toàn bộ 100 VPC quy tụ chung vào Trạm trung chuyển AWS Transit Gateway.",e:"Nếu áp dụng kiến trúc mạng ngang hàng Peering truyền thống (A, C) cho một số lượng lớn 100 VPC, quản trị viên sẽ phải thiết lập gần 5000 kết nối độc lập chéo nhau, tạo ra một cơn ác mộng cực lớn về mặt cấu trúc và khó khăn trong việc vận hành kiểm soát độ trễ. Giải pháp AWS Transit Gateway hoạt động giống như một thiết bị trung chuyển định tuyến tổng đài duy nhất (Hub). Khi đó, mỗi VPC chỉ cần thiết lập đúng một nhánh kết nối (Attachment) vào Hub này để có thể phân phối và xử lý toàn bộ luồng thông tin giao thông trên toàn mạng lưới một cách khoa học."},{t:"Một quy trình hoạt động của công ty đòi hỏi tạo luồng giao thông bảo mật ổn định từ một tài khoản AWS đặt tại một Khu vực địa lý (Region) sang một hệ thống máy chủ tại một tài khoản khác nằm ở Khu vực địa lý riêng biệt trên thế giới. Thiết lập kết cấu nào nên được tích hợp trên hai Trạm định tuyến Transit Gateways tại mỗi bên nhằm duy trì chức năng thông mạng?",o:["A. Cáp mạng xương sống AWS Direct Connect","B. Liên kết ngang hàng giữa các trạm trung chuyển (Transit gateway peering attachment)","C. Mạng kết nối VPN hạ tầng AWS Site-to-Site VPN","D. Cổng kết nối bảo mật AWS PrivateLink"],a:"B. Liên kết ngang hàng giữa các trạm trung chuyển (Transit gateway peering attachment)",e:"Trạm trung chuyển mạng AWS Transit Gateway được thiết kế để phân luồng cục bộ giữa các không gian VPC nằm trong cùng một Khu vực địa lý (Region). Tuy nhiên, khi đối mặt với bài toán kết nối mạng liên lục địa (ví dụ Mỹ sang Nhật Bản), chức năng Peering Attachment của AWS sẽ đóng vai trò xây dựng một \"đường hầm liên bang\", cho phép đồng bộ hóa bảng định tuyến chéo giúp hai Trạm trung chuyển này liên kết và giao tiếp thông suốt vượt khỏi ranh giới khu vực."},{t:"Một công ty sở hữu hai mạng VPC tách biệt. Mạng VPC A sở hữu khối phân bổ địa chỉ chuẩn (CIDR block) là 10.1.0.0/16, trong khi hệ thống mạng VPC B quản lý khối phân mảnh là 10.2.0.0/16. Hai phân mảnh mạng này hoạt động trong hệ thống nội bộ của cùng một công ty. Đâu là kiến trúc kết nối đơn giản, chi phí rẻ nhất nhằm đồng bộ hóa để hai khối mạng này trao đổi mọi luồng giao thông lưu lượng thông suốt nhau?",o:["A. Kết nối điểm nối điểm qua đường truyền internet AWS Site-to-Site VPN","B. Cầu nối không gian ngang hàng (VPC peering)","C. Kết nối cáp viễn thông trực tiếp qua AWS Direct Connect","D. Các thiết bị nối biên VPC endpoints"],a:"B. Cầu nối không gian ngang hàng (VPC peering)",e:"Khi yêu cầu hệ thống chỉ dừng ở mức độ chia sẻ kết nối trực diện giữa hai mạng nội bộ có không gian địa chỉ không trùng lặp (10.1 và 10.2), thiết lập VPC Peering là giải pháp hoàn mỹ và gọn nhẹ nhất. Hệ thống không đòi hỏi thiết bị chuyển mạch trung gian bổ sung, hoàn toàn không phụ thuộc yếu tố truyền tải qua mạng cáp công cộng, và miễn phí hoàn toàn cước phí khởi tạo ban đầu."},{t:"Các hệ thống phân tích nằm ở độ sâu của mạng con riêng tư và cực kỳ bảo mật trong cấu trúc mạng VPC đang được điều phối để truy cập lấy dữ liệu phân tích từ Amazon S3. Tổ hợp thiết kế kiến trúc bảo mật nào đảm bảo đóng băng toàn bộ khả năng phân luồng giao thông truy xuất của hệ thống tiếp xúc trực tiếp lên môi trường internet? (Chọn 2)",o:["A. Xây dựng một đường hầm mạng điểm cuối riêng tư (VPC gateway endpoint) liên kết đến dịch vụ Amazon S3.","B. Triển khai các thiết bị mạng giao diện mạng tư nhân (VPC interface endpoints).","C. Sửa đổi hệ thống gọi ứng dụng bằng cách kết nối thông qua hạ tầng IP nội bộ mã nguồn riêng của Amazon S3.","D. Thiết lập kiến trúc mạng điểm-đến-điểm bằng hệ thống VPC peering trực diện từ vùng bảo mật vào môi trường của Amazon S3.","E. Sử dụng giải pháp tĩnh với phân hệ địa chỉ mạng nội bộ cho các bộ xử lý hệ thống."],a:"A. Xây dựng một đường hầm mạng điểm cuối riêng tư (VPC gateway endpoint) liên kết đến dịch vụ Amazon S3 và B. Triển khai các thiết bị mạng giao diện mạng tư nhân (VPC interface endpoints).",e:"Để giải quyết bài toán giao tiếp giữa các thành phần cô lập (private subnets) với các hệ sinh thái như S3 hay DynamoDB mà không cho phép bất kỳ khả năng nào mở cổng Internet Gateway, giao thức của AWS quy định bắt buộc áp dụng công nghệ Điểm cuối VPC (VPC Endpoints). Khách hàng có hai tùy chọn bao gồm: 1. Endpoint dạng kết nối định tuyến chuyển tiếp (Gateway): Thiết kế truyền thống, điều hướng cấu trúc định tuyến (route table), miễn phí, chuyên sử dụng cho các nền tảng S3 hay DynamoDB (Chọn A). 2. Endpoint dựa trên nền tảng kết cấu cổng mạng linh hoạt (Interface): Hoạt động thông qua kiến trúc PrivateLink của AWS với một card mạng nhận dạng IP, có khả năng linh hoạt và mở rộng cho vô số hệ thống ứng dụng đối tác bảo mật (Chọn B)."},{t:"Một quy hoạch kiến trúc mạng lưới cấu trúc nên không gian gồm 3 VPC độc lập (VPC A, VPC B, VPC C). Tất cả khối không gian quản lý phân bổ địa chỉ (CIDR) đều không xung đột (non-overlapping). Mạng A và mạng C hiện đang sở hữu định tuyến liên kết chéo ngang hàng (VPC peering connections) hoàn toàn độc lập quy tụ vào mạng B. Tuy nhiên, bất chấp kết nối này, nền tảng của mạng A hoàn toàn vô hiệu hóa khả năng nhận diện định tuyến của mạng C. Phương thức tái thiết kế nào có khả năng thông luồng giao tiếp dữ liệu giữa A và C với kết quả tối ưu chi phí và tinh gọn nhất?",o:["A. Thao tác điều hướng thay đổi cấu hình mã luật định tuyến trên mạng B, nhằm mở khóa luồng dữ liệu trung gian cho A sang C.","B. Chủ động tạo thêm một kiến trúc kết nối ngang hàng (peering connection) trực tiếp liên thông A với C, đồng thời tái thiết lập bảng định tuyến trên cả hai hướng để quy luồng.","C. Thiết lập định dạng lại kiến trúc bằng mạng chuyển mạch trung gian Transit VPC, kết nối các VPC với nhau, rồi ép toàn bộ lưu lượng phân luồng tại đó.","D. Thiết lập những trạm điểm cuối VPC (endpoints) đơn lẻ trên máy chủ cụ thể ở VPC A để tìm cách chuyển dữ liệu mã hóa tĩnh từ mạng C."],a:"B. Chủ động tạo thêm một kiến trúc kết nối ngang hàng (peering connection) trực tiếp liên thông A với C, đồng thời tái thiết lập bảng định tuyến trên cả hai hướng để quy luồng.",e:"Trọng tâm cốt lõi của nguyên tắc thiết kế kết nối ngang hàng trên hạ tầng mạng đám mây AWS (VPC Peering) là tính chất ngăn chặn đặc quyền cầu nối trung chuyển (non-transitive routing). Bất kể cả hệ thống A và hệ thống C đều có kết nối hợp pháp định tuyến với trung tâm B, máy chủ đặt tại mạng B vĩnh viễn không thể đóng vai trò làm trạm tiếp sóng gói tin dẫn luồng để A định hướng dữ liệu liên kết gián tiếp thấy được máy chủ C. Để hệ thống thông nhau, khách hàng bị bắt buộc phải tạo dựng mạng kết nối Peering trực diện và độc quyền nối thẳng A và C. (Câu B)."},{t:"Trong một tình huống ứng phó gián đoạn kinh doanh do thảm họa thiên tai, một trung tâm dữ liệu tại chỗ cấp hai (secondary data center) của công ty đã buộc phải vận hành chuyển dịch trên nền tảng không gian làm việc cơ động chỉ duy trì phương thức kết nối băng thông internet. Yêu cầu đặt ra là thiết lập một liên kết mạng bảo mật vào không gian hạ tầng đám mây (VPC) mà tính bằng tiêu chí vận hành hiệu quả càng nhanh chóng càng tốt, do trung tâm dự kiến dỡ bỏ và di tản lần hai trong vòng 2 tuần tới. Lựa chọn thiết bị hoặc giao thức thiết kế kỹ thuật nào nhằm thỏa mãn hoàn toàn bối cảnh khẩn cấp này?",o:["A. Kênh liên kết dữ liệu mã hóa ảo AWS Site-to-Site VPN","B. Mạng kết nối cáp vật lý AWS Direct Connect","C. Cơ chế đường hầm chuyên dụng VPC endpoints","D. Giải pháp ngang hàng kiến trúc mạng VPC peering"],a:"A. Kênh liên kết dữ liệu mã hóa ảo AWS Site-to-Site VPN",e:"Đối mặt với yếu tố thời gian là giới hạn (operational as soon as possible) và tính chất lưu trữ tạm bợ chỉ trong vỏn vẹn \"2 tuần\", đường hầm kết nối truyền dẫn VPN (Site-to-Site VPN) là giải pháp chiến thắng tuyệt đối. Việc triển khai VPN diễn ra hoàn toàn dựa trên nền tảng internet cơ hữu và chỉ mất thời gian đo đếm bằng phút. Phương án cáp viễn thông kết nối vật lý AWS Direct Connect (B) mặc dù cung cấp băng thông bảo mật nhưng quá trình lập hợp đồng, kéo cáp thiết lập sẽ tiêu tốn từ vài tuần lên đến vài tháng."},{t:"Một hệ thống mạng lõi của công ty ghi nhận rủi ro bị mất mát giao thức lưu lượng (packet loss) do độ nghẽn đường truyền trên các điểm trung chuyển của nhà mạng viễn thông. Họ mong muốn triển khai một thiết kế để tiếp nhận đường truyền nội bộ khách hàng kết nối vào mạng lưới đám mây của Amazon một cách tối ưu, thông qua trung tâm biên (edge location) tiếp cận gần nhất đối với các cổng kết nối cục bộ của hệ thống nội mạng. AWS phát triển một nền tảng nào xử lý yêu cầu tối ưu hóa đường truyền như vậy?",o:["A. Nền tảng điều hướng và tăng tốc phân tán AWS Global Accelerator","B. Giao thức cáp chuyên dụng AWS Direct Connect","C. Trung tâm định tuyến mạng AWS Transit Gateway","D. Cổng truyền dẫn phân mảnh VPN cục bộ AWS VPN CloudHub"],a:"A. Nền tảng điều hướng và tăng tốc phân tán AWS Global Accelerator",e:"Global Accelerator hoạt động giống như một thiết bị tìm và dẫn đường ưu việt. Bằng cách định tuyến luồng truy cập của khách hàng tiếp nhận từ các điểm máy chủ phân tán ngoại vi (Edge Location) gần nhất, nó lập tức nén gói tin và ép thông lượng dữ liệu này đi vào dải mạng cáp quang riêng, độ trễ siêu thấp và được bảo vệ độc quyền của chính Amazon AWS, thay vì di chuyển ngẫu nhiên và nghẽn luồng trên không gian rủi ro và hỗn loạn của mạng lưới Internet công cộng."},{t:"Một quy trình thiết lập nền tảng sao lưu hàng đêm cực kỳ đồ sộ từ trung tâm dữ liệu tại chỗ lên môi trường khôi phục của đám mây AWS. Hệ thống kiến trúc đòi hỏi phải vận hành với tiêu chuẩn băng thông cung cấp và tốc độ lưu lượng mạng được cam kết với chất lượng mang hiệu suất cao và sự ổn định cao nhất mà không bị giới hạn biến động. Đâu là mô hình chuẩn cho phương án thiết kế này?",o:["A. Khởi tạo cầu nối bảo mật (VPC) peering","B. Tuyến đường dây cáp viễn thông bảo mật AWS Direct Connect","C. Mạng riêng ảo kết nối bảo mật AWS Site-to-Site VPN","D. Các liên kết cơ sở hạ tầng (VPC) endpoints"],a:"B. Tuyến đường dây cáp viễn thông bảo mật AWS Direct Connect",e:"Nếu khách hàng lựa chọn thiết lập truyền dẫn giao thức qua VPN (C), toàn bộ luồng lưu lượng buộc phải điều hướng chung thông qua không gian hạ tầng của các nhà mạng trên Internet, tốc độ có thể chậm do yếu tố khách quan không thể cam kết và kiểm soát. Phương án AWS Direct Connect mang tới một cáp quang riêng biệt hoàn toàn trực tiếp liên kết trung tâm hạ tầng dữ liệu của khách hàng đâm xuyên thẳng đến Data Center khổng lồ của AWS, nhằm cam kết băng thông tốc độ (1Gbps, 10Gbps, hoặc 100Gbps) ổn định vững chắc tuyệt đối 100%."},{t:"Không gian hạ tầng mạng của hệ thống nội bộ đang sử dụng phương thức liên kết truyền tải dữ liệu trực tiếp độc quyền bằng nền tảng của mạng AWS Direct Connect. Quản trị viên đang có kế hoạch tái đánh giá kiến trúc với mục tiêu thiết lập một lớp áo giáp kết nối nhằm bảo vệ rủi ro ngắt mạng cho hệ thống (Highly available), thông qua phương án xây dựng một hệ thống đường dây dự phòng, nhưng áp đặt quy định ngân sách tiết kiệm nhất có thể. Giao thức kết nối dự phòng nào thỏa mãn yếu tố thiết kế với chi phí vận hành siêu thấp (cost-effective solution)?",o:["A. Đăng ký mua thêm một mạng cáp quang Direct Connect kết nối thông qua một trạm thiết bị nhà cung cấp vị trí địa lý Direct Connect tách biệt.","B. Thiết lập mạng riêng ảo cục bộ theo yêu cầu (Client VPN connection) dựa trên thiết bị kết nối đơn.","C. Đăng ký mua thêm một mạng cáp quang Direct Connect bổ sung chia sẻ thông qua chung một trạm đấu nối địa lý Direct Connect.","D. Kích hoạt dự phòng thiết lập cấu hình kết nối mạng riêng ảo AWS Site-to-Site VPN theo nhu cầu (on-demand) tận dụng trên đường truyền cáp internet của tổ chức."],a:"D. Kích hoạt dự phòng thiết lập cấu hình kết nối mạng riêng ảo AWS Site-to-Site VPN theo nhu cầu (on-demand) tận dụng trên đường truyền cáp internet của tổ chức.",e:"Mặc dù việc mua thêm một sợi cáp vật lý dự phòng cấu hình song song của nền tảng AWS Direct Connect (như A hoặc C) mang đến băng thông tuyệt vời nhưng đi kèm mức chi tiêu rất đắt đỏ. Nếu cấu trúc tổ chức ưu tiên \"Tiết kiệm chi phí vận hành nhất\", chiến lược tạo bộ kết nối dự phòng Site-to-Site VPN trở thành phương án số 1. Phương án này chỉ phát sinh các phí tổn siêu nhỏ (on-demand) về sử dụng giao thức khi được chỉ định khởi động nhằm vá lỗi hệ thống ngắt sóng và làm tuyến truyền dự phòng trong khi hạ tầng đường cáp chính thực hiện thay thế sửa chữa."},{t:"Hệ thống kiến trúc phân tán kết nối quy tụ từ một Đám mây riêng ảo (VPC) phân nhánh đến hàng loạt mạng lưới các trung tâm hạ tầng dữ liệu khác nhau trên toàn quốc dựa trên phương pháp ảo hóa mạng (VPN). Phương án thiết kế triển khai tích hợp kỹ thuật mạng lưới nào có đủ tính chất để đem lại cấu trúc chống chịu đứt đoạn (resiliency) mạnh mẽ đồng thời giải quyết bài toán nhu cầu về cam kết băng thông luồng dữ liệu (predictable bandwidth) không suy giảm?",o:["A. Xây dựng môi trường mạng kết nối cáp quang Direct Connect giữ vai trò truyền tải mạch chính (primary), đồng thời dự phòng một lớp mã hóa ảo VPN thiết lập khả năng chịu lỗi (secondary failover) cho mỗi trung tâm dữ liệu khi sự cố khởi phát.","B. Sử dụng hoàn toàn bộ định tuyến cấu hình quy mô AWS Transit Gateway gắn vào để phân luồng.","C. Chuyển hướng theo định hình mô hình mạng không gian liên kết đồ thị lưới (mesh topology) như phương án liên kết Amazon VPC peering.","D. Áp dụng kỹ thuật giao thức tự động mở khóa đường vòng (BGP) thiết lập kết nối xuyên biên giới ở nhiều vùng đám mây."],a:"A. Xây dựng môi trường mạng kết nối cáp quang Direct Connect giữ vai trò truyền tải mạch chính (primary), đồng thời dự phòng một lớp mã hóa ảo VPN thiết lập khả năng chịu lỗi (secondary failover) cho mỗi trung tâm dữ liệu khi sự cố khởi phát.",e:"Kiến trúc câu hỏi đặt ra hai giới hạn khó khăn nhất trong quá trình quy hoạch định tuyến mạng. 1. Để đảm bảo luồng giao thông xử lý lưu lượng mạng không tắc nghẽn cũng như băng thông ổn định tuyệt đối (predictable bandwidth): Bắt buộc khách hàng phải ưu tiên cấu trúc vận chuyển bằng cáp chuyên tuyến vật lý AWS Direct Connect cho hệ thống chính. 2. Để đảm bảo mức độ chịu đựng rủi ro (resiliency): Cấu hình bổ sung hệ thống tạo đường hầm VPN chạy ẩn với vai trò giám sát, khi hệ thống cáp chính đứt tín hiệu, luồng dữ liệu sẽ ngay lập tức được \"nhảy\" chuyển hướng (failover) thông qua cấu trúc truyền thông Internet để duy trì dịch vụ. Đây được xem như là mô hình chuẩn hóa tiêu chuẩn trong thiết kế hạ tầng Enterprise tại AWS."}]},{id:9,title:"Quản lý Định danh và Truy cập (Identity and Access Management)",questions:[{t:"Đâu là các đặc điểm của một nhóm (group) trong AWS Identity and Access Management (IAM)? (Chọn 2)",o:["A. Một nhóm có thể thuộc về một nhóm khác.","B. Một người dùng (user) có thể thuộc nhiều nhóm.","C. Một nhóm có thể sở hữu thông tin xác thực bảo mật riêng.","D. Những người dùng mới được thêm vào một nhóm sẽ kế thừa các quyền của nhóm đó.","E. Các quyền trong chính sách của nhóm luôn ghi đè các quyền trong chính sách của người dùng."],a:"B. Một người dùng có thể thuộc nhiều nhóm và D. Những người dùng mới được thêm vào một nhóm sẽ kế thừa các quyền của nhóm đó.",e:"Trong IAM, Nhóm (Group) là một tập hợp các Người dùng (User) nhằm mục đích quản lý quyền hạn hàng loạt. Một Người dùng có thể nằm trong nhiều Nhóm cùng lúc (B). Khi bạn thêm một người dùng mới vào Nhóm, họ sẽ tự động được hưởng tất cả các quyền mà Nhóm đó đang sở hữu (D). (Lưu ý: Không thể tạo nhóm lồng bên trong nhóm (A sai) và Nhóm chỉ là ranh giới quản lý nên không có thông tin đăng nhập riêng biệt (C sai))."},{t:"Lợi thế của việc sử dụng mô hình Kiểm soát truy cập dựa trên thuộc tính (Attribute-Based Access Control - ABAC) so với Kiểm soát truy cập dựa trên vai trò (Role-Based Access Control - RBAC) là gì?",o:["A. ABAC yêu cầu ít quá trình kiểm thử hơn so với RBAC.","B. Các quyền của ABAC xác định rõ ràng các tài nguyên mà chúng bảo vệ.","C. ABAC có khả năng yêu cầu số lượng chính sách (policies) ít hơn so với RBAC.","D. Các quyền của ABAC an toàn hơn so với các quyền của RBAC."],a:"C. ABAC có khả năng yêu cầu số lượng chính sách ít hơn so với RBAC.",e:"Với RBAC truyền thống, mỗi khi có vị trí công việc mới bạn phải tạo thêm chính sách mới. Với ABAC, bạn phân quyền dựa trên các \"Thẻ\" (Tags) động. Ví dụ: \"Chỉ cho phép truy cập nếu thẻ 'Phòng ban' của người dùng khớp với thẻ 'Phòng ban' của tài nguyên\". Khi đó, bạn chỉ cần tạo một chính sách chung duy nhất cho toàn bộ công ty, giúp mở rộng quy mô quản trị tinh gọn hơn rất nhiều."},{t:"Một lập trình viên là thành viên của một nhóm IAM có đính kèm một chính sách nhóm. Chính sách nhóm này cho phép truy cập vào Amazon S3 và Amazon EC2, nhưng từ chối truy cập vào Amazon Elastic Container Service (Amazon ECS). Lập trình viên đó cũng có một chính sách người dùng được đính kèm trực tiếp, cho phép truy cập vào Amazon ECS và Amazon CloudFront. Quyền truy cập thực tế của người dùng này là gì?",o:["A. Được truy cập Amazon ECS và Amazon CloudFront, nhưng không được truy cập Amazon S3 và Amazon EC2.","B. Được truy cập Amazon S3 và Amazon EC2, nhưng không được truy cập Amazon ECS và Amazon CloudFront.","C. Được truy cập Amazon S3, Amazon EC2 và Amazon CloudFront, nhưng không được truy cập Amazon ECS.","D. Được truy cập Amazon S3, Amazon EC2, Amazon ECS và Amazon CloudFront."],a:"C. Được truy cập Amazon S3, Amazon EC2 và Amazon CloudFront, nhưng không được truy cập Amazon ECS.",e:"Đây là quy tắc đánh giá quyền hạn cốt lõi của AWS: Lệnh \"Từ chối rõ ràng\" (Explicit Deny) luôn luôn ghi đè và chiến thắng mọi lệnh \"Cho phép\" (Allow). Mặc dù chính sách cá nhân cho phép truy cập ECS, nhưng chính sách của nhóm đã lệnh \"Deny\" ECS, nên kết quả cuối cùng là người này bị cấm truy cập ECS hoàn toàn. Các dịch vụ khác không có xung đột (S3, EC2, CloudFront) nên vẫn được phép truy cập bình thường."},{t:"Lợi ích của việc thiết lập Liên kết danh tính (Identity federation) với Đám mây AWS là gì?",o:["A. Nó loại bỏ sự cần thiết phải định nghĩa các quyền trong IAM để bảo mật quyền truy cập vào tài nguyên AWS.","B. Nó tập trung hóa việc lưu trữ và quản lý danh tính người dùng vào bên trong AWS.","C. Nó gán các vai trò (roles) cho những người dùng đã xác thực để kiểm soát quyền truy cập của họ vào tài nguyên AWS.","D. Nó cho phép sử dụng nhà cung cấp danh tính bên ngoài để xác thực người dùng trong nội bộ tổ chức và cấp cho họ quyền truy cập vào tài nguyên AWS."],a:"D. Nó cho phép sử dụng nhà cung cấp danh tính bên ngoài để xác thực người dùng trong nội bộ tổ chức và cấp cho họ quyền truy cập vào tài nguyên AWS.",e:"Identity Federation (Liên kết danh tính) cho phép nhân viên sử dụng chính hệ thống định danh sẵn có của công ty (như Microsoft Active Directory, Google Workspace) để đăng nhập thẳng vào hệ thống AWS. Quản trị viên không cần phải tạo thêm và duy trì hàng ngàn tài khoản IAM rời rạc trên đám mây, giúp quản lý thông tin đăng nhập tập trung và an toàn hơn."},{t:"Dịch vụ nào hỗ trợ cung cấp liên kết danh tính (identity federation) dành cho người dùng truy cập vào một ứng dụng web đang chạy trên Đám mây AWS?",o:["A. AWS CloudHSM","B. AWS WAF","C. Amazon Cognito","D. AWS Key Management Service (AWS KMS)"],a:"C. Amazon Cognito",e:"Amazon Cognito là dịch vụ được thiết kế chuyên biệt để cung cấp hệ thống quản lý danh tính, xác thực và ủy quyền dành cho các ứng dụng web và thiết bị di động. Nó cho phép người dùng cuối của bạn đăng nhập qua các nền tảng mạng xã hội (Facebook, Google, Apple) hoặc thông qua hệ thống định danh của doanh nghiệp."},{t:"Dịch vụ nào hỗ trợ quản lý tập trung thanh toán hóa đơn, kiểm soát quyền truy cập, tuân thủ và bảo mật, đồng thời chia sẻ tài nguyên xuyên suốt trên nhiều tài khoản AWS khác nhau?",o:["A. AWS Systems Manager","B. AWS Organizations","C. AWS Identity and Access Management (IAM)","D. Amazon Cognito"],a:"B. AWS Organizations",e:"Khi một doanh nghiệp mở rộng quy mô và quản lý hàng chục tài khoản AWS độc lập (cho từng phòng ban, dự án), AWS Organizations là công cụ hợp nhất tất cả. Nó giúp bạn thanh toán trên một hóa đơn tổng duy nhất (Consolidated Billing) và áp đặt các quy chuẩn bảo mật thống nhất cho toàn bộ các tài khoản con."},{t:"Một công ty công nghệ có nhiều tài khoản môi trường sản xuất (production accounts) được nhóm vào một Đơn vị tổ chức (Organizational Unit - OU) sản xuất trong AWS Organizations. Công ty muốn ngăn chặn tuyệt đối tất cả người dùng IAM trong các tài khoản này xóa nhật ký AWS CloudTrail. Quản trị viên hệ thống có thể thực thi hạn chế này bằng cách nào?",o:["A. Tạo một chính sách IAM và gắn nó vào từng người dùng IAM trong các tài khoản sản xuất.","B. Tạo một Chính sách kiểm soát dịch vụ (Service Control Policy - SCP) và gắn nó vào OU sản xuất.","C. Tạo một chính sách thẻ (tag policy) và gắn nó vào các tài khoản sản xuất.","D. Tạo một chính sách Amazon S3 bucket và liên kết với tất cả các bucket chứa nhật ký CloudTrail."],a:"B. Tạo một Chính sách kiểm soát dịch vụ (Service Control Policy - SCP) và gắn nó vào OU sản xuất.",e:"SCP là cấp độ quản lý \"quyền lực tối cao\" trong nền tảng AWS Organizations. Khi bạn áp dụng một SCP có nội dung cấm xóa nhật ký lên một khối OU, thì quy định này sẽ đè bẹp mọi quyền hạn bên dưới; thậm chí ngay cả người dùng quản trị tối cao (Administrator) của các tài khoản con trong OU đó cũng không thể thực hiện hành động bị cấm."},{t:"Một lập trình viên đang viết một ứng dụng máy khách (client) nhằm mã hóa dữ liệu nhạy cảm bằng Khóa dữ liệu (Data key) trước khi gửi đến máy chủ. Ứng dụng máy khách cũng gửi luôn Khóa dữ liệu đó đến máy chủ để máy chủ có thể giải mã thông tin. Lập trình viên lo ngại rằng tính bảo mật của dữ liệu sẽ bị xâm phạm nếu Khóa dữ liệu bị đánh cắp trên đường truyền. Loại mã hóa nào nên được sử dụng để bảo vệ tối đa thông tin nhạy cảm này?",o:["A. Mã hóa bất đối xứng (Asymmetric encryption)","B. Mã hóa đối xứng (Symmetric encryption)","C. Mã hóa phía máy chủ (Server-side encryption)","D. Mã hóa phong bì (Envelope encryption)"],a:"D. Mã hóa phong bì (Envelope encryption)",e:"Mã hóa phong bì là phương pháp bảo mật tiêu chuẩn cao nhất trong kiến trúc đám mây. Dữ liệu thực tế được mã hóa bằng một Khóa dữ liệu (Data Key). Tuy nhiên, để ngăn chặn việc Khóa dữ liệu bị lộ, chính nó sẽ lại được mã hóa thêm một lần nữa bằng một Khóa chính cấp cao hơn (Master Key). Kẻ gian dù có đánh cắp được Khóa dữ liệu mã hóa thì cũng không thể giải mã được nó nếu không nắm giữ Khóa chính."},{t:"AWS Key Management Service (AWS KMS) cung cấp những chức năng cốt lõi nào? (Chọn 2)",o:["A. Xác thực người dùng bên ngoài","B. Tạo các khóa mã hóa đối xứng và bất đối xứng","C. Tạo khóa truy cập (access keys) cho AWS IAM","D. Lưu trữ dữ liệu đã được mã hóa","E. Xoay vòng (thay thế) các khóa"],a:"B. Tạo các khóa mã hóa đối xứng và bất đối xứng và E. Xoay vòng các khóa.",e:"AWS KMS là dịch vụ trung tâm để tạo lập và kiểm soát các khóa mã hóa. Hai chức năng chính của nó là sinh ra các khóa mật mã (khóa đối xứng hoặc khóa công khai/bí mật bất đối xứng) và hỗ trợ cơ chế tự động xoay vòng khóa (Rotate keys) định kỳ. Việc xoay vòng khóa giúp hạn chế rủi ro trong trường hợp một khóa bị lộ mà không cần phải can thiệp thủ công mã hóa lại toàn bộ dữ liệu."},{t:"Dịch vụ AWS nào tự động rà soát, phát hiện và bảo vệ các thông tin nhạy cảm được lưu trữ trên Amazon S3 trong một tài khoản AWS?",o:["A. AWS Audit Manager","B. Amazon Macie","C. Amazon Detective","D. AWS Resource Access Manager (AWS RAM)"],a:"B. Amazon Macie",e:"Amazon Macie là dịch vụ bảo mật dữ liệu sử dụng công nghệ học máy (Machine Learning) và so khớp mẫu nhận dạng (Pattern matching) để tự động quét các tệp tin lưu trong S3. Nếu nó phát hiện ra các thông tin mang tính nhận dạng cá nhân (PII) như số thẻ tín dụng, số căn cước công dân hoặc dữ liệu tài chính bị phơi bày, nó sẽ lập tức đưa ra cảnh báo cho quản trị viên."}]},{id:10,title:"Tự động hóa hạ tầng đám mây (Automating Infrastructure)",questions:[{t:"Dịch vụ nào đóng vai trò là dịch vụ Hạ tầng dưới dạng mã (Infrastructure as Code - IaC) được sử dụng để tự động hóa quá trình khởi tạo và quản lý các tài nguyên AWS?",o:["A. AWS Systems Manager","B. AWS CloudFormation","C. AWS Elastic Beanstalk","D. AWS OpsWorks"],a:"B. AWS CloudFormation",e:"AWS CloudFormation là dịch vụ cho phép người dùng định nghĩa toàn bộ kiến trúc hạ tầng đám mây của mình dưới dạng các tệp tin văn bản thuần túy (theo định dạng YAML hoặc JSON). Khi tệp tin này được thực thi, hệ thống AWS sẽ tự động phân tích cú pháp và khởi tạo chính xác tất cả các tài nguyên đã được khai báo, đảm bảo quá trình triển khai diễn ra hoàn toàn tự động và không có sai sót do thao tác thủ công."},{t:"Lợi ích cốt lõi của việc sử dụng phương pháp Hạ tầng dưới dạng mã (IaC) để tự động hóa quản lý tài nguyên là gì?",o:["A. Đơn giản hóa việc thiết lập và bảo trì các tài nguyên mạng nội bộ (on-premises).","B. Cung cấp một giao diện đồ họa người dùng để quản lý tài nguyên AWS.","C. Làm giảm sự phụ thuộc vào AWS Management Console trong việc cung cấp tài nguyên.","D. Cho phép sử dụng các khuôn mẫu (templates) để cung cấp và quản lý một tập hợp các tài nguyên theo một phương thức nhất quán và có thể lặp lại nhiều lần."],a:"D. Cho phép sử dụng các khuôn mẫu (templates) để cung cấp và quản lý một tập hợp các tài nguyên theo một phương thức nhất quán và có thể lặp lại nhiều lần.",e:"Phương pháp IaC cho phép bạn viết ra các \"bản thiết kế\" (templates) mô tả hạ tầng. Lợi ích lớn nhất là bạn có thể tái sử dụng bản thiết kế này để triển khai hệ thống đi triển khai lại vô hạn lần (repeatable) mà vẫn đảm bảo kết quả đầu ra đồng nhất tuyệt đối (consistent), loại bỏ hoàn toàn nguy cơ sai lệch cấu hình do con người thao tác thủ công trên giao diện web."},{t:"Thành phần nào của CloudFormation được sử dụng để mô tả khai báo các tài nguyên AWS mà bạn muốn tạo và quản lý?",o:["A. Khuôn mẫu (Templates)","B. Ngăn xếp (Stacks)","C. Bộ thay đổi (Change sets)","D. Tài nguyên (Resources)"],a:"A. Khuôn mẫu (Templates)",e:"Template (Khuôn mẫu) là tệp tin văn bản (JSON hoặc YAML) chứa toàn bộ các khai báo về tài nguyên hạ tầng mà bạn muốn AWS khởi tạo. Bên trong tệp này, bạn sẽ liệt kê chi tiết cấu hình mạng lưới, máy chủ ảo, cơ sở dữ liệu và các quy tắc bảo mật cần thiết cho hệ thống."},{t:"Thành phần nào của CloudFormation được sử dụng để quản lý một tập hợp toàn bộ các tài nguyên AWS như một đơn vị hệ thống duy nhất?",o:["A. Tài nguyên (Resources)","B. Bộ thay đổi (Change sets)","C. Ngăn xếp (Stacks)","D. Khuôn mẫu (Templates)"],a:"C. Ngăn xếp (Stacks)",e:"Khi một bản Khuôn mẫu (Template) được mang đi triển khai, AWS sẽ khởi tạo các tài nguyên vật lý thực tế và gom tất cả chúng vào một nhóm quản lý thống nhất gọi là Ngăn xếp (Stack). Bạn có thể cập nhật hoặc xóa toàn bộ Stack này cùng một lúc thay vì phải thao tác trên từng tài nguyên đơn lẻ, giúp tiết kiệm thời gian và tránh bỏ sót tài nguyên rác gây phát sinh chi phí."},{t:"Một kiến trúc sư giải pháp muốn xem trước những tác động thay đổi mà CloudFormation sẽ áp dụng lên một ngăn xếp (stack) trước khi chính thức thực thi. Họ nên sử dụng thành phần nào của CloudFormation?",o:["A. Bộ thay đổi (Change sets)","B. Khuôn mẫu (Templates)","C. Ngăn xếp (Stacks)","D. Phát hiện sai lệch (Drift detection)"],a:"A. Bộ thay đổi (Change sets)",e:"Change sets (Bộ thay đổi) cho phép kiến trúc sư xem trước một bản tóm tắt đầy đủ và chi tiết về tất cả các thay đổi dự kiến sẽ diễn ra: tài nguyên nào sẽ được tạo mới, tài nguyên nào sẽ bị chỉnh sửa, và đặc biệt là tài nguyên nào sẽ bị xóa bỏ. Việc rà soát này giúp đảm bảo tính an toàn tối đa cho hệ thống sản xuất đang vận hành trước khi áp dụng bất kỳ thay đổi nào."},{t:"Dịch vụ AWS nào cung cấp một giao diện quản trị tập trung thống nhất để tự động hóa và quản lý các tác vụ vận hành trên toàn bộ tài nguyên AWS của bạn?",o:["A. AWS CloudFormation","B. AWS OpsWorks","C. AWS Systems Manager","D. AWS Elastic Beanstalk"],a:"C. AWS Systems Manager",e:"AWS Systems Manager (SSM) là công cụ quản lý trung tâm đa năng, cho phép quản trị viên giám sát trạng thái, thu thập thông tin cấu hình, thực thi lệnh từ xa và tự động hóa hàng loạt các tác vụ quản trị trên dàn máy chủ EC2 hoặc hạ tầng tại chỗ (on-premises), tất cả thông qua một bảng điều khiển duy nhất mà không cần đăng nhập thủ công vào từng máy chủ."},{t:"Tính năng nào của AWS Systems Manager cung cấp khả năng thực thi các tập lệnh (scripts) hoặc mệnh lệnh trực tiếp trên một cụm (fleet) các máy chủ Amazon EC2?",o:["A. State Manager","B. Run Command","C. Automation","D. Patch Manager"],a:"B. Run Command",e:"Run Command cho phép người quản trị thực thi các lệnh hệ thống (như cài đặt phần mềm, thay đổi cấu hình, thu thập nhật ký) trên hàng loạt máy chủ EC2 cùng một lúc với quy mô lớn. Điểm nổi bật là quá trình này không yêu cầu phải mở kết nối SSH hay RDP trực tiếp vào từng máy, giúp duy trì bảo mật bằng cách đóng kín các cổng mạng rủi ro."},{t:"Một công ty muốn xây dựng quy trình tự động hóa hoàn toàn việc cài đặt các bản vá lỗi (patching) cho các máy chủ Amazon EC2 của họ. Họ nên sử dụng tính năng nào của AWS Systems Manager?",o:["A. Run Command","B. State Manager","C. Patch Manager","D. Automation"],a:"D. Automation",e:"Tính năng Automation được thiết kế chuyên biệt để đơn giản hóa và tự động hóa các quy trình quản trị hệ thống CNTT phức tạp và lặp đi lặp lại. Quản trị viên có thể xây dựng các Sách hướng dẫn vận hành (Runbooks) thiết lập chuỗi công việc tự động hoàn chỉnh: từ việc dừng máy ảo, sao lưu dữ liệu, áp dụng bản vá lỗi hệ điều hành, cho đến khởi động lại hệ thống, mọi bước đều diễn ra tự động theo kịch bản đã lập trình sẵn."},{t:"Dịch vụ AWS nào mang đến giải pháp dễ dàng nhất cho các nhà phát triển để triển khai và mở rộng quy mô các ứng dụng web, hỗ trợ sẵn hàng loạt các nền tảng ngôn ngữ lập trình phổ biến?",o:["A. AWS OpsWorks","B. AWS CloudFormation","C. AWS Systems Manager","D. AWS Elastic Beanstalk"],a:"D. AWS Elastic Beanstalk",e:"Elastic Beanstalk là nền tảng Nền tảng dưới dạng dịch vụ (PaaS) giúp lập trình viên triển khai ứng dụng cực kỳ nhanh chóng. Người phát triển chỉ cần tải mã nguồn ứng dụng lên (viết bằng Java, .NET, PHP, Node.js, Python, Ruby, Go...), Elastic Beanstalk sẽ tự động đảm nhận toàn bộ quá trình thiết lập hạ tầng phức tạp bao gồm khởi tạo máy chủ, cấu hình bộ cân bằng tải, thiết lập tự động mở rộng và giám sát tình trạng sức khỏe hệ thống."},{t:"Lợi ích kỹ thuật lớn nhất của việc sử dụng AWS Elastic Beanstalk để triển khai các ứng dụng web là gì?",o:["A. Cung cấp toàn quyền kiểm soát tuyệt đối đối với các tài nguyên hạ tầng cơ sở bên dưới.","B. Tự động xử lý hoàn toàn các khâu triển khai, phân bổ năng lực máy chủ, cân bằng tải và tự động mở rộng quy mô ứng dụng.","C. Trực tiếp làm giảm chi phí vận hành khi chạy các ứng dụng web trên hạ tầng AWS.","D. Cho phép sử dụng các khuôn mẫu (templates) để chủ động cung cấp và quản lý tài nguyên AWS."],a:"B. Tự động xử lý hoàn toàn các khâu triển khai, phân bổ năng lực máy chủ, cân bằng tải và tự động mở rộng quy mô ứng dụng.",e:"Đây là giá trị cốt lõi và tính năng nổi bật nhất của Elastic Beanstalk. Nền tảng này giúp ẩn đi toàn bộ sự phức tạp của hạ tầng điện toán đám mây bên dưới. Nó tự động hóa tất cả những công việc cấu trúc hệ thống nặng nhọc (triển khai mã nguồn, cấp phát tài nguyên máy chủ, thiết lập cân bằng tải, cấu hình tự động mở rộng), qua đó cho phép đội ngũ kỹ sư phần mềm chuyên tâm hoàn toàn vào việc phát triển tính năng sản phẩm và viết mã ứng dụng."}]},{id:11,title:"Quản lý hạ tầng đám mây (Infrastructure as Code)",questions:[{t:"Dịch vụ nào đóng vai trò là dịch vụ Hạ tầng dưới dạng mã (Infrastructure as Code - IaC) được sử dụng để tự động hóa quá trình khởi tạo và quản lý các tài nguyên AWS?",o:["A. AWS Systems Manager","B. AWS CloudFormation","C. AWS Elastic Beanstalk","D. AWS OpsWorks"],a:"B. AWS CloudFormation",e:"CloudFormation là dịch vụ cốt lõi của AWS cho phép bạn mô phỏng toàn bộ hạ tầng đám mây (bao gồm VPC, EC2, RDS, IAM...) thành các đoạn mã lập trình (định dạng JSON hoặc YAML). Khi bạn thực thi tệp tin này, hệ thống AWS sẽ tự động phân tích và xây dựng tất cả các tài nguyên một cách chính xác theo bản thiết kế kiến trúc."},{t:"Lợi ích cốt lõi của việc sử dụng phương pháp Hạ tầng dưới dạng mã (IaC) để tự động hóa quản lý tài nguyên là gì?",o:["A. Đơn giản hóa việc thiết lập và bảo trì các tài nguyên mạng nội bộ (on-premises).","B. Cung cấp một giao diện đồ họa người dùng để quản lý tài nguyên AWS.","C. Làm giảm sự phụ thuộc vào AWS Management Console trong việc cung cấp tài nguyên.","D. Cho phép sử dụng các khuôn mẫu (templates) để cung cấp và quản lý một tập hợp các tài nguyên theo một phương thức nhất quán và có thể lặp lại nhiều lần."],a:"D. Cho phép sử dụng các khuôn mẫu (templates) để cung cấp và quản lý một tập hợp các tài nguyên theo một phương thức nhất quán và có thể lặp lại nhiều lần.",e:"Bằng cách biến hạ tầng thành mã nguồn (IaC), bạn tạo ra các \"khuôn mẫu\" thiết kế. Lợi ích lớn nhất là bạn có thể tái sử dụng khuôn mẫu này để triển khai các môi trường sao chép (như môi trường thử nghiệm Test, môi trường sản xuất Production) hàng trăm lần (repeatable) mà vẫn đảm bảo độ chính xác và tính nhất quán tuyệt đối (consistent), loại bỏ hoàn toàn các lỗi sai sót do thao tác thủ công."},{t:"Thành phần nào của CloudFormation được sử dụng để mô tả khai báo các tài nguyên AWS mà bạn muốn tạo và quản lý?",o:["A. Khuôn mẫu (Templates)","B. Ngăn xếp (Stacks)","C. Bộ thay đổi (Change sets)","D. Tài nguyên (Resources)"],a:"A. Khuôn mẫu (Templates)",e:"Template (Khuôn mẫu) thực chất là tệp tin văn bản chứa mã nguồn kiến trúc (JSON/YAML). Trong tệp này, bạn sẽ khai báo thiết kế chi tiết về cấu hình của mạng, máy chủ ảo, cơ sở dữ liệu và các quy tắc bảo mật mà bạn dự định khởi tạo."},{t:"Thành phần nào của CloudFormation được sử dụng để quản lý một tập hợp toàn bộ các tài nguyên AWS như một đơn vị hệ thống duy nhất?",o:["A. Tài nguyên (Resources)","B. Bộ thay đổi (Change sets)","C. Ngăn xếp (Stacks)","D. Khuôn mẫu (Templates)"],a:"C. Ngăn xếp (Stacks)",e:"Khi một Khuôn mẫu (Template) được mang đi thực thi, AWS sẽ tạo ra một nhóm tài nguyên vật lý và gom tất cả chúng lại thành một khối logic gọi là Ngăn xếp (Stack). Sự tiện lợi của Stack là nếu bạn muốn gỡ bỏ hệ thống, bạn chỉ cần ra lệnh xóa Stack, AWS sẽ tự động dọn dẹp hàng loạt các thành phần bên trong mà không để sót lại tài nguyên rác gây lãng phí."},{t:"Một kiến trúc sư giải pháp muốn xem trước những tác động thay đổi mà CloudFormation sẽ áp dụng lên một ngăn xếp (stack) hệ thống trước khi chính thức thực thi. Họ nên sử dụng tính năng nào của CloudFormation?",o:["A. Bộ thay đổi (Change sets)","B. Khuôn mẫu (Templates)","C. Ngăn xếp (Stacks)","D. Phát hiện sai lệch (Drift detection)"],a:"A. Bộ thay đổi (Change sets)",e:"Change sets (Bộ thay đổi) đóng vai trò như một môi trường rà soát giả lập. Nó sẽ đối chiếu mã nguồn mới với hệ thống hiện tại và liệt kê chi tiết: hành động nào sẽ tạo thêm tài nguyên mới, tài nguyên nào bị chỉnh sửa thông số, và đặc biệt cảnh báo những tài nguyên nào sẽ bị xóa bỏ. Điều này giúp ngăn chặn những rủi ro thay đổi ngoài ý muốn làm sập dịch vụ đang chạy."},{t:"Dịch vụ AWS nào cung cấp một giao diện quản trị tập trung thống nhất để tự động hóa và điều phối các tác vụ vận hành trên toàn bộ cụm tài nguyên AWS của bạn?",o:["A. AWS CloudFormation","B. AWS OpsWorks","C. AWS Systems Manager","D. AWS Elastic Beanstalk"],a:"C. AWS Systems Manager",e:"AWS Systems Manager (SSM) là một công cụ vận hành trung tâm mạnh mẽ. Nó cấp quyền cho quản trị viên khả năng thu thập thông tin, hiển thị và kiểm soát tự động hóa vận hành trên quy mô hàng ngàn máy chủ (từ cấu hình phần mềm, vá lỗi bảo mật, đến theo dõi độ tuân thủ) trên một bảng điều khiển duy nhất, mà không cần phải đăng nhập thủ công vào từng hệ thống máy chủ rời rạc."},{t:"Tính năng nào của AWS Systems Manager cung cấp khả năng thực thi các tập lệnh (scripts) hoặc mệnh lệnh trực tiếp trên một cụm (fleet) các máy chủ Amazon EC2 mà không cần giao thức kết nối từ xa?",o:["A. State Manager","B. Run Command","C. Automation","D. Patch Manager"],a:"B. Run Command",e:"Run Command là giải pháp thao tác quản trị từ xa an toàn tuyệt đối. Nó cho phép người quản trị ra lệnh thực thi mã lệnh (như cài đặt phần mềm, thay đổi mật khẩu) xuống hàng loạt máy chủ EC2 tại cùng một thời điểm. Quá trình này không đòi hỏi phải sử dụng kết nối SSH hoặc RDP, do đó người dùng có thể đóng kín toàn bộ các cổng bảo mật rủi ro trên máy chủ."},{t:"Một công ty muốn xây dựng quy trình tự động hóa hoàn toàn việc cài đặt các bản vá lỗi (patching) cho hàng trăm máy chủ Amazon EC2 của họ. Họ nên sử dụng tính năng nào của AWS Systems Manager để điều phối việc này?",o:["A. Run Command","B. State Manager","C. Patch Manager","D. Automation"],a:"D. Automation",e:"Systems Manager Automation được thiết kế để đơn giản hóa việc giải quyết các nhiệm vụ duy trì hệ thống CNTT phức tạp và lặp đi lặp lại. Bạn có thể xây dựng các Sách hướng dẫn (Runbooks) thiết lập luồng công việc tự động: từ việc dừng máy ảo, tự động tạo bản sao lưu dữ liệu, áp dụng bản vá lỗi hệ điều hành và cuối cùng là khởi động lại hệ thống, mọi thứ diễn ra tự động theo kịch bản."},{t:"Dịch vụ AWS nào mang đến một giải pháp dễ dàng nhất cho các nhà phát triển (developers) để triển khai ứng dụng web và mở rộng quy mô, hỗ trợ sẵn hàng loạt các nền tảng ngôn ngữ lập trình phổ biến?",o:["A. AWS OpsWorks","B. AWS CloudFormation","C. AWS Systems Manager","D. AWS Elastic Beanstalk"],a:"D. AWS Elastic Beanstalk",e:"AWS Elastic Beanstalk là nền tảng Nền tảng dưới dạng dịch vụ (PaaS) lý tưởng cho lập trình viên. Người phát triển chỉ cần tải mã nguồn ứng dụng (viết bằng Java, .NET, PHP, Node.js, Python, Ruby...) lên nền tảng, Elastic Beanstalk sẽ tự động đảm nhận toàn bộ quá trình thiết lập kiến trúc phức tạp bao gồm khởi tạo máy chủ, thiết lập bộ cân bằng tải, cấu hình tự động mở rộng và theo dõi tình trạng hệ thống."},{t:"Lợi ích kỹ thuật lớn nhất của việc sử dụng nền tảng AWS Elastic Beanstalk để triển khai các ứng dụng web là gì?",o:["A. Cung cấp cho nhà quản trị toàn quyền kiểm soát tuyệt đối đối với các tài nguyên hạ tầng cơ sở vật lý.","B. Tự động hóa hoàn toàn các thao tác triển khai, phân bổ năng lực máy chủ, cân bằng tải mạng và mở rộng quy mô ứng dụng theo chu kỳ.","C. Trực tiếp làm giảm chi phí tính toán khi chạy các ứng dụng web trên hạ tầng AWS.","D. Cho phép thiết lập các khuôn mẫu mã nguồn (templates) để chủ động cung cấp và quản lý tài nguyên AWS chi tiết."],a:"B. Tự động hóa hoàn toàn các thao tác triển khai, phân bổ năng lực máy chủ, cân bằng tải mạng và mở rộng quy mô ứng dụng theo chu kỳ.",e:"Đây là giá trị cốt lõi giải phóng sức lao động. Nền tảng Elastic Beanstalk giúp ẩn đi sự phức tạp của hạ tầng điện toán đám mây. Nó tự động hóa tất cả những công việc cấu trúc hệ thống nặng nhọc (provisioning, load balancing, auto scaling), qua đó cho phép đội ngũ kỹ sư phần mềm chuyên tâm hoàn toàn vào việc phát triển tính năng và viết mã ứng dụng, thay vì loay hoay cấu hình máy chủ."}]},{id:12,title:"Bộ nhớ đệm (Caching)",questions:[{t:"Hai loại phân cấp bộ nhớ đệm (caching) phổ biến trên hệ thống đám mây là gì? (Chọn 2)",o:["A. Caching cấp ứng dụng (Application caching)","B. Caching cấp biên mạng (Edge caching)","C. Caching cấp tài nguyên (Resource caching)","D. Caching nội dung tĩnh (Static caching)","E. Caching cấp người dùng (User caching)"],a:"A. Caching cấp ứng dụng (Application caching) và B. Caching cấp biên mạng (Edge caching)",e:"Caching thường được thiết kế dựa trên khoảng cách và mục tiêu phục vụ. Caching cấp ứng dụng (ví dụ Amazon ElastiCache) lưu dữ liệu trực tiếp trong bộ nhớ RAM tại tầng máy chủ nội bộ để tối ưu hóa truy vấn cho cơ sở dữ liệu. Ngược lại, Caching cấp biên mạng (ví dụ Amazon CloudFront) đưa dữ liệu phân tán ra các trung tâm Edge Locations nằm gần người dùng nhất để giảm thiểu độ trễ tải trang vật lý."},{t:"Một công ty mong muốn cung cấp cho người dùng trải nghiệm tải tệp tin video và hình ảnh tốc độ cao với độ trễ tối thiểu nhất có thể. Người dùng của ứng dụng phân bố trên quy mô toàn cầu. Giải pháp dịch vụ AWS nào sẽ hoàn thành xuất sắc yêu cầu này?",o:["A. Amazon ElastiCache","B. Amazon API Gateway","C. Amazon Route 53","D. Amazon CloudFront"],a:"D. Amazon CloudFront",e:"Tổ hợp từ khóa \"Độ trễ thấp\" (low-latency) và phân bổ \"Toàn cầu\" (across the world) luôn xác định Amazon CloudFront là câu trả lời. Đây là nền tảng Mạng phân phối nội dung toàn cầu (CDN) có chức năng lưu trữ bản sao nội dung tại hàng trăm điểm biên mạng Edge Locations khắp thế giới, cho phép người dùng luôn tải dữ liệu từ trạm phát sóng gần họ nhất."},{t:"Cần triển khai một dịch vụ được quản lý toàn diện nhằm cung cấp cho người dùng truy cập siêu tốc (độ trễ thấp) đối với các tệp dữ liệu gốc được lưu trữ trong một bucket Amazon S3. Tổ chức nên ứng dụng dịch vụ AWS nào cho kịch bản kết hợp này?",o:["A. Amazon API Gateway","B. Amazon CloudFront","C. Amazon ElastiCache","D. Amazon Route 53"],a:"B. Amazon CloudFront",e:"Amazon CloudFront tương tác tích hợp như một mảnh ghép hoàn hảo với Amazon S3. Thay vì buộc mọi người dùng trên toàn thế giới phải truy cập vào một bucket S3 cố định tại Mỹ (tạo ra độ trễ khoảng cách rất lớn), CloudFront sẽ trích xuất tệp dữ liệu từ S3 và lưu trữ bản ghi vào bộ đệm (cache) tại các điểm biên mạng khu vực, giúp tăng tốc độ phản hồi truy cập lên hàng chục lần."},{t:"Một kiến trúc sư phần mềm mong muốn tìm kiếm một phương án thiết kế để giảm thiểu triệt để tải trọng tính toán quá tải lên hệ thống cơ sở dữ liệu backend của ứng dụng. Họ nên ứng dụng giải pháp công nghệ AWS nào?",o:["A. Amazon CloudFront","B. Amazon ElastiCache","C. Amazon API Gateway","D. Amazon Route 53"],a:"B. Amazon ElastiCache",e:"Để giải quyết vấn đề nghẽn cổ chai hoặc giảm tải khối lượng xử lý cho các hệ quản trị cơ sở dữ liệu truyền thống (như RDS hay Aurora), giải pháp tiêu chuẩn là sử dụng Amazon ElastiCache. Hệ thống này xây dựng một kho lưu trữ dữ liệu trực tiếp trên bộ nhớ RAM (In-memory). Bất cứ khi nào có một lệnh truy vấn trùng lặp lặp lại, ứng dụng sẽ lấy kết quả lưu sẵn từ ElastiCache cực nhanh thay vì đánh thức cơ sở dữ liệu phải thực hiện rà soát đĩa cứng chậm chạp tính toán lại."},{t:"Một kiến trúc sư muốn giảm thời gian phản hồi độ trễ (latency) của một dịch vụ giao diện lập trình ứng dụng (API). Giải pháp AWS nào tích hợp tính năng này hiệu quả nhất?",o:["A. Amazon ElastiCache","B. Amazon CloudFront","C. Amazon API Gateway","D. Amazon Route 53"],a:"C. Amazon API Gateway",e:"Amazon API Gateway không chỉ đóng vai trò phân luồng giao diện mà còn tích hợp sẵn một phân hệ bộ nhớ đệm (API caching) cấp doanh nghiệp. Khi được cấu hình kích hoạt, API Gateway sẽ tự động ghi nhớ các kết quả phản hồi (responses) từ máy chủ máy chủ nền tảng. Khi nhận được một yêu cầu giống hệt (cùng tham số đầu vào), nó sẽ trả ngay kết quả từ vùng đệm về cho người dùng trong mili giây mà không cần gọi hàm kích hoạt hệ thống backend xử lý lại từ đầu."},{t:"Phát biểu định nghĩa nào về chức năng của Edge caching (Bộ đệm biên mạng) là chính xác về mặt vật lý?",o:["A. Nó lưu trữ dữ liệu trong một bộ nhớ đệm được thiết lập cấu trúc gần với các máy chủ nền tảng (backend servers) của ứng dụng nhất.","B. Nó lưu trữ dữ liệu trong một bộ nhớ đệm được phân bổ nằm ở vị trí địa lý vật lý gần với người dùng cuối (users) của ứng dụng nhất.","C. Nó lưu trữ dữ liệu trong một bộ nhớ đệm được cấu trúc đặt gần cơ sở dữ liệu hệ thống nhất.","D. Nó lưu trữ dữ liệu trong một bộ nhớ đệm được đặt gần trung tâm phát triển (developers) phần mềm nhất."],a:"B. Nó lưu trữ dữ liệu trong một bộ nhớ đệm được phân bổ nằm ở vị trí địa lý vật lý gần với người dùng cuối (users) của ứng dụng nhất.",e:"Khái niệm \"Biên mạng\" (Edge) trong điện toán đám mây là hệ thống các trạm vệ tinh nằm ở ranh giới tiếp giáp cuối cùng của mạng lưới hạ tầng, vươn sát nhất đến khu vực địa lý của khách hàng tiêu dùng. Mục đích cốt lõi của việc áp dụng Edge Caching là rút ngắn tối đa quãng đường truyền tải gói tin cáp quang giữa hệ thống dữ liệu AWS và thiết bị truy cập cuối của người dùng."},{t:"Phát biểu định nghĩa nào về kiến trúc Application caching (Bộ đệm ứng dụng nội bộ) là chuẩn xác nhất?",o:["A. Nó lưu trữ dữ liệu trong bộ nhớ đệm tiếp giáp với khu vực thiết bị đầu cuối của người dùng.","B. Nó lưu trữ dữ liệu trong bộ nhớ đệm tập trung phục vụ riêng cho các trung tâm lập trình.","C. Nó lưu trữ dữ liệu trong bộ nhớ đệm được thiết lập định tuyến tiếp giáp song song với các tài nguyên xử lý ứng dụng nội bộ (backend resources).","D. Nó lưu trữ dữ liệu trong bộ nhớ đệm phân tán rộng tại các trạm biên (edge locations) toàn cầu."],a:"C. Nó lưu trữ dữ liệu trong bộ nhớ đệm được thiết lập định tuyến tiếp giáp song song với các tài nguyên xử lý ứng dụng nội bộ (backend resources).",e:"Trái ngược hoàn toàn với hệ thống Edge Caching hướng ngoại phục vụ người dùng cuối, kiến trúc Application Caching nhắm tới giải quyết độ trễ hiệu suất nội bộ. Nó triển khai các cụm nhớ trên RAM đặt sâu bên trong hệ thống lõi mạng VPC, giao tiếp liền kề với các máy chủ xử lý hoặc máy chủ cơ sở dữ liệu nhằm cắt giảm thời gian truy xuất thông tin của các thuật toán ứng dụng bên trong nền tảng máy chủ."},{t:"Công cụ nền tảng xử lý cốt lõi (engine) nào của Amazon ElastiCache được khuyến nghị sử dụng khi kiến trúc sư giải pháp cần xây dựng một kho lưu trữ dữ liệu trên bộ nhớ RAM, đòi hỏi hỗ trợ đa dạng các định dạng cấu trúc dữ liệu phức tạp nâng cao?",o:["A. Memcached","B. Redis","C. Neptune","D. DocumentDB"],a:"B. Redis",e:"Dịch vụ Amazon ElastiCache vận hành hỗ trợ hai cấu trúc nền tảng mã nguồn mở: - Memcached: Là nền tảng siêu tinh gọn, chỉ thiết kế để lưu trữ chuỗi dữ liệu đơn giản nhất dạng Khóa-Giá trị (Key-Value). - Redis (Lựa chọn B): Là công cụ cực kỳ mạnh mẽ, hỗ trợ các thuật toán cấu trúc phân cấp chuyên sâu (như chuỗi ký tự dài, danh sách list, tệp hợp set, mã hóa hàm băm hash). Đồng thời Redis sở hữu các công năng cấp doanh nghiệp như tự động phân cụm sao chép (replication), cấu hình độ bền dữ liệu và sao lưu phục hồi hệ thống."},{t:"Nền tảng lõi xử lý (engine) nào của Amazon ElastiCache được khuyến nghị ưu tiên khi một kiến trúc sư hệ thống cần xây dựng giải pháp bộ nhớ đệm trong RAM yêu cầu tiêu chí tối đa hóa sự tối giản vận hành và dễ dàng mở rộng công suất theo cấu trúc chiều ngang (horizontal scaling)?",o:["A. Memcached","B. Redis","C. Neptune","D. DocumentDB"],a:"A. Memcached",e:"Memcached nổi danh trong kiến trúc hệ thống nhờ vào triết lý thiết kế đơn giản tuyệt đối (simplicity). Đặc tính kỹ thuật của nó cho phép thực hiện thao tác mở rộng quy mô theo chiều ngang đa luồng (horizontal scaling) cực kỳ mượt mà. Khách hàng có thể linh hoạt bổ sung hoặc loại bỏ vô số các nút phân bổ (nodes) vào cụm máy chủ xử lý nhằm tăng cường hay thu hẹp tổng dung lượng bộ nhớ RAM mà không cần quá trình cấu trúc thiết lập lại phức tạp."},{t:"Phát biểu nào mô tả đúng đắn nhất tính chất linh hoạt của phương pháp bộ nhớ đệm (caching) trong hệ thống đám mây?",o:["A. Caching luôn luôn cải thiện tuyệt đối hiệu suất tốc độ của mọi ứng dụng.","B. Caching chỉ có thể được thiết lập ứng dụng để lưu trữ các định dạng dữ liệu có tính chất tĩnh.","C. Công nghệ Caching có khả năng được triển khai để lưu trữ đồng thời cả nội dung dữ liệu tĩnh và dữ liệu động.","D. Bộ nhớ đệm Caching chỉ được thiết kế vận hành hiệu quả dành riêng cho các tập dữ liệu dung lượng nhỏ."],a:"C. Công nghệ Caching có khả năng được triển khai để lưu trữ đồng thời cả nội dung dữ liệu tĩnh và dữ liệu động.",e:"Việc ứng dụng bộ nhớ đệm vô cùng đa năng trong kiến trúc điện toán. Hệ thống hoàn toàn có thể lưu vào bộ đệm cấu trúc các dữ liệu tĩnh không bao giờ thay đổi nội dung (như tệp hình ảnh, video, mã giao diện CSS) thông qua mạng lưới CDN CloudFront. Cùng lúc đó, hệ thống cũng có thể lưu vào bộ đệm những kết quả dữ liệu động đòi hỏi khả năng tính toán (như kết xuất truy vấn từ cơ sở dữ liệu hệ thống, kết quả tính toán thông số từ giao diện API) thông qua dịch vụ ElastiCache hoặc chức năng tích hợp của máy chủ API Gateway."}]},{id:13,title:"Kiến trúc Microservices và Serverless",questions:[{t:"Các phương thức giao tiếp và truyền thông dữ liệu cơ bản giữa các dịch vụ siêu nhỏ (microservices) trong một kiến trúc ứng dụng phân tán là gì? (Chọn 2)",o:["A. Giao tiếp đồng bộ (Synchronous)","B. Giao tiếp bất đồng bộ (Asynchronous)","C. Giao tiếp theo chu kỳ (Periodic)","D. Giao tiếp tĩnh trạng thái (Static)","E. Giao tiếp tức thời ngay lập tức (Immediate)"],a:"A. Giao tiếp đồng bộ (Synchronous) và B. Giao tiếp bất đồng bộ (Asynchronous)",e:"Trong kiến trúc hệ thống vi dịch vụ (Microservices), các thành phần dịch vụ tương tác thông tin chéo với nhau chủ yếu qua 2 mô hình giao thức: - **Đồng bộ (Synchronous):** Máy chủ A gọi máy chủ B và bắt buộc đóng băng hệ thống phải chờ nhận được kết quả phản hồi từ B trước khi tiếp tục công việc (thường dùng API). - **Bất đồng bộ (Asynchronous):** Máy chủ A gửi một thông điệp tác vụ vào đường ống truyền đi và ngay lập tức quay lại xử lý các công việc khác độc lập mà không cần quan tâm đến kết quả xử lý tức thì của B (thường dùng Hàng đợi Queue)."},{t:"Một kiến trúc sư giải pháp muốn chia tách (decouple) độc lập hoàn toàn các phân hệ thành phần của một ứng dụng phần mềm, nhằm mục đích đảm bảo chúng có khả năng phát sinh lỗi cục bộ hoặc mở rộng quy mô hệ thống riêng rẽ. Phương pháp thiết kế này cần ứng dụng dịch vụ AWS nào làm nền tảng?",o:["A. Amazon SQS","B. Amazon SNS","C. Amazon EventBridge","D. AWS Step Functions"],a:"A. Amazon SQS",e:"Dịch vụ Hàng đợi Thông điệp Đơn giản (Amazon Simple Queue Service - SQS) đóng vai trò như một \"vùng lưu trữ trung gian đệm\" an toàn nằm giữa các bộ phận xử lý của dịch vụ. Bằng việc phân tách kiến trúc (Decoupling), nếu máy chủ dịch vụ chuyên xử lý nhận dữ liệu gặp trục trặc sập nguồn hoặc quá tải năng lực, thì thông điệp dữ liệu đầu vào vẫn nằm chờ an toàn trong kho chứa hàng đợi SQS, bảo vệ toàn bộ kiến trúc ứng dụng khỏi nguy cơ đứt gãy sụp đổ dây chuyền."},{t:"Nhận định nào sau đây mô tả kỹ thuật chính xác nhất về bản chất của dịch vụ Amazon SQS?",o:["A. SQS là một dịch vụ web trung gian cung cấp khả năng truy cập vào cấu trúc một hàng đợi thông điệp (message queue), được vận hành chuyên dụng để lưu giữ bảo mật thông điệp trong thời gian chờ hệ thống máy chủ máy tính tiến hành nạp và xử lý chúng.","B. Nó là nền tảng web tạo điều kiện dễ dàng để lập cấu hình, thiết lập và phân phối các thông báo đẩy ra từ trung tâm đám mây.","C. Nó là một xe buýt dữ liệu sự kiện phi máy chủ cấu hình linh hoạt giúp liên kết tích hợp các hệ thống phần mềm lại với nhau thông qua sự kiện trích xuất ứng dụng nội bộ.","D. Đây là một nền tảng điều phối vận hành phi máy chủ trực quan hỗ trợ việc tổ chức chuỗi logic hoạt động của hàng loạt các khối chức năng AWS Lambda."],a:"A",e:"Định nghĩa nền tảng cốt lõi của SQS: một hệ thống bộ nhớ lưu trữ hàng đợi đám mây, đóng vai trò tập hợp lưu trữ tạm thời các khối giao dịch mệnh lệnh thông điệp (messages) cực kỳ bảo mật và đáng tin cậy, neo giữ trạng thái của chúng cho đến khi các máy chủ chuyên trách xử lý (worker nodes) có đủ tài nguyên tính toán tiến vào rút thông điệp ra để thực thi tác vụ."},{t:"Loại kiến trúc cấu hình hàng đợi Amazon SQS nào là điều kiện vận hành bắt buộc khi kỹ sư phần mềm thiết kế yêu cầu các thông điệp truyền tải phải được đảm bảo xử lý với mức độ chuẩn xác 100% theo đúng tuần tự thời gian như lúc nó được tạo ra?",o:["A. Hàng đợi thông thường (Standard queue)","B. Hàng đợi FIFO (FIFO queue)","C. Hàng đợi có trật tự (Ordered queue)","D. Hàng đợi ưu tiên mức độ (Priority queue)"],a:"B. Hàng đợi FIFO (FIFO queue)",e:"Ký hiệu công nghệ FIFO là viết tắt của \"First-In, First-Out\" (Vào trước, Ra trước). Loại thuật toán cấu trúc hàng đợi này của Amazon được thiết kế đảm bảo quy chuẩn xử lý bảo tồn nguyên vẹn tính tuần tự nghiêm ngặt tuyệt đối của chuỗi thông điệp và cam kết không xảy ra tình trạng nhân bản một thông điệp được xử lý trùng lặp (Exactly-Once processing). Cấu trúc Standard queue (A) thì tốc độ luồng xử lý cao hơn nhưng có nguy cơ xáo trộn thứ tự hoặc lặp thông báo."},{t:"Một kỹ sư hệ thống cần phát triển tính năng thiết lập hệ thống phát sóng các thông báo khẩn cấp từ một hệ thống trung tâm phân tán đồng loạt đến vô số các thiết bị nhận điểm cuối đa dạng, bao gồm hệ thống gửi địa chỉ hộp thư điện tử cá nhân (email) và kích hoạt trực tiếp hàm mã phi máy chủ AWS Lambda. Công cụ truyền thông mạng đám mây nào đáp ứng tốt nhất yêu cầu này?",o:["A. Amazon SQS","B. Amazon SNS","C. Amazon EventBridge","D. AWS Step Functions"],a:"B. Amazon SNS",e:"Amazon SNS (Simple Notification Service) vận hành chuyên biệt trên kiến trúc truyền thông một-chiều \"Xuất bản/Đăng ký\" (Publish/Subscribe). Thay vì phải lập trình tính toán từng địa chỉ người nhận, máy chủ chỉ cần phát đi một tin nhắn duy nhất ghim vào cấu trúc một Chủ đề (Topic). Hệ thống SNS sẽ có trách nhiệm kỹ thuật phân nhánh và bắn thông báo đó cùng lúc (fan-out) tới tất cả các thiết bị hay nền tảng (như ứng dụng Email, hệ thống tin nhắn SMS, hàng đợi SQS, hoặc hàm kích hoạt Lambda) đã thực hiện đăng ký theo dõi Topic đó."},{t:"Phát biểu nào sau đây phác thảo đúng đắn nhất tính năng của Amazon SNS?",o:["A. Dịch vụ này triển khai giải pháp để đóng gói, lưu trữ bền vững lâu dài các tệp thông báo trong một không gian hàng đợi tuần tự.","B. Dịch vụ này cung cấp phương thức phân tán dữ liệu thông điệp quy mô siêu lớn để chủ động đẩy trực tiếp (push) đến một số lượng lớn đối tượng đã tham gia đăng ký nhận tin (subscribers).","C. Nó mang đến công cụ giải pháp để điều phối thứ tự xếp lớp của hàng loạt hoạt động xử lý AWS Lambda.","D. Đây là công cụ hệ thống giúp đồng bộ liên kết hàng loạt cấu trúc nền tảng ứng dụng phần mềm dựa trên tập dữ liệu khai thác nền."],a:"B",e:"Nhiệm vụ duy nhất và tối thượng của SNS là vận chuyển và phân phối siêu tốc các gói tin thông điệp đến hàng triệu nút nhận (subscribers) trong thời gian thực tại cùng một thời điểm thông qua cơ chế tự động hóa phân luồng (Fan-out). Nó khác biệt với Amazon SQS (Câu A) vốn là nơi nhận giữ lưu trữ thông điệp thụ động để chờ người khác đến lấy (Pull)."},{t:"Một quy trình định tuyến thông tin của doanh nghiệp yêu cầu một hệ thống liên kết sâu các ứng dụng phần mềm độc lập với nhau, sử dụng việc phân loại dữ liệu phát sinh từ chính các ứng dụng máy chủ nội bộ, tích hợp thông tin liên thông từ các nhà cung cấp ứng dụng phần mềm dạng dịch vụ (SaaS) bên thứ ba độc lập (như Zendesk, Shopify), và toàn bộ các tính năng dịch vụ AWS. Bộ dịch vụ định tuyến nào của AWS được chuyên biệt xây dựng cho kiến trúc mở này?",o:["A. Amazon SQS","B. Amazon SNS","C. Amazon EventBridge","D. AWS Step Functions"],a:"C. Amazon EventBridge",e:"Amazon EventBridge đóng vai trò như một \"Chiếc xe buýt sự kiện phi máy chủ\" (Serverless Event Bus) vạn năng. Sức mạnh vượt trội và sự độc đáo của EventBridge là khả năng liên kết mở rộng nguyên bản. Nó cho phép lắng nghe tự động một cách trực tiếp các dòng sự kiện thông báo thay đổi hệ thống phát sinh từ các ứng dụng của hàng chục đối tác doanh nghiệp bên thứ 3 mà không cần lập trình mã kết nối API phức tạp, sau đó thiết lập luật điều hướng và chuyển tiếp chúng đến bộ phận hạ tầng xử lý của AWS."},{t:"Một kiến trúc sư giải pháp muốn đồng bộ và lên lịch điều phối tự động tất cả các thành phần chức năng rời rạc của một ứng dụng phần mềm phân tán rộng thông qua một nền tảng tạo dựng quy trình luồng công việc dưới định dạng giao diện hình ảnh trực quan (visual workflows). Lựa chọn nền tảng dịch vụ AWS nào là đúng đắn nhất?",o:["A. Amazon SQS","B. Amazon SNS","C. Amazon EventBridge","D. AWS Step Functions"],a:"D. AWS Step Functions",e:"AWS Step Functions cung cấp cho chuyên viên thiết kế kỹ thuật công cụ cực mạnh để quy hoạch, phác thảo ra một quá trình làm việc hệ thống (workflow) từ vô số các tác vụ con rời rạc dưới dạng một sơ đồ khối hình ảnh lưu đồ (State machine). Hệ thống này tự động chịu trách nhiệm duy trì theo dõi lưu giữ tiến trình, lập cấu hình khởi chạy bước xử lý tuần tự hoặc song song, và kiểm soát quá trình điều khiển quy luật phân luồng lỗi tự động theo chính xác bản vẽ đã thiết kế."},{t:"Nhận định chuyên ngành nào mô tả chức năng của AWS Step Functions là toàn diện và chuẩn xác nhất?",o:["A. Dịch vụ cung cấp kho chứa đóng gói lưu trữ cho các thông điệp dữ liệu đang treo trong hệ thống phân tầng hàng đợi.","B. Dịch vụ này triển khai bộ phát sóng thông điệp diện rộng theo cơ chế hướng người dùng nhằm truyền tin đến vô số thiết bị mục tiêu.","C. Dịch vụ cung cấp phương pháp tổ chức và điều phối phân cấp đồng bộ logic hoạt động của hàng chục nền tảng dịch vụ AWS rời rạc kết hợp thành một kiến trúc quy trình luồng công việc phi máy chủ hoàn chỉnh.","D. Đây là mạng lưới xe buýt chuyển dẫn để đồng bộ sự kiện giữa vô vàn ứng dụng cấu trúc phần mềm bên trong hệ sinh thái."],a:"C",e:"Trọng trách của Step Functions là đóng vai trò hệ thống tổng công trình sư điều phối trung tâm (Orchestrator). Trong mô hình kỹ thuật phi máy chủ (Serverless), quản trị viên sẽ tạo ra hàng chục các chức năng cực nhỏ (Microservices). Step Functions sẽ đứng ra để nối ghép và kiểm soát luồng di chuyển dữ liệu xuyên qua các dịch vụ chức năng cực nhỏ đó tạo thành một ứng dụng thống nhất theo một kịch bản chu trình chặt chẽ."},{t:"Lợi ích kỹ thuật mang tính triết lý kiến trúc thiết kế ưu việt nhất khi chuyển đổi hệ thống sang áp dụng kiến trúc công nghệ vi dịch vụ phân tách rời (decoupled architecture) là gì?",o:["A. Việc phân tách ứng dụng có tác động trực tiếp và tuyệt đối vào việc làm giảm ngay lập tức mọi chi phí tiêu thụ tài nguyên phần cứng vận hành ứng dụng trên nền tảng AWS.","B. Triết lý này đơn giản hóa tối đa cấu hình thiết lập cài đặt quy mô và loại bỏ tính chất bảo trì cho các máy chủ tài nguyên vật lý AWS.","C. Phương pháp kiến trúc này cô lập các tiến trình thành phần, cho phép một bộ phận trong hệ thống khả năng phát sinh xảy ra lỗi kỹ thuật hoặc tiến hành mở rộng gia tăng tài nguyên tự do độc lập mà không đe dọa hoặc tạo ra ảnh hưởng kéo theo sự suy giảm đối với phần còn lại của ứng dụng phân tán.","D. Kiến trúc phân mảnh này hợp nhất một trung tâm bảng điều khiển hệ thống duy nhất nhằm tạo điều kiện thực thi tập trung tất cả quy trình tác vụ giám sát trên bộ nhớ đám mây AWS."],a:"C",e:"Nguyên lý trọng tâm và quý giá nhất của bài toán kiến trúc phân tán (Decoupling) bằng mô hình dịch vụ thông điệp tách rời (thông qua hệ thống SQS và SNS) chính là khả năng độc lập xử lý và quản trị rủi ro thảm họa. Việc cô lập cách ly từng chức năng cụ thể thành những khối riêng rẽ đảm bảo rằng, nếu một khâu bị tổn thương đứt gãy sụp nguồn, hay một khâu khác đột nhiên nhận lưu lượng truy cập khổng lồ cần tiến hành mở rộng năng lực theo chiều ngang (Scale independently), những hiện tượng này sẽ bị bao vây chặt lại trong khối giới hạn cục bộ của nó, hoàn toàn không gây tác động tiêu cực, đe dọa kéo ngã toàn bộ các hệ sinh thái còn lại đang vận hành trong một tập thể ứng dụng cấu trúc khổng lồ."}]}];</script>
<script>const EXTRA_DATA = [];

// Module 2-4
EXTRA_DATA.push(...[
{id:2,title:"Kiến trúc đám mây (Mở rộng)",questions:[
{t:"Trụ cột nào của AWS Well-Architected Framework tập trung vào khả năng phục hồi sau sự cố?",o:["A. Bảo mật (Security)","B. Độ tin cậy (Reliability)","C. Hiệu suất (Performance Efficiency)","D. Tính bền vững (Sustainability)"],a:"B",e:"Trụ cột Reliability tập trung vào khả năng hệ thống phục hồi sau sự cố."},
{t:"Khái niệm 'Elasticity' trong điện toán đám mây có nghĩa là gì?",o:["A. Khả năng mã hóa tự động","B. Khả năng tự động co giãn tài nguyên theo nhu cầu","C. Khả năng sao lưu dữ liệu","D. Chạy nhiều hệ điều hành"],a:"B",e:"Elasticity là khả năng hệ thống tự động co giãn tài nguyên (thêm/bớt) theo lưu lượng thực tế."},
{t:"Nguyên tắc thiết kế nào giúp giảm thiểu tác động khi một thành phần gặp sự cố?",o:["A. Thiết kế monolithic","B. Thiết kế kết nối chặt","C. Thiết kế kết nối lỏng (Loose coupling)","D. Thiết kế đơn điểm"],a:"C",e:"Loose coupling đảm bảo các thành phần hoạt động độc lập, không bị ảnh hưởng dây chuyền."},
{t:"AWS Trusted Advisor cung cấp khuyến nghị về lĩnh vực nào? (Chọn 2)",o:["A. Tối ưu chi phí","B. Giao diện UI","C. Hiệu suất hệ thống","D. Quản lý nhân sự"],a:"A và C",e:"Trusted Advisor tự động kiểm tra tài khoản và khuyến nghị về Tối ưu chi phí, Hiệu suất, Bảo mật."},
{t:"Mô hình 'Pay-as-you-go' của AWS là gì?",o:["A. Trả trước 1 năm","B. Chỉ thanh toán cho tài nguyên thực tế đã sử dụng","C. Thanh toán cố định hàng tháng","D. Miễn phí năm đầu"],a:"B",e:"Pay-as-you-go nghĩa là chỉ trả tiền cho lượng tài nguyên thực tế đã tiêu thụ."},
{t:"Công cụ nào giúp ước tính chi phí trước khi triển khai?",o:["A. Billing Dashboard","B. Pricing Calculator","C. Cost Explorer","D. AWS Budgets"],a:"B",e:"AWS Pricing Calculator cho phép mô phỏng cấu hình và ước tính chi phí trước khi tạo tài nguyên."},
{t:"Lợi ích của việc dùng nhiều Availability Zones là gì?",o:["A. Giảm chi phí","B. Tăng tốc độ CPU","C. Tăng tính sẵn sàng và khả năng chịu lỗi","D. Đơn giản hóa quản trị"],a:"C",e:"Triển khai trên nhiều AZ giúp hệ thống sống sót ngay cả khi một Data Center gặp sự cố."},
{t:"AWS Free Tier cung cấp những loại ưu đãi nào? (Chọn 2)",o:["A. Dùng thử miễn phí 12 tháng","B. Giảm giá 50%","C. Miễn phí vĩnh viễn ở mức sử dụng thấp","D. Hoàn tiền 100%"],a:"A và C",e:"AWS Free Tier có: Dùng thử miễn phí, Miễn phí 12 tháng và Miễn phí vĩnh viễn (ở mức thấp)."},
{t:"'High Availability' trong AWS là gì?",o:["A. Hệ thống có tốc độ cực nhanh","B. Hệ thống luôn sẵn sàng hoạt động với thời gian ngừng tối thiểu","C. Chi phí cực thấp","D. Chỉ admin mới được truy cập"],a:"B",e:"High Availability nghĩa là hệ thống được thiết kế để hoạt động liên tục với downtime cực thấp."},
{t:"Nguyên tắc 'Design for Failure' khuyến nghị điều gì?",o:["A. Không cần sao lưu","B. Luôn giả định mọi thành phần đều có thể hỏng và thiết kế dự phòng","C. Chỉ dùng 1 máy chủ","D. Tắt hệ thống khi có lỗi"],a:"B",e:"Cần giả định mọi thứ đều có thể hỏng để thiết kế dự phòng, tự động phục hồi."}
]},
{id:3,title:"Bảo mật (Mở rộng)",questions:[
{t:"AWS CloudTrail cung cấp chức năng chính nào?",o:["A. Vá lỗi OS","B. Ghi nhật ký mọi lệnh gọi API trên tài khoản","C. Mã hóa S3","D. Quản lý khóa"],a:"B",e:"CloudTrail ghi lại chi tiết mọi hành động API trên tài khoản AWS."},
{t:"Xác thực đa yếu tố (MFA) cung cấp lớp bảo mật bằng cách nào?",o:["A. Mã hóa dữ liệu","B. Yêu cầu thêm mã xác thực ngoài mật khẩu","C. Khóa tài khoản sau 3 lần sai","D. Giới hạn IP"],a:"B",e:"MFA yêu cầu thêm mã OTP từ điện thoại ngoài mật khẩu để bảo vệ tài khoản tốt hơn."},
{t:"Dịch vụ nào phát hiện mối đe dọa bằng cách phân tích nhật ký?",o:["A. IAM","B. Amazon GuardDuty","C. KMS","D. Amazon S3"],a:"B",e:"GuardDuty dùng Machine Learning phân tích VPC Flow Logs, CloudTrail, DNS để tìm nguy hiểm."},
{t:"Security Group hoạt động ở cấp độ nào?",o:["A. Subnet","B. Máy chủ ảo (Instance)","C. VPC","D. Region"],a:"B",e:"Security Group hoạt động như tường lửa ảo ở cấp độ từng EC2 instance."},
{t:"Sự khác biệt chính giữa Security Group và Network ACL là gì?",o:["A. SG là stateless, NACL là stateful","B. SG ở cấp instance, NACL ở cấp subnet","C. SG kiểm soát lưu lượng vào, NACL kiểm soát vào và ra","D. Không khác biệt"],a:"B",e:"SG ở cấp instance và stateful. NACL ở cấp subnet và stateless."},
{t:"AWS Config cung cấp chức năng gì?",o:["A. Triển khai code","B. Theo dõi và ghi lại lịch sử thay đổi cấu hình tài nguyên","C. Cân bằng tải","D. Lưu mật khẩu"],a:"B",e:"AWS Config liên tục theo dõi mọi thay đổi cấu hình tài nguyên để đảm bảo tính tuân thủ."},
{t:"Chính sách nào được gắn trực tiếp lên tài nguyên như S3 bucket?",o:["A. Identity-based policy","B. Resource-based policy","C. SCP","D. Session policy"],a:"B",e:"Resource-based policy (như S3 Bucket Policy) được gắn trực tiếp lên tài nguyên để kiểm soát quyền truy cập."},
{t:"Dịch vụ nào cung cấp tường lửa ứng dụng web?",o:["A. GuardDuty","B. Shield","C. AWS WAF","D. Inspector"],a:"C",e:"AWS WAF bảo vệ ứng dụng web khỏi SQL injection, XSS..."},
{t:"AWS Shield bảo vệ chống lại tấn công nào?",o:["A. SQL injection","B. Tấn công DDoS","C. Phishing","D. Brute-force"],a:"B",e:"AWS Shield chuyên bảo vệ chống lại các cuộc tấn công Từ chối dịch vụ phân tán (DDoS)."},
{t:"Khi nào nên sử dụng IAM Role thay vì IAM User cho EC2?",o:["A. Cần mật khẩu tĩnh","B. Cần thông tin xác thực tạm thời tự động xoay vòng","C. Khi chỉ có 1 user","D. Không cần quyền"],a:"B",e:"IAM Role cung cấp thông tin xác thực tạm thời an toàn hơn là dùng Access Key tĩnh của User."}
]},
{id:4,title:"Lưu trữ (Mở rộng)",questions:[
{t:"Amazon S3 đảm bảo độ bền dữ liệu (durability) ở mức nào?",o:["A. 99.9%","B. 99.99%","C. 11 số 9 (99.999999999%)","D. 100%"],a:"C",e:"S3 được thiết kế với độ bền 11 số 9, rất khó mất dữ liệu."},
{t:"S3 Versioning giúp bảo vệ dữ liệu như thế nào?",o:["A. Mã hóa mọi file","B. Lưu giữ mọi phiên bản của đối tượng kể cả khi bị ghi đè","C. Sao chép qua Region khác","D. Nén dữ liệu"],a:"B",e:"Versioning lưu lại các phiên bản cũ để khôi phục khi bị xóa hoặc sửa nhầm."},
{t:"Dịch vụ nào phù hợp làm ổ đĩa hệ điều hành cho EC2?",o:["A. S3","B. Amazon EBS","C. EFS","D. Glacier"],a:"B",e:"EBS cung cấp ổ đĩa khối (block storage) hiệu suất cao để gắn làm ổ hệ điều hành."},
{t:"Sự khác biệt chính giữa EBS và EFS là gì?",o:["A. EBS chỉ cho Linux, EFS cho Windows","B. EBS gắn vào 1 EC2, EFS có thể chia sẻ giữa nhiều EC2","C. EBS miễn phí","D. Không khác biệt"],a:"B",e:"EBS gắn độc quyền 1 EC2. EFS là hệ thống file chia sẻ (NFS) cho hàng nghìn EC2 dùng chung."},
{t:"S3 Lifecycle Policy dùng làm gì?",o:["A. Mã hóa dữ liệu","B. Tự động chuyển dữ liệu giữa các lớp lưu trữ hoặc xóa sau một thời gian","C. Giới hạn quyền","D. Tăng tốc tải lên"],a:"B",e:"Lifecycle Policy tự động hóa việc chuyển dữ liệu sang lớp rẻ hơn hoặc xóa để tiết kiệm chi phí."},
{t:"S3 Intelligent-Tiering hoạt động ra sao?",o:["A. Luôn dùng lớp rẻ nhất","B. Tự động di chuyển dữ liệu giữa các lớp dựa trên tần suất truy cập thực tế","C. Chọn thủ công mỗi tháng","D. Chỉ lưu file nhỏ"],a:"B",e:"Intelligent-Tiering tự động tối ưu chi phí bằng cách theo dõi mẫu truy cập của dữ liệu."},
{t:"AWS Storage Gateway dùng khi nào?",o:["A. Lưu trên cloud hoàn toàn","B. Kết nối hạ tầng lưu trữ on-premises với đám mây AWS","C. Chạy web tĩnh","D. Chạy database"],a:"B",e:"Storage Gateway là giải pháp lai (hybrid) kết nối lưu trữ tại văn phòng với lưu trữ đám mây."},
{t:"S3 Object Lock cung cấp tính năng gì?",o:["A. Khóa bucket hoàn toàn","B. Ngăn chặn việc xóa/sửa đối tượng trong một khoảng thời gian xác định","C. Mã hóa bằng khóa riêng","D. Giới hạn dung lượng"],a:"B",e:"Object Lock áp dụng mô hình WORM (viết 1 lần, đọc nhiều lần) để tuân thủ pháp luật."},
{t:"Kích thước tối đa của 1 file trên S3 là bao nhiêu?",o:["A. 5 GB","B. 5 TB","C. 50 TB","D. Không giới hạn"],a:"B",e:"Kích thước tối đa của 1 đối tượng trên S3 là 5 Terabytes."},
{t:"Glacier Instant Retrieval khác gì Flexible Retrieval?",o:["A. Truy xuất dữ liệu ngay lập tức trong mili giây","B. Rẻ hơn","C. Chậm hơn","D. Giống nhau"],a:"A",e:"Instant Retrieval cho phép lấy lại dữ liệu tức thì (mili giây), còn Flexible mất từ phút đến giờ."}
]}

{t:"Dedicated Host là gì?",o:["A. Máy chủ vật lý riêng biệt cho phép kiểm soát cấp độ phần cứng (socket/core)","B. Máy ảo giá rẻ","C. Container","D. Database dùng chung"],a:"A",e:"Dùng Dedicated Host khi bạn có license phần mềm on-premises cần đối chiếu số CPU vật lý."},

{id:6,title:"Cơ sở dữ liệu (Mở rộng)",questions:[

{t:"Khi nào dùng DynamoDB thay vì RDS?",o:["A. Cần JOIN nhiều bảng","B. Cần độ trễ dưới 10ms, mở rộng không giới hạn và schema linh hoạt","C. Cần Store procedure","D. Cần ACID chặt chẽ"],a:"B",e:"DynamoDB vượt trội về tốc độ tải siêu cao và không yêu cầu schema cố định."},

]},
{id:7,title:"Mạng cơ bản (Mở rộng)",questions:[
{t:"Thành phần nào cho public subnet ra internet?",o:["A. NAT Gateway","B. Internet Gateway (IGW)","C. Virtual Private Gateway","D. Customer Gateway"],a:"B",e:"IGW là cánh cổng kết nối trực tiếp VPC với Internet công cộng."},
{t:"Private subnet ra internet tải update bằng cách nào an toàn?",o:["A. IGW","B. Elastic IP","C. NAT Gateway","D. Direct Connect"],a:"C",e:"NAT Gateway nằm ở Public Subnet sẽ đứng ra tải dữ liệu thay cho Private Subnet."},
{t:"Route Table là gì?",o:["A. Chặn IP","B. Bảng định tuyến quyết định đường đi của dữ liệu mạng","C. Load balancer","D. Cáp quang"],a:"B",e:"Route table chứa các luật (route) chỉ đường cho traffic đi ra IGW, NAT hay Peering."},
{t:"Chính sách Weighted routing của Route 53 làm gì?",o:["A. Load balance theo khu vực","B. Phân chia tỷ lệ % traffic đến các server","C. Kiểm tra sức khỏe","D. Định tuyến tự động"],a:"B",e:"Ví dụ gửi 80% truy cập vào server A, 20% vào server B."},
{t:"VPC Peering có đặc điểm gì?",o:["A. Kết nối qua mạng internet","B. Là kết nối mạng riêng (không qua internet) giữa 2 VPC","C. Hỗ trợ định tuyến bắc cầu (A->B, B->C suy ra A->C)","D. Chỉ dùng được trong 1 Region"],a:"B",e:"VPC Peering rất an toàn vì dùng hạ tầng cáp quang riêng của AWS. (Nó KHÔNG hỗ trợ bắc cầu)."},
{t:"Elastic IP là gì?",o:["A. IP đổi liên tục","B. IP tĩnh (Static) Public cấp cho tài khoản AWS của bạn","C. IP private","D. IPv6"],a:"B",e:"Là một IP cố định, bạn có thể gán nó từ EC2 này sang EC2 khác."},
{t:"NACL (Network ACL) đánh giá luật theo thứ tự nào?",o:["A. Ngẫu nhiên","B. Số thứ tự từ thấp đến cao","C. Số cao đến thấp","D. Đánh giá tất cả"],a:"B",e:"Luật số 100 sẽ được đánh giá trước luật số 200. Nếu khớp, nó bỏ qua các luật bên dưới."},

{t:"Khi tạo VPC mới, cái gì KHÔNG được tạo sẵn?",o:["A. Route Table mặc định","B. Security Group mặc định","C. NACL mặc định","D. Subnets"],a:"D",e:"Bạn phải tự tay tạo các Subnets sau khi tạo VPC."}
]},
{id:8,title:"Mạng nâng cao (Mở rộng)",questions:[
{t:"Transit Gateway giải quyết vấn đề gì?",o:["A. Backup data","B. Thay thế VPC Peering chằng chịt bằng cấu trúc Hub trung tâm mạng lưới","C. Giảm giá EC2","D. Tăng tốc web"],a:"B",e:"Transit Gateway là tổng đài trung tâm, các VPC chỉ cần nối 1 dây vào Hub này là có thể kết nối với nhau."},

{t:"Global Accelerator dùng để làm gì?",o:["A. Nén file zip","B. Tăng tốc độ truy cập ứng dụng toàn cầu bằng mạng cáp quang nội bộ AWS","C. Tính toán toán học","D. Backup DB"],a:"B",e:"Giúp người dùng ở VN kết nối đến máy chủ Mỹ với tốc độ siêu nhanh thông qua Edge Location."},
{t:"Site-to-Site VPN dùng giao thức gì để mã hóa đường hầm?",o:["A. HTTP","B. IPsec","C. SSH","D. FTP"],a:"B",e:"IPsec là tiêu chuẩn vàng để mã hóa mạng VPN doanh nghiệp."},
{t:"Phía AWS trong kết nối VPN gọi là gì?",o:["A. Customer Gateway","B. Virtual Private Gateway (VGW) hoặc Transit Gateway","C. IGW","D. NAT"],a:"B",e:"VGW là cánh cửa tiếp nhận kết nối VPN từ Customer Gateway của doanh nghiệp."},
{t:"VPN CloudHub dùng làm gì?",o:["A. Kết nối 1 VPC - 1 Data Center","B. Kết nối nhiều VPC với nhau","C. Kết nối nhiều chi nhánh văn phòng (Hub and Spoke) qua VPN AWS","D. Chia sẻ file"],a:"C",e:"Biến AWS thành Hub trung tâm để chi nhánh Hà Nội có thể kết nối với chi nhánh HCM thông qua mạng AWS."},
{t:"Interface VPC Endpoint dùng công nghệ gì?",o:["A. Direct Connect","B. AWS PrivateLink","C. Transit Gateway","D. IGW"],a:"B",e:"PrivateLink tạo ra 1 card mạng (ENI) có IP private ngay trong subnet của bạn để kết nối với AWS service."},

{t:"VPC Flow Logs KHÔNG lưu thông tin gì?",o:["A. IP nguồn/đích","B. Nội dung bên trong gói tin (Packet Payload)","C. Port","D. Giao thức"],a:"B",e:"Nó chỉ log metadata mạng (ai gọi cho ai), không lưu nội dung bạn chat gì hay gửi file gì."}
]}
]);
